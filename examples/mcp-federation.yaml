# Two MCP servers behind one endpoint.
#
# Their tools are exposed as `everything_*` and `fetch_*`, so the two can both
# export a tool of the same name without colliding. `Mcp-Session-Id` is in
# exposeHeaders because a browser client cannot read it otherwise -- and
# without it, it cannot make a second request.
config:
  # Spans and metrics to an OTLP collector. Omit the whole block to stay off:
  # an exporter pointed at nothing retries in the background forever.
  tracing:
    endpoint: http://localhost:4317
    serviceName: rusty-agent-gateway
  limits:
    # Sheds with 503 + Retry-After rather than queueing. Counts requests until
    # a response is produced, so this bounds handshakes and auth rather than
    # streaming tool calls -- which is the load worth shedding.
    maxConcurrentRequests: 256

binds:
  # A TLS listener. ALPN advertises h2 and http/1.1; one certificate per port,
  # since SNI-based selection is not available.
  # - port: 8443
  #   listeners:
  #     - protocol: HTTPS
  #       tls:
  #         cert: /etc/certs/tls.crt
  #         key: /etc/certs/tls.key
  #       routes: [...]
  - port: 3000
    listeners:
      - routes:
          - name: mcp
            matches:
              - path:
                  pathPrefix: /mcp
            policies:
              timeout:
                # requestTimeout bounds producing a response; the MCP transport
                # streams, so only backendRequestTimeout bounds a tool call.
                requestTimeout: 30s
                backendRequestTimeout: 10s
              cors:
                allowOrigins: ["*"]
                allowHeaders: [mcp-protocol-version, content-type, cache-control]
                exposeHeaders: ["Mcp-Session-Id"]
              # An MCP-aware policy service, consulted over gRPC. Unlike the
              # gates above it can rewrite as well as refuse -- redacting a
              # secret out of a result is not a yes/no answer. Its answer can
              # also carry a headerMutation, which changes the headers of the
              # upstream call itself; that only lands on `mcp:` targets, since
              # a stdio target has no HTTP request to change.
              #
              # `methods` is an allow-list; a method matching no key bypasses
              # the processor. failureMode defaults to failClosed, so a
              # processor that is down refuses rather than waving calls
              # through. Note requestHeaders: an empty `allowed` forwards
              # every header, which is the opposite of extAuthz.includeHeaders.
              mcpGuardrails:
                processors:
                  - kind: remote
                    host: guardrail.internal:9000
                    timeout: 5s
                    # Any of the seven served methods. A processor sees the
                    # unmuxed name on the request side (`summarize`,
                    # `memo:insights`) and the federated form on the response
                    # side, so a filter has to know which side it is on.
                    methods:
                      tools/call: full
                      "prompts/*": full
                      "resources/read": full
                      "*/list": response
                    # CEL over `jwt`, `request` and `mcp` -- the subject the
                    # call is about, unmuxed. Exactly one of mcp.tool /
                    # mcp.prompt / mcp.resource exists per call, so a key
                    # written against the wrong kind is simply dropped.
                    metadata:
                      tenant: 'request.headers["x-tenant"]'
                      tool: 'mcp.tool.name'
                      prompt: 'mcp.prompt.name'
                      resource: 'mcp.resource.name'
                    requestHeaders:
                      allowed: [x-tenant]
              # Applies to the upstream MCP request. `{{mcpGuardrails.<key>}}`
              # reads what a processor returned, so a classification made
              # in-band reaches the server behind the gateway. An unresolved
              # placeholder drops its header rather than sending the template
              # text upstream.
              requestHeaderModifier:
                set:
                  x-classification: "{{mcpGuardrails.classification}}"
              # Applies to the response the gateway itself returns; an MCP
              # route has no upstream HTTP response a client ever sees.
              #
              # A `urlRewrite` path rewrite transforms each target's own
              # path, so it works across a whole federation -- `prefix: /rpc`
              # here would dial the two targets below at /rpc/... each.
              # `authority` is the exception: pointed at several targets it
              # would collapse them onto one server, so `--check` reports it.
              responseHeaderModifier:
                set:
                  x-served-by: rusty-agent-gateway
              mcpAuthorization:
                # Deny wins over allow, and an empty allow list means
                # "everything not denied". These match the *federated* name.
                denyTools: ["_delete$"]
                # CEL rules, for when the answer depends on who is asking.
                # These match the tool's own name and its target, before
                # federation joins them -- `echo`, not `everything_echo`.
                # A bare string is an allow. Prefer `require` to `deny`: an
                # expression that cannot be evaluated counts as false, which
                # refuses for `require` and permits for `deny`.
                # Rules cover prompts and resources too. Note that exactly
                # one of mcp.tool / mcp.prompt / mcp.resource is bound per
                # call: on a prompts/get, `mcp.tool.name == "echo"` does not
                # resolve and reads as false. So a rule set of only tool
                # allows is an allow-list that refuses every prompt and
                # resource -- safe, but it takes an explicit rule to open up.
                rules:
                  - 'mcp.tool.name == "echo"'
                  - 'mcp.prompt.name == "summarize"'
                  # A resource matches on its target's own URI, before the
                  # gateway widens the scheme to `alpha+memo:insights`.
                  - 'mcp.resource.name.startsWith("memo:")'
                  - require: 'jwt.iss == "https://auth.example.com"'
            backends:
              - mcp:
                  # Uncomment to dial every target through one address -- an
                  # egress proxy or a mesh sidecar. Each target keeps its own
                  # path, which is then the only thing telling them apart, so
                  # `--check` reports two that would collapse onto the same
                  # address and path. Deliberately not `urlRewrite.authority`,
                  # which redirects a single target rather than collapsing all
                  # of them.
                  # via: egress.local:8443
                  targets:
                    - name: everything
                      stdio:
                        cmd: npx
                        args: ["@modelcontextprotocol/server-everything"]
                    - name: fetch
                      stdio:
                        cmd: uvx
                        args: ["mcp-server-fetch"]

          # A plain HTTP backend on the same gateway. Weighted round-robin;
          # weight 0 would drain a backend without deleting it.
          - name: api
            matches:
              - path:
                  pathPrefix: /api
            policies:
              # Asked before the request is served, and fails closed: an
              # authorizer that cannot be reached denies with 503 rather than
              # becoming an open door. Both header lists are allow-lists --
              # allowedUpstreamHeaders is what stops an authorizer setting any
              # header the upstream trusts.
              extAuthz:
                target: http://authz.internal:9000
                timeout: 250ms
                includeHeaders: [authorization]
                allowedUpstreamHeaders: [x-user-id]
                # A bound, not a target: a body over this is refused with 413
                # rather than truncated, because a fragment of JSON does not
                # parse and the authorizer would answer about something that
                # was never the request. Reading it does not consume it -- the
                # same bytes continue upstream.
                includeBody: 4096
              # Two retries after the first try. Only the listed codes are
              # retried; a transport error is retried only when it is a connect
              # failure, which is the one that cannot have been processed.
              retry:
                attempts: 2
                backoff: 100ms
                codes: [502, 503]
              # Burst plus sustained: a request must satisfy both.
              localRateLimit:
                - maxTokens: 100
                  tokensPerFill: 100
                  fillInterval: 60s
                - maxTokens: 5
                  tokensPerFill: 5
                  fillInterval: 1s
              urlRewrite:
                path:
                  prefix: /v1
              requestHeaderModifier:
                set:
                  x-gateway: rusty-agent-gateway
            backends:
              - host: "10.0.0.1:8080"
                weight: 3
              - host: "10.0.0.2:8080"
                weight: 1

          # An OpenAI-compatible endpoint over Anthropic. A client POSTs an
          # ordinary chat-completions request; `model` here overrides whatever
          # it asked for, and backendAuth.key is the *provider* credential.
          - name: llm
            matches:
              - path:
                  pathPrefix: /v1
            policies:
              backendAuth:
                key: sk-ant-replace-me
              # Applied to the request the gateway builds for the provider,
              # after the provider's own headers -- so a route can replace or
              # take back a header the gateway put there, `authorization`
              # included.
              requestHeaderModifier:
                set:
                  x-gateway: rusty-agent-gateway
              # The address rewritten here is the *provider's* endpoint -- a
              # client's path never reaches a provider. `/v1/messages` with the
              # route's matched `/v1` replaced, so this dials
              # https://api.anthropic.com/proxy/v1/messages.
              urlRewrite:
                path:
                  prefix: /proxy/v1
              # An `ai` request is replayable by construction -- it has to be
              # read to be translated -- so `attempts` always means what it
              # says here. 429 and 503 are what a provider actually sheds with.
              retry:
                attempts: 2
                backoff: 500ms
                codes: [429, 503]
              # Both kinds at once. Requests are charged before dispatch; the
              # token bucket is charged what the provider reported, which is
              # the limit that matters here -- ten calls are cheap and one
              # 200k-token context is not.
              localRateLimit:
                - maxTokens: 60
                  tokensPerFill: 60
                  fillInterval: 60s
                - maxTokens: 200000
                  tokensPerFill: 200000
                  fillInterval: 1h
                  type: tokens
              # A stated ladder: an alias resolves what the caller meant, then
              # prompts shape the conversation, then defaults fill what was
              # left out, then overrides replace what was set. The backend's
              # own `model:` below still wins over all of it.
              ai:
                modelAliases:
                  fast: claude-haiku-4-5
                prompts:
                  prepend:
                    - role: system
                      content: Answer concisely and cite your sources.
                defaults:
                  temperature: 0.2
                overrides:
                  max_tokens: 2048
                # Anthropic only -- OpenAI caches long prefixes by itself.
                # `cacheTools` is deliberately absent: tools are not translated
                # to Anthropic by this build, so `--check` reports it.
                promptCaching:
                  cacheSystem: true
                  cacheMessages: true
                  cacheMessageOffset: 1
                  minTokens: 2048
            backends:
              - ai:
                  provider:
                    anthropic:
                      model: claude-sonnet-4

          # Agents behind the gateway. The card served here names the gateway,
          # not the agents -- a client reading an agent's own URL would go
          # around the gateway entirely.
          - name: agents
            matches:
              - path:
                  pathPrefix: /a2a
            policies:
              a2a:
                denyMethods: ["^tasks/cancel$"]
                agentCard:
                  url: "https://gateway.example.com/a2a"
              # Reaches the agent even on a call the `a2a` policy had to buffer
              # to read the JSON-RPC method out of the body.
              requestHeaderModifier:
                set:
                  x-gateway: rusty-agent-gateway
            backends:
              - host: "agent-a:9000"
              - host: "agent-b:9000"
