# Two MCP servers behind one endpoint.
#
# Their tools are exposed as `everything_*` and `fetch_*`, so the two can both
# export a tool of the same name without colliding. `Mcp-Session-Id` is in
# exposeHeaders because a browser client cannot read it otherwise -- and
# without it, it cannot make a second request.
config:
  # Spans and metrics to an OTLP collector. Omit the whole block to stay off:
  # an exporter pointed at nothing retries in the background forever.
  tracing:
    endpoint: http://localhost:4317
    serviceName: rusty-agent-gateway
  limits:
    # Sheds with 503 + Retry-After rather than queueing. Counts requests until
    # a response is produced, so this bounds handshakes and auth rather than
    # streaming tool calls -- which is the load worth shedding.
    maxConcurrentRequests: 256

binds:
  # A TLS listener. ALPN advertises h2 and http/1.1; one certificate per port,
  # since SNI-based selection is not available.
  # - port: 8443
  #   listeners:
  #     - protocol: HTTPS
  #       tls:
  #         cert: /etc/certs/tls.crt
  #         key: /etc/certs/tls.key
  #       routes: [...]
  - port: 3000
    listeners:
      - routes:
          - name: mcp
            matches:
              - path:
                  pathPrefix: /mcp
            policies:
              timeout:
                # requestTimeout bounds producing a response; the MCP transport
                # streams, so only backendRequestTimeout bounds a tool call.
                requestTimeout: 30s
                backendRequestTimeout: 10s
              cors:
                allowOrigins: ["*"]
                allowHeaders: [mcp-protocol-version, content-type, cache-control]
                exposeHeaders: ["Mcp-Session-Id"]
              mcpAuthorization:
                # Deny wins over allow, and an empty allow list means
                # "everything not denied".
                denyTools: ["_delete$"]
            backends:
              - mcp:
                  targets:
                    - name: everything
                      stdio:
                        cmd: npx
                        args: ["@modelcontextprotocol/server-everything"]
                    - name: fetch
                      stdio:
                        cmd: uvx
                        args: ["mcp-server-fetch"]

          # A plain HTTP backend on the same gateway. Weighted round-robin;
          # weight 0 would drain a backend without deleting it.
          - name: api
            matches:
              - path:
                  pathPrefix: /api
            policies:
              # Asked before the request is served, and fails closed: an
              # authorizer that cannot be reached denies with 503 rather than
              # becoming an open door. Both header lists are allow-lists --
              # allowedUpstreamHeaders is what stops an authorizer setting any
              # header the upstream trusts.
              extAuthz:
                target: http://authz.internal:9000
                timeout: 250ms
                includeHeaders: [authorization]
                allowedUpstreamHeaders: [x-user-id]
              # Two retries after the first try. Only the listed codes are
              # retried; a transport error is retried only when it is a connect
              # failure, which is the one that cannot have been processed.
              retry:
                attempts: 2
                backoff: 100ms
                codes: [502, 503]
              # Burst plus sustained: a request must satisfy both.
              localRateLimit:
                - maxTokens: 100
                  tokensPerFill: 100
                  fillInterval: 60s
                - maxTokens: 5
                  tokensPerFill: 5
                  fillInterval: 1s
              urlRewrite:
                path:
                  prefix: /v1
              requestHeaderModifier:
                set:
                  x-gateway: rusty-agent-gateway
            backends:
              - host: "10.0.0.1:8080"
                weight: 3
              - host: "10.0.0.2:8080"
                weight: 1

          # An OpenAI-compatible endpoint over Anthropic. A client POSTs an
          # ordinary chat-completions request; `model` here overrides whatever
          # it asked for, and backendAuth.key is the *provider* credential.
          - name: llm
            matches:
              - path:
                  pathPrefix: /v1
            policies:
              backendAuth:
                key: sk-ant-replace-me
            backends:
              - ai:
                  provider:
                    anthropic:
                      model: claude-sonnet-4

          # Agents behind the gateway. The card served here names the gateway,
          # not the agents -- a client reading an agent's own URL would go
          # around the gateway entirely.
          - name: agents
            matches:
              - path:
                  pathPrefix: /a2a
            policies:
              a2a:
                denyMethods: ["^tasks/cancel$"]
                agentCard:
                  url: "https://gateway.example.com/a2a"
            backends:
              - host: "agent-a:9000"
              - host: "agent-b:9000"
