[package]
name = "agentgateway-mcp"
version = "0.1.0"
description = "MCP federation for rusty_agent_gateway"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agentgateway-config = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["rt", "macros", "process", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
cel = { workspace = true }
http = { workspace = true }
# The `mcpGuardrails` wire protocol. The messages are written by hand rather
# than generated, so no `protoc` is needed to build this crate.
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
process-wrap = { version = "9", features = ["tokio1"] }

[dev-dependencies]
# `http2` is dev-only on purpose: the gateway speaks gRPC as a *client*, and
# the scripted processor in the tests is the only thing here that serves it.
axum = { workspace = true, features = ["http2"] }
http-body-util = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
