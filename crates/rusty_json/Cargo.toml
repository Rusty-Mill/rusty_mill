[package]
name = "rusty_json"
version = "0.1.0"
edition = "2021"
description = "A from-scratch JSON library for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_json"
readme = "README.md"
keywords = ["json", "serialization", "no_std"]
categories = ["encoding", "no-std"]

[lib]
name = "rusty_json"
path = "src/lib.rs"

[features]
default = ["std", "serde"]
std = []
# Serde-based (de)serialization: `from_str`/`to_string` for arbitrary
# `Deserialize`/`Serialize` types, `from_value`/`to_value`, and `Value`'s own
# `serde::Serialize`/`Deserialize` impls (for driving `Value` through other
# serde data formats). Off by default features stay on this crate's own
# `Value` + JSON parser/writer, with no `serde` dependency at all -- for
# callers that want JSON support without pulling in `serde`.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }
rusty_json-derive = { path = "rusty_json-derive", version = "0.1.0", optional = true }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
