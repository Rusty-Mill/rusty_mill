[package]
name = "rusty_homelab_mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An MCP server for controlling a homelab -- Proxmox VE, OPNsense, and Fedora (via rusty_fedora_agent) today, more backends welcome."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_homelab_mcp"
authors = ["rusty_homelab_mcp contributors"]
readme = "README.md"
keywords = ["mcp", "homelab", "proxmox", "opnsense", "fedora"]
categories = ["network-programming"]
# An application binary consuming the rusty-mcp scaffold, not a library
# meant to be depended on -- same convention as rusty-mcp-demo.
publish = false

[[bin]]
name = "rusty_homelab_mcp"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
# rusty-mcp, rusty_proxmox, and rusty_opnsense are all siblings in this
# same workspace -- plain path dependencies.
rusty-mcp = { path = "../rusty_mcp/crates/rusty-mcp" }
rusty_proxmox = { path = "../rusty_proxmox" }
rusty_opnsense = { path = "../rusty_opnsense" }
rusty_fedora = { path = "../rusty_fedora" }
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dev-dependencies]
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util"] }
