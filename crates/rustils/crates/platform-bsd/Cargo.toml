[package]
name = "platform-bsd"
description = "BSD backend (net-only slice, rustils#48/#86): platform::net over libc for macOS, FreeBSD, OpenBSD, NetBSD and DragonFly, mirroring platform-linux's layering."
version = "0.27.1"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
platform.workspace = true

# Kept textually identical to `lib.rs`'s `#![cfg(...)]` — the two must
# agree or the crate either pulls a dependency it never uses or fails to
# build the one it does. `ios`/`tvos`/`watchos` are Darwin too and would
# very likely work as-is, but are deliberately left out until a consumer
# asks (RFC v2 §3): nothing in CI could verify them (rustils#86).
[target.'cfg(any(target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
libc.workspace = true

[dev-dependencies]
platform-parity.workspace = true
platform-mock.workspace = true

[lints]
workspace = true
