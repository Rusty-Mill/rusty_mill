[package]
name = "coreutils"
description = "Modular pure-Rust implementation of core GNU/POSIX utilities"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
platform.workspace = true
# `rusty_regx` and `rpath` are now sibling crates in this same workspace
# (rusty_mill) — plain path dependencies, matching the pattern used for
# every other pin retired in this series. Previously pinned git
# dependencies (before that, unresolvable local-only paths — see git
# history), now real workspace siblings that build reproducibly for
# every clone and CI runner without a patch table.
rusty_regx = { path = "../../../rusty_regx" }
rpath = { path = "../../../rpath" }

[dev-dependencies]
platform-mock.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux.workspace = true

[target.'cfg(windows)'.dependencies]
platform-windows.workspace = true

[[bin]]
name = "rcat"
path = "src/bin/rcat.rs"

[[bin]]
name = "rls"
path = "src/bin/rls.rs"

[[bin]]
name = "rrun"
path = "src/bin/rrun.rs"

[[bin]]
name = "rpar"
path = "src/bin/rpar.rs"

[[bin]]
name = "rtee"
path = "src/bin/rtee.rs"

[[bin]]
name = "rterm"
path = "src/bin/rterm.rs"

[[bin]]
name = "rcp"
path = "src/bin/rcp.rs"

[[bin]]
name = "rmv"
path = "src/bin/rmv.rs"

[[bin]]
name = "rrm"
path = "src/bin/rrm.rs"

[[bin]]
name = "rmkdir"
path = "src/bin/rmkdir.rs"

[[bin]]
name = "rtouch"
path = "src/bin/rtouch.rs"

[[bin]]
name = "rwc"
path = "src/bin/rwc.rs"

[[bin]]
name = "rhead"
path = "src/bin/rhead.rs"

[[bin]]
name = "rtail"
path = "src/bin/rtail.rs"

[[bin]]
name = "rsort"
path = "src/bin/rsort.rs"

[[bin]]
name = "runiq"
path = "src/bin/runiq.rs"

[[bin]]
name = "rcut"
path = "src/bin/rcut.rs"

[[bin]]
name = "rtr"
path = "src/bin/rtr.rs"

[[bin]]
name = "rgrep"
path = "src/bin/rgrep.rs"

[[bin]]
