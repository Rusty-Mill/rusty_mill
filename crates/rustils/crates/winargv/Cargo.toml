[package]
name = "winargv"
description = "Windows argv -> command-line construction (MSVCRT + cmd-rules quoting, refuse-unrepresentable). Standalone so handback consumers don't need to depend on platform-windows."
# Independent of the PAL group's version — see docs/versioning.md §1
# (winargv has its own handback lifecycle, D3) and CHANGELOG.md.
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
platform.workspace = true

[lints]
workspace = true
