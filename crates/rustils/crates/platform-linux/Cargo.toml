[package]
name = "platform-linux"
description = "Linux backend: libc floor now (RFC v2 §2 D-2); raw-syscall Track P later, feature-gated."
version = "0.27.1"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# D-12: rusty_libc is the Track P backend, feature-gated behind
# `track-p`. Previously a pinned git dependency; now a sibling crate in
# this same workspace (rusty_mill), plain path dependency, matching the
# pattern used for every other pin retired in this series.
# rusty_libc's own MSRV is 1.88, above this workspace's 1.75 floor — the
# feature must stay off on any MSRV-pinned build.
rusty_libc = { path = "../../../rusty_libc", optional = true }

[features]
# RFC v2 §2 Track P: route curated call families through raw syscalls
# (rusty_libc) instead of libc. Off by default; D-2 keeps libc the floor.
track-p = ["dep:rusty_libc"]

[dev-dependencies]
platform-parity.workspace = true
platform-mock.workspace = true

[lints]
workspace = true
