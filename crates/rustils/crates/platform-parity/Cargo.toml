[package]
name = "platform-parity"
description = "Shared behavior-spec assertion sets for the PAL parity suites. Test-support only; never a dependency of a shipped crate."
version = "0.27.1"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
# The traits every assertion is written against. Nothing else: this crate
# must stay backend-agnostic, or a backend's parity suite would be
# testing against a rival backend's idea of correct.
platform.workspace = true

[lints]
workspace = true
