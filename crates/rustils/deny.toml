# cargo-deny configuration — dependency policy enforcement (RFC v2 §4.2)

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-DFS-2016", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
# ADR-004 (rush) / RFC v2 §5: the core is synchronous; no async runtime may enter the tree.
deny = [
    { name = "tokio" },
    { name = "async-std" },
]

[advisories]
yanked = "deny"
ignore = [
    # rsa 0.9.x (Marvin Attack timing side-channel): present in the shared
    # workspace Cargo.lock via jsonwebtoken's `rust_crypto` feature in
    # agentgateway-auth (rusty_agent_gateway) and rusty-mcp's `jwt`
    # feature, not a rustils dependency itself -- cargo-deny resolves the
    # whole workspace graph regardless of which crate's config invokes it.
    # Reviewed: both crates' production code only calls
    # `jsonwebtoken::decode`/`DecodingKey` (signature *verification*,
    # public-key only); `encode`/`EncodingKey` (the private-key signing
    # path the advisory concerns) appears only in each crate's own test
    # suite, never in shipped code. The Marvin Attack leaks private-key
    # bits through timing in RSA decrypt/sign operations; verifying a
    # signature with the public modulus/exponent has no secret-dependent
    # computation to leak. Revisit once a patched `rsa` release exists.
    { id = "RUSTSEC-2023-0071", reason = "RS256 verify-only usage (DecodingKey/decode); the private-key sign/decrypt path the Marvin Attack targets is never exercised in production code" },
]

[sources]
# D-12: rusty_libc is a deliberate rev-pinned git dependency (the Track P
# backend). Any other git source is a policy violation, not a warning.
#
# rusty_regx and rpath joined the list when coreutils' dependencies on
# them moved from `path = "../../../…"` to rev-pinned git. Those path
# deps resolved only on a machine with both repos checked out beside
# the rustils clone, so a fresh clone — and every CI runner — failed at
# `cargo metadata` before compiling anything, taking the whole
# workspace down with it. Same treatment as rusty_libc: pin the rev,
# bump deliberately, never track a branch.
unknown-git = "deny"
allow-git = [
    "https://github.com/baileyrd/rusty_libc",
    # D-15: rusty_win32 is rusty_libc's Windows counterpart, admitted on
    # the same terms — the Track W backend behind platform-windows's
    # `track-w` feature, pinned by rev, bumped deliberately.
    "https://github.com/baileyrd/rusty_win32",
    "https://github.com/baileyrd/rusty_regx",
    "https://github.com/baileyrd/rpath",
]
