[package]
name = "rusty_rsa"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Hand-rolled, dependency-free BigUint (RSA/ECC arithmetic) and SHA-256 -- the primitives rusty_oauth and rusty_rdp each independently reimplemented for their own RSA public-key verification/encryption. Named for the primary use case; BigUint is general-purpose (rusty_oauth's own ECC/ES256 code also builds on it) and SHA-256 is a general hash, not RSA-specific -- see lib.rs."
license = "MIT OR Apache-2.0"

