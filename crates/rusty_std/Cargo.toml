[package]
name = "rusty_std"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign standard library built on top of rusty_libc and rusty_win32"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_std"
keywords = ["std", "no-std", "sovereign", "kernel", "libc"]
categories = ["no-std", "os"]

[dependencies]
# rusty_libc/rusty_win32 are now siblings in this same workspace -- plain
# path dependencies.
rusty_libc = { path = "../rusty_libc", optional = true }
rusty_win32 = { path = "../rusty_win32", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rusty_libc = { path = "../rusty_libc" }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { path = "../rusty_win32" }

[features]
default = []
