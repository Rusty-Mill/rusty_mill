[package]
name = "rusty_config"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A zero-dependency, no_std INI and Key-Value configuration file parser for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_config"
keywords = ["config", "ini", "parser", "kv", "no-deps"]
categories = ["config", "no-std"]

[dependencies]

[features]
default = ["std"]
std = []

