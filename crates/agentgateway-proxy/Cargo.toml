[package]
name = "agentgateway-proxy"
version = "0.1.0"
description = "HTTP reverse proxying for rusty_agent_gateway host backends"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agentgateway-config = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "client"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
bytes = { workspace = true }
tokio = { workspace = true, features = ["time"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
