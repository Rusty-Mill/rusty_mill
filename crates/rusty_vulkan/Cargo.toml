[package]
name = "rusty_vulkan"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign raw Vulkan / Metal hardware command buffer and GPU surface layer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_vulkan"
keywords = ["vulkan", "gpu", "hardware", "commandbuffer", "no-std"]
categories = ["graphics", "no-std"]

[dependencies]

[target.'cfg(windows)'.dependencies]
rusty_win32 = { path = "../rusty_win32" }

[features]
default = []
