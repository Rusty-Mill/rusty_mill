<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>sessionmgr</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="brand-row">
        <div id="brand">
          <span id="brand-mark"><span></span><span></span><span></span><span></span></span>
          <span id="brand-name">sessionmgr</span>
        </div>
        <button id="new-session-btn" title="New session (Ctrl/Cmd+N)">+ New session</button>
      </div>
      <div id="session-list"></div>
    </aside>
    <main id="workspace">
      <div id="breadcrumb-row">
        <div id="breadcrumb-text" title="Open command palette">No session focused</div>
        <div id="breadcrumb-actions">
          <span id="breadcrumb-agent" class="agent-pill" title="Switch this session's agent"></span>
          <span id="breadcrumb-elapsed" class="breadcrumb-meta"></span>
          <span class="breadcrumb-divider"></span>
          <button id="diff-btn" class="icon-btn" title="Toggle git diff for focused session"></button>
          <button id="view-toggle-btn" class="icon-btn" title="Focus view (maximize focused pane)"></button>
          <button id="stop-btn" class="btn-secondary" title="Send Ctrl-C to the focused session"></button>
          <button id="palette-btn" class="icon-btn" title="Command palette (Ctrl/Cmd+K)"></button>
          <span id="kbd-badge" class="kbd-badge"></span>
        </div>
      </div>
      <div id="grid"></div>
      <div id="empty-state">no sessions -- create one with the + button or Ctrl/Cmd+N</div>
      <div id="status-bar">
        <span id="status-text">Ctrl/Cmd+K: command palette</span>
      </div>
    </main>
  </div>

  <div id="palette-overlay" class="overlay hidden">
    <div class="overlay-box">
      <input id="palette-input" type="text" placeholder="Type a command..." autocomplete="off" />
      <ul id="palette-list"></ul>
    </div>
  </div>

  <div id="prompt-overlay" class="overlay hidden">
    <div class="overlay-box">
      <div id="prompt-title"></div>
      <input id="prompt-input" type="text" autocomplete="off" />
      <div class="overlay-hint">Enter to confirm, Esc to cancel</div>
    </div>
  </div>

  <script src="boot-diag.js"></script>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
