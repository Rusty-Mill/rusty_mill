[package]
name = "sessionmgr-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Tauri's own convention: `main.rs` is a thin shim calling `run()` here,
# so mobile targets (which need a `cdylib`/`staticlib` entry point, not a
# `main.rs`) can link against the same crate. Unused today -- this project
# ships desktop only -- but it costs nothing and keeps this crate on
# Tauri's own well-trodden path rather than a bespoke layout.
name = "sessionmgr_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri's own async runtime is real `tokio`, not `rusty_tokio`
# (`docs/decisions/0001-async-runtime-rusty-tokio.md`'s own choice) --
# baked into the `tauri` crate itself, not something this crate opted
# into. Rather than fight that by trying to drive `rusty_tokio` tasks
# from inside a real-tokio-hosted command handler (two different
# runtimes' wakers do not interoperate), this crate's own socket client
# (`client.rs`) is deliberately synchronous `std` I/O on dedicated
# blocking threads -- the same "blocking read, forward into a channel"
# shape `sessionmgr-tui::app::spawn_input_thread` already uses for
# keyboard input, applied here to the daemon socket instead. See
# `docs/phase-8-report.md` for the full account of why this is the one
# crate in the workspace that does not use `rusty_tokio`.
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
sessionmgr-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
# `std::os::unix::net::UnixStream` does not exist on Windows at all --
# confirmed live in CI (`E0433: cannot find unix in os`), not caught by
# any Linux-side check in this pass. `sessionmgr-daemon` reaches the
# same AF_UNIX sockets on Windows through `rusty_tokio`'s own hand-rolled
# WinSock layer (`io/socket/windows.rs`), which this crate deliberately
# does not depend on (see this file's own comment on why real `tokio`
# and `rusty_tokio` cannot be mixed). `uds_windows` is the well-known,
# narrowly-scoped equivalent for exactly this situation: a blocking
# `UnixStream`/`UnixListener` pair with the same API shape as
# `std::os::unix::net`, backed by WinSock's own `AF_UNIX` support
# (Windows 10 1803+) -- reusing it here is "boring over bespoke" rather
# than a second hand-rolled WinSock client.
uds_windows = "1"
