[package]
name = "rusty_codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign TOML configuration parser and binary buffer serialization crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_codec"
keywords = ["toml", "bincode", "codec", "encoder", "no-std"]
categories = ["encoding", "no-std"]

[dependencies]
rusty_wire = { path = "../rusty_wire" }
rusty_std = { path = "../rusty_std" }

[features]
default = []
