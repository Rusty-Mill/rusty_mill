[package]
name = "conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
contract.workspace = true
compat.workspace = true

[[bin]]
name = "conformance-report"
path = "src/bin/conformance-report.rs"

# Spawn target for the process probes. A dedicated binary rather than
# re-executing `current_exe()`, because the probes also run from a test
# harness binary, which would re-enter libtest instead of the child logic.
[[bin]]
name = "conformance-child"
path = "src/bin/conformance-child.rs"
