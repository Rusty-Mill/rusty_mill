[package]
name = "rusty_fedora_agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unprivileged local agent exposing scoped systemd/dnf/config-file control over HTTP -- the backend rusty_homelab_mcp's fedora module talks to."
license = "MIT OR Apache-2.0"
authors = ["rusty_fedora_agent contributors"]
readme = "README.md"
keywords = ["fedora", "systemd", "homelab", "agent"]
categories = ["network-programming"]
# A daemon binary meant to be deployed to a Fedora host, not a library
# meant to be depended on -- same convention as rusty_homelab_mcp.
publish = false

[[bin]]
name = "rusty_fedora_agent"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
# platform/platform-linux are rustils' own portable process-spawning
# layer -- siblings in this same workspace, already hoisted in
# [workspace.dependencies]. Reused here rather than adding a subprocess
# crate of this agent's own.
platform = { workspace = true }
platform-linux = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# The allowlist config file's format -- already hoisted for rusty_key's
# rk-config and others.
toml = { workspace = true }
# This agent's own local HTTP API: a small *synchronous* server -- no
# real concurrent I/O to exploit for one local admin agent handling
# occasional requests, so it deliberately does not pull tokio/axum in
# (rustils' own platform crate already rejects tokio in its layer for the
# same reason -- see docs/rusty-mill-profile.md). Not used anywhere else
# in the workspace yet.
tiny_http = { workspace = true }

[dev-dependencies]
# The scripted `Spawner`/`Child` test double -- lets every adapter's
# allowlist-rejection and happy-path tests run without a real Fedora box.
platform-mock = { workspace = true }
