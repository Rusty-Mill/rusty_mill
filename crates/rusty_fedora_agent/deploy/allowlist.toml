# rusty_fedora_agent allowlist config.
#
# This is a REVIEWABLE TEMPLATE, not something rusty_fedora_agent applies
# on its own. Copy it to the path passed as --allowlist (default
# /etc/rusty-fedora-agent/allowlist.toml on the target host) and edit it
# by hand. It ships empty on purpose: nothing is permitted until a human
# deliberately adds an entry here.
#
# Path passed to rusty_fedora_agent via --allowlist / RUSTY_FEDORA_AGENT_ALLOWLIST.

# Exact systemd unit names this agent may start/stop/restart/enable/
# disable via fedora_service_control. Must also be covered by the polkit
# rule in deploy/polkit/ -- adding a unit here without also adding it
# there means fedora_service_control will still be refused (by polkit,
# with a less specific error) even though this allowlist permits it.
#
# Example:
# units = ["ollama.service"]
units = []

# Exact dnf package names this agent may install/remove via
# fedora_dnf_install/fedora_dnf_remove.
#
# Example:
# packages = ["htop", "tmux"]
packages = []

# Absolute path prefixes this agent may read/write via
# fedora_read_config/fedora_write_config. A path must start with one of
# these prefixes (after rejecting any ".." component) to be permitted.
#
# Example:
# config_path_prefixes = ["/etc/systemd", "/etc/NetworkManager"]
config_path_prefixes = []
