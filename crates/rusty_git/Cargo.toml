[package]
name = "rusty_git"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure Rust implementation of Git object model, index, refs, and CLI binary"

[dependencies]
rusty_diff = { path = "../rusty_diff" }
rpath = { path = "../rpath" }
# Object hashing: git's object model is content-addressed by SHA-1. Shared
# with rusty_term's WebSocket handshake (its `web-bridge` feature) via
# src/sha1.rs's re-export -- see that module's doc comment.
rusty_sha1 = { path = "../rusty_sha1" }
# Loose-object storage: git wraps every object in a zlib stream. rusty_compress's
# `compress_deflate` only emits RFC 1951 "stored" (uncompressed) blocks today, not
# real Huffman-coded ones, but stored blocks are a fully spec-legal DEFLATE
# encoding and real git/zlib decompress them without complaint -- verified via
# `git cat-file` interop tests in this crate. `decompress_deflate` is the
# corresponding limitation: it can only read stored-block streams (i.e. objects
# this crate wrote itself), not arbitrary real repos' Huffman-compressed objects.
# See src/zlib.rs's module doc for the honest read/write asymmetry this implies.
rusty_compress = { path = "../rusty_compress" }
