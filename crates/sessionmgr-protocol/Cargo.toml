[package]
name = "sessionmgr-protocol"
description = "Wire types shared by the sessionmgr daemon, its workers, and its clients. Serde only, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sessionmgr_protocol"
path = "src/lib.rs"

[dependencies]
sessionmgr-core = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# Tests only. The crate itself is serialization-format-agnostic -- it
# derives `Serialize`/`Deserialize` and lets the transport pick a format;
# the tests need a concrete one to assert round-tripping and framing
# safety against, and JSON is what the transport actually uses.
serde_json = { workspace = true }
