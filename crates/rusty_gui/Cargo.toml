[package]
name = "rusty_gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign OS windowing, event loop, and clipboard manager crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_gui"
keywords = ["gui", "window", "event", "clipboard", "no-std"]
categories = ["gui", "no-std"]

[dependencies]
# Pinned git deps, not path deps: a `git = "..."` Cargo dependency on
# this crate clones only this one repository, so a sibling `../rusty_wire`
# checkout doesn't exist for any external consumer (see rusty_std's
# Cargo.toml for the same fix, and rusty_tokio#254).
rusty_wire = { git = "https://github.com/baileyrd/rusty_wire", rev = "4f72aa50bd28b965ae44c9bb0d7df72f014ebe0b" }
rusty_std = { git = "https://github.com/baileyrd/rusty_std", rev = "99135f32afc48e868d3e17b6e234db4162e1c758" }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { path = "../rusty_win32", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
rusty_libc = { git = "https://github.com/baileyrd/rusty_libc", rev = "73bf01bf20dc8de55a583cbd5719ad829076ccca" }

[features]
default = []
