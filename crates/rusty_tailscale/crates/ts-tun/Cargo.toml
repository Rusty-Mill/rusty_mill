[package]
name = "ts-tun"
description = "TUN device, routes, and DNS platform adapters"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[dependencies]
tokio = { workspace = true, features = ["net", "rt", "macros"] }
thiserror.workspace = true
tracing.workspace = true
# rustils' Tun/virtual-link surface (rustils#56, decision D14) — justified in DESIGN.md:
platform = { workspace = true }
platform-linux = { workspace = true }
