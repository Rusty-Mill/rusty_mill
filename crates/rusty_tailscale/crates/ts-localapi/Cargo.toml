[package]
name = "ts-localapi"
description = "LocalAPI-compatible HTTP-over-UDS server subset"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[dependencies]
ts-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "macros"] }
rusty_http = { workspace = true, features = ["tokio"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Independent HTTP/1.1 client for tests/roundtrip.rs -- proves real interop
# with a totally separate implementation, not just this crate against
# itself. Not a runtime dependency (see the dependency table in DESIGN.md).
tokio = { workspace = true, features = ["rt", "net", "macros", "rt-multi-thread", "time"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
