[package]
name = "ts-engine"
description = "Orchestration: control -> magicsock -> wg -> tun, behind ports-and-adapters traits"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[dependencies]
ts-types.workspace = true
ts-key.workspace = true
ts-control.workspace = true
ts-derp.workspace = true
ts-wg.workspace = true
ts-tun.workspace = true
ts-magicsock.workspace = true
ts-disco.workspace = true
ts-filter.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
