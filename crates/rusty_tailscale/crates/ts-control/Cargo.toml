[package]
name = "ts-control"
description = "ts2021 control-plane client: Noise IK channel, registration, netmap long-poll"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[dependencies]
ts-types.workspace = true
ts-key.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
h2.workspace = true
bytes.workspace = true
http.workspace = true
chacha20poly1305.workspace = true
blake2.workspace = true
hkdf.workspace = true
rusty_http = { workspace = true, features = ["tokio"] }
# Standard base64 for the `X-Tailscale-Handshake` header; replaced this
# crate's own encode-only copy (see DESIGN.md's dependency table).
rusty_base64 = { path = "../../../rusty_base64" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "process"] }
