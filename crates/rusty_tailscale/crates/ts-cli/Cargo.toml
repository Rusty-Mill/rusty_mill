[package]
name = "ts-cli"
description = "CLI: status/up/down/ping over the tailscaled LocalAPI Unix socket"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[dependencies]
ts-types.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "macros"] }
rusty_http = { workspace = true, features = ["tokio"] }
thiserror.workspace = true
