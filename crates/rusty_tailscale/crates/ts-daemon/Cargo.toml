[package]
name = "ts-daemon"
description = "tailscaled-equivalent daemon binary"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[dependencies]
ts-key.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "signal", "time"] }
ts-engine.workspace = true
ts-localapi.workspace = true
ts-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
