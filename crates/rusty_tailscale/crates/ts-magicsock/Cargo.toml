[package]
name = "ts-magicsock"
description = "Path multiplexer: direct UDP and DERP, path upgrade and live migration"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[dependencies]
ts-types.workspace = true
ts-key.workspace = true
ts-disco.workspace = true
ts-derp.workspace = true
ts-stun.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
rand_core.workspace = true
thiserror.workspace = true
tracing.workspace = true
# rustils' D16 Net surface (rustils#41/#42) — justified in DESIGN.md:
platform = { workspace = true }
platform-linux = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
