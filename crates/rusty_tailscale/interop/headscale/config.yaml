# Minimal Headscale 0.26 config for the local interop environment.
# The tailnet is fully local: no external DERP relays are configured, so the
# two same-host tailscaled nodes establish direct (LAN) paths via disco.
server_url: http://10.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 127.0.0.1
    ipv6: "::1"
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

log:
  format: text
  level: info

dns:
  override_local_dns: false
  magic_dns: true
  base_domain: tailnet.test
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/lib/headscale/headscale.sock
unix_socket_permission: "0770"

policy:
  mode: file
  path: ""
