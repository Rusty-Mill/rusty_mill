[package]
name = "inventory-core"
description = "Local-first index over the conversation history AI coding tools write to disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl", "backup", "functions"] }
directories = "5"
walkdir = "2"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
tempfile = "3"

# The keychain backend is per-platform. Linux uses the kernel keyring rather
# than Secret Service so the crate builds without libdbus development headers;
# see docs/ARCHITECTURE.md for what that costs.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = { workspace = true }
