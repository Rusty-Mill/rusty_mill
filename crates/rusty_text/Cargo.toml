[package]
name = "rusty_text"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure Rust stream editing (sed) and pattern scanning/processing (awk) engines"

[dependencies]
rusty_regx = { path = "../rusty_regx" }
rpath = { path = "../rpath" }

[[bin]]
name = "rsed"
path = "src/bin/rsed.rs"

[[bin]]
name = "rawk"
path = "src/bin/rawk.rs"
