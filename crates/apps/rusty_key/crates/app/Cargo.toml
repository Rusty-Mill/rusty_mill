[package]
name = "rk-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_oauth = { workspace = true }
rusty_crypto_key = { workspace = true }
rk-config.workspace = true
rk-observe.workspace = true
rk-constrain.workspace = true
rk-feed.workspace = true
rk-kernel.workspace = true
rk-compose.workspace = true
rk-mcp.workspace = true
# `openaicompatible` references `providers::openai` internally, so `openai`
# must be enabled alongside it (aisdk 0.5.2 feature-wiring quirk).
aisdk = { workspace = true, features = ["openaicompatible", "openai"] }
anyhow = "1"
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
# `axum` "0.7" is still a deliberate split against the root's "0.8" -- see the
# "Hoisted from rusty_key"/"Hoisted from rusty_adk" comment blocks in the
# root Cargo.toml for why it is tracked as a migration, not drift.
rusty_mcp_server = { workspace = true, optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
futures = { version = "0.3", optional = true }

[features]
# MCP server mode (`rusty-keys --mcp`): expose Session::send() over JSON-RPC
# (ADR-0029) on `rusty_mcp_server`'s stdio transport. Off by default; enable
# for IDE integration. `rk-mcp/rmcp` is the client side, for connecting the
# servers declared in the config.
mcp-server = ["dep:rusty_mcp_server", "rk-mcp/rmcp"]
# Web gateway (`rusty-keys --gateway`): axum HTTP/SSE over Session::send()
# (PRD 06). Off by default (pulls axum); enable for web/desktop clients.
gateway = ["dep:axum", "dep:tower", "dep:tower-http", "dep:futures", "tokio/net"]

[[bin]]
name = "rusty-keys"
path = "src/main.rs"

[dev-dependencies]
rk-kernel = { workspace = true, features = ["fake"] }
rk-feed = { workspace = true, features = ["chaos", "fake-embed"] }
rk-mcp = { workspace = true, features = ["fake"] }
serde_json.workspace = true
async-trait.workspace = true

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
