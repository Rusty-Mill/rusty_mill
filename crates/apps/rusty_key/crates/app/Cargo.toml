[package]
name = "rk-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_oauth = { workspace = true }
rusty_crypto_key = { workspace = true }
rk-config.workspace = true
rk-observe.workspace = true
rk-constrain.workspace = true
rk-feed.workspace = true
rk-kernel.workspace = true
rk-compose.workspace = true
rk-mcp.workspace = true
# `openaicompatible` references `providers::openai` internally, so `openai`
# must be enabled alongside it (aisdk 0.5.2 feature-wiring quirk).
aisdk = { workspace = true, features = ["openaicompatible", "openai"] }
anyhow = { workspace = true }
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
rusty_mcp_server = { workspace = true, optional = true }
# The gateway's HTTP/SSE surface (#879 pilot): `rusty_axum` served on a
# `rusty_tokio` runtime; `rusty_axum_tokio` lets its handlers keep calling
# the tokio-based session (aisdk/reqwest, tokio::spawn) until rk-app leaves
# tokio.
rusty_axum = { workspace = true, optional = true }
rusty_axum_tokio = { workspace = true, optional = true }
rusty_tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
# MCP server mode (`rusty-keys --mcp`): expose Session::send() over JSON-RPC
# (ADR-0029) on `rusty_mcp_server`'s stdio transport. Off by default; enable
# for IDE integration. `rk-mcp/rmcp` is the client side, for connecting the
# servers declared in the config; its OAuth fetch runs on rusty_tokio's
# fallback runtime, which `main` installs.
mcp-server = ["dep:rusty_mcp_server", "rk-mcp/rmcp", "dep:rusty_tokio"]
# Web gateway (`rusty-keys --gateway`): HTTP/SSE over Session::send()
# (PRD 06). Off by default; enable for web/desktop clients.
gateway = ["dep:rusty_axum", "dep:rusty_axum_tokio", "dep:rusty_tokio", "dep:futures"]

[[bin]]
name = "rusty-keys"
path = "src/main.rs"

[dev-dependencies]
rk-kernel = { workspace = true, features = ["fake"] }
rk-feed = { workspace = true, features = ["chaos", "fake-embed"] }
rk-mcp = { workspace = true, features = ["fake"] }
serde_json.workspace = true
async-trait.workspace = true

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
