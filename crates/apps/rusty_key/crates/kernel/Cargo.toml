[package]
name = "rk-kernel"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rk-constrain.workspace = true
aisdk.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio.workspace = true
futures = { workspace = true }

[features]
# Ships the scripted FakeLanguageModel fixture (testing-strategy.md). Enabled in
# dev/tests; downstream test crates turn it on too.
fake = []

[dev-dependencies]
rk-observe.workspace = true
rk-kernel ={ path = ".", features = ["fake"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
