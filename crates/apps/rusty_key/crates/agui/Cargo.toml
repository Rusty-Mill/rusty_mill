[package]
name = "rk-agui"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Serve a Rusty Keys session over AG-UI: a Session per thread behind rusty_agui's Agent trait, with the approval gate and plan exits as frontend tool calls (ADR-0007 follow-ons step 10)"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rk-app.workspace = true
rk-config.workspace = true
rk-constrain.workspace = true
rk-observe.workspace = true
aisdk.workspace = true
anyhow = "1"
# The protocol: the `Agent` trait this crate implements, the event types,
# and the `serve` feature's handler a consumer mounts on `rusty_serve`.
rusty_agui = { workspace = true, features = ["serve"] }
# AG-UI values are `rusty_json::Value`, Rusty Keys' are `serde_json::Value`;
# the `serde` feature is the bridge between the two.
rusty_json = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
rk-kernel = { workspace = true, features = ["fake"] }
rusty_agui = { workspace = true, features = ["serve", "client"] }
rusty_serve.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
