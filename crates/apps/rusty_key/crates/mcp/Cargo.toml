[package]
name = "rk-mcp"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rk-config.workspace = true
rk-constrain.workspace = true
rk-observe.workspace = true
rk-feed.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror = "2"
toml.workspace = true
# `tokio::sync::Mutex` guards the connection across remote awaits; `rusty_tokio`'s
# mutex loses the wakeup when a queued waiter is cancelled (#1064).
tokio = { workspace = true, features = ["sync"] }
rusty-mcp-client = { workspace = true, optional = true }

[dev-dependencies]
rusty_tokio.workspace = true

[features]
# Expose the in-process FakeMcpClient for downstream offline tests.
fake = []
# The MCP transport adapter (ADR-0029), over `rusty-mcp-client` (first-party
# native client). Off by default so the offline core builds without the SDK;
# CI/release builds enable it. The feature keeps its `rmcp` name.
rmcp = ["dep:rusty-mcp-client", "rusty-mcp-client/tokio"]

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
