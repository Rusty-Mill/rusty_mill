# cargo-deny configuration (ADR-0029). The license gate protects the project's
# permissive (MIT/Apache-2.0) posture: a copyleft transitive dependency — the
# reason opendocswork-mcp was rejected in favour of rmcp — fails the build.
#
# Run locally / in CI: `cargo deny check licenses`

[licenses]
# Only permissive licenses are allowed in the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
# Copyleft licenses are not in `allow`, so they fail the gate by omission.
confidence-threshold = 0.9

[bans]
# Informational; the license gate is the load-bearing check here.
multiple-versions = "warn"

[advisories]
# Security advisories are reported; tune to "deny" once a baseline is clean.
yanked = "warn"
ignore = [
    # rsa 0.9.x (Marvin Attack timing side-channel): present in the shared
    # workspace Cargo.lock via jsonwebtoken's `rust_crypto` feature in
    # agentgateway-auth (rusty_agent_gateway) and rusty-mcp's `jwt`
    # feature, not a rusty_key dependency itself -- cargo-deny resolves
    # the whole workspace graph regardless of which crate's config
    # invokes it. Reviewed: both crates' production code only calls
    # `jsonwebtoken::decode`/`DecodingKey` (signature *verification*,
    # public-key only); `encode`/`EncodingKey` (the private-key signing
    # path the advisory concerns) appears only in each crate's own test
    # suite, never in shipped code. The Marvin Attack leaks private-key
    # bits through timing in RSA decrypt/sign operations; verifying a
    # signature with the public modulus/exponent has no secret-dependent
    # computation to leak. Revisit once a patched `rsa` release exists.
    { id = "RUSTSEC-2023-0071", reason = "RS256 verify-only usage (DecodingKey/decode); the private-key sign/decrypt path the Marvin Attack targets is never exercised in production code" },
]
