<svg xmlns="http://www.w3.org/2000/svg" width="980" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="760" fill="#0f1117"/>
  <text x="490" y="40" fill="#e6e6e6" font-size="24" font-weight="700" text-anchor="middle">Scorecard: Rusty Key vs. the references' principles</text>

  <!-- legend -->
  <rect x="250" y="58" width="16" height="16" rx="3" fill="#3ba55d"/>
  <text x="272" y="71" fill="#c4ccda" font-size="12">Strong / Exceeds</text>
  <rect x="430" y="58" width="16" height="16" rx="3" fill="#d9a23b"/>
  <text x="452" y="71" fill="#c4ccda" font-size="12">Partial</text>
  <rect x="560" y="58" width="16" height="16" rx="3" fill="#c34d4d"/>
  <text x="582" y="71" fill="#c4ccda" font-size="12">Gap</text>

  <!-- column header -->
  <text x="40" y="108" fill="#8b93a7" font-size="13" font-weight="700">PRINCIPLE</text>
  <text x="640" y="108" fill="#8b93a7" font-size="13" font-weight="700" text-anchor="middle">RATING</text>
  <text x="800" y="108" fill="#8b93a7" font-size="13" font-weight="700">NOTE</text>

  <!-- rows: y, label, color, note -->
  <!-- Each row: bg cell + dot + text -->

  <!-- 1 -->
  <rect x="40" y="120" width="900" height="40" rx="6" fill="#161a24"/>
  <text x="56" y="145" fill="#dfe4ee" font-size="13">Thin kernel / thick harness split</text>
  <circle cx="640" cy="140" r="9" fill="#3ba55d"/>
  <text x="700" y="145" fill="#9aa3b5" font-size="12">Enforced by acyclic crate DAG — cleaner than monolith</text>

  <!-- 2 -->
  <rect x="40" y="166" width="900" height="40" rx="6" fill="#11141c"/>
  <text x="56" y="191" fill="#dfe4ee" font-size="13">Sensors / layered verification (Augment's #1 point)</text>
  <circle cx="640" cy="186" r="9" fill="#3ba55d"/>
  <text x="700" y="191" fill="#9aa3b5" font-size="12">Exceeds CC: judge + checks + entropy + chaos tests</text>

  <!-- 3 -->
  <rect x="40" y="212" width="900" height="40" rx="6" fill="#161a24"/>
  <text x="56" y="237" fill="#dfe4ee" font-size="13">Evaluator independent of self-report</text>
  <circle cx="640" cy="232" r="9" fill="#3ba55d"/>
  <text x="700" y="237" fill="#9aa3b5" font-size="12">ADR-0035: same checks run at eval-time, override agent</text>

  <!-- 4 -->
  <rect x="40" y="258" width="900" height="40" rx="6" fill="#11141c"/>
  <text x="56" y="283" fill="#dfe4ee" font-size="13">Composable, deny-first permissions</text>
  <circle cx="640" cy="278" r="9" fill="#3ba55d"/>
  <text x="700" y="283" fill="#9aa3b5" font-size="12">PolicyChain, 6 modes, fail-closed before tool body</text>

  <!-- 5 -->
  <rect x="40" y="304" width="900" height="40" rx="6" fill="#161a24"/>
  <text x="56" y="329" fill="#dfe4ee" font-size="13">Append-only, replayable session state</text>
  <circle cx="640" cy="324" r="9" fill="#3ba55d"/>
  <text x="700" y="329" fill="#9aa3b5" font-size="12">evidence.jsonl + episode packages</text>

  <!-- 6 -->
  <rect x="40" y="350" width="900" height="40" rx="6" fill="#11141c"/>
  <text x="56" y="375" fill="#dfe4ee" font-size="13">Primitive/capability tools (Read/Write/Exec/Connect)</text>
  <circle cx="640" cy="370" r="9" fill="#3ba55d"/>
  <text x="700" y="375" fill="#9aa3b5" font-size="12">fs / bash / web / agent / MCP</text>

  <!-- 7 -->
  <rect x="40" y="396" width="900" height="40" rx="6" fill="#161a24"/>
  <text x="56" y="421" fill="#dfe4ee" font-size="13">Layered memory</text>
  <circle cx="640" cy="416" r="9" fill="#3ba55d"/>
  <text x="700" y="421" fill="#9aa3b5" font-size="12">Richer than CC (typed graph + skill lifecycle)...</text>

  <!-- 8 -->
  <rect x="40" y="442" width="900" height="40" rx="6" fill="#11141c"/>
  <text x="56" y="467" fill="#dfe4ee" font-size="13">Context-as-resource compaction</text>
  <circle cx="640" cy="462" r="9" fill="#d9a23b"/>
  <text x="700" y="467" fill="#9aa3b5" font-size="12">3 tiers vs CC's 5; ~4 chars/token is crude</text>

  <!-- 9 -->
  <rect x="40" y="488" width="900" height="40" rx="6" fill="#161a24"/>
  <text x="56" y="513" fill="#dfe4ee" font-size="13">Subagents (isolated, summary-return)</text>
  <circle cx="640" cy="508" r="9" fill="#d9a23b"/>
  <text x="700" y="513" fill="#9aa3b5" font-size="12">Depth-bounded seam; fewer prebuilt types</text>

  <!-- 10 -->
  <rect x="40" y="534" width="900" height="40" rx="6" fill="#11141c"/>
  <text x="56" y="559" fill="#dfe4ee" font-size="13">Owns its agent loop</text>
  <circle cx="640" cy="554" r="9" fill="#d9a23b"/>
  <text x="700" y="559" fill="#9aa3b5" font-size="12">Loop delegated to aisdk; no per-step in-loop control</text>

  <!-- 11 -->
  <rect x="40" y="580" width="900" height="40" rx="6" fill="#161a24"/>
  <text x="56" y="605" fill="#dfe4ee" font-size="13">Execution boundary = safety boundary (sandbox)</text>
  <circle cx="640" cy="600" r="9" fill="#d9a23b"/>
  <text x="700" y="605" fill="#9aa3b5" font-size="12">Seam exists but in-process is the DEFAULT</text>

  <!-- 12 -->
  <rect x="40" y="626" width="900" height="40" rx="6" fill="#11141c"/>
  <text x="56" y="651" fill="#dfe4ee" font-size="13">Guides / feedforward (CLAUDE.md hierarchy)</text>
  <circle cx="640" cy="646" r="9" fill="#c34d4d"/>
  <text x="700" y="651" fill="#9aa3b5" font-size="12">~3-sentence system prompt; no instruction layer</text>

  <!-- 13 -->
  <rect x="40" y="672" width="900" height="40" rx="6" fill="#161a24"/>
  <text x="56" y="697" fill="#dfe4ee" font-size="13">"The ratchet": failures → standing rules</text>
  <circle cx="640" cy="692" r="9" fill="#c34d4d"/>
  <text x="700" y="697" fill="#9aa3b5" font-size="12">No codified mechanism (skills are data, not policy)</text>

  <!-- 14 -->
  <rect x="40" y="718" width="900" height="40" rx="6" fill="#11141c"/>
  <text x="56" y="743" fill="#dfe4ee" font-size="13">Declarative extensibility (Skills / Hooks / Plugins)</text>
  <circle cx="640" cy="738" r="9" fill="#c34d4d"/>
  <text x="700" y="743" fill="#9aa3b5" font-size="12">MCP only; no .md/.json extension layer</text>
</svg>
