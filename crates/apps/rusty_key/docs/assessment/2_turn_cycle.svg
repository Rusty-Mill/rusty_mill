<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="760" fill="#0f1117"/>
  <text x="480" y="40" fill="#e6e6e6" font-size="24" font-weight="700" text-anchor="middle">One Turn: what Session::send() does</text>
  <text x="480" y="66" fill="#8b93a7" font-size="14" text-anchor="middle">The harness wraps the model loop with context-building (before) and verification (after).</text>

  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L10,0 L5,8 Z" fill="#5b6478"/>
    </marker>
  </defs>

  <!-- helper: each step is a rounded rect -->
  <!-- 1 ORIENT -->
  <rect x="280" y="90" width="400" height="64" rx="10" fill="#16202e" stroke="#61afef" stroke-width="2"/>
  <text x="300" y="116" fill="#61afef" font-size="13" font-weight="700">1 · ORIENT — assemble context</text>
  <text x="300" y="138" fill="#c4ccda" font-size="12">task state + recalled memory (scored, de-duped) + transcript</text>
  <line x1="480" y1="154" x2="480" y2="174" stroke="#5b6478" stroke-width="2" marker-end="url(#d)"/>

  <!-- 2 BUDGET -->
  <rect x="280" y="176" width="400" height="64" rx="10" fill="#16202e" stroke="#61afef" stroke-width="2"/>
  <text x="300" y="202" fill="#61afef" font-size="13" font-weight="700">2 · BUDGET &amp; COMPACT</text>
  <text x="300" y="224" fill="#c4ccda" font-size="12">line-item token estimate → Micro / Session / Full (0.80 / 0.90 / 0.95)</text>
  <line x1="480" y1="240" x2="480" y2="260" stroke="#5b6478" stroke-width="2" marker-end="url(#d)"/>

  <!-- 3 KERNEL -->
  <rect x="240" y="262" width="480" height="116" rx="10" fill="#2b2140" stroke="#c678dd" stroke-width="3"/>
  <text x="260" y="288" fill="#c678dd" font-size="13" font-weight="700">3 · KERNEL DISPATCH — the model loop (aisdk)</text>
  <text x="260" y="310" fill="#d9c2ef" font-size="12">run_turn / stream_turn · model decides: text or tool call</text>
  <!-- inner policy gate -->
  <rect x="270" y="322" width="420" height="44" rx="8" fill="#3a1f24" stroke="#e06c75" stroke-width="2"/>
  <text x="290" y="342" fill="#e06c75" font-size="12" font-weight="700">↳ every tool call vetted by PolicyChain BEFORE its body runs</text>
  <text x="290" y="358" fill="#d39ba1" font-size="11">blocked → structured ToolOutcome::blocked (recover, don't crash)</text>
  <line x1="480" y1="378" x2="480" y2="398" stroke="#5b6478" stroke-width="2" marker-end="url(#d)"/>

  <!-- 4 VERIFY stack -->
  <rect x="200" y="400" width="560" height="150" rx="10" fill="#16241a" stroke="#98c379" stroke-width="2"/>
  <text x="220" y="426" fill="#98c379" font-size="13" font-weight="700">4 · VERIFY (layered "sensors")</text>
  <rect x="220" y="436" width="250" height="34" rx="6" fill="#1c2e1f" stroke="#5d7a4d"/>
  <text x="232" y="458" fill="#cfe0bf" font-size="11">a. deterministic: NoToolErrors, CleanTermination</text>
  <rect x="490" y="436" width="250" height="34" rx="6" fill="#1c2e1f" stroke="#5d7a4d"/>
  <text x="502" y="458" fill="#cfe0bf" font-size="11">b. semantic: criteria judge (LLM)</text>
  <rect x="220" y="476" width="250" height="34" rx="6" fill="#1c2e1f" stroke="#5d7a4d"/>
  <text x="232" y="498" fill="#cfe0bf" font-size="11">c. H3 registered checks (checks.toml)</text>
  <rect x="490" y="476" width="250" height="34" rx="6" fill="#1c2e1f" stroke="#5d7a4d"/>
  <text x="502" y="498" fill="#cfe0bf" font-size="11">d. entropy audit (heuristic)</text>
  <text x="220" y="532" fill="#7f9c6a" font-size="11">→ every failed check maps to ONE FailureType (FTool/FModel/FVerify/FRecovery)</text>
  <line x1="480" y1="550" x2="480" y2="570" stroke="#5b6478" stroke-width="2" marker-end="url(#d)"/>

  <!-- 5 JOURNAL -->
  <rect x="280" y="572" width="400" height="56" rx="10" fill="#241f16" stroke="#e5c07b" stroke-width="2"/>
  <text x="300" y="598" fill="#e5c07b" font-size="13" font-weight="700">5 · JOURNAL evidence</text>
  <text x="300" y="618" fill="#c4ccda" font-size="12">evidence.jsonl + episodes/&lt;turn&gt;.json (append-only, replayable)</text>
  <line x1="480" y1="628" x2="480" y2="648" stroke="#5b6478" stroke-width="2" marker-end="url(#d)"/>

  <!-- 6 MEMORY -->
  <rect x="280" y="650" width="400" height="64" rx="10" fill="#241f16" stroke="#e5c07b" stroke-width="2"/>
  <text x="300" y="676" fill="#e5c07b" font-size="13" font-weight="700">6 · POST-TURN MEMORY (concurrent)</text>
  <text x="300" y="698" fill="#c4ccda" font-size="12">verified → promote skill · failed → capture attribution · idle → consolidate</text>

  <text x="480" y="742" fill="#5b6478" font-size="11" text-anchor="middle">Steps 1–2 and 4–6 are the harness. Step 3 is the only "AI logic" — and it's delegated to aisdk.</text>
</svg>
