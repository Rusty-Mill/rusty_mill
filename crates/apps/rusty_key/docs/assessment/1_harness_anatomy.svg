<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="600" fill="#0f1117"/>
  <text x="480" y="40" fill="#e6e6e6" font-size="24" font-weight="700" text-anchor="middle">The Shared Thesis: thin kernel, thick harness</text>
  <text x="480" y="68" fill="#8b93a7" font-size="14" text-anchor="middle">All 3 references + Rusty Key agree: the model loop is small; the engineering lives in the wrapper.</text>

  <!-- Outer harness ring -->
  <rect x="120" y="100" width="720" height="420" rx="18" fill="#161a24" stroke="#2a3142" stroke-width="2"/>
  <text x="480" y="128" fill="#9fb0ff" font-size="15" font-weight="700" text-anchor="middle">THE HARNESS  (~98% of the code — VILA-Lab: "98.4% deterministic infrastructure")</text>

  <!-- Four verbs as boxes around the kernel -->
  <!-- Constrain (left) -->
  <rect x="150" y="210" width="190" height="120" rx="12" fill="#1d2433" stroke="#e06c75" stroke-width="2"/>
  <text x="245" y="238" fill="#e06c75" font-size="16" font-weight="700" text-anchor="middle">CONSTRAIN</text>
  <text x="245" y="262" fill="#c4ccda" font-size="12" text-anchor="middle">vet every tool call</text>
  <text x="245" y="280" fill="#c4ccda" font-size="12" text-anchor="middle">BEFORE dispatch</text>
  <text x="245" y="304" fill="#7f8aa3" font-size="11" text-anchor="middle">PolicyChain · 6 modes</text>
  <text x="245" y="320" fill="#7f8aa3" font-size="11" text-anchor="middle">fail-closed, deny-first</text>

  <!-- Feed (top) -->
  <rect x="370" y="160" width="220" height="90" rx="12" fill="#1d2433" stroke="#61afef" stroke-width="2"/>
  <text x="480" y="186" fill="#61afef" font-size="16" font-weight="700" text-anchor="middle">FEED</text>
  <text x="480" y="208" fill="#c4ccda" font-size="12" text-anchor="middle">tools · context · memory</text>
  <text x="480" y="226" fill="#c4ccda" font-size="12" text-anchor="middle">task state · recall</text>
  <text x="480" y="244" fill="#7f8aa3" font-size="11" text-anchor="middle">3-tier memory, FTS5/semantic</text>

  <!-- Compose (right) -->
  <rect x="620" y="210" width="190" height="120" rx="12" fill="#1d2433" stroke="#98c379" stroke-width="2"/>
  <text x="715" y="238" fill="#98c379" font-size="16" font-weight="700" text-anchor="middle">COMPOSE</text>
  <text x="715" y="262" fill="#c4ccda" font-size="12" text-anchor="middle">verify the turn</text>
  <text x="715" y="280" fill="#c4ccda" font-size="12" text-anchor="middle">attribute failures</text>
  <text x="715" y="304" fill="#7f8aa3" font-size="11" text-anchor="middle">determ→semantic→checks</text>
  <text x="715" y="320" fill="#7f8aa3" font-size="11" text-anchor="middle">→entropy · evidence.jsonl</text>

  <!-- Observe (bottom) -->
  <rect x="370" y="390" width="220" height="90" rx="12" fill="#1d2433" stroke="#e5c07b" stroke-width="2"/>
  <text x="480" y="416" fill="#e5c07b" font-size="16" font-weight="700" text-anchor="middle">OBSERVE</text>
  <text x="480" y="438" fill="#c4ccda" font-size="12" text-anchor="middle">episode trace · tool events</text>
  <text x="480" y="456" fill="#c4ccda" font-size="12" text-anchor="middle">interventions · entropy audit</text>
  <text x="480" y="474" fill="#7f8aa3" font-size="11" text-anchor="middle">append-only, replayable</text>

  <!-- Kernel (center) -->
  <rect x="385" y="280" width="190" height="80" rx="12" fill="#2b2140" stroke="#c678dd" stroke-width="3"/>
  <text x="480" y="312" fill="#c678dd" font-size="16" font-weight="700" text-anchor="middle">KERNEL</text>
  <text x="480" y="332" fill="#d9c2ef" font-size="12" text-anchor="middle">the model loop (aisdk)</text>
  <text x="480" y="350" fill="#9b86b5" font-size="11" text-anchor="middle">Think · Act · Observe · Repeat</text>

  <!-- arrows in/out of kernel -->
  <line x1="340" y1="300" x2="385" y2="305" stroke="#e06c75" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="250" x2="480" y2="280" stroke="#61afef" stroke-width="2" marker-end="url(#a)"/>
  <line x1="575" y1="305" x2="620" y2="300" stroke="#98c379" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="360" x2="480" y2="390" stroke="#e5c07b" stroke-width="2" marker-end="url(#a)"/>

  <text x="480" y="500" fill="#8b93a7" font-size="12" text-anchor="middle" font-style="italic">Rusty Key enforces this split with an acyclic crate DAG: the kernel sees only &amp;dyn ToolDispatch / &amp;dyn Policy.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b93a7"/>
    </marker>
  </defs>

  <text x="480" y="558" fill="#5b6478" font-size="11" text-anchor="middle">Maps to OODA: Constrain=gate · Feed=Observe/Orient · Kernel=Decide/Act · Compose=Verify</text>
</svg>
