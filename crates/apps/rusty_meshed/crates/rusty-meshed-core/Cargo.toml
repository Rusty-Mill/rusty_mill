[package]
name = "rusty-meshed-core"
version = "0.1.0"
edition = "2021"
description = "Shared platform config for rusty_meshed: env-prefixed settings loaded once, injected into every other rusty_meshed crate."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mill"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_err = { workspace = true }
rusty_json = { workspace = true }
rusty_uuid = { workspace = true }

[dev-dependencies]
