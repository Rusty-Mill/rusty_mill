[package]
name = "ts-hub"
description = "First-party ts2021 coordination server (spike B): register by pre-auth key, netmap long-poll"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
ts-control.workspace = true
ts-types.workspace = true
ts-key.workspace = true
ts-derp.workspace = true
ts-stun.workspace = true
rusty_tls = { workspace = true, features = ["rusty-tokio"] }
crypto_box.workspace = true
rusty_tokio.workspace = true
rusty_h2 = { path = "../../../../libs/net/rusty_h2", features = ["rusty-tokio"] }
rusty_http = { workspace = true, features = ["rusty-tokio"] }
rusty_base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
ts-net.workspace = true
rusty_sha2.workspace = true
rusty_log = { workspace = true, features = ["subscriber"] }
