[package]
name = "ts-daemon"
description = "tailscaled-equivalent daemon binary"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
ts-key.workspace = true
rusty_tokio.workspace = true
ts-engine.workspace = true
ts-localapi.workspace = true
ts-types.workspace = true
rusty_log = { workspace = true, features = ["subscriber"] }
