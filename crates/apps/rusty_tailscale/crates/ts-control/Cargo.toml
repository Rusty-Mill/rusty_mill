[package]
name = "ts-control"
description = "ts2021 control-plane client: Noise IK channel, registration, netmap long-poll"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
ts-types.workspace = true
ts-key.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time"] }
# HTTP/2 over the Noise channel. Its connection driver reads and writes
# through `rusty_tokio`'s I/O traits (`src/rusty_io.rs` adapts tokio streams
# to them) and needs no `rusty_tokio` runtime, so it runs on tokio here.
rusty_h2 = { path = "../../../../libs/net/rusty_h2", features = ["rusty-tokio"] }
rusty_tokio.workspace = true
chacha20poly1305.workspace = true
blake2.workspace = true
hkdf.workspace = true
rusty_http = { workspace = true, features = ["tokio"] }
# Standard base64 for the `X-Tailscale-Handshake` header; replaced this
# crate's own encode-only copy (see DESIGN.md's dependency table).
rusty_base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "process"] }
