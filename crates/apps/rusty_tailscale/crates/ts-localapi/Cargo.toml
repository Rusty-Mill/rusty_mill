[package]
name = "ts-localapi"
description = "LocalAPI-compatible HTTP-over-UDS server subset"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
ts-types.workspace = true
serde.workspace = true
serde_json.workspace = true
rusty_tokio.workspace = true
rusty_http = { workspace = true, features = ["rusty-tokio"] }
rusty_log = { workspace = true }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Raw `socket`/`bind`/`chmod`/`listen` steps in `bind()`'s Unix backend --
# `std`/`tokio`'s `UnixListener::bind` binds *and* starts listening in one
# call, so narrowing the socket file's mode has to happen by hand, in
# between `bind` and `listen`, to close the TOCTOU window a `bind`-then-
# `chmod` ordering leaves open.
libc = { workspace = true }

[dev-dependencies]
# Independent HTTP/1.1 client for tests/roundtrip.rs -- proves real interop
# with a totally separate implementation, not just this crate against
# itself. Not a runtime dependency (see the dependency table in DESIGN.md).
hyper = { workspace = true, features = ["client", "http1"] }
http-body-util.workspace = true
