[package]
name = "ts-cli"
description = "CLI: status/up/down/ping over the tailscaled LocalAPI Unix socket"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
ts-types.workspace = true
serde_json.workspace = true
rusty_tokio.workspace = true
rusty_http = { workspace = true, features = ["rusty-tokio"] }
thiserror.workspace = true
