[package]
name = "rusty_fair_play"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"
description = "Fair Play household cards: a JSON HTTP API and web UI over rusty_multimodal_db's fair_play domain"
publish = false

# Nested in the rusty_multimodal_db family (ADR-0003: an app crate may
# depend on an app crate only within its own family), beside the domain
# it serves.
[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
# The domain, embedded: the three stacks, the queries, the seed loader
# with the deck inside it. Default features only — no server, no research.
rusty_multimodal_db = { path = "../.." }
# The data-directory lock, so two processes never serve one store.
rusty_multimodal_db_engine = { workspace = true }
# HTTP/1.1 framing, JSON and query-string decoding come from the
# monorepo's own crates (rusty_tick's ADR-0001), not hyper/axum/serde_json.
rusty_http = { workspace = true }
rusty_json = { workspace = true }
rusty_url = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = { version = "1", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
tempfile = "3"
