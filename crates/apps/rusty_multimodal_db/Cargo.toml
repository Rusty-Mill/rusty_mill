[package]
name = "rusty_multimodal_db"
version = "0.1.0"
edition = "2021"
# The oldest compiler that builds this crate: `std::fs::File::try_lock` (the data-
# directory lock, `ADR-0092`) is stable since 1.89.0, one minor above the 1.88.0
# ceiling every dependency declares (`time` 0.3.55). Checked by the monorepo's
# `multimodal-db-msrv` job in the root workflow (the crate's own workflow was
# retired by `ADR-0106`), so a dependency bump that raises it fails there rather
# than on whoever builds next. Keep the job's toolchain pin equal to this.
rust-version = "1.89"
description = "The multimodal_db server, clients and domain adapters over rusty_multimodal_db_engine"
repository = "https://github.com/baileyrd/rusty_multimodal_db"
license = "MIT"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[lib]
name = "rusty_multimodal_db"
path = "src/lib.rs"

[[bench]]
name = "generic_production"
harness = false
required-features = ["research"]

# Needs both: real sockets + ConnectionStore/serve (server) against all
# three domains, two of which (Order/Customer, Employee) are research-gated
# reference material — same pairing tests/server_order_integration.rs and
# tests/server_employee_integration.rs already require.
[[bench]]
name = "server"
harness = false
required-features = ["server", "research"]

[[test]]
name = "production_integration"
required-features = ["research"]

[[test]]
name = "generic_production_integration"
required-features = ["research"]

[[test]]
name = "mmap_record_identity_keying"
required-features = ["research"]

# The server integration tests spin up a real TCP listener against the
# `server` feature's `ConnectionStore` adapters. The Dog-domain test only
# needs `server`; the Order/Customer one additionally needs `research`
# (see `src/server/order.rs`'s own module docs).
[[test]]
name = "server_dog_integration"
required-features = ["server"]

[[test]]
name = "server_reminder_integration"
required-features = ["server"]

[[test]]
name = "server_entity_integration"
required-features = ["server"]

[[test]]
name = "server_memory_integration"
required-features = ["server"]

# `FPL-FR-007` (ADR-0137): the three `Fair Play` tables over
# `serve_tables`, driven by the Rust client and by the Python reference
# client (`clients/python/fair_play_driver.py`; needs a CPython 3
# interpreter on `PATH`, fails loudly without one).
[[test]]
name = "server_fair_play_integration"
required-features = ["server"]

# `ECO-FR-003` (ADR-0043): proves the client-only feature set builds and
# works with no server compiled — framing + protocol round trips and the
# client library's own refusals, connecting to nothing.
[[test]]
name = "server_client_only"
required-features = ["client"]

# `ECO-FR-008` (ADR-0043): the Python reference client driven against a
# real `Entity` server. Needs a CPython 3 interpreter on `PATH`
# (`python3` or `python`, whichever is found — see the test's own
# `python_binary`) and fails loudly without one — a skipped test is not
# a test (see the file's own docs).
[[test]]
name = "server_python_client"
required-features = ["server"]

[[test]]
name = "server_order_integration"
required-features = ["server", "research"]

[[test]]
name = "server_employee_integration"
required-features = ["server", "research"]

[[test]]
name = "server_schema_driven_client"
required-features = ["server", "research"]

[[test]]
name = "server_auth_integration"
required-features = ["server"]

[[test]]
name = "server_transaction_integration"
required-features = ["server"]

[[test]]
name = "server_tls_integration"
required-features = ["server"]

[[test]]
name = "server_protocol_version"
required-features = ["server", "research"]

[[test]]
name = "server_sql_integration"
required-features = ["server", "research"]

# `ADR-0062` item 5, re-scoped `DIFFERENTIAL-TEST-SUITE-PORT`: the
# equivalent differential/behavioral coverage the original ~60-test
# port would have been, built directly against this crate's own real
# primitives instead — `server` alone, no `research` (only `Memory`/
# `Entity`/`Relation`, all front-door domains).
[[test]]
name = "server_hub_differential"
required-features = ["server"]

# `ADR-0064`: process-wide counters over a real socket — `server` alone.
[[test]]
name = "server_metrics_integration"
required-features = ["server"]

# `ADR-0069`: HTTP scrapes of the shared wire counters over a second listener.
[[test]]
name = "server_metrics_http_integration"
required-features = ["server"]

[[test]]
name = "memory_server_data_dir_lock"
required-features = ["server"]

# Five server-only test targets that were never registered (ADR-0098):
# each imports `rusty_multimodal_db::server::{memory,entity,relation,...}`,
# so without `required-features` they fail to compile under any feature
# set that lacks `server` -- invisible to CI's `--all-features` run.
[[test]]
name = "memory_server_mvcc_integration"
required-features = ["server"]

[[test]]
name = "server_memory_mvcc_integration"
required-features = ["server"]

[[test]]
name = "server_entity_mvcc_integration"
required-features = ["server"]

[[test]]
name = "server_relation_mvcc_integration"
required-features = ["server"]

[[test]]
name = "server_replication_integration"
required-features = ["server"]

[[test]]
name = "server_limits_integration"
required-features = ["server"]

[[test]]
name = "server_drain_integration"
required-features = ["server"]

[[test]]
name = "memory_server_drain"
required-features = ["server"]

[[test]]
name = "server_nullable_integration"
required-features = ["server"]

[[test]]
name = "server_planner_eq_integration"
required-features = ["server"]

[[test]]
name = "server_session_writes_integration"
required-features = ["server"]

[[test]]
name = "server_change_log_integration"
required-features = ["server"]

[[test]]
name = "memory_server_exposure"
required-features = ["server"]

[[test]]
name = "memory_server_defaults"
required-features = ["server"]

# The crash-safety diagnosis harness's four trials as a CI gate
# (ADR-0095): spawns `crash_writer`, so it needs the `research` feature
# that binary is gated behind.
[[test]]
name = "crash_safety"
required-features = ["research"]

# `ADR-0065`: a live snapshot copy into a `SERVER_BACKUP_ROOT`-relative
# directory, reopened via `open_memory_production_stack_portable` to
# prove the copy is real — `server` alone.
[[test]]
name = "server_backup_integration"
required-features = ["server"]

# `ADR-0066`: the schema-migration regression test, sharing its logic
# with `examples/migrate_memory_v1_to_v2.rs` via `#[path]` (see that
# file's own module doc comment). No `required-features` — unlike
# every other `[[test]]` entry above, `crate::generic::memory` is
# front-door, not `server`/`research`-gated, so this needs nothing
# beyond the default build; listed explicitly anyway, matching this
# file's own convention of naming every test target rather than
# leaving some to bare autodiscovery.
[[test]]
name = "schema_migration"

# `ADR-0066`: the real, runnable migration CLI this design's worked
# example ships as — `cargo run --example migrate_memory_v1_to_v2 --
# <old_path> <new_path>`. Same no-feature-needed reasoning as the test
# entry above; `examples/support/migrate_memory_v1_to_v2_lib.rs` lives
# in a subdirectory specifically so Cargo's example autodiscovery does
# not also try to build it as its own (`main`-less) example target.
[[example]]
name = "migrate_memory_v1_to_v2"

# `ADR-0070`: offline restore needs only the public generic constructors.
# The shared main-less module stays under examples/support/ so Cargo
# does not discover it as a separate example, like the migration above.
[[example]]
name = "restore_backup"

# No required-features: offline checks run by default; real socket-backed
# Backup fixtures are cfg(server) tests within this same target.
[[test]]
name = "restore_backup"

# `ADR-0118`: the replica-refresh CLI — `FetchSnapshot` into a fresh,
# verified directory, once or on an interval. Needs the client half
# (`SchemaDrivenClient`); the shared main-less module lives under
# examples/support/ like the restore and migration tools' own.
[[example]]
name = "replica_refresh"
required-features = ["client"]

# `ADR-0131`: what the change log costs under concurrent writers.
[[example]]
name = "change_log_bench"
required-features = ["server"]

# `ADR-0136`: what a chunked snapshot costs the table's writers.
[[example]]
name = "snapshot_stall_bench"
required-features = ["server"]

# Its integration test serves a real table, so it needs `server`; the
# file is `#![cfg(feature = "server")]` as well.
[[test]]
name = "replica_refresh"
required-features = ["server"]

# `ADR-0115`: the journal gauges over a real served pair of tables.
[[test]]
name = "server_journal_metrics_integration"
required-features = ["server"]

# `crash_writer`/`crash_safety_harness` (the crash-safety diagnosis
# harness) build `Order`/`Customer` datasets via `generic::order_customer`
# and use `bench_support::fresh_temp_dir` — both research-gated. Explicit
# `[[bin]]` entries needed for the same reason as `[[test]]` above.
[[bin]]
name = "crash_writer"
required-features = ["research"]

[[bin]]
name = "crash_safety_harness"
required-features = ["research"]

# `multiprocess_writer`/`multiprocess_harness` (the multi-process access
# diagnosis harness) — same reason as `crash_writer`/`crash_safety_harness`
# above.
[[bin]]
name = "multiprocess_writer"
required-features = ["research"]

[[bin]]
name = "multiprocess_harness"
required-features = ["research"]

# A minimal, real server binary for the `Dog` domain — a hand-written
# three-record sample dataset, not `generator` (research-gated), so this
# builds under `server` alone. See `src/server/mod.rs`'s own doc comment
# for what this binary does and does not provide before running it.
[[bin]]
name = "dog_server"
required-features = ["server"]

# A minimal, real server binary for the `Reminder` domain — mirrors
# `dog_server`'s own shape exactly (RMD-FR-008, ADR-0036); `server` alone
# is sufficient, since `Reminder` is front-door, not `research`-gated.
[[bin]]
name = "reminder_server"
required-features = ["server"]

# A minimal, real server binary for the `Entity` domain — mirrors
# `reminder_server`'s own shape exactly (ENT-FR-006, ADR-0037); `server`
# alone is sufficient, since `Entity` is front-door, not `research`-gated.
[[bin]]
name = "entity_server"
required-features = ["server"]

# A minimal, real server binary for the `Memory` domain — mirrors
# `reminder_server`'s own shape exactly (MEM-FR-007, ADR-0048); `server`
# alone is sufficient, since `Memory` is front-door, not `research`-gated.
[[bin]]
name = "memory_server"
required-features = ["server"]

# A minimal, real server binary for the `Fair Play` domain — `memory_server`'s
# multi-table shape over `serve_tables` with `card` primary (FPL-FR-007,
# ADR-0137); `server` alone is sufficient, since `Fair Play` is front-door.
[[bin]]
name = "fair_play_server"
required-features = ["server"]

[dependencies]
# PEM bodies (`src/server/pem.rs`), part of the `client` feature.
rusty_base64 = { workspace = true, optional = true }
# UUID type + deterministic construction from seeded random bytes (Builder::from_random_bytes
# needs no extra feature — Uuid::new_v4()'s OS-randomness feature is deliberately not enabled,
# since dataset generation must be reproducible from a seed, not OS-random). The "serde" feature
# is new as of the durability work (STORAGE-008/009): WAL entries and snapshots need Uuid to
# (de)serialize.
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
# The generic store, extracted from this crate so another product can embed it
# (ADR-0124); re-exported as `generic`, `durability::DurabilityError` and
# `codec`, so this crate's paths are unchanged.
rusty_multimodal_db_engine = { workspace = true }
# The Fair Play domain (ADR-0137), its own libs crate so the `rusty_fair_play`
# app can share it; re-exported as `generic::fair_play`.
rusty_fair_play_domain = { workspace = true }
# Error type for the one fallible DogStore operation (update_age on an unknown UUID), and for
# DurabilityError (src/durability/mod.rs).
thiserror = "1"
# New as of the durability work (STORAGE-008/009): (De)serialize trait for DogRecord and the
# shared CanonicalCachedState snapshot/WAL-entry shape. The "derive" feature is needed for the
# #[derive(Serialize, Deserialize)] on those types.
serde = { version = "1", features = ["derive"] }
# New as of the durability work: binary (de)serialization for WAL entries and snapshots. Chosen
# over serde_json for the whole durability module (not just the WAL's hot path) — this is a
# benchmark harness, not a tool whose on-disk files need to stay human-readable/debuggable, and
# a single serialization format is one fewer thing to keep consistent across 8 variants.
bincode = "1"
# New as of the durability work, Tier 2 variant 6 only (src/durability/mmap_store.rs): safe(r)
# wrapper over memory-mapped files. The de facto standard crate for this in the Rust ecosystem
# (successor to the unmaintained `memmap`).
memmap2 = "0.9"
# New as of the server auth work (ADR-0012, `SERVER-AUTH-DESIGN.md`): constant-time byte
# comparison for token checking (`src/server/mod.rs`'s `AuthConfig::check`). Deliberately not
# hand-rolled — a DIY constant-time loop is a well-known place timing side-channel bugs hide
# silently (a compiler optimization can reintroduce early-exit behavior the source never wrote).
# Only exercised behind the `server` feature, but left unconditional rather than `dep:`-gated — it's tiny and dependency-free.
subtle = "2"
# New as of the server transport-encryption work (ADR-0014, `SERVER-TLS-DESIGN.md`): native TLS
# for `serve`'s optional `TlsConfig` — this owner's own ecosystem-wide `rustls` wrapper, rather
# than depending on `rustls` directly: `rusty_tls` exists specifically so no consumer in this
# owner's ecosystem depends on `rustls` (or picks its own crypto-provider crate, cipher policy, or
# trust-anchor handling) independently, and its server-side `TlsAcceptor`/`TlsServerStream` is a
# close-to-drop-in fit for this crate's own thread-per-connection, sync-`Read`/`Write` model — see
# `docs/design/SERVER-TLS-DESIGN.md`'s "Ecosystem check" for the full reasoning. `dep:`-gated
# (only the `server` feature needs it). Was a pinned git dependency on `Rusty-Mill/rusty_mill`
# (matching `rusty_tls`'s own sibling-pinning convention, `rustils`' `docs/versioning.md` §3);
# retired to a plain path dependency now that this crate itself lives in that same workspace as
# `crates/rusty_tls` — the same-workspace-source rule ADR-0002 (root `docs/adr/`) requires, and
# the same swap `rusty_yirp`'s `sessionmgr-pty` and `nexus-rush` made on their own merges.
rusty_tls = { workspace = true, optional = true }
# New as of the server metrics HTTP work (ADR-0069, `SERVER-METRICS-HTTP-DESIGN.md`):
# HTTP/1.1 head parsing and response writing for the opt-in scrape listener — this owner's
# own ecosystem message layer, matching ADR-0014's `rusty_tls` reuse instead of a raw
# dependency or hand-rolled parser. Its sync `Read`/`Write` adapter fits the existing
# thread-per-connection model; default features add no transitive dependency or runtime.
# A plain sibling path, like `rusty_tls` above; `dep:`-gated under `server` only.
rusty_http = { workspace = true, optional = true }
# New as of `Entity`'s source-verification follow-ups (ADR-0042, `ENT5-FR-002`,
# `docs/design/SERVER-ENTITY-SOURCE-VERIFICATION-DESIGN.md`): `crate::generic::entity::entity_id`
# derives a deterministic `Uuid` from an entity's normalized name — SHA-256 over the normalized
# string, first 16 bytes — so two callers minting the same name converge on one id and a
# canonical-name lookup is a single indexed `GetById`. Mirrors `rusty_remind_me`'s own
# `entity_id` (sha256 of the normalized name), read directly from its source, without inheriting
# its 48-bit truncation. Pure Rust (RustCrypto), no build script; unconditional like `subtle`
# above since `crate::generic::entity` is front-door, not `research`- or `server`-gated. The
# first new *unconditional* dependency since `subtle` (ADR-0012) — every addition between them
# (`rusty_tls`, the since-removed external-database bench crates) is `optional = true`. Named as a real
# cost in ADR-0042's own Consequences (which overstated it as "first since `rusty_tls`"; the
# correction is recorded in that ADR's implementation log).
sha2 = "0.10"

[dependencies.rand]
# Seeded, reproducible RNG for dataset generation (StdRng::seed_from_u64) and for benchmark
# target-UUID selection. Pinned to the well-established 0.8 API rather than the newer 0.10
# line to reduce API-churn risk in a small experimental crate.
version = "0.8"

[dev-dependencies]
# Benchmark harness for the remaining benches (generic_production, server).
criterion = "0.5"
# New as of the server transport-encryption work (ADR-0014, `SERVER-TLS-DESIGN.md`): generates a
# throwaway self-signed certificate + private key for `tests/server_tls_integration.rs`'s own
# hermetic tests. Dev-only, never shipped — matches `rusty_tls`'s own precedent exactly (it takes
# the identical `rcgen` dev-dependency for the identical reason, its own rejection-path test
# suite). Considered and rejected: shelling out to the `openssl` CLI at test time avoids a new
# dependency entirely, but depends on a tool's presence/behavior in every environment `cargo test`
# runs in (this repo's own CI happens to have it, but a contributor's machine might not) — a
# pure-Rust dev-dependency is more hermetic and portable for a test the whole suite depends on.
rcgen = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
# `memory_server`'s SIGTERM/SIGINT handlers for graceful drain (ADR-0127): a first-party raw
# `rt_sigaction`, enabled by `server`; other platforms serve until killed, as before.
rusty_libc = { workspace = true, optional = true }

[features]
# The reference fixtures and durability harnesses: the `Order`/`Customer` and
# `Employee` reference domains, the dataset builders, the crash-safety and
# multi-process harness binaries, and the tests and benches that use them.
# The benchmarked-alternative backends, durability variants, concurrency
# strategies and spikes this feature once also held were removed by
# ADR-0138; they stay readable at the commit that ADR names.
research = ["rusty_multimodal_db_engine/research"]
# The network server/query layer (`src/server/`) — off by default, distinct
# from `research`: this is new, real, additive capability (ADR-0010,
# Accepted), not a benchmarked-alternative or historical-spike module.
# Validating it against the `Order`/`Customer` domain additionally needs
# `research` (see `src/server/order.rs`'s own module docs) since
# `order_customer` itself is research-gated reference material; the `Dog`
# side needs `server` alone. See `src/server/mod.rs`'s own doc comment for
# what this does and does not provide before enabling it. Pulls in
# `rusty_tls` (ADR-0014, `SERVER-TLS-DESIGN.md`) for `serve`'s optional
# native-TLS support — `TlsConfig` is `None` unless an operator opts in, so
# this dependency compiles in but adds no behavior change for an existing
# deployment that doesn't configure it.
# The client half of `src/server/` alone — framing, protocol, the
# schema-driven client and its SQL front end, PEM loading, and `rusty_tls`
# for the client side of TLS. A consumer that only talks to a server
# depends on this and compiles no `serve`, no domain adapter, no journal
# (`ECO-FR-001`, ADR-0043). `server` implies it.
client = ["dep:rusty_tls", "dep:rusty_base64"]
server = ["client", "dep:rusty_http", "dep:rusty_libc"]

[profile.bench]
opt-level = 3
lto = true
