[package]
name = "rp-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_retry = { workspace = true }
rp-core.workspace = true
rp-router.workspace = true
rusty_mcp_server = { workspace = true }
rusty-mcp-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_serve = { workspace = true }
