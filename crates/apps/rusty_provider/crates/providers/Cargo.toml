[package]
name = "rp-providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest.workspace = true
futures-util.workspace = true
# `Compat`: reqwest's SSE body is a `futures` stream; `ChatStream` is `rusty_stream`.
rusty_stream = { workspace = true, features = ["futures-core"] }
bytes.workspace = true
eventsource-stream.workspace = true
percent-encoding = "2"

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
