[package]
name = "rp-providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
rusty_request.workspace = true
# Per-exchange deadline (`time::timeout_at`) over a streamed response body.
rusty_tokio.workspace = true
futures-util.workspace = true
# `Compat`: the SSE decoder (eventsource-stream) yields a `futures` stream;
# `ChatStream` is `rusty_stream`.
rusty_stream = { workspace = true, features = ["futures-core"] }
eventsource-stream.workspace = true
percent-encoding = "2"

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
