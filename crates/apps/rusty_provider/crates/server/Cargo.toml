[package]
name = "rp-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_oauth = { workspace = true }
rp-core.workspace = true
rp-mcp.workspace = true
rp-router.workspace = true
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_mcp_axum.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
ring.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true

[dev-dependencies]
wiremock.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
