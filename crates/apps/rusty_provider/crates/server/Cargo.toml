[package]
name = "rp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_oauth = { workspace = true }
rp-core.workspace = true
rp-mcp.workspace = true
rp-router.workspace = true
rusty_mcp_server = { workspace = true, features = ["rusty-axum"] }
# The HTTP server (#875): rusty_axum on rusty_tokio. Handlers still call
# tokio libraries (reqwest via rp-router, tokio::sync), so the router's
# outermost layer is rusty_axum_tokio's bridge.
rusty_axum.workspace = true
rusty_axum_tokio.workspace = true
rusty_tokio.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
rusty_log = { workspace = true, features = ["subscriber"] }
anyhow.workspace = true
ring.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true

[dev-dependencies]
wiremock.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
