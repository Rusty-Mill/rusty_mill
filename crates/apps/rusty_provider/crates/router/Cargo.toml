[package]
name = "rp-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rp-core.workspace = true
rp-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror = "2"
anyhow.workspace = true
rusty_log = { workspace = true }
rusty_stream.workspace = true
prometheus.workspace = true
rusty_sqlite.workspace = true
# Shared exponential-backoff delay math, also used by rusty_request's and
# rusty_acp's own retry policies -- `jitter: 0.0` reproduces the plain
# doubling-capped-at-max formula webhook.rs's retry loop used to hand-roll.
rusty_retry.workspace = true
# ANSI stripping (the RTK pipeline's first stage): CSI, OSC and two-byte escapes.
rusty_ansi.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rusty_request.workspace = true
regex.workspace = true
ring.workspace = true

[dev-dependencies]
rusty_tokio.workspace = true
async-trait.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["test-util"] }
