[project]
name = "rls-service"
version = "0.1.0"
description = "Replay-Scoring Service (M2): FastAPI + SQLModel API/persistence/credit layer over the Rust scoring worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlmodel>=0.0.14",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Broker-backed job queue (§4): the API enqueues, Celery workers score.
queue = ["celery>=5.3", "redis>=5"]
# dev pulls in `queue` so CI exercises the Celery adapter (eager-mode test).
dev = ["pytest>=8", "httpx>=0.27", "celery>=5.3", "redis>=5"]
# Production PDF rendering (weasyprint needs native libs: pango, cairo, gdk-pixbuf).
pdf = ["weasyprint>=60"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
