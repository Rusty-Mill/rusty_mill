[package]
name = "replay-viewer"
version = "0.1.0"
edition = "2021"
description = "Self-contained 3D HTML replay viewer over the canonical match model"
default-run = "replay-viewer"

[lib]
name = "replay_viewer"
path = "src/lib.rs"

[[bin]]
name = "replay-viewer"
path = "src/main.rs"

[dependencies]
replay-analyzer = { path = ".." }
replay-skills = { path = "../skills" }
replay-scoring = { path = "../scoring" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
