[package]
name = "replay-scoring"
version = "0.1.0"
edition = "2021"
description = "Pure, config-driven decision-discipline scoring over the canonical match model"
default-run = "replay-scoring"

[lib]
name = "replay_scoring"
path = "src/lib.rs"

[[bin]]
name = "replay-scoring"
path = "src/main.rs"

[[bin]]
name = "reconcile"
path = "src/bin/reconcile.rs"

[[bin]]
name = "xg-fit"
path = "src/bin/xg_fit.rs"

[[bin]]
name = "contract"
path = "src/bin/contract.rs"

[dependencies]
replay-analyzer = { path = ".." }
replay-value = { path = "../value" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
