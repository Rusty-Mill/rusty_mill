[workspace]
members = ["scoring", "value"]

[package]
name = "replay-analyzer"
version = "0.2.0"
edition = "2021"
description = "Scoring-agnostic Rocket League replay analyzer: .replay -> canonical match model"
build = "build.rs"

[lib]
name = "replay_analyzer"
path = "src/lib.rs"

[[bin]]
name = "replay-analyzer"
path = "src/main.rs"

[dependencies]
boxcars = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
