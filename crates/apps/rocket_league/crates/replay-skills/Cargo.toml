[package]
name = "replay-skills"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Pure, config-driven mechanical-skill detection and verification over the canonical match model"
default-run = "replay-skills"

[lib]
name = "replay_skills"
path = "src/lib.rs"

[[bin]]
name = "replay-skills"
path = "src/main.rs"

[dependencies]
replay-analyzer = { path = "../replay-analyzer" }
# Used by the binary's `--value` report (per-touch ΔV). The library stays
# value-agnostic: `value_link` takes plain `TouchDv` numbers, not value types.
replay-value = { path = "../replay-value" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.rusty_mill]
layer = "apps"
