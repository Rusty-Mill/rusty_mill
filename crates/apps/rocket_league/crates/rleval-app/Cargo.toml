[package]
name = "rleval-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Unified RLEvalSystem application: one binary that serves a web UI tying the analyzer, scoring, skills, value and 3D viewer into a single page."

[lib]
name = "rleval_app"
path = "src/lib.rs"

[[bin]]
name = "rleval"
path = "src/main.rs"

[features]
# Session storage on the Rusty-Mill engine (`--store mmdb`). Off by default so a
# plain build stays free of the engine's dependencies (memmap2, bincode, uuid).
mmdb = ["dep:rusty_multimodal_db_engine", "dep:uuid"]
# Google sign-in (`--oidc-*`), built on Rusty-Mill's OAuth/HTTP/TLS crates. Off by
# default: it pulls in rustls (via rusty_tls) that a token-only server never needs.
oidc = ["dep:rusty_oauth", "dep:rusty_http", "dep:rusty_tls"]

[dependencies]
# OS CSPRNG for upload-URL signing keys: /dev/urandom on Unix, BCryptGenRandom on Windows.
rusty_rand = { workspace = true }
replay-analyzer = { path = "../replay-analyzer" }
replay-pacifist = { path = "../replay-pacifist" }
replay-scoring = { path = "../replay-scoring" }
replay-skills = { path = "../replay-skills" }
replay-value = { path = "../replay-value" }
replay-viewer = { path = "../replay-viewer" }
bc-clone = { path = "../bc-clone" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The embedded record store from the Rusty-Mill monorepo, pinned to a commit: its
# on-disk formats are bincode, so a drifting dependency could change stored bytes.
rusty_multimodal_db_engine = { workspace = true, optional = true }
uuid = { version = "1", default-features = false, features = ["std", "serde"], optional = true }
# Sign-in stack, pinned to the same rusty_mill commit as the store above.
rusty_oauth = { workspace = true, optional = true }
rusty_http = { workspace = true, optional = true }
rusty_tls = { workspace = true, optional = true }

[package.metadata.rusty_mill]
layer = "apps"
