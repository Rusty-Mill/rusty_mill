[package]
name = "rleval-app"
version = "0.1.0"
edition = "2021"
description = "Unified RLEvalSystem application: one binary that serves a web UI tying the analyzer, scoring, skills, value and 3D viewer into a single page."

[lib]
name = "rleval_app"
path = "src/lib.rs"

[[bin]]
name = "rleval"
path = "src/main.rs"

[dependencies]
replay-analyzer = { path = ".." }
replay-pacifist = { path = "../pacifist" }
replay-scoring = { path = "../scoring" }
replay-skills = { path = "../skills" }
replay-value = { path = "../value" }
replay-viewer = { path = "../viewer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
