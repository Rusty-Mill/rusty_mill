[package]
name = "replay-value"
version = "0.1.0"
edition = "2021"
default-run = "replay-value"
description = "Outcome-grounded value model over the canonical match model: states -> P(team scores next within T), per-player ΔV"

[lib]
name = "replay_value"
path = "src/lib.rs"

[[bin]]
name = "replay-value"
path = "src/main.rs"

[dependencies]
replay-analyzer = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
