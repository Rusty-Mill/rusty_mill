# Joined the root workspace when the external `rlbot` client was replaced by
# `rb_rlbot_client` / `rb_rlbot_wire` (rlbot/PLAN.md, stage 4). Build it from this directory:
# `.cargo/config.toml` keeps the output in `./target`, where the bot configs
# (`bot.toml`, `bots/*.bot.toml`) and `rb_run_tapes` launch it from.
# See docs/research/BOT-CAPTURE-PLAN.md.
[package]
name = "rb_tape_bot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Scenario files, shared with `rb-verify --scenario` (workspace crate).
rb_scenario = { path = "../../../crates/rb_scenario" }
rb_rlbot_client = { path = "../../../crates/rb_rlbot_client" }
rb_rlbot_wire = { path = "../../../crates/rb_rlbot_wire" }

[package.metadata.rusty_mill]
layer = "apps"
