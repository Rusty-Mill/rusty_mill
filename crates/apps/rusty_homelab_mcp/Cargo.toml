[package]
name = "rusty_homelab_mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An MCP server for controlling a homelab -- Proxmox VE, OPNsense, and Fedora (via rusty_fedora_agent) today, more backends welcome."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_homelab_mcp"
authors = ["rusty_homelab_mcp contributors"]
readme = "README.md"
keywords = ["mcp", "homelab", "proxmox", "opnsense", "fedora"]
categories = ["network-programming"]
# An application binary consuming the rusty-mcp scaffold, not a library
# meant to be depended on -- same convention as rusty-mcp-demo.
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "rusty_homelab_mcp"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
# rusty-mcp, rusty_proxmox, and rusty_opnsense are all siblings in this
# same workspace -- plain path dependencies.
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_serve = { workspace = true }
rusty_http = { workspace = true }
rusty_oauth = { workspace = true }
rusty_crypto_key = { workspace = true }
rusty_proxmox = { workspace = true }
rusty_opnsense = { workspace = true }
rusty_fedora = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = "1"
clap = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Parses hosts.toml, the Fedora host registry -- already a workspace
# dependency (rusty_fedora_agent's own allowlist.toml loader).
toml = { workspace = true }

[dev-dependencies]
# The canned-response HTTP mock server the client tests drive against
# (was an identical copy under tests/support/ in each REST-client crate).
rusty_wiremock = { workspace = true, features = ["std"] }
rusty-mcp-client = { workspace = true }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util"] }
