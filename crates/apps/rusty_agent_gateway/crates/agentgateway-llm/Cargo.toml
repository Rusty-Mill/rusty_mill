[package]
name = "agentgateway-llm"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway for rusty_agent_gateway"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]
publish = false

# De-inherited from rusty_agent_gateway's own former `[workspace.lints]`:
# this workspace root's `[workspace.lints]` is rustils' (a weaker
# `unsafe_code = "warn"`, and none of the rest), so these are written
# literally rather than silently downgraded.
[package.metadata.rusty_mill]
layer = "apps"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
agentgateway-config = { workspace = true }
agentgateway-core = { workspace = true }
regex = { workspace = true }
cel = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
# Provider, moderation and webhook calls.
rusty_request = { workspace = true }
async-stream = { workspace = true }
# Retry waits and the deadline on a streamed answer.
rusty_tokio = { workspace = true }
thiserror = "2"
rusty_log = { workspace = true }
