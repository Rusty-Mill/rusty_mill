[package]
name = "agentgateway"
version = "0.1.0"
description = "An AI-native gateway for MCP, speaking agentgateway's configuration"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "agentgateway"
path = "src/main.rs"

# De-inherited from rusty_agent_gateway's own former `[workspace.lints]`:
# this workspace root's `[workspace.lints]` is rustils' (a weaker
# `unsafe_code = "warn"`, and none of the rest), so these are written
# literally rather than silently downgraded.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
agentgateway-a2a = { workspace = true }
agentgateway-agui = { workspace = true }
agentgateway-auth = { workspace = true }
agentgateway-config = { workspace = true }
agentgateway-core = { workspace = true }
agentgateway-llm = { workspace = true }
agentgateway-mcp = { workspace = true }
agentgateway-proxy = { workspace = true }
agentgateway-tls = { workspace = true }

rusty_mcp_server = { workspace = true, features = ["http"] }
# The MCP handler's request and reply types, for `mcp_service`.
rusty_serve = { workspace = true }
rusty_http = { workspace = true }
rusty_mcp_middleware = { workspace = true, default-features = false, features = ["otel"] }
# The server. `http2` is load-bearing and must not be "tidied away": the TLS
# listener advertises `h2` over ALPN, and a server that negotiates a protocol
# it cannot speak closes the connection after a successful handshake -- which
# looks like a network fault rather than a missing feature flag.
rusty_axum = { workspace = true, features = ["http2"] }
rusty_tokio = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rusty_log = { workspace = true, features = ["subscriber"] }

[dev-dependencies]
rusty_prost = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
rusty_base64 = { workspace = true }
rsa = "0.9"
rand = { workspace = true }
tempfile = { workspace = true }
rcgen = "0.13"
# File locking, for the port bands in tests/common. A safe wrapper, which
# matters here: the workspace forbids `unsafe`, tests included. `fs4` rather
# than `rustix::fs::flock` because `rustix::fs` is `cfg(not(windows))` -- these
# tests also run on windows-latest in this workspace's CI, where `fs4` maps the
# same call onto `LockFileEx`.
fs4 = "0.13"
# Serves h2c for the scripted gRPC processors in `tests/common`; dev-only, as
# the gateway is a gRPC *client*.
rusty_hyper = { workspace = true, features = ["rusty-tokio"] }
# The Streamable HTTP MCP target in `mcp_guardrails.rs`, mounted on `rusty_axum`.
rusty_mcp_server = { workspace = true, features = ["http", "rusty-axum"] }
