[package]
name = "rusty_mux_client"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "rusty_mux's attach protocol for clients: connecting, the handshake, takeover and reading a window's layout, and the SSH forward. Shared by the terminal and GUI clients and rusty-mux-ctl; links no server."
repository = "https://github.com/Rusty-Mill/rusty_mill"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_mux_core = { workspace = true }
rusty_mux_proto = { workspace = true }
rusty_uuid = { workspace = true }

# Reaching a server over TLS (#506): a local relay in a thread of its own,
# pinned to the server's certificate by fingerprint (rusty_term D236).
[target.'cfg(unix)'.dependencies]
rusty_tls = { workspace = true, features = ["rusty-tokio"] }
rusty_tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
platform-windows = { workspace = true }

[features]
default = ["screen"]
# Checkpoint assembly and the cell style codec, re-exported from
# rusty_mux_proto, for the clients that draw a screen. rusty-mux-ctl turns
# it off, so it never builds the terminal engine.
screen = ["rusty_mux_proto/screen"]

[dev-dependencies]
# Decodes the test certificate.
rusty_base64 = { workspace = true }
