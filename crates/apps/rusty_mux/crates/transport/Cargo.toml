[package]
name = "rusty_mux_transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "rusty_mux's UDP transport: sealed datagrams carrying reliable ordered streams, with roaming. No I/O."
repository = "https://github.com/Rusty-Mill/rusty_mill"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_aead = { workspace = true }
rusty_wire = { workspace = true }
