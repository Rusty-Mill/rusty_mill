[package]
name = "rusty_mux_server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "rusty_mux's server: owns the PTYs, keeps one terminal per block, and tees raw output to attached clients over a Unix socket."
repository = "https://github.com/Rusty-Mill/rusty_mill"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "rusty-mux-server"
path = "src/main.rs"

[dependencies]
rusty_mux_core = { workspace = true }
rusty_mux_proto = { workspace = true, features = ["screen"] }
# The config file's `server` section, parsed as ctl parses the rest.
rusty_mux_script = { workspace = true }
rusty_mux_status = { workspace = true }
# The UDP association behind `--udp`; its keys come from the OS CSPRNG.
rusty_mux_transport = { workspace = true }
rusty_rand = { workspace = true }
# Headless engine only: no `gui` or `l13`, so no tokio reaches this binary.
rusty_term_core = { workspace = true }
rusty_tokio = { workspace = true }
rusty_uuid = { workspace = true }
# Compares takeover tokens in constant time.
rusty_crypto_key = { workspace = true }
platform = { workspace = true }
# The session store (C45): sessions, windows, layouts and blocks as records
# (owner's pick, rusty_term D73). Its record bound needs serde derives, and
# its ids are the `uuid` crate's.
rusty_multimodal_db_engine = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }

# Linux and Windows (ConPTY or rusty_conhost, over AF_UNIX); other targets
# build a stub.
[target.'cfg(target_os = "linux")'.dependencies]
# Tailscale identity (C27): `tailscaled`'s LocalAPI `whois`, over its Unix
# socket, with the types the `tailscale` CLI decodes it with.
rusty_http = { workspace = true, features = ["rusty-tokio"] }
serde_json = { workspace = true }
ts-types = { workspace = true }
platform-linux = { workspace = true }
rusty_libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
platform-windows = { workspace = true }
# `RUSTY_CONSOLE_HOST=own`: our own console host instead of ConPTY. Links
# rusty_term_core without `l13`, as the line above for the server's grids.
rusty_conhost = { workspace = true }
