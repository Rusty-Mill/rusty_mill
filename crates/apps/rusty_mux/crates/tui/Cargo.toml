[package]
name = "rusty_mux_tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Throwaway Phase 1 terminal client for rusty_mux: attaches the local terminal to one block over a Unix socket."
repository = "https://github.com/Rusty-Mill/rusty_mill"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "rusty-mux"
path = "src/main.rs"

[dependencies]
rusty_mux_core = { workspace = true }
rusty_mux_proto = { workspace = true }
# Only for `checkpoint::Receiver`, the documented client-side assembler.
rusty_mux_server = { workspace = true }
rusty_term_core = { workspace = true }
rusty_uuid = { workspace = true }
platform = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { workspace = true }
