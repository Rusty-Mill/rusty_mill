<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mill Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' fill='%2312a3dc'/%3E%3Crect x='9' width='7' height='7' fill='%23d4006f'/%3E%3Crect y='9' width='7' height='7' fill='%23f2c200'/%3E%3Crect x='9' y='9' width='7' height='7' fill='%2315171a'/%3E%3C/svg%3E">
<style>
/* A press room's job board: cards are numbered job tickets; process inks carry state.
   Cyan: in work. Yellow: queued. Magenta: waits on you, and nothing else. Vermilion: blocked. */
@font-face{font-family:"Hanken Grotesk";src:url(/ui/fonts/hanken-grotesk.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(/ui/fonts/barlow-condensed-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#f4f5f7;--card:#fff;--sunk:#eceef1;--ink:#15171a;--mute:#555c66;--line:#dcdfe4;--line2:#c7ccd3;
  --rail:#1b1f23;--rail-ink:#eef0f2;--rail-mute:#a3abb5;--rail-line:#30363d;
  --cyan:#0a7fb3;--cyan-fill:#12a3dc;--cyan-wash:#d9f0fa;--yellow:#f2c200;--yellow-wash:#fbf1c4;
  --mag:#c4006a;--mag-wash:#fbe6f1;--red:#c2361b;--red-fill:#e2492a;--red-wash:#fbe5df;--done:#c9ced5;
  --ok:#1d7a46;--focus:#12a3dc;--al:40%;
  --ui:"Hanken Grotesk",system-ui,sans-serif;--num:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111316;--card:#1a1d21;--sunk:#15181b;--ink:#e9ebee;--mute:#a0a8b2;--line:#2b3036;--line2:#3a4048;
  --rail:#0a0c0e;--rail-ink:#eef0f2;--rail-mute:#98a1ab;--rail-line:#262b31;
  --cyan:#45bdf0;--cyan-fill:#1f9fd6;--cyan-wash:#123445;--yellow:#e8bd12;--yellow-wash:#2c3036;
  --mag:#ff5aae;--mag-wash:#3a1229;--red:#ff7357;--red-fill:#d8462a;--red-wash:#3b1a12;--done:#4a515a;
  --ok:#55c98a;--al:66%;color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);font-feature-settings:"tnum" 1;
  display:grid;grid-template-rows:auto auto auto minmax(0,1fr);-webkit-font-smoothing:antialiased}
::selection{background:var(--cyan-wash);color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
a{color:var(--cyan);text-underline-offset:3px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line2);border-radius:5px;padding:6px 9px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:1}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
button{cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
button.primary:hover{background:color-mix(in srgb,var(--ink) 85%,var(--cyan))}
button.ask{color:var(--mag);border-color:var(--mag);background:var(--card);font-weight:600}
button.ask:hover:not(:disabled){background:var(--mag);color:#fff;border-color:var(--mag)}

/* The graphite top bar: brand, views, quick add, who you are. */
header.top{display:flex;align-items:center;gap:6px;padding:0 14px;min-height:52px;background:var(--rail);color:var(--rail-ink);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-right:18px;white-space:nowrap}
.brand svg{width:18px;height:18px}
.views{display:flex;align-self:stretch;gap:2px}
.views button{background:none;border:0;border-radius:0;color:var(--rail-mute);padding:0 12px;font-weight:500;box-shadow:inset 0 -2px 0 transparent}
.views button:hover{color:var(--rail-ink)}
.views button[aria-pressed=true]{color:var(--rail-ink);box-shadow:inset 0 -2px 0 var(--rail-ink)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--mag);color:#fff;font:700 12px/1 var(--num);letter-spacing:.02em}
.badge:empty{display:none}
.quick{display:flex;gap:6px;margin-left:auto;align-items:center}
.top input,.top select{background:#262b31;border-color:var(--rail-line);color:var(--rail-ink)}
.top input::placeholder{color:var(--rail-mute)}
.top #title{width:min(24vw,260px)}
.top button.primary{background:var(--rail-ink);color:var(--rail);border-color:var(--rail-ink)}
.top button.primary:hover{background:#fff}
.top button.icon{background:none;border-color:transparent;color:var(--rail-mute);padding:7px}
.top button.icon:hover{color:var(--rail-ink);border-color:var(--rail-line)}
.who{display:flex;gap:6px;align-items:center}
.me{display:inline-flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--rail-line);border-radius:16px;white-space:nowrap;color:var(--rail-mute)}
.me b{color:var(--rail-ink);font-weight:600}
.me .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--rail-ink);color:var(--rail);font-weight:700;font-size:12px}

/* The scope bar: repository, its projects, and the agents holding claims. Each only narrows the board. */
#nav1{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;white-space:nowrap}
#nav1:empty{display:none}
#nav1 .lbl{font-size:12px;font-weight:600;color:var(--mute);margin:0 2px 0 8px}
#nav1 .lbl:first-child{margin-left:0}
#nav1 .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 6px}
#repo{font-weight:600;padding:5px 8px;max-width:260px}
#nav1 .item{border-radius:14px;padding:4px 10px;gap:7px;background:var(--card);border-color:var(--line);font-size:13px}
#nav1 .item .n{font:700 14px/1 var(--num);color:var(--mute)}
#nav1 .item.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
#nav1 .item.on .n{color:var(--card);opacity:.75}
#nav1 .item .name{display:inline-flex;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ag);margin-right:6px;flex:none}
@keyframes pulse{50%{opacity:.3}}
.running .dot{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.running .dot{animation:none}}

/* The colour control strip: one patch per column, as wide as its load; a jump bar to it. */
.strip{display:flex;gap:3px;align-items:stretch;padding:10px 14px 0;background:var(--bg)}
.strip[hidden]{display:none}
.strip .patch{flex:var(--w) 1 0;min-width:max-content;border:0;border-radius:3px;padding:6px 10px;justify-content:flex-start;
  background:var(--ink-fill);color:var(--ink-on);font-weight:600;font-size:13px}
.strip .patch b{font:700 17px/1 var(--num);margin-left:auto;padding-left:10px}
.strip .patch.zero{background:none;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line2);border-style:dashed}
.strip .patch:hover{filter:brightness(.95)}
.strip .waits{align-self:center;margin-left:10px;color:var(--mag);font-weight:600;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;background:none;border:0;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.strip .waits::before{content:"";width:10px;height:10px;background:var(--mag);border-radius:2px}
.strip .waits:hover{text-decoration-thickness:2px}

/* Stage inks, by column kind. */
[data-kind=backlog]{--ink-fill:var(--yellow-wash);--ink-on:var(--ink);--sw:var(--yellow)}
[data-kind=queue]{--ink-fill:var(--yellow);--ink-on:#15171a;--sw:var(--yellow)}
[data-kind=work]{--ink-fill:var(--cyan-fill);--ink-on:#fff;--sw:var(--cyan-fill)}
[data-kind=work][data-late]{--ink-fill:var(--cyan-wash);--ink-on:var(--ink);--sw:#7fcbec}
[data-kind=done]{--ink-fill:var(--done);--ink-on:var(--ink);--sw:var(--done)}
[data-kind=blocked]{--ink-fill:var(--red-fill);--ink-on:#fff;--sw:var(--red-fill)}

/* The board. Columns scroll on their own; an empty one folds to a spine. */
main{overflow:auto;padding:10px 14px 14px;min-height:0}
main.board{display:flex;align-items:stretch;gap:0}
.board>.col{flex:1 1 220px;min-width:210px;max-width:360px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);padding:0 10px}
.board>.col:first-child{padding-left:0}.board>.col:last-child{border-right:0;padding-right:0}
.board>.col>.cards{overflow-y:auto;min-height:0;flex:1;padding:2px 2px 12px;margin:0 -2px}
.board>.col.spine{flex:0 0 46px;min-width:0;padding:0;align-items:center;cursor:default}
.spine h2{writing-mode:vertical-rl;transform:rotate(180deg);flex-direction:row-reverse;margin:8px 0;gap:10px}
.spine h2 .sw{margin:0}
.col.over{background:color-mix(in srgb,var(--cyan) 7%,transparent);box-shadow:inset 0 0 0 2px var(--cyan-fill);border-radius:4px}
.col h2{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600;margin:6px 0 10px;letter-spacing:0;text-transform:none;color:var(--ink)}
.col h2 .sw{width:10px;height:10px;border-radius:2px;background:var(--sw);align-self:center;flex:none}
.col h2 .n{font:700 20px/1 var(--num)}
.col h2 .hint{margin-left:auto;font-size:12px;font-weight:500;color:var(--mute)}
.colbar{display:flex;gap:6px;margin:-4px 0 10px;flex-wrap:wrap}.colbar button{font-size:12px;padding:3px 8px}
.flash{animation:flash 1s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--cyan) 14%,transparent)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* A card is a job ticket: its number set large, then title, then one line of who and where. */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 11px 10px;margin-bottom:8px;cursor:grab;
  box-shadow:0 1px 2px rgb(20 24 30 / .05);transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--line2);box-shadow:0 3px 10px -4px rgb(20 24 30 / .18)}
.card .top{display:flex;align-items:center;gap:8px;min-height:22px}
.num{font:700 21px/1 var(--num);letter-spacing:.01em;color:var(--ink)}
.card b{display:block;font-size:14.5px;line-height:1.35;font-weight:600;margin:3px 0 0;text-wrap:pretty}
.meta{color:var(--mute);font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.meta.stale,.idle{color:var(--red)}
.idle{font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:12px;line-height:19px;color:var(--mute)}
.tag.proj{border:0;padding:0;font-size:13px;color:var(--mute)}
.tag.agent{border:0;padding:0;font-size:13px;color:var(--ink)}
.tag.agent .dot{margin-right:0}
.more{font-size:12px;color:var(--mute)}
/* Priority: a filled, half or open square, with its word. */
.tag.p5,.tag.p3,.tag.p1{border:0;padding:0;margin-left:auto;font-size:12.5px;color:var(--ink);font-weight:500}
.tag.p5::before,.tag.p3::before,.tag.p1::before{content:"";width:9px;height:9px;border:1.5px solid currentColor;box-sizing:border-box}
.tag.p5::before{background:currentColor}
.tag.p3::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.tag.p5{color:var(--red)}
.ask-row{display:flex;flex-wrap:wrap;white-space:nowrap;align-items:center;gap:8px;margin:9px -11px -10px;padding:7px 11px;border-top:1px solid var(--mag-wash);color:var(--mag);font-size:13px;font-weight:600;background:color-mix(in srgb,var(--mag-wash) 55%,var(--card));border-radius:0 0 4px 4px}
.ask-row button{margin-left:auto;padding:3px 9px;font-size:12.5px}
.card.waits{border-color:color-mix(in srgb,var(--mag) 45%,var(--line))}
.empty-note{color:var(--mute);font-size:13px;padding:6px 2px}

/* Other views share the sheet: panels, not boxes in boxes. */
main.roadmap,main.metrics{display:grid;gap:14px;align-content:start}
main.roadmap{grid-template-columns:repeat(5,minmax(200px,1fr))}
main.metrics{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.roadmap h3,.metrics h3,.archive h3{grid-column:1/-1;margin:4px 0 0;font-size:18px;font-weight:600}
.roadmap>.col,.metrics>.col{border-top:3px solid var(--ink);padding-top:8px}
.roadmap .card,.metrics .card,.archive .card{cursor:pointer}
[data-lane=now]{border-top-color:var(--cyan-fill)!important}[data-lane=next]{border-top-color:var(--yellow)!important}
[data-lane=blocked]{border-top-color:var(--red-fill)!important}[data-lane=shipped]{border-top-color:var(--done)!important}
.kpis{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.kpi{padding:12px 18px;min-width:140px;color:var(--mute);font-size:13px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi b{display:block;color:var(--ink);font:700 34px/1.05 var(--num)}
.bar{display:grid;grid-template-columns:minmax(0,8.5em) 1fr 2.6em;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar>span:last-child{text-align:right;font:700 16px/1 var(--num)}
.bar>span:nth-child(2){background:var(--sunk);border-radius:2px;height:12px;display:block}
.bar i{display:block;height:12px;min-width:2px;border-radius:2px;background:var(--fill,var(--cyan-fill))}
main.archive,main.decisions{display:grid;grid-template-columns:minmax(0,780px);justify-content:center;align-content:start;gap:12px}
.archive input{width:100%}
.decisions>.col{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--mag);border-radius:4px;padding:12px 14px}
.decisions .col p{margin:6px 0}.decisions .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.decisions a{color:var(--mag)}
.decisions .cand{border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:8px 0}
@media (max-width:900px){main.roadmap{grid-template-columns:minmax(0,1fr)}}

/* Dialogs: the card, settings and sign-in. */
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:6px;width:min(600px,94vw);padding:18px 20px;box-shadow:0 24px 60px -20px rgb(0 0 0 / .45)}
dialog::backdrop{background:rgb(14 16 19 / .45)}
dialog form{display:grid;gap:10px}
dialog h2{margin:0;font-size:18px}
#dlg .dhead{display:flex;align-items:baseline;gap:10px}
#dlg .dhead .num{font-size:30px}
#dlg .dhead .meta{margin:0}
#dlg input:first-of-type{font-size:16px;font-weight:600}
#dlg .row{display:flex;flex-wrap:wrap;gap:6px}
.cm{border-top:1px solid var(--line)}
.cm div{border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px}
.cm div b{margin-right:6px}
.banner{border:1px solid var(--mag);background:var(--mag-wash);border-radius:4px;padding:8px 10px}.banner:empty{display:none}
#signin form{display:grid;gap:10px}#signin .err{color:var(--red);min-height:1.2em;margin:0}
#settings{width:min(980px,96vw);max-height:90vh;padding:0}
#settings>div{padding:0 20px 18px}
#settings .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -20px 14px;padding:0 14px;position:sticky;top:0;background:var(--card);z-index:1}
#settings .tabs button{border:0;border-radius:0;background:none;padding:12px 10px;color:var(--mute);font-weight:500;box-shadow:inset 0 -2px 0 transparent}
#settings .tabs button:hover{color:var(--ink)}
#settings .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
#settings table{width:100%;border-collapse:collapse;margin:4px 0 12px}
#settings th{font-size:12px;font-weight:600;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
#settings td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
#settings tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
#settings .err{color:var(--red);min-height:1.2em;margin:6px 0}
#settings .note{color:var(--mute);margin:8px 0;font-size:13px}
#settings .secret{border:1px solid var(--mag);background:var(--mag-wash);border-radius:4px;padding:10px;margin:8px 0;overflow-wrap:anywhere}
#settings code{font-family:ui-monospace,monospace;font-size:12.5px}
#settings fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:10px 0;display:flow-root}
#settings legend{float:left;font-weight:600;padding:5px 0;min-width:200px}
#settings fieldset>.row,#settings fieldset>textarea{clear:both}
#settings fieldset>button{font-size:13px;padding:4px 9px;margin-right:6px}
#settings textarea{width:100%;min-height:3.2em}
#settings .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
#settings details{display:inline-block}
#settings details label{display:block}
#settings h3,#settings h4{margin:14px 0 6px;font-size:14px}
#settings input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:5px;display:none;box-shadow:0 12px 30px -10px rgb(0 0 0 / .4);border-left:0;max-width:min(640px,92vw)}
#toast::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red-fill);margin-right:9px}
@media (max-width:760px){
  header.top{padding:8px 10px}.quick{margin-left:0;width:100%}.top #title{flex:1;width:auto}
  main.board{flex-direction:column}.board>.col{max-width:none;border-right:0;padding:0;flex:none}
  .board>.col.spine{flex:none;align-items:stretch}.spine h2{writing-mode:horizontal-tb;transform:none;flex-direction:row}
  .strip{flex-wrap:wrap}
}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="7" height="7" fill="#12a3dc"/><rect x="9" width="7" height="7" fill="#d4006f"/><rect y="9" width="7" height="7" fill="#f2c200"/><rect x="9" y="9" width="7" height="7" fill="#eef0f2"/></svg>Mill Board</span>
  <nav class="views" aria-label="views">
    <button id="boardv" type="button" aria-pressed="true">Board</button>
    <button id="view" type="button" aria-pressed="false" title="The chosen project's roadmap">Roadmap</button>
    <button id="metrics" type="button" aria-pressed="false" title="Metrics for the chosen repository or project, or the whole board">Metrics</button>
    <button id="archive" type="button" aria-pressed="false" title="Done cards set aside: archived, or done more than 14 days ago">Archive</button>
    <button id="decide" type="button" aria-pressed="false" hidden title="Decisions waiting for you: open BBP escalations">Decisions <span id="decide-n" class="badge"></span></button>
  </nav>
  <div class="quick">
    <input id="title" placeholder="New card title" aria-label="new card title">
    <button id="add" type="button" class="primary"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Add card</button>
  </div>
  <div class="who">
    <span id="me" class="me" hidden></span>
    <input id="actor" placeholder="your name" size="11" aria-label="actor name">
    <select id="role" aria-label="role"></select>
  </div>
  <button id="gear" type="button" class="icon" title="Settings" aria-label="settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button id="signout" type="button" class="icon" hidden title="Sign out" aria-label="sign out"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
</header>
<nav id="nav1" aria-label="repositories, projects and agents"></nav>
<nav id="strip" class="strip" aria-label="columns" hidden></nav>
<main id="board"></main>
<dialog id="dlg"></dialog>
<dialog id="settings" aria-label="settings"></dialog>
<dialog id="signin" aria-label="sign in"><form method="dialog">
  <h2>Sign in to Mill Board</h2>
  <p id="signin-why" class="err" role="alert"></p>
  <input id="signin-token" type="password" placeholder="board token" autocomplete="current-password" aria-label="board token" required>
  <button class="primary">Sign in</button>
</form></dialog>
<div id="toast" role="alert"></div>
<script>
/* The board's columns and the moves between them, as an admin set them (board_columns).
   Until read, the original seven, so the board draws at once. */
let FLOW={columns:[["backlog","Backlog","backlog"],["ready","Ready","queue"],["building","Building","work"],["qa","QA","work"],
  ["review","Review","work"],["done","Done","done"],["blocked","Blocked","blocked"]].map(([id,label,kind])=>({id,label,kind})),transitions:[]};
const colLabel=id=>FLOW.columns.find(c=>c.id===id)?.label??id;
const working=()=>FLOW.columns.filter(c=>c.kind==="work").map(c=>c.id);
let tok=null;
const $=id=>document.getElementById(id);
let cards=[],cursor=null,dlg=null,repos={},sel={repo:"",project:"",agent:""};
const projects=()=>Object.values(repos).flat();
/* `default` is the Inbox: where a card that names no project lands (rusty_tick's Inbox list). Shown by that name only. */
const INBOX="default",label=p=>p===INBOX?"Inbox":p;
const repoOf=p=>Object.keys(repos).find(r=>repos[r].includes(p))||"";
const shown=k=>(!sel.repo||repoOf(k.project)===sel.repo)&&(!sel.project||k.project===sel.project)&&(!sel.agent||k.claim===sel.agent);
const count=f=>cards.filter(f).length;
/* A Done card is shelved, off the board and in the Archive view, once archived or 14 days after it
   was done (closed without shipping: after its last change) or last restored. The server's
   Card::shelved, with board_list's default window; kept here so the board reads every card once. */
const SHELF_DAYS=14,isDone=k=>FLOW.columns.find(c=>c.id===k.column)?.kind==="done";
const since=k=>Math.max(k.done_ms??k.updated_ms,k.restored_ms??-Infinity);
const shelved=k=>isDone(k)&&(k.archived_ms!=null||Date.now()-since(k)>SHELF_DAYS*864e5);
const listed=f=>count(k=>!shelved(k)&&f(k));
/* One colour per agent, the same on every card and in the panel. Twelve hues 30 degrees apart; a name
   prefers the slot its hash picks and takes the next free one if another agent has it, so two agents
   never look alike. The set of agents seen is kept in this browser so colours do not shuffle. */
const SLOTS=12;
let known=[];try{known=JSON.parse(pref("agents")||"[]")}catch{}
let slotOf={};
const hash=n=>{let h=2166136261;for(const c of n){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function assignSlots(){
  const used=new Set();slotOf={};
  for(const n of known){let k=hash(n)%SLOTS;for(let i=0;i<SLOTS&&used.has(k);i++)k=(k+1)%SLOTS;used.add(k);slotOf[n]=k}
}
assignSlots();
function agentColor(n){
  if(!(n in slotOf)){known=[...new Set([...known,n])].sort();pref("agents",JSON.stringify(known));assignSlots()}
  return "hsl("+(slotOf[n]*30+8)+" 62% var(--al))";
}
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{}};
/* The token: a #token= in the address is kept in this browser and dropped from the address bar;
   otherwise the one kept from before. With none, or a refused one, the first call asks for it. */
let signing=null,resume=()=>{};   // the open sign-in box, and how to let its waiting calls go
function setToken(t){tok=t;pref("token",t);$("signout").hidden=false;resume()}
{const h=new URLSearchParams(location.hash.slice(1)).get("token");
  if(h){setToken(h);try{history.replaceState(null,"",location.pathname+location.search)}catch{}}
  else if(pref("token"))setToken(pref("token"))}
/* Signing in reloads the page: the new token may be another agent, with its own role, projects
   and view of the board, so everything is read again and no refused write is replayed as someone else.
   Until then the refused calls wait, and every one shares the one box. If the token is replaced
   meanwhile (your own rotation answering late), the box closes and the waiting calls retry with it. */
function signIn(why){
  return signing??=new Promise(done=>{
    const d=$("signin"),f=$("signin-token");$("signin-why").textContent=why;f.value="";
    d.oncancel=e=>e.preventDefault();   // nothing works without a token, so Escape does not dismiss it
    d.querySelector("form").onsubmit=()=>{pref("token",f.value.trim());location.reload()};
    resume=()=>{resume=()=>{};signing=null;d.close();done()};
    d.showModal();f.focus();
  });
}

async function api(op,args={}){
  let r;
  for(;;){
    const sent=tok;   // a 401 for a token since replaced (own rotation) is retried with the current one
    r=await fetch("/api/"+op,{method:"POST",headers:{"content-type":"application/json",...(sent&&{authorization:"Bearer "+sent})},body:JSON.stringify(args)});
    if(r.status!==401)break;
    if(sent===tok)await signIn(tok?"That token was refused. Enter a current one.":"This board needs a token.");
  }
  const j=await r.json().catch(()=>({error:r.statusText}));
  if(!r.ok){const e=new Error(j.error||r.statusText);e.status=r.status;throw e}
  return j;
}
/* A per-model token fixes who you are: send nothing, so a role renamed under you never disagrees. */
const who=()=>$("actor").disabled?{}:{actor:$("actor").value.trim(),role:$("role").value};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)}
// Run a write as the current actor, then re-read the board. Resolves to the reply, or null after showing the error.
async function act(op,args){
  try{const r=await api(op,{...who(),...args});await refresh();return r}
  catch(e){toast(e.message);if(e.status===409)await refresh().catch(()=>{});return null}
}
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
// A card's heading: its board number in the corner, if it has one, then its title.
const heading=k=>{const top=el("div",null,"top");if(k.number)top.append(el("span","#"+k.number,"num"));top.append(...priorityTag(k));return [top,el("b",k.title)]};
// rusty_tick's priority scale; 0 (none) shows no badge.
const PRIORITY={5:"High",3:"Medium",1:"Low",0:"None"};
const priorityTag=k=>k.priority?[el("span",PRIORITY[k.priority],"tag p"+k.priority)]:[];

// Ages: "40m", "5h", "3d". A card in a work column untouched for a day reads as idle.
const ago=ms=>{const m=(Date.now()-ms)/6e4;return m<60?Math.max(1,Math.round(m))+"m":m<1440?Math.round(m/60)+"h":Math.round(m/1440)+"d"};
const kindOf=c=>FLOW.columns.find(x=>x.id===c)?.kind;
/* A gate ahead: a work column whose move onward is a human approval. Its cards wait on the owner. */
const gateFrom=c=>kindOf(c)==="work"?FLOW.transitions.find(m=>m.from===c&&m.gate&&kindOf(m.to)!=="blocked"):null;
const decisionsOn=k=>pending?.filter(p=>p.card?.id===k.id).length??0;
const waitsOnYou=k=>!!gateFrom(k.column)||decisionsOn(k)>0;
// Stage ink attributes for a column: its kind, and whether it is a later work column (a lighter cyan).
function ink(e,c){const kind=kindOf(c)??"backlog";e.dataset.kind=kind;
  if(kind==="work"&&working().indexOf(c)>0)e.dataset.late="";else delete e.dataset.late}
const shownIn=c=>cards.filter(k=>k.column===c&&shown(k)&&!shelved(k));

// A card's own tags, the first shown and the rest folded into a count (named on hover).
function tagChips(k){
  const tags=k.tags.filter(t=>!t.startsWith("migrated:"));if(!tags.length)return [];
  const out=[el("span",tags[0],"tag")];
  if(tags.length>1){const x=el("span","+"+(tags.length-1),"more");x.title=tags.slice(1).join(", ");out.push(x)}
  return out;
}
/* A job ticket: number and priority, title, then project, holder and age; extra tags fold to a count. */
function ticket(k){
  const d=el("div",null,"card");
  d.append(...heading(k));
  const m=el("div",null,"meta");
  if(projects().length>1&&!sel.project){const t=el("span",label(k.project),"tag proj");t.title=repoOf(k.project);m.append(t)}
  if(k.claim){
    d.classList.add("claimed");d.style.setProperty("--ag",agentColor(k.claim));
    const t=el("span",null,"tag agent"+(working().includes(k.column)?" running":""));t.append(el("i",null,"dot"),k.claim);m.append(t);
  }
  const work=kindOf(k.column)==="work",age=Date.now()-k.updated_ms;
  if(work&&age>DAY)m.append(el("span","idle "+ago(k.updated_ms),"idle"));
  else if(work||k.claim)m.append(el("span",ago(k.updated_ms)));
  m.append(...tagChips(k));
  if(k.issue)m.append(el("span","issue #"+k.issue));
  if(k.comments.length)m.append(el("span",k.comments.length+(k.comments.length===1?" comment":" comments")));
  d.append(m);
  // What waits on you: a decision on this card, or a gate it stands at.
  const n=decisionsOn(k),gate=gateFrom(k.column);
  if(n||gate){
    d.classList.add("waits");
    const r=el("div",null,"ask-row");
    if(n){r.append(n===1?"Decision waiting":n+" decisions waiting");const b=el("button","Answer","ask");b.type="button";b.onclick=e=>{e.stopPropagation();setView("decisions")};r.append(b)}
    else{r.append("Waits on you");const b=el("button","Approve","ask");b.type="button";b.title="Approve into "+colLabel(gate.to);
      b.onclick=e=>{e.stopPropagation();if(confirm("Approve #"+(k.number??"")+" "+k.title+" into "+colLabel(gate.to)+"?"))act("card_move",{id:k.id,to:gate.to})};r.append(b)}
    d.append(r);
  }
  d.draggable=true;d.ondragstart=e=>e.dataTransfer.setData("text",k.id);
  d.onclick=()=>show(k.id);
  return d;
}

/* The colour control strip: each column a patch as wide as its open cards, coloured by its stage;
   a click scrolls to it. At the right, everything that waits on you. */
function renderStrip(){
  const s=$("strip");s.hidden=view!=="board";if(s.hidden)return;
  s.replaceChildren();
  for(const {id,label:name} of FLOW.columns){
    const n=shownIn(id).length,b=el("button",null,"patch"+(n?"":" zero"));b.type="button";ink(b,id);
    b.style.setProperty("--w",String(n?Math.max(1,Math.sqrt(n)):0));b.dataset.jump=id;
    b.append(name,el("b",String(n)));b.title="Show "+name;
    b.onclick=()=>{const c=document.querySelector('#board .col[data-col="'+id+'"]');if(!c)return;c.scrollIntoView({inline:"start",block:"nearest",behavior:"smooth"});
      c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash")};
    s.append(b);
  }
  const gates=cards.filter(k=>shown(k)&&!shelved(k)&&gateFrom(k.column)).length,dec=pending?.length??0;
  if(gates||dec){
    const parts=[...(gates?[gates+(gates===1?" approval":" approvals")]:[]),...(dec?[dec+(dec===1?" decision":" decisions")]:[])];
    const w=el("button","Waits on you: "+parts.join(" · "),"waits");w.type="button";
    w.onclick=()=>{if(!gates){setView("decisions");return}
      const first=FLOW.columns.find(c=>gateFrom(c.id)&&shownIn(c.id).length);document.querySelector('[data-jump="'+first?.id+'"]')?.click()};
    s.append(w);
  }
}

function render(){
  renderStrip();
  if(view==="decisions"){renderDecisions();return}
  if(view==="roadmap"){renderRoadmap();return}
  if(view==="metrics"){renderMetrics();return}
  if(view==="archive"){renderArchive();return}
  mapSeq++;   // drop any roadmap or metrics still loading
  const b=$("board");b.classList.remove("board","roadmap","metrics","decisions","archive");b.classList.add("board");b.replaceChildren();
  for(const {id:c,label:name} of FLOW.columns){
    const list=shownIn(c),spine=!list.length&&kindOf(c)!=="done";
    const col=el("section",null,"col"+(spine?" spine":""));col.dataset.col=c;ink(col,c);col.setAttribute("aria-label",name);
    col.append(...colHead(c,name,list.length,spine));
    col.ondragover=e=>{e.preventDefault();col.classList.add("over")};
    col.ondragleave=()=>col.classList.remove("over");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("over");act("card_move",{id:e.dataTransfer.getData("text"),to:c})};
    if(!spine){
      const box=el("div",null,"cards");box.append(...list.map(ticket));
      if(!list.length)box.append(el("p","Nothing here.","empty-note"));
      col.append(box);
    }
    b.append(col);
  }
  renderSide();syncDialog();
}

/* The roadmap: the chosen project's cards in lanes (now, next, later, blocked, shipped), laid out
   by the server's board_roadmap so the rules live in one place. Re-read whenever the board is. */
let view=location.pathname==="/inbox"?"decisions":["roadmap","metrics","archive"].includes(pref("view"))?pref("view"):"board",mapSeq=0;
// Each lane's columns, from the workflow's kinds (the server's Lane::of).
const LANE_KIND={now:"work",next:"queue",later:"backlog",blocked:"blocked",shipped:"done"};
const laneHint=l=>FLOW.columns.filter(c=>c.kind===LANE_KIND[l]).map(c=>c.label).join(", ")+(l==="shipped"?", last 30 days":"");
const pressed=()=>{$("boardv").setAttribute("aria-pressed",view==="board");$("view").setAttribute("aria-pressed",view==="roadmap");$("metrics").setAttribute("aria-pressed",view==="metrics");$("decide").setAttribute("aria-pressed",view==="decisions");$("archive").setAttribute("aria-pressed",view==="archive")};
function setView(v){view=v;pref("view",v);pressed();render()}
// The chosen project, else the chosen repository's own, else `default`, else the first this credential may see.
const roadmapProject=()=>[sel.project,sel.repo,"default",...projects()].find(p=>p&&projects().includes(p));
async function renderRoadmap(){
  const project=roadmapProject(),seq=++mapSeq,b=$("board");
  const stale=()=>seq!==mapSeq||view!=="roadmap";   // a newer render, or the board, won
  let map;
  try{
    if(!project)throw new Error("No project to show a roadmap for.");
    map=await api("board_roadmap",{project});
  }catch(e){if(!stale()){b.classList.remove("board","roadmap","metrics","decisions","archive");b.replaceChildren(el("p",e.message,"meta"));renderSide()}return}
  if(stale())return;
  b.classList.remove("board","metrics","decisions","archive");b.classList.add("roadmap");b.replaceChildren(el("h3","Roadmap · "+label(map.project)));
  for(const l of map.lanes){
    const col=el("section",null,"col");col.dataset.lane=l.lane;
    const h=el("h2",l.lane[0].toUpperCase()+l.lane.slice(1)+" · "+l.cards.length);h.title=laneHint(l.lane);col.append(h);
    for(const k of l.cards){
      const d=el("div",null,"card");d.append(...heading(k));
      const m=el("div",null,"meta");
      if(l.lane==="now")m.append(el("span",colLabel(k.column)));
      if(k.claim){const t=el("span",null,"tag agent");t.style.setProperty("--ag",agentColor(k.claim));t.append(el("i",null,"dot"),k.claim);m.append(t)}
      m.append(...tagChips(k));
      if(k.waits_on.length)m.append(el("span","waits on "+k.waits_on.length));
      if(k.done_ms)m.append(el("span","shipped "+new Date(k.done_ms).toLocaleDateString()));
      d.append(m);d.onclick=()=>show(k.id);col.append(d);
    }
    b.append(col);
  }
  renderSide();syncDialog();
}

/* Metrics: counts, flow and lead time for the chosen project, else the chosen repository, else everything
   this credential may see, computed by the server's board_metrics. Re-read whenever the board is. */
const DAY=864e5,dur=ms=>ms==null?"–":ms<DAY?Math.round(ms/36e5)+"h":(ms/DAY).toFixed(ms<10*DAY?1:0)+"d";
const day=ms=>new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"});
// A panel of labelled bars: rows are {label, n, title?, fill?}; `max` lets two panels share a scale.
function bars(title,rows,hint,max=Math.max(1,...rows.map(r=>r.n))){
  const s=el("section",null,"col"),h=el("h2",title[0].toUpperCase()+title.slice(1));if(hint)h.title=hint;s.append(h);
  for(const r of rows){
    const row=el("div",null,"bar"),f=el("i"),t=el("span");f.style.width=(r.n/max*100)+"%";
    if(r.fill)f.style.setProperty("--fill",r.fill);if(r.title)row.title=r.title;
    t.append(f);row.append(el("span",r.label),t,el("span",String(r.n)));s.append(row);
  }
  if(!rows.length)s.append(el("p","None.","meta"));
  return s;
}
async function renderMetrics(){
  const seq=++mapSeq,b=$("board"),stale=()=>seq!==mapSeq||view!=="metrics";
  const args=sel.project?{project:sel.project}:sel.repo?{repo:sel.repo}:{};
  let m;
  try{m=await api("board_metrics",args)}
  catch(e){if(!stale()){b.classList.remove("board","roadmap","metrics","decisions","archive");b.replaceChildren(el("p",e.message,"meta"));renderSide()}return}
  if(stale())return;
  const n=c=>m.by_column.find(t=>t.key===c)?.count??0,lt=m.lead_time;
  const kpis=el("div",null,"kpis");
  for(const [v,l,t] of [[m.open,"open"],[working().reduce((a,c)=>a+n(c),0),"in progress",working().map(colLabel).join(", ")],[n("blocked"),"blocked"],
    [lt.shipped,"shipped, 30 days"],[dur(lt.median_ms),"median lead time","created to shipped, last 30 days"],[dur(lt.p85_ms),"85% within","created to shipped, last 30 days"]]){
    const k=el("div",null,"kpi");k.append(el("b",String(v)),l);if(t)k.title=t;kpis.append(k);
  }
  const wmax=Math.max(1,...m.weeks.flatMap(w=>[w.added,w.done]));
  const idle=el("section",null,"col");idle.append(el("h2","Idle longest"));
  for(const k of m.idle){
    const d=el("div",null,"card");d.append(...heading(k));
    d.append(el("div",[colLabel(k.column),"idle "+dur(k.idle_ms),...(k.claim?[k.claim]:[]),...(sel.project?[]:[label(k.project)])].join(" · "),"meta"));
    d.onclick=()=>show(k.id);idle.append(d);
  }
  if(!m.idle.length)idle.append(el("p","Nothing past backlog is open.","meta"));
  b.classList.remove("board","roadmap","decisions","archive");b.classList.add("metrics");
  b.replaceChildren(el("h3","Metrics · "+(sel.project?label(sel.project):sel.repo||"all projects")),kpis,
    bars("added per week",m.weeks.map(w=>({label:day(w.start_ms),n:w.added})),"cards created, the current week last",wmax),
    bars("shipped per week",m.weeks.map(w=>({label:day(w.start_ms),n:w.done})),"cards done, the current week last",wmax),
    bars("open by column",m.by_column.map(t=>({label:colLabel(t.key),n:t.count}))),
    bars("open by priority",m.by_priority.map(t=>({label:PRIORITY[t.key],n:t.count}))),
    ...(sel.project?[]:[bars("open by project",m.by_project.map(p=>({label:label(p.project),n:p.open,title:p.shipped+" shipped in 30 days"})))]),
    bars("in progress by agent",m.by_claim.map(t=>({label:t.key,n:t.count,fill:agentColor(t.key)})),"claimed cards in work columns"),
    idle);
  renderSide();syncDialog();
}

/* The scope bar: the repository, its projects as chips, then the agents holding claims.
   Everything here only narrows what the board shows. */
function renderSide(){
  // Every repository is offered, an empty one too (you may be about to add its first card), except the
  // `default` repository when the Inbox is all it holds: the Inbox chip is it.
  const names=Object.keys(repos).filter(r=>r!==INBOX||repos[r].length>1);
  const item=(text,n,on,fn,agent)=>{
    const b=el("button",null,"item"+(on?" on":""));b.type="button";b.setAttribute("aria-pressed",String(on));
    const name=el("span",null,"name");
    if(agent){const d=el("i",null,"dot");d.style.setProperty("--ag",agentColor(agent));name.append(d)}
    name.append(text);b.append(name,el("span",String(n),"n"));b.onclick=fn;return b};
  const n1=$("nav1");n1.replaceChildren();
  if(projects().length>1){
    const r=el("select");r.id="repo";r.setAttribute("aria-label","repository");
    r.append(new Option("All repositories · "+listed(()=>true),""));
    for(const x of names)r.append(new Option(x+" · "+listed(k=>repoOf(k.project)===x),x));
    r.value=sel.repo;r.onchange=()=>pick(r.value,"");
    n1.append(r);
    // The Inbox is a project, not a repository: it shows and counts only cards with no other project.
    // Listed only when this credential may see it, like every other entry here.
    const chips=[];
    if(projects().includes(INBOX))chips.push(item("Inbox",listed(k=>k.project===INBOX),sel.project===INBOX,()=>pick(repoOf(INBOX),INBOX)));
    // The projects of the chosen repository, or of every repository, so one project's cards are a click
    // away. A repository whose only project is its own is left out: it is the repository, chosen above.
    // (A credential limited to some projects may see a repository with one other project: that one stays.)
    const named=Object.entries(repos).filter(([x])=>!sel.repo||x===sel.repo)

/* Decisions (#595): the open BBP escalations of the tasks linked from cards, read through inbox_list
   (admin only; Mill Board stores none of it). `pending` is null when this credential or board has no
   inbox (a 403 or 422), which hides the button. Any other failure is a read failure: `pendingErr` says
   so, and the decisions last read stay shown, marked stale, so a host hiccup never hides one.
   Each action is dry-run first, and BBP's answer is shown before it is taken. */
let pending=null,pendingAt=0,pendingRead=0,pendingErr=null;
async function loadPending(){
  pendingAt=Date.now();
  try{pending=await api("inbox_list",who());pendingRead=pendingAt;pendingErr=null}
  catch(e){
    if(e.status===403||e.status===422){pending=null;pendingErr=null}
    else pendingErr=e.message||"no answer";
  }
  $("decide").hidden=pending===null&&pendingErr===null&&view!=="decisions";
  $("decide-n").textContent=(pending?.length?String(pending.length):"")+(pendingErr?" !":"");
  $("decide").title=pendingErr?"Could not read the inbox: "+pendingErr:"Decisions waiting for you: open BBP escalations";
}
/* #704 erosion detail (D91): the bin's error, the metrics and the worst functions when erosion fails
   the claim, and unmeasured code always (D45). Shares are basis points, shown as percents. The detail
   is passed through untyped, so a missing or changed field skips its line instead of breaking the view. */
function erosion(er){
  const m=er?.line,out=[],list=x=>Array.isArray(x)?x:[];
  if(er?.error)return[el("p","Erosion could not measure: "+er.error,"meta")];
  if(!m||typeof m!=="object")return out;
  const share=(name,s)=>s&&name+" "+s.base/100+"% → "+s.candidate/100+"% ("+(s.delta>0?"+":"")+s.delta/100+")";
  if(er.failing){
    const lim=m.mode&&typeof m.mode==="object"?" (limits "+m.mode.max_concentration_bp/100+"% and "+m.mode.max_duplication_bp/100+"%)":"";
    const shares=[share("concentration",m.concentration_bp),share("duplication",m.duplication_bp)].filter(Boolean);
    out.push(el("p","Erosion fails"+lim+(shares.length?": "+shares.join(", "):""),"meta"));
    for(const w of list(m.worst_affected))if(w)out.push(el("p","Complexity "+w.base_cc+" → "+w.cc+" in "+w.key,"meta"));
  }
  if(list(m.unmeasured).length)out.push(el("p","Not measured by erosion: "+list(m.unmeasured).join(", "),"meta"));
  return out;
}
const pct=c=>c.confidence+"% · score "+c.score+" · budget "+c.spent+"/"+c.budget+(c.epoch?" · epoch "+c.epoch:"");

async function decide(item,action){

    if(d.response.Rejected){toast("BBP would refuse: "+d.response.Rejected.code+" "+d.response.Rejected.detail);return}
    const then=d.then.length?"\nThen: "+d.then.map(s=>s.verb+" "+s.args.join(" ")).join("; "):"";
    if(!confirm(d.step.verb+" "+d.step.args.join(" ")+"\nWould write: "+changes(d)+then))return;

    else if(r.recorded)toast("Already decided; its card is "+name(filed));

}
function renderDecisions(){

/* Columns change without a card event (an admin's edit elsewhere), so they are re-read on every
   poll; a changed set redraws the board even when no card moved. */
async function pollColumns(){
  const flow=await api("board_columns");
  if(JSON.stringify(flow)===JSON.stringify(FLOW))return false;
  FLOW=flow;return true;
}
async function poll(){
  try{
    let redraw=await pollColumns();
    if(Date.now()-pendingAt>30000){const n=JSON.stringify([pending,pendingErr]);await loadPending();redraw||=n!==JSON.stringify([pending,pendingErr])}
    const r=await api("board_events",{after:cursor,limit:1000});

      cursor=r.cursor;cards=byPriority(list);redraw=true;
    }
    if(redraw)render();
  }catch(e){}

  const collect=()=>Object.fromEntries(Object.entries(draft).map(([r,ps])=>[r,Object.fromEntries(ps.map(p=>[p.name,p.paths.split("\n").map(x=>x.trim()).filter(Boolean)]))]));
  const restructure=fn=>()=>{inputs.forEach(f=>f());fn();drawSettings()};   // keep what was typed, change the shape, redraw
  for(const r of Object.keys(draft)){
    const fs=el("fieldset");fs.append(el("legend",r));
    for(const p of draft[r]){
      const row=el("div",null,"row"),nm=field("input",{value:p.name,size:18,placeholder:"project name"}),
            paths=field("textarea",{value:p.paths,placeholder:"one repository path per line, e.g. crates/apps/rocket_league"});
      inputs.push(()=>{p.name=nm.value.trim();p.paths=paths.value});
      const rm=el("button","Remove");rm.type="button";rm.onclick=restructure(()=>{draft[r]=draft[r].filter(x=>x!==p)});
      row.append(nm,rm);fs.append(row,paths);
    }
    const addp=el("button","+ project"),rmr=el("button","Remove repository");addp.type=rmr.type="button";
    addp.onclick=restructure(()=>draft[r].push({name:"",paths:""}));
    rmr.onclick=restructure(()=>{delete draft[r]});
    fs.append(addp);if(r!=="default")fs.append(" ",rmr);t.append(fs);   // `default` always exists
  }
  const newr=field("input",{placeholder:"new repository name",size:22}),addr=el("button","+ repository"),save=el("button","Save repositories and projects");
  addr.type=save.type="button";
  addr.onclick=restructure(()=>{const n=newr.value.trim();if(n&&!(n in draft))draft[n]=[]});
  save.onclick=guard(err,async()=>{inputs.forEach(f=>f());await setting("settings_projects_set",{repos:collect()});reposDraft=null});
  const row=el("div",null,"row");row.append(newr,addr);
  t.append(row,save,err);
  return t;
}
function rolesTab(){
  const t=el("div"),err=el("div",null,"err");
  if(!cfg.files.roles)t.append(unwritable("--roles FILE"));
  const CAPS=cfg.capabilities,about=cfg.capability_about||{};
  const draft=JSON.parse(JSON.stringify(cfg.roles)),tbl=el("table"),head=el("tr");
  head.append(el("th","Role"));CAPS.forEach(c=>{const th=el("th",c);th.title=about[c]||"";head.append(th)});head.append(el("th",""));tbl.append(head);
  const holders=r=>cfg.agents.filter(a=>a.role===r).map(a=>a.actor);
  for(const r of Object.keys(draft)){
    const held=holders(r),name=el("td",r);name.title=held.length?"held by "+held.join(", "):"held by no agent";
    const tr=el("tr");tr.append(name);
    CAPS.forEach(c=>{const b=field("input",{type:"checkbox",checked:draft[r].includes(c)});b.onchange=()=>{draft[r]=CAPS.filter(x=>x===c?b.checked:draft[r].includes(x))};const td=el("td");td.append(b);tr.append(td)});
    const mv=el("button","Rename");mv.type="button";mv.onclick=guard(err,async()=>{const to=prompt("New name for role "+r+" (its agents move with it):",r)?.trim();if(to&&to!==r)await setting("settings_role_rename",{from:r,to})});
    const rm=el("button","Remove");rm.type="button";rm.disabled=held.length>0;rm.title=held.length?"Held by "+held.join(", ")+": give them another role first":"";
    rm.onclick=guard(err,async()=>{if(!confirm("Remove role "+r+"?"))return;const next={...draft};delete next[r];await setting("settings_roles_set",{roles:next})});
    const td=el("td");td.append(mv," ",rm);tr.append(td);tbl.append(tr);
  }
  const nm=field("input",{placeholder:"new role, e.g. tester",size:20}),add=el("button","Add role");add.type="button";
  add.onclick=guard(err,async()=>{const n=nm.value.trim();await setting("settings_roles_set",{roles:{...draft,[n]:[]}})});
  const save=el("button","Save roles");save.type="button";save.onclick=guard(err,()=>setting("settings_roles_set",{roles:draft}));
  const row=el("div",null,"row");row.append(nm,add);
  const help=el("table");for(const c of CAPS){const tr=el("tr");tr.append(el("td",c),el("td",about[c]||""));help.append(tr)}
  t.append(tbl,row,save,err,help,el("p","Roles are yours to define; capabilities are built in. A role held by an agent cannot be removed, and at least one agent must keep a role with admin.","note"));
  return t;
}

/* Columns and the moves between them. Edited as a draft and saved whole: the server checks it
   (Backlog, Done and Blocked stay; a column that still holds cards cannot be removed). */
let flowDraft=null;
const KINDS={queue:"Queue: waits to be taken",work:"Work: claimed; leaving needs the claim",backlog:"Backlog",done:"Done",blocked:"Blocked"};
function columnsTab(){
  const t=el("div"),err=el("div",null,"err"),ro=!cfg.files.workflow;
  if(ro)t.append(unwritable("--settings-dir DIR"));
  const d=flowDraft??=JSON.parse(JSON.stringify(cfg.workflow)),redraw=()=>drawSettings();
  const btn=(text,fn,title)=>{const b=el("button",text);b.type="button";b.disabled=ro;if(title)b.title=title;b.onclick=()=>{fn();redraw()};return b};
  const held=id=>count(k=>k.column===id);
  const cols=el("table"),ch=el("tr");["Column","Label","Kind","Cards",""].forEach(h=>ch.append(el("th",h)));cols.append(ch);
  d.columns.forEach((c,i)=>{
    const tr=el("tr"),anchor=["backlog","done","blocked"].includes(c.kind);
    const lb=field("input",{value:c.label,size:18,disabled:ro});lb.setAttribute("aria-label","label of "+c.id);lb.oninput=()=>{c.label=lb.value};
    const kind=anchor?el("span",KINDS[c.kind]):field("select",{disabled:ro});
    if(!anchor){for(const k of ["queue","work"])kind.append(new Option(KINDS[k],k));kind.value=c.kind;kind.onchange=()=>{c.kind=kind.value}}
    const ops=el("td");
    ops.append(btn("↑",()=>{if(i)[d.columns[i-1],d.columns[i]]=[d.columns[i],d.columns[i-1]]},"move left"),
      btn("↓",()=>{if(i<d.columns.length-1)[d.columns[i+1],d.columns[i]]=[d.columns[i],d.columns[i+1]]},"move right"));
    if(!anchor)ops.append(btn("Remove",()=>{d.columns.splice(i,1);d.transitions=d.transitions.filter(m=>m.from!==c.id&&m.to!==c.id)},
      held(c.id)?"move its cards out first":"remove this column and its moves"));
    const k=el("td");k.append(kind);
    tr.append(el("td",c.id),(()=>{const td=el("td");td.append(lb);return td})(),k,el("td",String(held(c.id))),ops);cols.append(tr);
  });
  const id=field("input",{placeholder:"new column id, e.g. design",size:20,disabled:ro}),nl=field("input",{placeholder:"label",size:14,disabled:ro});
  const nk=field("select",{disabled:ro});for(const k of ["queue","work"])nk.append(new Option(KINDS[k],k));nk.value="work";
  const add=btn("Add column",()=>{const v=id.value.trim();if(!v)return;
    const at=d.columns.findIndex(c=>c.kind==="done");d.columns.splice(at<0?d.columns.length:at,0,{id:v,label:nl.value.trim()||v,kind:nk.value})});
  const addRow=el("div",null,"row");addRow.append(id,nl,nk,add);
  const ids=d.columns.map(c=>c.id),caps=cfg.capabilities;
  const pick=(opts,v,on,lbl,name=o=>o)=>{const s=field("select",{disabled:ro});s.setAttribute("aria-label",lbl);for(const o of opts)s.append(new Option(name(o),o));s.value=v;s.onchange=()=>on(s.value);return s};
  const colName=o=>d.columns.find(c=>c.id===o)?.label??o;
  const moves=el("table"),mh=el("tr");["From","To","Needs","Gate",""].forEach(h=>mh.append(el("th",h)));moves.append(mh);
  d.transitions.forEach((m,i)=>{
    const tr=el("tr"),cell=x=>{const td=el("td");td.append(x);return td};
    const gate=field("input",{type:"checkbox",checked:!!m.gate,disabled:ro});gate.title="a human approval: also needs admin, even with movement rules off";
    gate.onchange=()=>{m.gate=gate.checked};
    tr.append(cell(pick(ids,m.from,v=>{m.from=v},"from",colName)),cell(pick(ids,m.to,v=>{m.to=v},"to",colName)),cell(pick(caps,m.cap,v=>{m.cap=v},"capability")),cell(gate),
      cell(btn("Remove",()=>d.transitions.splice(i,1))));
    moves.append(tr);
  });
  const addMove=btn("Add move",()=>d.transitions.push({from:ids[0],to:ids[1]??ids[0],cap:caps[0]}));
  const save=el("button","Save columns");save.type="button";save.disabled=ro;
  save.onclick=guard(err,async()=>{await setting("settings_workflow_set",{workflow:d});flowDraft=null});
  const reset=btn("Discard changes",()=>{flowDraft=null});
  const bar=el("div",null,"row");bar.append(save,reset);
  t.append(cols,addRow,el("h4","Moves"),moves,addMove,bar,err,
    el("p","A column's id is fixed once cards use it; its label is what people see. Any open card may always be moved to Blocked, so that move is not listed. A gate is a human approval: it needs its capability and admin.","note"));
  return t;
}

/* Card movement rules: on, moves follow the column table and each role's capabilities; off, any move but out of Done. */
function rulesTab(){
  const t=el("div"),err=el("div",null,"err"),note=el("p",null,"note");
  if(!cfg.files.rules)t.append(unwritable("--settings-dir DIR"));
  const box=field("input",{type:"checkbox"});
  // Always show what the server holds: after a save, and after a failed one too.
  const show=()=>{const on=(cfg.rules||{}).movement!=="open";box.checked=on;box.disabled=!cfg.files.rules;
    note.textContent=on
      ?"On: a card moves only along the Columns tab's moves, by a role holding that move's capability, and leaving a work column needs the claim."
      :"Off: anyone signed in with any capability may move any card to any column, except out of Done and through a gate. Each such move is logged."};
  box.onchange=async()=>{
    const movement=box.checked?"enforced":"open";err.textContent="";box.disabled=true;
    try{await setting("settings_rules_set",{movement});await changed();return}
    catch(e){err.textContent=e.message}
    try{cfg=await setting("settings_get")}catch(e){err.textContent+=" (and the current setting could not be re-read: "+e.message+")"}
    show();
  };
  show();
  const l=el("label");l.append(box," Enforce card movement rules");
  t.append(l,err,note);
  return t;
}

/* Apps signed in through OAuth (e.g. a claude.ai connector). Revoking one drops its tokens; it can sign in again. */
function appsTab(){
  const t=el("div"),err=el("div",null,"err");
  if(!cfg.apps){t.append(el("p","OAuth sign-in is off. Start the board with --issuer URL to let apps such as claude.ai sign in.","note"));return t}
  if(!cfg.apps.length){t.append(el("p","No app has signed in.","note"));return t}
  const tbl=el("table"),head=el("tr");["App","Registered","Tokens",""].forEach(h=>head.append(el("th",h)));tbl.append(head);
  for(const a of cfg.apps){
    const tr=el("tr"),when=a.client_id_issued_at?new Date(a.client_id_issued_at*1000).toLocaleString():"";
    const name=el("td");name.append(el("div",a.client_name||"(unnamed)"),el("code",a.client_id));
    const rv=el("button","Revoke");rv.type="button";
    rv.onclick=guard(err,async()=>{if(!confirm("Sign "+(a.client_name||a.client_id)+" out? It must sign in again."))return;await setting("settings_app_revoke",{client_id:a.client_id})});
    const td=el("td");td.append(rv);tr.append(name,el("td",when),el("td",a.access_tokens+" access, "+a.refresh_tokens+" refresh"),td);tbl.append(tr);
  }
  t.append(tbl,err,el("p","Removing an agent also stops the apps it signed in.","note"));
  return t;
}

/* How the server was started. Changed with its flags or board.env, then a restart. */
function serverTab(){
  const t=el("div"),s=cfg.server||{},p=cfg.paths||{},tbl=el("table");
  const row=(k,v)=>{const tr=el("tr");tr.append(el("td",k),el("td",v));tbl.append(tr)};
  row("Cards",s.tick?"rusty_tick at "+s.tick:"in memory (lost on restart)");
  row("OAuth sign-in",s.issuer||"off");
  row("Accepted hosts",(s.hosts||[]).join(", "));
  for(const [k,label] of [["agents","Agents file"],["projects","Projects file"],["roles","Roles file"],["rules","Rules file"],["workflow","Columns file"],["github","GitHub file"]])
    row(label,p[k]||"none (read-only here)");
  t.append(tbl,el("p","These come from the server's flags or its environment file and change with a restart.","note"));
  return t;
}

function githubTab(){
  const t=el("div"),err=el("div",null,"err"),g=cfg.github||{};
  if(!cfg.files.github)t.append(unwritable("--github-config FILE"));
  t.append(el("p",g.repo?"Syncing "+g.repo+(g.running?" (running)":" (not running)"):"Not syncing.","note"));
  const repo=field("input",{value:g.repo||"",placeholder:"owner/name",size:28}),api_=field("input",{value:g.api||"https://api.github.com",size:36}),
        secs=field("input",{type:"number",min:5,value:g.interval_secs||60,style:"width:6em"}),
        tok=field("input",{type:"password",placeholder:g.has_token?"unchanged (stored)":"token with issues read/write",size:36,autocomplete:"off"});
  const lab=(l,i)=>{const r=el("div",null,"row");r.append(el("label",l),i);return r};
  const save=el("button","Save and "+(g.repo?"restart":"start")+" sync"),off=el("button","Turn sync off");save.type=off.type="button";
  save.onclick=guard(err,()=>setting("settings_github_set",{repo:repo.value,api:api_.value,interval_secs:Number(secs.value),token:tok.value}));
  off.onclick=guard(err,()=>setting("settings_github_clear",{}));
  const row=el("div",null,"row");row.append(save);if(g.repo)row.append(off);
  t.append(lab("Repository",repo),lab("API URL",api_),lab("Every (seconds)",secs),lab("Token",tok),row,err,
    el("p","The token is stored in github.json, readable only by the account running the board, and is never shown again.","note"));

}

// Board metadata: on failure carry on with a fallback, but say why, so a refusal is not an empty panel.
const meta=(op,fallback)=>api(op).catch(e=>{toast(op+" failed: "+e.message);return fallback});
async function loadMeta(){
  const roles=Object.keys((await meta("board_roles",{roles:{human:1}})).roles);
  const cur=$("role").value;$("role").replaceChildren(...roles.map(r=>new Option(r,r)));
  $("role").value=roles.includes(cur)?cur:(pref("role")&&roles.includes(pref("role"))?pref("role"):(roles.includes("human")?"human":roles[0]));
  FLOW=await meta("board_columns",FLOW);
  // With a per-model token, who you are is fixed by the token: show it, do not ask.
  const me=await meta("board_whoami",{});
  if(me.authenticated){$("actor").value=me.actor;$("actor").disabled=true;$("role").value=me.role;$("role").disabled=true;
    $("actor").hidden=$("role").hidden=true;const c=$("me");c.hidden=false;
    c.replaceChildren(el("span",(me.actor[0]||"?").toUpperCase(),"av"),el("b",me.actor),"· "+me.role);c.title="Signed in as "+me.actor+" ("+me.role+")"}
  // repo -> its projects. A credential limited to some projects hears only of those.
  const listed=(await meta("board_projects",{repos:{}})).repos;
  repos=Object.fromEntries(Object.entries(listed).map(([r,p])=>[r,Object.keys(p)]));
  if(sel.repo&&!(sel.repo in repos))sel={repo:"",project:"",agent:sel.agent};
  if(sel.project&&!projects().includes(sel.project))sel={...sel,project:""};
}
(async()=>{
  $("actor").value=pref("actor")||"";
  await loadMeta();
  const r=pref("repo"),p=pref("project");
  if(r in repos&&(!p||repos[r].includes(p)))sel={repo:r,project:p||"",agent:""};
  $("actor").onchange=()=>pref("actor",$("actor").value);$("role").onchange=()=>pref("role",$("role").value);
  $("gear").onclick=openSettings;
  $("view").onclick=()=>setView(view==="roadmap"?"board":"roadmap");
  $("metrics").onclick=()=>setView(view==="metrics"?"board":"metrics");pressed();
  $("decide").onclick=()=>setView(view==="decisions"?"board":"decisions");
  $("archive").onclick=()=>setView(view==="archive"?"board":"archive");
  $("signout").onclick=()=>{try{localStorage.removeItem("token")}catch{}location.reload()};
  $("boardv").onclick=()=>setView("board");
  // New cards go to the chosen project, else to the chosen repository's own project.
  $("add").onclick=()=>{const t=$("title").value.trim();const project=sel.project||sel.repo;if(!t){$("title").focus();return}$("title").value="";act("card_add",{title:t,...(project&&{project})})};
  $("title").onkeydown=e=>{if(e.key==="Enter")$("add").click()};
  try{await refresh()}catch(e){toast(e.message)}
  poll();
})();
