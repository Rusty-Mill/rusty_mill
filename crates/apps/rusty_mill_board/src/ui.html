<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mill Board</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f6f4;--panel:#ececE8;--card:#fff;--ink:#1b1b1a;--mute:#6b6b66;--line:#d8d8d2;--acc:#a8461c;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161615;--panel:#1f1f1d;--card:#292927;--ink:#ececE8;--mute:#9a9a92;--line:#3a3a36;--acc:#e07a4a;--err:#f2867e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 auto 0 0}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
main{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;padding:12px 16px;overflow-x:auto;min-height:calc(100vh - 60px)}
.col{background:var(--panel);border-radius:8px;padding:8px;min-height:120px}
.col.over{outline:2px dashed var(--acc)}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:2px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:grab}
.card b{display:block}
.meta{color:var(--mute);font-size:12px;margin-top:4px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-right:4px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--err);color:#fff;padding:8px 14px;border-radius:6px;display:none}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(560px,92vw)}
dialog form{display:grid;gap:8px}
.cm{border-top:1px solid var(--line);padding:6px 0}
@media (max-width:640px){main{grid-auto-flow:row;grid-auto-columns:auto}}
</style>
</head>
<body>
<header>
  <h1>Mill Board</h1>
  <input id="actor" placeholder="your name" size="12" aria-label="actor name">
  <select id="role" aria-label="role"></select>
  <input id="title" placeholder="New card title" size="26" aria-label="new card title">
  <button id="add">Add</button>
</header>
<main id="board"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="alert"></div>
<script>
const COLS=["backlog","ready","building","qa","review","done","blocked"];
const tok=new URLSearchParams(location.hash.slice(1)).get("token");
const $=id=>document.getElementById(id);
let cards=[],cursor=null,open=null;
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{}};

async function api(op,args={}){
  const r=await fetch("/api/"+op,{method:"POST",headers:{"content-type":"application/json",...(tok&&{authorization:"Bearer "+tok})},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>({error:r.statusText}));
  if(!r.ok)throw new Error(j.error||r.statusText);
  return j;
}
const who=()=>({actor:$("actor").value.trim(),role:$("role").value});
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)}
async function act(op,args){try{await api(op,{...who(),...args});await refresh()}catch(e){toast(e.message)}}
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}

function render(){
  const b=$("board");b.replaceChildren();
  for(const c of COLS){
    const col=el("section",null,"col");col.dataset.col=c;col.append(el("h2",c));
    col.ondragover=e=>{e.preventDefault();col.classList.add("over")};
    col.ondragleave=()=>col.classList.remove("over");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("over");act("card_move",{id:e.dataTransfer.getData("text"),to:c})};
    for(const k of cards.filter(k=>k.column===c)){
      const d=el("div",null,"card");d.draggable=true;d.append(el("b",k.title));
      const m=el("div",null,"meta");k.tags.forEach(t=>m.append(el("span",t,"tag")));
      if(k.claim)m.append(el("span","⚑ "+k.claim+" "));
      if(k.issue)m.append(el("span","#"+k.issue));
      if(k.comments.length)m.append(el("span"," · "+k.comments.length+" 💬"));
      d.append(m);
      d.ondragstart=e=>e.dataTransfer.setData("text",k.id);
      d.onclick=()=>show(k.id);
      col.append(d);
    }
    b.append(col);
  }
  if(open&&$("dlg").open)show(open);
}

function show(id){
  const k=cards.find(c=>c.id===id);if(!k)return;open=id;
  const dlg=$("dlg"),f=el("form");f.method="dialog";
  const t=el("input");t.value=k.title;const body=el("textarea");body.rows=6;body.value=k.body;
  const tags=el("input");tags.value=k.tags.join(", ");tags.placeholder="tags, comma separated";
  const row=el("div");
  const btn=(label,fn)=>{const b=el("button",label);b.type="button";b.onclick=fn;row.append(b," ")};
  btn("Save",()=>act("card_update",{id,title:t.value,body:body.value,tags:tags.value.split(",").map(s=>s.trim()).filter(Boolean)}));
  btn("Claim",()=>act("card_claim",{id}));btn("Release",()=>act("card_release",{id}));
  btn("Close",()=>{open=null;dlg.close()});
  f.append(t,body,tags,row,el("div",k.column+(k.claim?" · claimed by "+k.claim:""),"meta"));
  k.comments.forEach(c=>{const d=el("div",null,"cm");d.append(el("b",c.by+": "),el("span",c.text));f.append(d)});
  const ci=el("input");ci.placeholder="Comment, then Enter";
  ci.onkeydown=e=>{if(e.key==="Enter"&&ci.value.trim()){e.preventDefault();act("card_comment",{id,text:ci.value})}};
  f.append(ci);dlg.replaceChildren(f);if(!dlg.open)dlg.showModal();
}
$("dlg").onclose=()=>{open=null};

async function refresh(){
  cards=(await api("board_list")).cards;
  const ev=(await api("board_events",{limit:1000})).events;cursor=ev.length?ev[ev.length-1].id:null;
  render();
}
async function poll(){
  try{
    const ev=(await api("board_events",{after:cursor,limit:1000})).events;
    if(ev.length){cursor=ev[ev.length-1].id;cards=(await api("board_list")).cards;render()}
  }catch(e){}
  setTimeout(poll,1500);
}
(async()=>{
  const roles=Object.keys((await api("board_roles").catch(()=>({roles:{human:1}}))).roles);
  roles.forEach(r=>$("role").append(new Option(r,r)));
  $("actor").value=pref("actor")||"";$("role").value=pref("role")||(roles.includes("human")?"human":roles[0]);
  $("actor").onchange=()=>pref("actor",$("actor").value);$("role").onchange=()=>pref("role",$("role").value);
  $("add").onclick=()=>{const t=$("title").value.trim();if(t){$("title").value="";act("card_add",{title:t})}};
  $("title").onkeydown=e=>{if(e.key==="Enter")$("add").click()};
  try{await refresh()}catch(e){toast(e.message)}
  poll();
})();
</script>
</body>
</html>
