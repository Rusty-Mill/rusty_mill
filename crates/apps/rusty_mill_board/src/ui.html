<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mill Board</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f6f4;--panel:#ececE8;--card:#fff;--ink:#1b1b1a;--mute:#6b6b66;--line:#d8d8d2;--acc:#a8461c;--err:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161615;--panel:#1f1f1d;--card:#292927;--ink:#ececE8;--mute:#9a9a92;--line:#3a3a36;--acc:#e07a4a;--err:#f2867e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 auto 0 0}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
main{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;padding:12px 16px;overflow-x:auto;min-height:calc(100vh - 60px)}
.col{background:var(--panel);border-radius:8px;padding:8px;min-height:120px}
.col.over{outline:2px dashed var(--acc)}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:2px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:grab}
.card b{display:block}
.num{float:right;margin-left:6px;color:var(--mute);font-size:12px}
.meta{color:var(--mute);font-size:12px;margin-top:4px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-right:4px}
.tag.proj{border-color:var(--acc)}
.tag.p5{border-color:var(--err);color:var(--err)}.tag.p3{border-color:var(--acc);color:var(--acc)}
#view[aria-pressed=true],#metrics[aria-pressed=true]{background:var(--acc);color:#fff}
main.roadmap{grid-auto-flow:row;grid-template-columns:repeat(5,minmax(190px,1fr));align-content:start}
.roadmap h3{grid-column:1/-1;margin:0;font-size:15px}
@media (max-width:640px){main.roadmap{grid-template-columns:minmax(0,1fr)}}
.roadmap .card{cursor:pointer}
main.metrics{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-content:start}
.metrics h3,.kpis{grid-column:1/-1;margin:0;font-size:15px}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{background:var(--panel);border-radius:8px;padding:8px 12px;min-width:120px;color:var(--mute);font-size:12px}
.kpi b{display:block;color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:minmax(0,8em) 1fr 2.5em;gap:6px;align-items:center;margin:4px}
.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar i{display:block;height:10px;min-width:1px;border-radius:3px;background:var(--fill,var(--acc))}
.metrics .card{cursor:pointer}
:root{--al:40%}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--al:66%}}
.card.claimed{border-left:4px solid var(--ag);background:color-mix(in srgb,var(--ag) 9%,var(--card))}
.tag.agent{border-color:var(--ag);color:var(--ag)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ag);margin-right:6px;flex:none}
@keyframes pulse{50%{opacity:.25}}
.running .dot{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.running .dot{animation:none}}
.shell{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:100vh}
.shell.noside{grid-template-columns:minmax(0,1fr)}.shell.noside #side{display:none}
#side{display:flex;background:var(--panel);border-right:1px solid var(--line)}
#side nav{width:220px;padding:12px 8px;overflow-y:auto;min-height:100%}
#side h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:4px 8px 8px}
#side h2.sep{margin-top:18px}
#side .item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;margin-top:2px;overflow-wrap:anywhere}
#side .item:hover{background:var(--card)}
#side .item.on{background:var(--acc);color:#fff}
#side .item .n{opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}
#side .item .name{display:flex;align-items:center}
#toggle,#gear{padding:4px 9px}
#signin form{display:grid;gap:8px}#signin .err{color:var(--err);min-height:1.2em;margin:0}
#settings{width:min(860px,94vw);max-height:90vh}
#settings .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
#settings .tabs button{border:0;border-radius:6px 6px 0 0;background:none}
#settings .tabs button.on{background:var(--acc);color:#fff}
#settings table{width:100%;border-collapse:collapse}
#settings th,#settings td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
#settings .err{color:var(--err);min-height:1.2em;margin:6px 0}
#settings .note{color:var(--mute);margin:6px 0}
#settings .secret{border:1px solid var(--acc);border-radius:6px;padding:8px;margin:8px 0;overflow-wrap:anywhere}
#settings code{font-family:ui-monospace,monospace}
#settings fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
#settings textarea{width:100%;min-height:3.2em}
#settings .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
#settings details{display:inline-block}
#settings details label{display:block}
@media (max-width:760px){.shell{grid-template-columns:minmax(0,1fr)}#side{flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#side nav{width:100%;min-height:0}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--err);color:#fff;padding:8px 14px;border-radius:6px;display:none}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(560px,92vw)}
dialog form{display:grid;gap:8px}
.cm div{border-top:1px solid var(--line);padding:6px 0}
.banner{border:1px solid var(--acc);border-radius:6px;padding:6px 8px}.banner:empty{display:none}
@media (max-width:640px){main{grid-auto-flow:row;grid-auto-columns:auto}}
</style>
</head>
<body>
<div class="shell" id="shell">
<aside id="side" aria-label="repositories, projects and agents"><nav id="nav1" aria-label="repositories, projects and agents"></nav></aside>
<div>
<header>
  <button id="toggle" aria-label="toggle repositories panel" title="Repositories">&#9776;</button>
  <h1>Mill Board</h1>
  <button id="view" aria-pressed="false" title="Show the chosen project's roadmap">Roadmap</button>
  <button id="metrics" aria-pressed="false" title="Show metrics for the chosen repository or project, or the whole board">Metrics</button>
  <input id="actor" placeholder="your name" size="12" aria-label="actor name">
  <select id="role" aria-label="role"></select>
  <input id="title" placeholder="New card title" size="26" aria-label="new card title">
  <button id="add">Add</button>
  <button id="gear" title="Settings" aria-label="settings">&#9881;</button>
  <button id="signout" hidden>Sign out</button>
</header>
<main id="board"></main>
</div>
</div>
<dialog id="dlg"></dialog>
<dialog id="settings" aria-label="settings"></dialog>
<dialog id="signin" aria-label="sign in"><form method="dialog">
  <h2>Sign in to Mill Board</h2>
  <p id="signin-why" class="err" role="alert"></p>
  <input id="signin-token" type="password" placeholder="board token" autocomplete="current-password" aria-label="board token" required>
  <button>Sign in</button>
</form></dialog>
<div id="toast" role="alert"></div>
<script>
const COLS=["backlog","ready","building","qa","review","done","blocked"];
let tok=null;
const $=id=>document.getElementById(id);
let cards=[],cursor=null,dlg=null,repos={},sel={repo:"",project:"",agent:""};
const projects=()=>Object.values(repos).flat();
/* `default` is the Inbox: where a card that names no project lands (rusty_tick's Inbox list). Shown by that name only. */
const INBOX="default",label=p=>p===INBOX?"Inbox":p;
const repoOf=p=>Object.keys(repos).find(r=>repos[r].includes(p))||"";
const shown=k=>(!sel.repo||repoOf(k.project)===sel.repo)&&(!sel.project||k.project===sel.project)&&(!sel.agent||k.claim===sel.agent);
const count=f=>cards.filter(f).length;
/* One colour per agent, the same on every card and in the panel. Twelve hues 30 degrees apart; a name
   prefers the slot its hash picks and takes the next free one if another agent has it, so two agents
   never look alike. The set of agents seen is kept in this browser so colours do not shuffle. */
const SLOTS=12;
let known=[];try{known=JSON.parse(pref("agents")||"[]")}catch{}
let slotOf={};
const hash=n=>{let h=2166136261;for(const c of n){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function assignSlots(){
  const used=new Set();slotOf={};
  for(const n of known){let k=hash(n)%SLOTS;for(let i=0;i<SLOTS&&used.has(k);i++)k=(k+1)%SLOTS;used.add(k);slotOf[n]=k}
}
assignSlots();
function agentColor(n){
  if(!(n in slotOf)){known=[...new Set([...known,n])].sort();pref("agents",JSON.stringify(known));assignSlots()}
  return "hsl("+(slotOf[n]*30+8)+" 62% var(--al))";
}
const RUNNING=["building","qa","review"];
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{}};
/* The token: a #token= in the address is kept in this browser and dropped from the address bar;
   otherwise the one kept from before. With none, or a refused one, the first call asks for it. */
let signing=null,resume=()=>{};   // the open sign-in box, and how to let its waiting calls go
function setToken(t){tok=t;pref("token",t);$("signout").hidden=false;resume()}
{const h=new URLSearchParams(location.hash.slice(1)).get("token");
  if(h){setToken(h);try{history.replaceState(null,"",location.pathname+location.search)}catch{}}
  else if(pref("token"))setToken(pref("token"))}
/* Signing in reloads the page: the new token may be another agent, with its own role, projects
   and view of the board, so everything is read again and no refused write is replayed as someone else.
   Until then the refused calls wait, and every one shares the one box. If the token is replaced
   meanwhile (your own rotation answering late), the box closes and the waiting calls retry with it. */
function signIn(why){
  return signing??=new Promise(done=>{
    const d=$("signin"),f=$("signin-token");$("signin-why").textContent=why;f.value="";
    d.oncancel=e=>e.preventDefault();   // nothing works without a token, so Escape does not dismiss it
    d.querySelector("form").onsubmit=()=>{pref("token",f.value.trim());location.reload()};
    resume=()=>{resume=()=>{};signing=null;d.close();done()};
    d.showModal();f.focus();
  });
}

async function api(op,args={}){
  let r;
  for(;;){
    const sent=tok;   // a 401 for a token since replaced (own rotation) is retried with the current one
    r=await fetch("/api/"+op,{method:"POST",headers:{"content-type":"application/json",...(sent&&{authorization:"Bearer "+sent})},body:JSON.stringify(args)});
    if(r.status!==401)break;
    if(sent===tok)await signIn(tok?"That token was refused. Enter a current one.":"This board needs a token.");
  }
  const j=await r.json().catch(()=>({error:r.statusText}));
  if(!r.ok){const e=new Error(j.error||r.statusText);e.status=r.status;throw e}
  return j;
}
/* A per-model token fixes who you are: send nothing, so a role renamed under you never disagrees. */
const who=()=>$("actor").disabled?{}:{actor:$("actor").value.trim(),role:$("role").value};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)}
// Run a write as the current actor, then re-read the board. Resolves to the reply, or null after showing the error.
async function act(op,args){
  try{const r=await api(op,{...who(),...args});await refresh();return r}
  catch(e){toast(e.message);if(e.status===409)await refresh().catch(()=>{});return null}
}
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
// A card's heading: its board number in the corner, if it has one, then its title.
const heading=k=>[...(k.number?[el("span","#"+k.number,"num")]:[]),el("b",k.title)];
// rusty_tick's priority scale; 0 (none) shows no badge.
const PRIORITY={5:"High",3:"Medium",1:"Low",0:"None"};
const priorityTag=k=>k.priority?[el("span",PRIORITY[k.priority],"tag p"+k.priority)]:[];

function render(){
  if(view==="roadmap"){renderRoadmap();return}
  if(view==="metrics"){renderMetrics();return}
  mapSeq++;   // drop any roadmap or metrics still loading
  const b=$("board");b.classList.remove("roadmap","metrics");b.replaceChildren();
  for(const c of COLS){
    const col=el("section",null,"col");col.dataset.col=c;col.append(el("h2",c));
    col.ondragover=e=>{e.preventDefault();col.classList.add("over")};
    col.ondragleave=()=>col.classList.remove("over");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("over");act("card_move",{id:e.dataTransfer.getData("text"),to:c})};
    for(const k of cards.filter(k=>k.column===c&&shown(k))){
      const d=el("div",null,"card");d.draggable=true;d.append(...heading(k));
      const m=el("div",null,"meta");
      if(projects().length>1&&!sel.project){const t=el("span",label(k.project),"tag proj");t.title=repoOf(k.project);m.append(t)}
      m.append(...priorityTag(k));
      k.tags.filter(t=>!t.startsWith("migrated:")).forEach(t=>m.append(el("span",t,"tag")));
      if(k.claim){
        d.classList.add("claimed");d.style.setProperty("--ag",agentColor(k.claim));
        const t=el("span",null,"tag agent"+(RUNNING.includes(k.column)?" running":""));t.append(el("i",null,"dot"),k.claim);m.append(t);
      }
      if(k.issue)m.append(el("span","issue #"+k.issue));
      if(k.comments.length)m.append(el("span"," · "+k.comments.length+" 💬"));
      d.append(m);
      d.ondragstart=e=>e.dataTransfer.setData("text",k.id);
      d.onclick=()=>show(k.id);
      col.append(d);
    }
    b.append(col);
  }
  renderSide();syncDialog();
}

/* The roadmap: the chosen project's cards in lanes (now, next, later, blocked, shipped), laid out
   by the server's board_roadmap so the rules live in one place. Re-read whenever the board is. */
let view=["roadmap","metrics"].includes(pref("view"))?pref("view"):"board",mapSeq=0;
const LANE_HINT={now:"building, qa, review",next:"ready",later:"backlog",blocked:"blocked",shipped:"done, last 30 days"};
const pressed=()=>{$("view").setAttribute("aria-pressed",view==="roadmap");$("metrics").setAttribute("aria-pressed",view==="metrics")};
function setView(v){view=v;pref("view",v);pressed();render()}
// The chosen project, else the chosen repository's own, else `default`, else the first this credential may see.
const roadmapProject=()=>[sel.project,sel.repo,"default",...projects()].find(p=>p&&projects().includes(p));
async function renderRoadmap(){
  const project=roadmapProject(),seq=++mapSeq,b=$("board");
  const stale=()=>seq!==mapSeq||view!=="roadmap";   // a newer render, or the board, won
  let map;
  try{
    if(!project)throw new Error("No project to show a roadmap for.");
    map=await api("board_roadmap",{project});
  }catch(e){if(!stale()){b.classList.remove("roadmap","metrics");b.replaceChildren(el("p",e.message,"meta"));renderSide()}return}
  if(stale())return;
  b.classList.remove("metrics");b.classList.add("roadmap");b.replaceChildren(el("h3","Roadmap · "+label(map.project)));
  for(const l of map.lanes){
    const col=el("section",null,"col");col.dataset.lane=l.lane;
    const h=el("h2",l.lane+" · "+l.cards.length);h.title=LANE_HINT[l.lane];col.append(h);
    for(const k of l.cards){
      const d=el("div",null,"card");d.append(...heading(k));
      const m=el("div",null,"meta");
      if(l.lane==="now")m.append(el("span",k.column,"tag"));
      m.append(...priorityTag(k));
      k.tags.filter(t=>!t.startsWith("migrated:")).forEach(t=>m.append(el("span",t,"tag")));
      if(k.claim)m.append(el("span",k.claim,"tag"));
      if(k.waits_on.length)m.append(el("span","waits on "+k.waits_on.length));
      if(k.done_ms)m.append(el("span","shipped "+new Date(k.done_ms).toLocaleDateString()));
      d.append(m);d.onclick=()=>show(k.id);col.append(d);
    }
    b.append(col);
  }
  renderSide();syncDialog();
}

/* Metrics: counts, flow and lead time for the chosen project, else the chosen repository, else everything
   this credential may see, computed by the server's board_metrics. Re-read whenever the board is. */
const DAY=864e5,dur=ms=>ms==null?"–":ms<DAY?Math.round(ms/36e5)+"h":(ms/DAY).toFixed(ms<10*DAY?1:0)+"d";
const day=ms=>new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"});
// A panel of labelled bars: rows are {label, n, title?, fill?}; `max` lets two panels share a scale.
function bars(title,rows,hint,max=Math.max(1,...rows.map(r=>r.n))){
  const s=el("section",null,"col"),h=el("h2",title);if(hint)h.title=hint;s.append(h);
  for(const r of rows){
    const row=el("div",null,"bar"),f=el("i"),t=el("span");f.style.width=(r.n/max*100)+"%";
    if(r.fill)f.style.setProperty("--fill",r.fill);if(r.title)row.title=r.title;
    t.append(f);row.append(el("span",r.label),t,el("span",String(r.n)));s.append(row);
  }
  if(!rows.length)s.append(el("p","None.","meta"));
  return s;
}
async function renderMetrics(){
  const seq=++mapSeq,b=$("board"),stale=()=>seq!==mapSeq||view!=="metrics";
  const args=sel.project?{project:sel.project}:sel.repo?{repo:sel.repo}:{};
  let m;
  try{m=await api("board_metrics",args)}
  catch(e){if(!stale()){b.classList.remove("roadmap","metrics");b.replaceChildren(el("p",e.message,"meta"));renderSide()}return}
  if(stale())return;
  const n=c=>m.by_column.find(t=>t.key===c)?.count??0,lt=m.lead_time;
  const kpis=el("div",null,"kpis");
  for(const [v,l,t] of [[m.open,"open"],[RUNNING.reduce((a,c)=>a+n(c),0),"in progress","building, qa, review"],[n("blocked"),"blocked"],
    [lt.shipped,"shipped, 30 days"],[dur(lt.median_ms),"median lead time","created to shipped, last 30 days"],[dur(lt.p85_ms),"85% within","created to shipped, last 30 days"]]){
    const k=el("div",null,"kpi");k.append(el("b",String(v)),l);if(t)k.title=t;kpis.append(k);
  }
  const wmax=Math.max(1,...m.weeks.flatMap(w=>[w.added,w.done]));
  const idle=el("section",null,"col");idle.append(el("h2","idle longest"));
  for(const k of m.idle){
    const d=el("div",null,"card");d.append(...heading(k));
    d.append(el("div",[k.column,"idle "+dur(k.idle_ms),...(k.claim?[k.claim]:[]),...(sel.project?[]:[label(k.project)])].join(" · "),"meta"));
    d.onclick=()=>show(k.id);idle.append(d);
  }
  if(!m.idle.length)idle.append(el("p","Nothing past backlog is open.","meta"));
  b.classList.remove("roadmap");b.classList.add("metrics");
  b.replaceChildren(el("h3","Metrics · "+(sel.project?label(sel.project):sel.repo||"all projects")),kpis,
    bars("added per week",m.weeks.map(w=>({label:day(w.start_ms),n:w.added})),"cards created, the current week last",wmax),
    bars("shipped per week",m.weeks.map(w=>({label:day(w.start_ms),n:w.done})),"cards done, the current week last",wmax),
    bars("open by column",m.by_column.map(t=>({label:t.key,n:t.count}))),
    bars("open by priority",m.by_priority.map(t=>({label:PRIORITY[t.key],n:t.count}))),
    ...(sel.project?[]:[bars("open by project",m.by_project.map(p=>({label:label(p.project),n:p.open,title:p.shipped+" shipped in 30 days"})))]),
    bars("in progress by agent",m.by_claim.map(t=>({label:t.key,n:t.count,fill:agentColor(t.key)})),"claimed cards in building, qa or review"),
    idle);
  renderSide();syncDialog();
}

/* The side panel: repositories (and the agents holding claims) on the left; the chosen
   repository's projects in a second pane. Everything here only narrows what the board shows. */
function renderSide(){
  // Every repository is listed, an empty one too (you may be about to add its first card), except the
  // `default` repository when the Inbox is all it holds: the Inbox row below is it.
  const names=Object.keys(repos).filter(r=>r!==INBOX||repos[r].length>1);
  $("shell").classList.toggle("noside",(projects().length<2&&!cards.some(k=>k.claim))||pref("side")==="0");
  const item=(label,n,on,fn,agent)=>{
    const b=el("button",null,"item"+(on?" on":""));b.type="button";
    const name=el("span",null,"name");
    if(agent){const d=el("i",null,"dot");d.style.setProperty("--ag",agentColor(agent));name.append(d)}
    name.append(label);b.append(name,el("span",String(n),"n"));b.onclick=fn;return b};
  const n1=$("nav1");n1.replaceChildren();
  if(projects().length>1){
    n1.append(el("h2","Repositories"),item("All repositories",cards.length,!sel.repo,()=>pick("","")));
    // The Inbox is a project, not a repository: it shows and counts only cards with no other project.
    // Listed only when this credential may see it, like every other entry here.
    if(projects().includes(INBOX))n1.append(item("Inbox",count(k=>k.project===INBOX),sel.project===INBOX,()=>pick(repoOf(INBOX),INBOX)));
    for(const r of names)n1.append(item(r,count(k=>repoOf(k.project)===r),sel.repo===r,()=>pick(r,"")));
    // The projects of the chosen repository, or of every repository, so one project's cards are a click
    // away. A repository whose only project is its own is left out: it is the repository, listed above.
    // (A credential limited to some projects may see a repository with one other project: that one stays.)

/* Read the cursor first, then the cards: anything committed in between is in the list
   AND comes back from the next poll (a harmless extra refresh); nothing can be skipped.
   Both reads must succeed before either is kept. */
// Highest priority first in each column, as card_take takes them; stable, so the store's order follows.
const byPriority=list=>list.sort((a,b)=>b.priority-a.priority);

async function poll(){

async function loadMeta(){

  $("role").value=roles.includes(cur)?cur:(pref("role")&&roles.includes(pref("role"))?pref("role"):(roles.includes("human")?"human":roles[0]));
  // With a per-model token, who you are is fixed by the token: show it, do not ask.
  const me=await meta("board_whoami",{});
  if(me.authenticated){$("actor").value=me.actor;$("actor").disabled=true;$("role").value=me.role;$("role").disabled=true}
  // repo -> its projects. A credential limited to some projects hears only of those.
  const listed=(await meta("board_projects",{repos:{}})).repos;
  repos=Object.fromEntries(Object.entries(listed).map(([r,p])=>[r,Object.keys(p)]));

  $("gear").onclick=openSettings;
  $("view").onclick=()=>setView(view==="roadmap"?"board":"roadmap");
  $("metrics").onclick=()=>setView(view==="metrics"?"board":"metrics");pressed();
  $("signout").onclick=()=>{try{localStorage.removeItem("token")}catch{}location.reload()};
  $("toggle").onclick=()=>{pref("side",pref("side")==="0"?"1":"0");renderSide()};
  // New cards go to the chosen project, else to the chosen repository's own project.
  $("add").onclick=()=>{const t=$("title").value.trim();const project=sel.project||sel.repo;if(t){$("title").value="";act("card_add",{title:t,...(project&&{project})})}};
  $("title").onkeydown=e=>{if(e.key==="Enter")$("add").click()};
  try{await refresh()}catch(e){toast(e.message)}
  poll();
})();
</script>
</body>
</html>
