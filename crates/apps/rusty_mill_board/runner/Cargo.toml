[package]
name = "rusty_mill_runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Optional runner for Mill Board: works cards through stages by running a configured agent command per column, sandboxed in a git worktree."
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "mill-runner"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
rusty_mill_board = { path = ".." }
rusty_sandbox = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_serve = { workspace = true }
