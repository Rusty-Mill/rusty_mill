[package]
name = "rusty_mill_board"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Mill Board: a capability-gated kanban board for humans and agents, served over MCP and a live web UI."
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "rusty_mill_board"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rusty_multimodal_db_engine = { workspace = true }
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_serve = { workspace = true }
rusty_http = { workspace = true }
rusty_oauth = { workspace = true }
rusty_crypto_key = { workspace = true }
clap = { workspace = true }
rusty_request = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
