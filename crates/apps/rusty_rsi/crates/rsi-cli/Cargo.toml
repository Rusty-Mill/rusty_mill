[package]
name = "rsi-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Composition root of the rusty_rsi harness: the `rsi` binary (calibrate, run, report, inner) and its sandbox and grader entry points"

# ADR-0002 tier S: workspace crates only, no external dependencies.
[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "rsi"
path = "src/main.rs"

[dependencies]
rsi-core = { path = "../rsi-core" }
rsi-runtime = { path = "../rsi-runtime" }

[package.metadata.cargo-shear]
# `rsi-harness` is a dev-dependency on purpose, never called from code: it
# makes CI's affected-crate analysis (.github/scripts/affected_crates.py walks
# Cargo's reverse dependency graph) re-run this crate's end-to-end tests when
# the harness changes. test_ci_workflow pins this edge.
ignored = ["rsi-harness"]

[dev-dependencies]
# The executor's own error type, matched in the invariants tests.
rusty_sandbox = { workspace = true }
# Never called: the tests compile the harness from its source with plain
# rustc, as the runtime does. The edge exists so that CI's affected-crate
# analysis re-runs these end-to-end tests whenever a0 changes.
rsi-harness = { path = "../../harness" }
