<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventory</title>
<style>
:root {
  --bg: rgba(18,18,19,0.86);
  --fg: #f2f2f3;
  --dim: #8b8b91;
  --line: rgba(255,255,255,0.09);
  --sel: rgba(255,255,255,0.07);
  --accent: #f2f2f3;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: rgba(252,252,253,0.9);
    --fg: #17171a;
    --dim: #75757c;
    --line: rgba(0,0,0,0.09);
    --sel: rgba(0,0,0,0.05);
    --accent: #17171a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  color: var(--fg);
  background: transparent;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  backdrop-filter: saturate(180%) blur(30px);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
header { border-bottom: 1px solid var(--line); }
.query-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
.glyph { color: var(--dim); flex: none; }
#query {
  flex: 1; border: 0; outline: 0; background: transparent;
  color: var(--fg); font-size: 17px; font-family: inherit;
}
#query::placeholder { color: var(--dim); }
.hint { color: var(--dim); font-size: 11px; white-space: nowrap; }
kbd {
  font: inherit; font-size: 10.5px; border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 5px; color: var(--dim);
}
.filters { display: flex; gap: 6px; padding: 0 16px 12px; flex-wrap: wrap; }
.chip {
  font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--dim); cursor: pointer;
  user-select: none; white-space: nowrap;
}
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }
.chip.frozen::after { content: " ●"; color: #d19a20; }
main { flex: 1; overflow-y: auto; }
.empty { color: var(--dim); padding: 36px 16px; text-align: center; }
.row { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row[aria-selected="true"] { background: var(--sel); }
.row .title { font-weight: 550; display: flex; align-items: baseline; gap: 8px; }
.row .meta { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
.row .snippet {
  color: var(--dim); font-size: 12px; margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.row .snippet mark { background: transparent; color: var(--fg); font-weight: 600; }
.via {
  font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  color: var(--dim); flex: none;
}
footer {
  border-top: 1px solid var(--line); padding: 8px 16px;
  display: flex; justify-content: space-between; gap: 12px;
  color: var(--dim); font-size: 11.5px;
}
textarea#capture {
  width: 100%; min-height: 92px; border: 0; outline: 0; resize: none;
  background: transparent; color: var(--fg); font: inherit; font-size: 15px;
  padding: 16px;
}
.section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.section h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); margin: 0 0 8px; font-weight: 600;
}
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; }
.kv span:first-child { color: var(--dim); }
.opt { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; cursor: pointer; }
.opt[aria-selected="true"] .name { font-weight: 600; }
.opt .name::before { content: "○ "; color: var(--dim); }
.opt[aria-selected="true"] .name::before { content: "● "; color: var(--fg); }
.clip { padding: 8px 16px; border-bottom: 1px solid var(--line); }
.clip .meta { color: var(--dim); font-size: 11px; }
.clip .text {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-word; max-height: 60px; overflow: hidden;
}
button {
  font: inherit; font-size: 12px; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer;
}
button:hover { background: var(--sel); }
.note { color: var(--dim); font-size: 11.5px; padding: 10px 16px; }
.warn { color: #d19a20; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="query-row">
      <span class="glyph" id="glyph">⌕</span>
      <input id="query" autocomplete="off" spellcheck="false" placeholder="Search every conversation…">
      <span class="hint" id="mode-hint"><kbd>⌘M</kbd> meaning</span>
    </div>
    <div class="filters" id="filters"></div>
  </header>
  <main id="main"></main>
  <footer>
    <span id="status"></span>
    <span><kbd>↵</kbd> open · <kbd>⌘K</kbd> palette · <kbd>esc</kbd> close</span>
  </footer>
</div>

<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

const SOURCES = [
  ["claude-code", "Claude Code"], ["codex", "Codex"], ["cursor", "Cursor"],
  ["zed", "Zed"], ["kiro", "Kiro"], ["antigravity", "Antigravity"],
];

const state = {
  mode: "search",       // search | capture | scratchpad | palette | conversation
  meaning: true,        // the ⌘M toggle
  sources: new Set(),   // empty === all
  hits: [],
  selected: 0,
  semanticAvailable: false,
  frozen: new Set(),
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function relative(unix) {
  const d = Math.floor(Date.now() / 1000) - unix;
  if (d < 60) return "just now";
  if (d < 3600) return `${Math.floor(d / 60)}m ago`;
  if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
  if (d < 86400 * 30) return `${Math.floor(d / 86400)}d ago`;
  if (d < 86400 * 365) return `${Math.floor(d / 2592000)}mo ago`;
  return `${Math.floor(d / 31536000)}y ago`;
}

function bytes(n) {
  const u = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return i === 0 ? `${n} B` : `${n.toFixed(1)} ${u[i]}`;
}

/// The core returns snippets with [matched] markers; render them as marks so
/// the highlighting never depends on re-running the match in JS.
function snippet(text) {
  return esc(text).replace(/\[([^\]]*)\]/g, "<mark>$1</mark>");
}

// --- chrome -----------------------------------------------------------------

function renderFilters() {
  if (state.mode !== "search") { $("filters").innerHTML = ""; return; }
  const chip = (id, label) => {
    const on = id === "" ? state.sources.size === 0 : state.sources.has(id);
    const frozen = state.frozen.has(id) ? " frozen" : "";
    return `<span class="chip${frozen}" data-source="${id}" aria-pressed="${on}">${esc(label)}</span>`;
  };
  $("filters").innerHTML = [chip("", "All"), ...SOURCES.map(([id, l]) => chip(id, l))].join("");
}

$("filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const id = chip.dataset.source;
  if (id === "") state.sources.clear();
  else state.sources.has(id) ? state.sources.delete(id) : state.sources.add(id);
  renderFilters();
  runSearch();
});

function setMode(mode) {
  state.mode = mode;
  const q = $("query");
  const configs = {
    search:     { glyph: "⌕", placeholder: "Search every conversation…", hint: `<kbd>⌘M</kbd> meaning ${state.meaning ? "on" : "off"}`, show: true },
    capture:    { glyph: "✎", placeholder: "", hint: "<kbd>⌘↵</kbd> save", show: false },
    scratchpad: { glyph: "⎘", placeholder: "Filter clips…", hint: "clipboard scratchpad", show: true },
    palette:    { glyph: "⌘", placeholder: "", hint: "command palette", show: false },
    conversation: { glyph: "‹", placeholder: "", hint: "<kbd>esc</kbd> back", show: false },
  };
  const c = configs[mode] || configs.search;
  $("glyph").textContent = c.glyph;
  q.placeholder = c.placeholder;
  q.style.display = c.show ? "" : "none";
  $("mode-hint").innerHTML = c.hint;
  renderFilters();

  if (mode === "search") { q.value = ""; q.focus(); runSearch(); }
  if (mode === "capture") renderCapture();
  if (mode === "scratchpad") renderScratchpad();
  if (mode === "palette") renderPalette();
}

// --- search -----------------------------------------------------------------

let searchSeq = 0;

async function runSearch() {
  const query = $("query").value.trim();
  const seq = ++searchSeq;

  if (!query) {
    state.hits = [];
    $("main").innerHTML = `<div class="empty">Type to search across every tool at once.</div>`;
    $("status").textContent = "";
    return;
  }

  try {
    const res = await invoke("search", {
      query, sources: [...state.sources], meaning: state.meaning, limit: 40,
    });
    // A slower earlier query must not overwrite a newer one's results.
    if (seq !== searchSeq) return;

    state.hits = res.hits;
    state.selected = 0;
    state.semanticAvailable = res.semantic_available;
    renderHits();
    $("status").textContent =
      `${res.hits.length} of ${res.total_candidates} · ${res.semantic_model}` +
      (res.semantic_available ? "" : " (lexical fallback)");
  } catch (e) {
    $("main").innerHTML = `<div class="empty warn">${esc(e)}</div>`;
  }
}

function renderHits() {
  if (!state.hits.length) {
    $("main").innerHTML = `<div class="empty">Nothing yet.</div>`;
    return;
  }
  $("main").innerHTML = state.hits.map((h, i) => {
    const c = h.conversation;
    const meta = [
      SOURCES.find(([id]) => id === c.source)?.[1] ?? c.source,
      `${c.message_count} messages`,
      c.git_branch, relative(c.updated_at),
    ].filter(Boolean);

    // Only label a hit "meaning" when a model that models meaning ran.
    let via = "";
    if (h.matched_via === "meaning") {
      via = `<span class="via">${state.semanticAvailable ? "meaning" : "similar"}</span>`;
    }
    return `<div class="row" data-i="${i}" data-id="${c.id}" aria-selected="${i === state.selected}">
      <div class="title">${esc(c.title)}${via}</div>
      <div class="meta">${esc(meta.join(" · "))}</div>
      ${h.snippet ? `<div class="snippet">${snippet(h.snippet)}</div>` : ""}
    </div>`;
  }).join("");
}

function move(delta) {
  if (!state.hits.length) return;
  state.selected = Math.max(0, Math.min(state.hits.length - 1, state.selected + delta));
  renderHits();
  document.querySelector('.row[aria-selected="true"]')
    ?.scrollIntoView({ block: "nearest" });
}

$("main").addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (row) openConversation(Number(row.dataset.id));
});

async function openConversation(id) {
  try {
    const { conversation: c, messages } = await invoke("conversation", { id });
    const resume = await invoke("resume", { id });
    setMode("conversation");
    $("main").innerHTML = `
      <div class="section">
        <div class="title" style="font-size:15px;font-weight:600">${esc(c.title)}</div>
        <div class="meta" style="color:var(--dim);font-size:11.5px">
          ${esc([SOURCES.find(([s]) => s === c.source)?.[1], c.project_path, c.git_branch].filter(Boolean).join(" · "))}
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          ${resume.supported
            ? `<button data-act="resume">Resume — ${esc(resume.command)}</button>`
            : ""}
          <button data-act="primer">Copy hand-off primer</button>
        </div>
        ${resume.supported && resume.project_moved
          ? `<div class="note warn" style="padding:8px 0 0">The original project folder has moved — it will open in your home directory.</div>`
          : ""}
        ${!resume.supported ? `<div class="note" style="padding:8px 0 0">${esc(resume.message)}</div>` : ""}
      </div>
      ${messages.map((m) => `
        <div class="section">
          <h2>${esc(m.role)}</h2>
          <div style="white-space:pre-wrap">${esc(m.text)}</div>
        </div>`).join("")}`;

    $("main").onclick = async (e) => {
      const act = e.target.closest("button")?.dataset.act;
      if (act === "primer") {
        const text = await invoke("primer", { id });
        await window.__TAURI__.clipboardManager.writeText(text);
        e.target.textContent = "Copied — paste it anywhere";
      }
      if (act === "resume") {
        await window.__TAURI__.clipboardManager.writeText(`cd ${resume.cwd} && ${resume.command}`);
        e.target.textContent = "Command copied";
      }
    };
  } catch (e) {
    $("main").innerHTML = `<div class="empty warn">${esc(e)}</div>`;
  }
}

// --- capture ----------------------------------------------------------------

function renderCapture() {
  $("main").innerHTML = `
    <textarea id="capture" placeholder="What are you thinking?"></textarea>
    <div class="note">Saved locally. On save, Inventory checks whether you already worked this out.</div>
    <div id="capture-results"></div>`;
  const box = $("capture");
  box.focus();
  box.addEventListener("keydown", async (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      const text = box.value.trim();
      if (!text) return;
      const res = await invoke("capture", { text });
      state.semanticAvailable = res.semantic_available;
      state.hits = res.hits;
      box.value = "";
      $("capture-results").innerHTML = res.hits.length
        ? `<div class="section"><h2>You may have already worked this out</h2></div>` +
          res.hits.map((h) => `<div class="row" data-id="${h.conversation.id}">
              <div class="title">${esc(h.conversation.title)}</div>
              <div class="meta">${esc(SOURCES.find(([s]) => s === h.conversation.source)?.[1] ?? "")} · ${relative(h.conversation.updated_at)}</div>
            </div>`).join("")
        : `<div class="note">Captured. Nothing related in your history yet.</div>`;
    }
  });
}

// --- scratchpad -------------------------------------------------------------

async function renderScratchpad() {
  const s = await invoke("stats");
  const list = await invoke("clips", { limit: 200 });

  $("main").innerHTML = `
    <div class="section">
      <div class="kv">
        <span>Clipboard scratchpad</span>
        <span>
          <button data-act="toggle">${s.scratchpad_enabled ? "Turn off" : "Turn on"}</button>
          <button data-act="export">Export</button>
          <button data-act="clear">Clear</button>
        </span>
      </div>
      <div class="note" style="padding:8px 0 0">
        ${s.scratchpad_enabled
          ? "On. Everything you copy is stored in the index, tagged with the app it came from, until you clear it."
          : "Off. Nothing is being recorded."}
      </div>
    </div>
    ${list.length ? list.map((c) => `
      <div class="clip">
        <div class="meta">${relative(c.created_at)} · ${esc(c.app ?? "unknown app")}</div>
        <div class="text">${esc(c.text)}</div>
      </div>`).join("") : `<div class="empty">Nothing copied yet.</div>`}`;

  $("main").onclick = async (e) => {
    const act = e.target.closest("button")?.dataset.act;
    if (act === "toggle") await invoke("set_scratchpad", { enabled: !s.scratchpad_enabled });
    if (act === "clear") await invoke("clear_clips");
    if (act === "export") {
      await window.__TAURI__.clipboardManager.writeText(await invoke("export_clips"));
      e.target.textContent = "Copied";
      return;
    }
    renderScratchpad();
  };
}

// --- command palette --------------------------------------------------------

async function renderPalette() {
  const [s, srcs, options] = await Promise.all([
    invoke("stats"), invoke("sources"), invoke("retention_options"),
  ]);
  state.frozen = new Set(srcs.filter((x) => x.state === "frozen").map((x) => x.source));

  $("main").innerHTML = `
    <div class="section">
      <h2>Inventory</h2>
      <div class="kv"><span>Version</span><span>${esc(s.version)}</span></div>
      <div class="kv"><span>License</span><span>one-time purchase · verified offline</span></div>
      <div class="kv"><span>Index</span><span>${bytes(s.index_bytes)}</span></div>
      <div class="kv"><span>Encrypted at rest</span><span>${s.encrypted ? `yes · ${s.entropy.toFixed(4)} bits/byte` : "no"}</span></div>
      <div class="kv"><span>Conversations</span><span>${s.conversations}</span></div>
      <div class="kv"><span>Semantic model</span><span>${esc(s.semantic_model)}${s.semantic_available ? "" : " (lexical fallback)"}</span></div>
    </div>

    <div class="section">
      <h2>How much history to keep</h2>
      ${options.map((o) => `
        <div class="opt" data-window="${o.slug}" aria-selected="${o.selected}">
          <span class="name">${esc(o.label)}</span>
          <span style="color:var(--dim)">${o.conversations} conversations · ${bytes(o.bytes)}</span>
        </div>`).join("")}
      <div class="note" style="padding:8px 0 0">Narrowing the window deletes what falls outside it.</div>
    </div>

    <div class="section">
      <h2>Sources</h2>
      ${srcs.map((x) => {
        const label = SOURCES.find(([id]) => id === x.source)?.[1] ?? x.source;
        let right = "not installed";
        if (x.state === "ok") right = `${x.conversation_count} conversations`;
        if (x.state === "frozen") {
          right = `<span class="warn">frozen — history kept${x.last_ok_at ? `, last read ${relative(x.last_ok_at)}` : ""}</span>`;
        }
        return `<div class="kv"><span>${esc(label)}</span><span>${right}</span></div>`;
      }).join("")}
      <div style="margin-top:10px"><button data-act="index">Index now</button></div>
    </div>`;

  $("main").onclick = async (e) => {
    const opt = e.target.closest(".opt");
    if (opt) { await invoke("set_retention", { window: opt.dataset.window }); renderPalette(); return; }
    if (e.target.closest("button")?.dataset.act === "index") {
      e.target.textContent = "Indexing…";
      const r = await invoke("index_now", { full: false });
      e.target.textContent = `${r.added} new, ${r.updated} updated`;
      renderPalette();
    }
  };
}

// --- input ------------------------------------------------------------------

$("query").addEventListener("input", () => {
  if (state.mode === "search") runSearch();
});

document.addEventListener("keydown", (e) => {
  const meta = e.metaKey || e.ctrlKey;

  if (e.key === "Escape") {
    e.preventDefault();
    // Esc backs out one level before it closes the panel.
    if (state.mode === "search") invoke("hide_panel");
    else setMode("search");
    return;
  }
  if (meta && e.key.toLowerCase() === "k") {
    e.preventDefault();
    setMode(state.mode === "palette" ? "search" : "palette");
    return;
  }
  if (meta && e.key.toLowerCase() === "m") {
    e.preventDefault();
    state.meaning = !state.meaning;
    $("mode-hint").innerHTML = `<kbd>⌘M</kbd> meaning ${state.meaning ? "on" : "off"}`;
    if (state.mode === "search") runSearch();
    return;
  }
  if (state.mode !== "search") return;

  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  if (e.key === "Enter" && state.hits[state.selected]) {
    e.preventDefault();
    openConversation(state.hits[state.selected].conversation.id);
  }
});

listen("panel-mode", (event) => setMode(event.payload));
listen("index-complete", () => { if (state.mode === "search") runSearch(); });

setMode("search");
invoke("sources")
  .then((srcs) => {
    state.frozen = new Set(srcs.filter((x) => x.state === "frozen").map((x) => x.source));
    renderFilters();
  })
  .catch(() => {});
</script>
</body>
</html>
