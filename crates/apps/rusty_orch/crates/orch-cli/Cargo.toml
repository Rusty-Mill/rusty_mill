[package]
name = "orch-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Shared CLI-adapter core for rusty_orch: process seam with a hard deadline, the JSON reply protocol, and prompt rendering."
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
orch-core = { workspace = true }
orch-dispatch = { workspace = true }
# Sovereign JSON parser (foundation layer). Default features off keeps serde
# out, as rusty_request and rusty_oauth do; see ADR-0004 and root ADR-0002.
rusty_json = { path = "../../../../foundation/rusty_json", default-features = false, features = ["std"] }

[features]
# Ships `FakeCommand` and the board fixtures adapters test against.
fake = []

[dev-dependencies]
orch-cli = { path = ".", features = ["fake"] }
