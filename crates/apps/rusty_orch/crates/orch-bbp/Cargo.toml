[package]
name = "orch-bbp"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "TaskHost adapter over the existing BBP CLI and moderator"
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
orch-core = { workspace = true }
orch-dispatch = { workspace = true }
orch-cli = { workspace = true }
# #1318 S5: the builder sequence moves `orch_lens::builder::Session` rows.
orch-lens = { workspace = true }
rusty_bbp = { workspace = true }
rusty_serde = { workspace = true }
rusty_atomic_file = { workspace = true }
rusty_json = { path = "../../../../foundation/rusty_json", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# #1318 S4: `own` is spawned with the slot and ACP end at fds 3 and 4.
platform = { workspace = true }
platform-linux = { workspace = true }

[dev-dependencies]
orch-dispatch = { workspace = true, features = ["fake"] }
orch-cli = { workspace = true, features = ["fake"] }
