[package]
name = "rusty_orch"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Orchestrator command line: runs a JSON goal file through the dispatcher over the Codex and Ollama adapters and prints the board."
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "rusty_orch"
path = "src/main.rs"

[dependencies]
orch-core = { workspace = true }
orch-dispatch = { workspace = true }
orch-cli = { workspace = true }
orch-ollama = { workspace = true }
orch-codex = { workspace = true }
rusty_json = { path = "../../../../foundation/rusty_json", default-features = false, features = ["std"] }

[dev-dependencies]
orch-dispatch = { workspace = true, features = ["fake"] }
orch-cli = { workspace = true, features = ["fake"] }
