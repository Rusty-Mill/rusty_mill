[package]
name = "orch-fs-shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "The fs/shell MCP server for one agent session's root (Let Em Loose #1379): read, list, stat, write and exec over stdio. It confines nothing; running it inside lel-jail as a gateway target is future work."
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[[bin]]
name = "orch-fs-shell"
path = "src/bin/orch-fs-shell.rs"

[dependencies]
# The MCP server and its stdio transport; first-party.
rusty_mcp_server = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
