[package]
name = "orch-ollama"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Orchestrator adapter: Agent::Local over the Ollama CLI. Prompt on stdin, one JSON object out."
license = "MIT"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
orch-core = { workspace = true }
orch-dispatch = { workspace = true }
orch-cli = { workspace = true }

[dev-dependencies]
orch-cli = { workspace = true, features = ["fake"] }
