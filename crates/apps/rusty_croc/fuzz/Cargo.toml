[package]
name = "rusty-croc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone workspace so the fuzz crate (nightly-only) never interferes with
# a normal `cargo build`/`cargo test` of the main crate.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rusty-croc]
path = ".."

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pake"
path = "fuzz_targets/pake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mnemonicode"
path = "fuzz_targets/mnemonicode.rs"
test = false
doc = false
bench = false
