name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — runs the fuzz smoke job
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast gate: formatting, lints, unit tests + Go-generated vectors.
  test:
    name: rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --release --locked
      - name: test
        run: cargo test --release --locked

  # Cross-implementation interop against a freshly built stock Go croc.
  interop:
    name: interop vs stock croc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: run interop suite
        run: bash scripts/interop_test.sh

  # Parser fuzz smoke — nightly + cargo-fuzz, kept off the per-push path
  # (weekly schedule, or on demand) since the instrumented build is slow.
  fuzz:
    name: fuzz smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz each target briefly
        run: |
          for t in mnemonicode message pake frame; do
            echo "== $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=4096
          done
