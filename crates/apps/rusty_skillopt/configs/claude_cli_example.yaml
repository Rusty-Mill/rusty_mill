# Example config using the `claude_cli` provider -- shells out to the
# `claude` CLI's non-interactive print mode (`claude -p`) instead of
# calling the Anthropic API directly. Useful wherever a working `claude`
# CLI session already exists (e.g. an OAuth-authenticated Claude Code
# sandbox) but no portable ANTHROPIC_API_KEY is available for a raw HTTP
# client -- confirmed in this project's own development sandbox, where
# every prior real (non-mock) run needed a key this environment never had.
#
# `model` is passed straight through as `claude -p`'s `--model` argument
# (an alias like "sonnet"/"opus"/"fable", or a full model name).
#
# Sized small (train 4 / val 2 / test 2, 1 epoch, batch 2) on purpose:
# this is a smoke-scale run proving the loop actually completes live
# end-to-end via this backend, not a difficulty-tuned experiment -- see
# docs/USAGE.md §5 for what a real run needs to actually find something.
#
# Prerequisites: `claude` on PATH and authenticated (`claude -p "hi"`
# should print a reply with no further setup).

skill_path: skills/initial.md
output_dir: out/claude_cli_example

executor:
  provider: claude_cli
  model: sonnet

optimizer:
  provider: claude_cli
  model: sonnet

reflector:
  provider: claude_cli
  model: sonnet

train:
  epochs: 1
  batch_size: 2
  val_batch_size: 2
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: synthetic_arithmetic
  params:
    train_size: 4
    val_size: 2
    test_size: 2
    seed: 0
    distractor_rate: 0.5
