# Same shape as configs/aisf_triage_claude_cli_full_deep_example.yaml --
# every role live via `claude -p`, zero API keys anywhere in the chain --
# but against `data/aisf_triage_hard_labels.jsonl` instead of the
# original 40-scenario set. Both `aisf_triage` and `aisf_validation`
# reached a perfect ceiling score on their original datasets after the
# fix this project's `train` loop found and applied back to AISF's real
# prompt (see RELEASE_NOTES.md) -- this config exists to find out
# whether that ceiling reflects a genuinely excellent skill or just a
# benchmark that's stopped being able to tell the difference. See
# `data/aisf_triage_hard_labels.md` for what specifically makes these
# 24 scenarios harder (and why) than the original set.
#
# `train` settings here match the full_deep config's own
# (`val_batch_size: 8` = the entire val split, `epochs: 2`) so this file
# doubles as a ready-to-go train config, not just an eval one -- run
# `eval` first to see where the current skill actually stands before
# spending a much longer `train` run's worth of real `claude -p` calls.

skill_path: skills/aisf_triage_initial.md
output_dir: out/aisf_triage_hard_example

executor:
  provider: aisf_stage
  model: triage
  aisf_binary_path: /path/to/aisf/target/debug/software-factory
  max_tokens: 256

optimizer:
  provider: claude_cli
  model: sonnet
  max_tokens: 1024

reflector:
  provider: claude_cli
  model: sonnet
  max_tokens: 256

train:
  epochs: 2
  batch_size: 4
  val_batch_size: 8
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: aisf_triage
  params:
    labels_path: data/aisf_triage_hard_labels.jsonl
