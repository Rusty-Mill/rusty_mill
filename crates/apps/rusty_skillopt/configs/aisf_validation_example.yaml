# Example config optimizing AISF's real validation agent prompt against a
# small set of hand-labeled synthetic PR-review scenarios, instead of a
# generated benchmark. Sibling to configs/aisf_triage_example.yaml -- same
# shape, different stage.
#
# Only `executor` uses `provider: aisf_stage` -- it's the one role that
# runs the actual agent under governance (a whole multi-turn tool-use loop
# via AISF's `eval-stage` subcommand, driven as a subprocess). `optimizer`
# and `reflector` stay plain chat backends.
#
# - `aisf_binary_path` is the path to AISF's *built* `software-factory`
#     binary (`cargo build` in a checkout of
#     https://github.com/baileyrd/AISF, then point here at
#     target/debug/software-factory or target/release/software-factory).
# - `model` is reinterpreted as the AISF stage to drive -- "validation" here.
# - `ANTHROPIC_API_KEY` must be set in this process's environment: the
#     spawned AISF binary inherits it. Unlike triage, validation has no
#     claude_cli/MCP-bridge driver yet -- a real key is currently the only
#     way to run this executor role live.
#
# skill_path below should start as a copy of AISF's own
# prompts/validation.md (not this repo's generic skills/initial.md) -- the
# trainable document is a real agent's real system prompt, not a
# from-scratch one.

skill_path: skills/aisf_validation_initial.md
output_dir: out/aisf_validation_example

executor:
  provider: aisf_stage
  model: validation
  aisf_binary_path: /path/to/aisf/target/debug/software-factory
  max_tokens: 256

optimizer:
  provider: anthropic
  model: claude-sonnet-5
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 1024

reflector:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 256

train:
  epochs: 1
  batch_size: 4
  val_batch_size: 4
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: aisf_validation
  params:
    labels_path: data/aisf_validation_labels.jsonl
