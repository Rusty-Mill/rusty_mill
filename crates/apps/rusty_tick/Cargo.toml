[package]
name = "rusty_tick"
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"
description = "Self-hosted task manager on rusty_multimodal_db_engine (spike)"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_multimodal_db_engine = { workspace = true }
# HTTP/1.1 framing, JSON and query-string decoding come from the monorepo's
# own crates (ADR-0002), not hyper/axum/serde_json.
rusty_http = { workspace = true }
rusty_json = { workspace = true }
rusty_url = { workspace = true }
# Per-user tokens (ADR-0002): random secrets, their encoding, and a digest of
# each so only digests are stored. `sha2` is the workspace's pinned SHA-256
# (the monorepo has no first-party one); it is used behind `users::digest`.
rusty_rand = { workspace = true }
rusty_base64 = { workspace = true }
sha2 = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
