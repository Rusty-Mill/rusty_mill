# cargo-deny configuration (V6, docs/0.1.2/audits/repo-review-2026-06-10.md).
#
# Supply-chain gate for the Rust workspace: security advisories, license
# policy, duplicate-version hygiene, and registry provenance. Local/manual
# tool only -- not run in CI. Wiring this into `.github/workflows/ci.yml`
# was attempted (2026-09-12 monorepo review, finding 59) and reverted:
# enforcing it against this workspace's real, shared Cargo.lock surfaces a
# large pre-existing backlog (unmaintained/yanked transitive crates, two
# real wasmtime CVEs, an rmcp DNS-rebinding CVE, license-metadata gaps in
# `rusty_rusqlite`/`rusty_stream`, and dozens of the workspace's own
# deliberate duplicate-version splits tripping `[bans]`) that is a separate
# triage project, not a CI-gate change. Run locally with `cargo deny check`.

[graph]
# The platforms Nexus actually ships on. Limiting the graph keeps the check
# from flagging advisories in target-gated deps we never compile.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste is a build-time proc-macro (transitive via tokenizers); it ships
    # no runtime code and upstream archived it with no successor. Revisit if
    # the direct dependents migrate off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro, no runtime code" },
    # rsa 0.9.x (Marvin Attack timing side-channel): present in the shared
    # workspace Cargo.lock via jsonwebtoken's `rust_crypto` feature in
    # agentgateway-auth (rusty_agent_gateway) and rusty-mcp's `jwt`
    # feature, not a nexus dependency itself -- cargo-deny resolves the
    # whole workspace graph regardless of which crate's config invokes it.
    # Reviewed: both crates' production code only calls
    # `jsonwebtoken::decode`/`DecodingKey` (signature *verification*,
    # public-key only); `encode`/`EncodingKey` (the private-key signing
    # path the advisory concerns) appears only in each crate's own test
    # suite, never in shipped code. The Marvin Attack leaks private-key
    # bits through timing in RSA decrypt/sign operations; verifying a
    # signature with the public modulus/exponent has no secret-dependent
    # computation to leak. Revisit once a patched `rsa` release exists.
    { id = "RUSTSEC-2023-0071", reason = "RS256 verify-only usage (DecodingKey/decode); the private-key sign/decrypt path the Marvin Attack targets is never exercised in production code" },
]

[licenses]
# Everything in today's tree. All permissive (plus MPL-2.0, weak file-level
# copyleft — fine for unmodified library use). Adding a dep under a new
# license fails CI until the license is reviewed and listed here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
confidence-threshold = 0.8

[bans]
# The tree currently carries many duplicate minor versions (transitive churn);
# warn rather than deny so this surfaces in logs without blocking PRs.
multiple-versions = "warn"
# Wildcard version requirements are banned, except the `path = "..."`
# workspace-internal deps which legitimately have no version.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
