[package]
name = "nexus-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Nexus MCP server (forge ops → AI clients) + Host client (external MCP servers → Nexus)"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
nexus-kernel = { path = "../nexus-kernel" }
nexus-plugins = { path = "../nexus-plugins" }
nexus-types = { path = "../nexus-types" }
rusty-mcp = { workspace = true, features = ["client"] }
rmcp = { version = "3.1", features = ["server", "macros"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true }
toml = "1.1"
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl"] }

[features]
# Audit-2026-05-01 P1-3 (#113) — emit JSON Schema + TypeScript bindings
# for the wire-mirror IPC types. Off by default. Schemars is already
# unconditional (used internally for MCP tool schemas) so the feature
# only gates ts-rs.
ts-export = ["dep:ts-rs"]

[dev-dependencies]
# Only the in-process adapter tests in `server.rs` drive a real client; the
# production Host client lives in `rusty-mcp`'s `client` feature.
rmcp = { version = "3.1", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
