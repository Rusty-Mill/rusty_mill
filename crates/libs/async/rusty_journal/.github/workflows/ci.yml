name: CI

# Runs on every PR and on pushes to main. The job is named "check" so it matches
# the required-status-check name expected by branch protection (see
# docs from repo-config's ci-and-branch-protection reference). No Cargo.toml
# exists yet, so this currently just no-ops green; the moment one lands, this
# workflow starts running real fmt/clippy/test checks automatically.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cargo project
        id: cargo
        run: echo "exists=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.cargo.outputs.exists == 'true'
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        if: steps.cargo.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        if: steps.cargo.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.cargo.outputs.exists == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.cargo.outputs.exists == 'true'
        run: cargo test --all-features

      - name: No Cargo project yet
        if: steps.cargo.outputs.exists == 'false'
        run: echo "No Cargo.toml yet - nothing to check. This step keeps 'check' green so branch protection has a real status to gate on until the storage engine crate lands."
