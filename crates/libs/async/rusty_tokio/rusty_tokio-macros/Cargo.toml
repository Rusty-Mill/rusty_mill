[package]
name = "rusty_tokio-macros"
version = "0.1.0"
edition = "2021"
description = "Proc-macro attributes (#[main], #[test]) for rusty_tokio -- not meant to be depended on directly, use rusty_tokio's re-exports."
license = "MIT"

[package.metadata.rusty_mill]
layer = "libs"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
