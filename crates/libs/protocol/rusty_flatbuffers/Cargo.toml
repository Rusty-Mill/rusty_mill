[package]
name = "rusty_flatbuffers"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Dependency-free FlatBuffers runtime: a bounds-checked table/vector reader that returns errors instead of panicking, and a back-to-front builder. No code generation; schemas are hand-written on top."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
readme = "README.md"
keywords = ["flatbuffers", "serialization", "protocol"]
categories = ["encoding"]
publish = false

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
