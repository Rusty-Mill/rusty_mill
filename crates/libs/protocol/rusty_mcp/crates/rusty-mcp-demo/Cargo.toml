[package]
name = "rusty-mcp-demo"
version = "0.5.0"
description = "Example MCP server built on rusty_mcp_server"
publish = false
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mcp"

[package.metadata.rusty_mill]
layer = "libs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[[bin]]
name = "rusty-mcp-demo"
path = "src/main.rs"

[dependencies]
rusty_mcp_server = { path = "../../../rusty_mcp_server", features = ["http", "request-state"] }
rusty_serve = { path = "../../../../net/rusty_serve" }

[dev-dependencies]
# The acceptance suite drives the server with the `rmcp` client, the oracle
# the MCP crates are being moved off; never shipped.
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "elicitation",
] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
