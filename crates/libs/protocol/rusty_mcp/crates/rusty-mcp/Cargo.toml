[package]
name = "rusty-mcp"
version = "0.7.0"
description = "Transport-level building blocks for MCP servers and gateways: OAuth resource-server auth, load shedding, W3C trace context, OpenTelemetry"
keywords = ["mcp", "model-context-protocol", "ai", "llm"]
categories = ["network-programming", "development-tools"]
readme = "../../README.md"
# Not published to crates.io. Consume it via a git or path dependency.
publish = false
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mcp"
authors = ["rusty_mcp contributors"]

[package.metadata.rusty_mill]
layer = "libs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# Pagination cursors are base64 so clients treat them as opaque.
rusty_base64 = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
http = { workspace = true }
rusty_json = { workspace = true }
tower-service = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusty_url = { workspace = true }
tower-layer = "0.3"
# `rust_crypto` keeps the build pure-Rust; `aws_lc_rs` would need a C toolchain.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"], optional = true }
rusty_percent = { workspace = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
rand = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_mcp_axum = { workspace = true }
rsa = "0.9"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }

[features]
default = []
# A JWKS-backed JWT validator for the authorization layer.
jwt = ["dep:jsonwebtoken", "dep:reqwest", "tokio/sync"]
# Export spans to an OpenTelemetry collector over OTLP.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
