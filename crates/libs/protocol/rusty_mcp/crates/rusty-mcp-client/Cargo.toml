[package]
name = "rusty-mcp-client"
version = "0.1.0"
description = "Protocol-only MCP client: stdio child process and Streamable HTTP, with API-key, bearer and OAuth client-credentials auth"
keywords = ["mcp", "model-context-protocol", "ai", "llm"]
categories = ["network-programming", "development-tools"]
publish = false
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mcp"
authors = ["rusty_mcp contributors"]

[package.metadata.rusty_mill]
layer = "libs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
# The client is `rusty_mcp_client_native` (the HTTP transport is on `rusty_request`
# and `rusty_tls`). `rusty_request` is also used here for the OAuth token fetch;
# its `tokio` feature makes it run on the caller's tokio runtime.
rusty_mcp_client_native = { workspace = true, features = ["http"] }
rusty_request = { workspace = true, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
toml = "1.1"
# The server the end-to-end tests talk to, in process.
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_serve = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
