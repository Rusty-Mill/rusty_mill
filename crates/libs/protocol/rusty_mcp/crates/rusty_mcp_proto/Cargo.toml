[package]
name = "rusty_mcp_proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Sovereign MCP wire protocol: JSON-RPC 2.0 messages and the core Model Context Protocol types (initialize, tools), hand-written on rusty_json with no serde"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
keywords = ["mcp", "model-context-protocol", "json-rpc", "protocol"]
categories = ["network-programming"]
publish = false

[package.metadata.rusty_mill]
layer = "libs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
# First-party only (ADR-0002 Tier S after Amendment 1). `rusty_json` without its
# `serde` feature: this crate hand-writes its codec against `Value`.
# A path dependency, not `workspace = true`: Cargo ignores `default-features`
# on an inherited dependency, and the workspace entry has the default features.
rusty_json = { path = "../../../../../foundation/rusty_json", version = "0.1.0", default-features = false, features = ["std"] }

[dev-dependencies]
# Differential oracle only (ADR-0002: dev-only external dependencies are
# allowed as independent test oracles and must not ship).
rmcp = { version = "3.1", default-features = false, features = ["server", "client"] }
serde = "1"
serde_json = "1"
