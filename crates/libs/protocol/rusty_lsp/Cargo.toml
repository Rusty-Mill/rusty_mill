[package]
name = "rusty_lsp"
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
description = "A small, reusable async Language Server Protocol framework. Own the protocol plumbing; implement one trait for your language."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/baileyrd/rusty_lsp"
keywords = ["lsp", "language-server", "async", "rusty-tokio", "jsonrpc"]
categories = ["development-tools", "asynchronous"]

[package.metadata.rusty_mill]
layer = "libs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies.criterion]
version = "0.5"
default-features = false

[[bench]]
name = "core"
harness = false
required-features = ["runtime"]

[[test]]
name = "integration"
required-features = ["runtime"]

[[test]]
name = "property"
required-features = ["runtime"]

[[test]]
name = "test_client"
required-features = ["runtime"]

[[example]]
name = "text_server"
required-features = ["runtime"]

[features]
default = ["runtime"]
# The async server/client runtime (`server`, `client`, `service`,
# `transport`, `documents`, `cancel`, `testing`) on `rusty_tokio`.
# Without it the crate is just the protocol data types (`error`, `jsonrpc`,
# `lsp`, `text`), so a consumer that only parses JSON-RPC links no runtime.
runtime = ["dep:rusty_tokio"]
# `Server::from_tcp`/`serve_tcp`: serve accepted `rusty_tokio` TCP connections.
tcp = ["runtime"]
# Wire-level instrumentation via the `tracing` crate.
tracing = ["runtime", "dep:rusty_log"]
# Kept so existing feature lists still build; `runtime` is `rusty_tokio` now.
rusty-tokio = ["runtime"]
# Sovereign JSON support via `rusty_json`.
rusty-json = ["dep:rusty_json"]

[dependencies]
rusty_percent = { workspace = true }
serde = { workspace = true }
serde_json = "1"
rusty_log = { workspace = true, optional = true }
# The async runtime behind the `runtime` feature.
rusty_tokio = { workspace = true, optional = true }
# Sovereign JSON support over `rusty_json`; already merged into this
# workspace at crates/rusty_json, so a plain path dependency.
rusty_json = { workspace = true, optional = true }

[dev-dependencies]
rusty_tokio = { workspace = true }
