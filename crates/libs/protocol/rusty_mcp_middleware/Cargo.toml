[package]
name = "rusty_mcp_middleware"
version = "0.13.0"
description = "Transport-level building blocks for MCP servers and gateways: OAuth resource-server auth, load shedding, W3C trace context, OpenTelemetry"
keywords = ["mcp", "model-context-protocol", "ai", "llm"]
categories = ["network-programming", "development-tools"]
readme = "README.md"
# Not published to crates.io. Consume it via a git or path dependency.
publish = false
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mcp"
authors = ["rusty_mcp contributors"]

[package.metadata.rusty_mill]
layer = "libs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
# Pagination cursors are base64 so clients treat them as opaque.
rusty_base64 = { workspace = true }
# Status codes.
rusty_http = { workspace = true }
rusty_json = { workspace = true }
# The workspace's one door to `tracing` (docs/research/TRACING-FACADE-PLAN.md).
rusty_log = { workspace = true, features = ["subscriber"] }
rusty_url = { workspace = true }
# JWT signature and claim verification (RS256, ES256).
rusty_oauth = { workspace = true, optional = true }
# JWKS fetch. The `tokio` feature makes each request run on the caller's own tokio
# runtime (detected per call), so no second runtime is started.
rusty_request = { workspace = true, features = ["tokio"], optional = true }
rusty_percent = { workspace = true }
# Optional (feature `otel`): the export thread runs `rusty_request` on a small `rusty_tokio` runtime.
# (Feature `jwt`): the JWKS cache sits behind its `RwLock`, which needs no runtime.
rusty_tokio = { workspace = true, optional = true }
# Optional (feature `serve`): the blocking-server adapters for the auth and limits cores.
rusty_serve = { workspace = true, optional = true }
# Optional (feature `otel`): random trace and span ids.
rusty_rand = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusty_mcp_server = { workspace = true, features = ["http"] }
# The blocking server for `tests/trace_context.rs`'s MCP handler and
# `tests/jwt_validator.rs`'s mock JWKS endpoint.
rusty_serve = { workspace = true }
rsa = "0.9"
# Signs the RS256 test tokens: `rusty_oauth` only verifies RSA signatures.
# `rust_crypto` keeps the build pure-Rust.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# The test clients (`reqwest`) and the raw-socket mocks run on tokio (#906).
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
rusty_tokio = { workspace = true }

[features]
default = []
# Auth and load shedding for a blocking `rusty_serve` server.
serve = ["dep:rusty_serve"]
# A JWKS-backed JWT validator.
jwt = ["dep:rusty_oauth", "dep:rusty_request", "dep:rusty_tokio"]
# Export spans to an OpenTelemetry collector over OTLP.
otel = [
    "dep:rusty_request",
    "dep:rusty_tokio",
    "dep:rusty_rand",
]
