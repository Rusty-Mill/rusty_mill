[package]
name = "rusty_tonic"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Dependency-free gRPC protocol core: status codes and error details, validated metadata, message framing with a receive limit, grpc-timeout, and request/response header lists. Sans-IO; no async, no HTTP/2, no code generation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
readme = "README.md"
keywords = ["grpc", "protobuf", "protocol"]
categories = ["network-programming", "encoding"]
publish = false

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
rusty_prost = { workspace = true }
rusty_base64 = { workspace = true }
rusty_percent = { workspace = true }
# The client (module `client`) is behind `rusty-tokio`, the arrangement `rusty_h2`, `rusty_tls`
# and `rusty_hyper` use, so a default build pulls in nothing and stays sans-IO.
rusty_hyper = { path = "../../net/rusty_hyper", optional = true, features = ["rusty-tokio"] }
# The HTTP/2 error codes the client maps to gRPC statuses.
rusty_h2 = { path = "../../net/rusty_h2", optional = true }
rusty_http = { workspace = true, optional = true }
rusty_tokio = { workspace = true, optional = true }
# The server (module `server`) takes an optional `TlsAcceptor`.
rusty_tls = { workspace = true, optional = true, features = ["rusty-tokio"] }
# The `tonic-codec` feature: a codec for `rusty_prost` messages on tonic's transport.
tonic = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[features]
rusty-tokio = ["dep:rusty_hyper", "dep:rusty_h2", "dep:rusty_http", "dep:rusty_tokio", "dep:rusty_tls"]
tonic-codec = ["dep:tonic", "dep:bytes"]

[[test]]
name = "tonic_codec"
required-features = ["tonic-codec"]

[[test]]
name = "bridge"
required-features = ["rusty-tokio"]

[[test]]
name = "client_calls"
required-features = ["rusty-tokio"]

[[test]]
name = "client_lifecycle"
required-features = ["rusty-tokio"]

[[test]]
name = "client_tls"
required-features = ["rusty-tokio"]

[[test]]
name = "client_tonic"
required-features = ["rusty-tokio"]

[[test]]
name = "server_calls"
required-features = ["rusty-tokio"]

[[test]]
name = "server_lifecycle"
required-features = ["rusty-tokio"]

[[test]]
name = "server_tonic"
required-features = ["rusty-tokio"]

[dev-dependencies]
# Independent oracle only (never shipped): our status trailers are read by tonic and tonic's by
# us, and (client tests) a real tonic server is called by our client. The library builds on
# rust-version 1.75; the tests need tonic's floor.
tonic = { workspace = true, features = ["router"] }
# The oracle server's message type and codec, and its runtime (never shipped).
tonic-prost = { workspace = true }
prost = { workspace = true }
# Hosts the tonic oracle server in `client_tonic` (tonic needs a tokio runtime).
tokio = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
# The oracle's streams are `futures_core::Stream`s, built with `rusty_stream`.
futures-core = { workspace = true }
rusty_stream = { path = "../../async/rusty_stream", features = ["futures-core"] }
# Throwaway certificates for the TLS tests; `CertificateDer` names the pinned anchors.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# Names `TcpListener` and `spawn` in the tests (already a dependency under the feature).
rusty_tokio = { workspace = true }
rusty_hyper = { path = "../../net/rusty_hyper", features = ["rusty-tokio"] }
rusty_h2 = { path = "../../net/rusty_h2", features = ["rusty-tokio"] }
rusty_tls = { workspace = true, features = ["rusty-tokio"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
