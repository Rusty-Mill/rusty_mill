[package]
name = "rusty_protobuf"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Dependency-free Protobuf wire-format runtime: a zero-copy reader that returns errors instead of panicking on hostile input, and a length-fixing writer. No code generation; schemas are hand-written on top."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
readme = "README.md"
keywords = ["protobuf", "serialization", "protocol"]
categories = ["encoding"]
publish = false

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
