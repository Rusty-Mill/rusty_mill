[package]
name = "rusty_h2"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A from-scratch HTTP/2 (RFC 9113) implementation in Rust"
license = "MIT"

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
rusty_tokio = { workspace = true, version = "0.2.0", optional = true }

[features]
# The async connection driver (`driver`). Off by default so the sans-IO core
# stays dependency-free; the same arrangement as `rusty_tls`.
rusty-tokio = ["dep:rusty_tokio"]

[[test]]
name = "driver"
required-features = ["rusty-tokio"]

[[test]]
name = "interop"
required-features = ["rusty-tokio"]

[dev-dependencies]
# Independent oracles only (never shipped): live interop in both directions.
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# Only for the `tokio::io` traits `h2` is written against; the oracle runs on
# `rusty_tokio` through an adapter in `tests/interop.rs`, so no tokio runtime.
tokio = { version = "1", default-features = false, features = ["io-util"] }
