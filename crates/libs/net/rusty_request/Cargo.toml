[package]
name = "rusty_request"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "An async HTTP client -- a Rust take on Python's requests, built on rusty_tokio and rusty_http."
license = "MIT"

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
# rusty_tokio, rusty_tls, and rusty_http are now siblings in this same
# workspace -- plain path dependencies. All three used to be pinned `git`
# revs that had to move together (Cargo treats two different revs of the
# same git dependency as two unrelated crates, so `rusty_tls::AsyncTlsStream`
# and `rusty_http::async_tokio::AsyncTransport`'s `AsyncRead`/`AsyncWrite`
# generics over rusty_tokio's own traits wouldn't have matched at
# different revs) -- a workspace `path` dependency resolves that same
# concern by construction: there's only ever one `rusty_tokio` in the
# build graph.
rusty_tokio = { workspace = true }
rusty_tls = { path = "../rusty_tls", features = [
    "rusty-tokio",
] }
rusty_http = { path = "../rusty_http", features = [
    "rusty-tokio",
    "cookies",
] }
# Only for `TrustPolicy::PinnedAnchors`'s `CertificateDer` type -- so a
# caller pinning a private CA never needs their own direct dependency on
# `rustls` itself. This is the same type `rusty_tls::TrustPolicy` already
# requires (re-exported from `rustls::pki_types`, per that crate's own
# Cargo.toml); depending on the small, no-crypto `rustls-pki-types` crate
# directly (rather than all of `rustls`) keeps this to a types-only
# dependency, already present in the build graph at a compatible version
# via `rusty_tls`/the `rustls` dev-dependency below.
rustls-pki-types = "1"
# Exponential backoff math + Retry-After delta-seconds parsing, shared
# with rusty-acp's own RetryPolicy. Retry *eligibility* (which statuses,
# methods, errors) stays here -- only the delay computation moved.
rusty_retry = { workspace = true }
# RFC 7617 Basic auth's `base64(username:password)`. This crate carried its
# own encode-only copy until the workspace's shared implementation existed.
rusty_base64 = { workspace = true }
# `Value` + JSON parser/writer for `.json()`/`Response::json()`. This crate
# carried its own hand-rolled copy (deliberately no `serde`) until
# `rusty_json` grew a serde-free `Value` surface of its own;
# `default-features = false` keeps that same no-`serde` stance.
rusty_json = { path = "../../../foundation/rusty_json", default-features = false, features = [
    "std",
] }


[dev-dependencies]
# Test-only: builds a local TLS server (via a self-signed cert) to
# exercise the https:// connector and CONNECT-tunnel proxying against,
# without real network access. Never a dependency of the shipped
# library -- rusty_tls (a client) is what the library itself uses.
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
] }
rcgen = "0.13"
# Oracle for `tests/foreign_executor.rs`: requests made from tasks a real
# tokio runtime drives, served by `rusty_tokio`'s fallback runtime.
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "net",
    "time",
    "io-util",
] }
