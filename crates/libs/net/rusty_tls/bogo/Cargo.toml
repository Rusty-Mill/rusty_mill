# BoringSSL's protocol test suite ("BoGo") shim for the hand-rolled engine.
#
# Deliberately a separate, unpublished package, like `fuzz/`: it is a test
# harness with a binary, it needs a Go toolchain and a BoringSSL checkout to be
# any use, and nothing about it belongs in the workspace's dependency graph.
# See README.md for how to run it.
#
#   RUSTFLAGS='--cfg rusty_tls_handrolled' cargo build --release
#
# On the native backend (ADR-0005, ADR-0006), without RSA signing:
#
#   RUSTFLAGS='--cfg rusty_tls_handrolled --cfg rusty_tls_native_crypto' \
#     cargo build --release --no-default-features --features native

[package]
name = "rusty_tls-bogo"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies.rusty_tls]
path = ".."

[features]
default = ["ring"]
# The engine's `ring` backend: both roles.
ring = ["rusty_tls/handrolled-engine"]
# The first-party backend: both roles, no RSA signing. Needs `--cfg rusty_tls_native_crypto`.
native = ["rusty_tls/native-crypto"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rusty_tls_native_crypto)'] }

[[bin]]
name = "bogo_shim"
path = "src/main.rs"

# Standalone: not a member of the parent, which has no workspace of its own.
[workspace]
