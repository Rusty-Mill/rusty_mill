# Coverage-guided fuzzing for the hand-rolled parsers (rusty_tls#25).
#
# Deliberately a separate, unpublished package rather than part of the main
# crate: it needs nightly (libFuzzer's instrumentation is nightly-only), so
# folding it in would put a nightly requirement on a crate that otherwise
# builds on stable. `tests/handrolled_fuzz.rs` is the stable counterpart that
# runs on every pull request; these targets are for deliberate longer runs.
#
# Both require the same two gates as everything else in `handrolled`:
#
#   RUSTFLAGS='--cfg rusty_tls_handrolled' cargo +nightly fuzz run der_reader
#
# cargo-fuzz appends its own flags to RUSTFLAGS rather than replacing it, so
# the cfg survives.

[package]
name = "rusty_tls-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rusty_tls]
path = ".."
features = ["handrolled-engine"]

[[bin]]
name = "der_reader"
path = "fuzz_targets/der_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certificate"
path = "fuzz_targets/certificate.rs"
test = false
doc = false
bench = false

# Standalone: this is not a member of the parent, which is a single crate with
# no workspace of its own.
[workspace]
