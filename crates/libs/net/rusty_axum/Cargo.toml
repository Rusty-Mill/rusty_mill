[package]
name = "rusty_axum"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "An in-house web framework replacing axum: a router, extractors, responses and SSE over rusty_http's types, runtime-free at its core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
publish = false

[package.metadata.rusty_mill]
layer = "libs"

# Every dependency is justified (the ecosystem's dependency-justification
# convention, see rusty_tls's Cargo.toml).
[dependencies]
# The message types (`Method`, `StatusCode`, `HeaderMap`): one HTTP model in
# the workspace, not a second one from the `http` crate.
rusty_http = { workspace = true, features = ["rusty-tokio"] }
# The server's runtime (accept loop, connection tasks, timers) and TLS. The
# owner's decision (#879): rusty_tokio, never tokio.
rusty_tokio = { workspace = true }
rusty_tls = { workspace = true, features = ["rusty-tokio"] }
# Query-string decoding (`+` as space, `%XX`).
rusty_percent = { workspace = true }
# `Query`, `Path` and `Json` deserialize into the handler's own types, which
# every consumer already derives with serde.
serde = { workspace = true }
serde_json = { workspace = true }
# The `Stream` trait for streamed bodies and SSE: the interop trait every
# consumer's streams already implement. The trait only, not `futures`.
futures-core = { workspace = true }
# Optional (feature `http2`): HTTP/2 on a TLS connection that negotiates
# ALPN `h2`, served by rusty_hyper's per-connection loop (#885). It needs
# rustc 1.88 (rusty_hyper and rusty_h2); the declared 1.87 covers the
# default HTTP/1.1 build, so CI checks `--all-features` here at 1.88.
rusty_hyper = { path = "../rusty_hyper", features = ["rusty-tokio"], optional = true }

[features]
default = []
# HTTP/2 over TLS (ALPN `h2`), next to HTTP/1.1 on the same port.
http2 = ["dep:rusty_hyper"]

[dev-dependencies]
# Test certificates and the client's trust anchor, as rusty_hyper's tests.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# The HTTP/2 client for the `http2` tests, and its reset code.
rusty_hyper = { path = "../rusty_hyper", features = ["rusty-tokio"] }
rusty_h2 = { path = "../rusty_h2" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
