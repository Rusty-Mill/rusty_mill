[package]
name = "rusty_hyper"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "HTTP/2-only client and server packaging over rusty_h2: connect(url) for plain h2c or TLS with ALPN h2, serve(listener, tls, handler), timeouts, keepalive and graceful shutdown. No HTTP/1.1."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
readme = "README.md"
keywords = ["http2", "grpc", "transport"]
categories = ["network-programming"]
publish = false

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
# The whole transport sits behind `rusty-tokio`, the arrangement `rusty_h2`
# and `rusty_tls` already use, so a default build pulls in nothing.
rusty_h2 = { path = "../rusty_h2", optional = true, features = ["rusty-tokio"] }
rusty_tls = { workspace = true, optional = true, features = ["rusty-tokio"] }
rusty_tokio = { workspace = true, optional = true }
# Only for `Url`, so a client takes the same `http(s)://host[:port]/path` the
# rest of the workspace parses.
rusty_http = { workspace = true, optional = true }

[features]
rusty-tokio = [
    "dep:rusty_h2",
    "dep:rusty_tls",
    "dep:rusty_tokio",
    "dep:rusty_http",
]

[[test]]
name = "plain"
required-features = ["rusty-tokio"]

[[test]]
name = "tls"
required-features = ["rusty-tokio"]

[[test]]
name = "interop"
required-features = ["rusty-tokio"]

[[test]]
name = "lifecycle"
required-features = ["rusty-tokio"]

[dev-dependencies]
# Names `TcpListener` and `spawn` in the tests (already a dependency under the feature).
rusty_tokio = { workspace = true }
# Throwaway certificates for the TLS tests; dev-only, never shipped.
rcgen = "0.13"
# Only to name `CertificateDer` in `TrustPolicy::PinnedAnchors`.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# Independent oracles only (never shipped): our server and client are driven
# live by the `h2` crate, as for `rusty_h2`'s own interop tests.
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
