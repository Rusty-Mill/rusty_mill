[package]
name = "adk-agents"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Agents for the Rust ADK: LlmAgent, workflow agents, callbacks, and graph integration"

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
adk-core.workspace = true
adk-graph.workspace = true
adk-models.workspace = true
adk-tools.workspace = true
async-trait.workspace = true
serde_json.workspace = true
rusty_stream = { workspace = true, features = ["futures-core"] }

[dev-dependencies]
adk-sessions.workspace = true
rusty_tokio.workspace = true
