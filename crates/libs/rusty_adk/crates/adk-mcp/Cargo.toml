[package]
name = "adk-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Model Context Protocol transports for the Rust ADK: serve ADK tools, or consume an MCP server's"

[package.metadata.rusty_mill]
layer = "libs"

[features]
default = ["stdio", "http", "client"]
# Serve tools over stdio (newline-delimited JSON-RPC).
stdio = ["tokio/io-std", "tokio/io-util", "tokio/sync"]
# Serve tools over streamable HTTP.
http = ["dep:axum", "dep:rusty_mcp_axum", "tokio/net", "rusty_mcp_server/http"]
# Consume tools from an external MCP server launched as a subprocess.
client = ["dep:rusty-mcp-client", "tokio/sync"]

[dependencies]
adk-core.workspace = true
adk-tools.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tracing.workspace = true
# The workspace's first-party MCP stack: the wire protocol, handshake and
# transports. This crate keeps only the ADK mapping.
rusty_mcp_server = { workspace = true }
rusty-mcp-client = { workspace = true, optional = true }
rusty_mcp_axum = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
# Always needed: tool calls run on the runtime the transport was started on.
tokio = { workspace = true, features = ["rt"] }

# Wire-level MCP conformance suite (design review Tranche 4). Its own
# runner, because the binary doubles as the MCP server the client cases
# launch over stdio.
[[test]]
name = "conformance"
harness = false
required-features = ["stdio", "http", "client"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
adk-sessions.workspace = true
