[package]
name = "adk-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "The ADK 2.0 workflow graph engine: nodes, edges, routes, joins, and interrupts"

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
adk-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusty_log = { workspace = true }
rusty_stream.workspace = true
rusty_tokio.workspace = true

[dev-dependencies]
adk-sessions.workspace = true
