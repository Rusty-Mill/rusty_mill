[package]
name = "adk-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Procedural macros for the Rust ADK: #[adk_tool]"

[package.metadata.rusty_mill]
layer = "libs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["extra-traits"] }

[dev-dependencies]
adk-core.workspace = true
adk-tools.workspace = true
adk-sessions.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
