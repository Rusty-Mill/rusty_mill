[package]
name = "adk-sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Session, artifact, and memory service implementations for the Rust ADK"

[package.metadata.rusty_mill]
layer = "libs"

[features]
default = []
# A durable SessionService backed by SQLite. `bundled` compiles SQLite itself,
# so nothing needs to be installed on the host.
sqlite = ["dep:rusty_sqlite", "dep:rusty_tokio"]

[dependencies]
adk-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
rusty_sqlite = { workspace = true, optional = true }
rusty_tokio = { workspace = true, optional = true }

[dev-dependencies]
rusty_tokio.workspace = true

[package.metadata.docs.rs]
all-features = true
