[package]
name = "weather-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "End-to-end rusty-adk example: tools, an LlmAgent, a routing graph, and human-in-the-loop"

[package.metadata.rusty_mill]
layer = "libs"

[features]
# Use a real model when GOOGLE_API_KEY or ANTHROPIC_API_KEY is set.
live = []

[dependencies]
rusty-adk = { path = "../../crates/rusty-adk" }
serde_json.workspace = true
# Stays on tokio: the live Gemini/Anthropic models in `adk-models` (tier C) use
# reqwest, which needs a tokio runtime (#908).
tokio = { workspace = true, features = ["full"] }
rusty_stream.workspace = true
