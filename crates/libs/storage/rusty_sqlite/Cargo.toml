[package]
name = "rusty_sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "A thin, ergonomic wrapper over rusqlite: cross-platform bundled SQLite, typed FTS5 schema building, and connection/migration lifecycle management."
repository = "https://github.com/baileyrd/rusty_sqlite"
authors = ["rusty_sqlite contributors"]
readme = "README.md"

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
# Bundled SQLite 3.54+ fixes RUSTSEC-2026-0459. Keep the same rusqlite
# major as the workspace and multimodal engine so links=sqlite3 stays unique.
rusqlite = { version = "0.41", features = ["bundled"] }

[features]
default = []
pool = []

[dev-dependencies]
# Exercise the manifest-only SQLx compatibility patch against the same WAL
# database as rusqlite, including the actual linked SQLite version.
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
