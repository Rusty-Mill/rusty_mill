[package]
name = "rusty_rusqlite"
version = "0.0.1"
edition = "2021"
description = "Pure-Rust, from-scratch SQLite reimplementation aiming for rusqlite API parity"
license = "UNLICENSED"
repository = "https://github.com/baileyrd/rusty_-rusqlite"

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
rusty_atomic_file = { workspace = true }

[lib]
name = "rusty_rusqlite"
path = "src/lib.rs"
