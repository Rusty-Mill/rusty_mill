[package]
name = "rusty-search-algolia"
description = "Algolia-backed SearchBackend implementation for rusty_search: a hosted search SaaS"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
rusty-search-core = { workspace = true, features = ["serde-json"] }
async-trait = { workspace = true }
rusty_serde = { workspace = true }
# Algolia's wire protocol goes through reqwest's real-serde-backed
# `.json()` convenience methods, so this stays alongside rusty_serde
# rather than being replaced by it - see convert.rs.
serde_json = { workspace = true }
rusty_request = { workspace = true }
percent-encoding = "2"
rusty_tokio.workspace = true
rusty_uuid.workspace = true

[dev-dependencies]
wiremock = { workspace = true }
