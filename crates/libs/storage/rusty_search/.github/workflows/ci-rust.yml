name: CI

# Runs on every PR and on pushes to the default branch. The "on green CI, merge"
# rule depends on this workflow being the required status check — set it as required
# under branch protection (see references/ci-and-branch-protection.md).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # By default actions/checkout injects an auth header for all of
          # github.com (not just this repo), so private-repo/submodule
          # checkouts keep working. That header breaks Cargo's fetch of
          # *other* github.com repos used as git dependencies (e.g.
          # rusty_serde, pinned by commit since it isn't on crates.io) -
          # "failed to authenticate"/"revision not found" even though the
          # commit is real and rusty_serde is public, regardless of
          # whether Cargo uses its bundled libgit2 or shells out to the
          # system git CLI (CARGO_NET_GIT_FETCH_WITH_CLI). This job
          # doesn't push or need submodules, so it's safe to just not
          # persist the credential in the first place.
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings fail the build, matching the "no unwrap/expect outside tests,
        # clippy clean" standard.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features
