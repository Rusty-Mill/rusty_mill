[package]
name = "rusty_gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign OS windowing, event loop, and clipboard manager crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_gui"
keywords = ["gui", "window", "event", "clipboard", "no-std"]
categories = ["gui", "no-std"]

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
# rusty_wire/rusty_std are now siblings in this same workspace -- plain
# path dependencies.
rusty_wire = { workspace = true }
rusty_std = { workspace = true }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rusty_libc = { workspace = true }

[features]
default = []
