[package]
name = "rusty_log"
version = "0.1.0"
edition = "2021"
# Compiled with a 1.74 rustc: `pin-project-lite` (through `tracing`) does not build on 1.73. The
# `msrv-compile` CI job keeps this honest. `tracing` 0.1 and `tracing-subscriber` 0.3 declare 1.65.
rust-version = "1.74"
description = "The workspace's single door to `tracing`: re-exports the logging and span API, and (feature `subscriber`) the subscriber kit, so that one crate owns the third-party dependency."
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
tracing = { workspace = true }
# Optional: only entry points and the span layers need it.
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
# Re-export `tracing_subscriber` (`EnvFilter`, `fmt`, `Layer`, `Registry`, ...).
subscriber = ["dep:tracing-subscriber"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[[test]]
name = "facade"
required-features = ["subscriber"]
