[package]
name = "rusty_wiremock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A blocking std::net HTTP mock server that answers canned responses, for Rusty Mill test suites"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_wiremock"
keywords = ["mock", "http", "wiremock", "test"]
categories = ["development-tools::testing"]

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]

[features]
default = []
# `canned`: a real, blocking `std::net` mock server that answers a fixed
# sequence of responses -- what the workspace's REST-client test suites
# actually need. Off by default; without it the crate is empty.
std = []
