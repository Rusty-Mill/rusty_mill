[package]
name = "rusty_fedora"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Async client for rusty_fedora_agent's local HTTP API: system status, systemd services, journal reads, dnf updates/install/remove, and allowlisted config file read/write."
repository = "https://github.com/baileyrd/rusty_fedora"
authors = ["rusty_fedora contributors"]
readme = "README.md"
keywords = ["fedora", "systemd", "homelab", "dnf"]
categories = ["api-bindings", "asynchronous"]

[package.metadata.rusty_mill]
layer = "libs"

[dependencies]
# rusty_request on its default `rusty_tokio` backend: this crate and its
# consumer, rusty_homelab_mcp, run on `rusty_tokio` (#905).
rusty_request = { workspace = true }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# The canned-response HTTP mock server the client tests drive against
# (was an identical copy under tests/support/ in each REST-client crate).
rusty_wiremock = { workspace = true, features = ["std"] }
rusty_tokio.workspace = true
