[package]
name = "rusty_uuid"
version = "0.1.0"
edition = "2021"
description = "Minimal, dependency-free UUID v4 generation"
license = "MIT"
repository = "https://github.com/baileyrd/rusty_uuid"

[dependencies]
rusty_rand = { path = "../rusty_rand" }

[features]
# Serialize/Deserialize via this workspace's own dependency-free `rusty_serde`
# (not external `serde`): a `Uuid` becomes its canonical hyphenated lowercase
# string, matching how the external `uuid` crate's own serde support formats
# it for human-readable formats. Off by default so this crate stays
# dependency-free unless a consumer opts in.
rusty_serde = ["dep:rusty_serde"]

[dependencies.rusty_serde]
path = "../rusty_serde/rusty_serde"
version = "0.1.0"
optional = true
default-features = false
