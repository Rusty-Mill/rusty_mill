[package]
name = "rusty-croc"
version = "0.1.0"
edition = "2021"
description = "Rust port of croc (https://github.com/schollz/croc) — secure peer-to-peer file transfer"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
# `raw_value`, not `arbitrary_precision`: the PAKE handshake needs the exact
# decimal text of curve-sized integers (see `pake::Pake::update`), and
# `arbitrary_precision` is a workspace-wide behaviour change once cargo unifies
# features across this monorepo's members.
serde_json = { version = "1", features = ["raw_value"] }
# The workspace's own dependency-free base64 (RFC 4648 standard alphabet),
# for the wire message's byte fields; replaced the external `base64` crate.
rusty_base64 = { path = "../rusty_base64" }
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", features = ["arithmetic"] }
p384 = { version = "0.13", features = ["arithmetic"] }
p521 = { version = "0.13", features = ["arithmetic"] }
crypto-bigint = { version = "0.7", features = ["subtle"] }
subtle = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
md-5 = "0.10"
murmur3 = "0.5"
highway = "1"
if-addrs = "0.13"
socket2 = { version = "0.5", features = ["all"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
qrcode = { version = "0.14", default-features = false }
ignore = "0.4"
zeroize = "1"

[dev-dependencies]
hex = "0.4"

[[bin]]
name = "rusty-croc"
path = "src/main.rs"

[lib]
name = "rusty_croc"
path = "src/lib.rs"
