[package]
name = "rusty_term_l13"
version = "0.1.0"
edition = "2024"
description = "rusty_term's L13 structured side-channel: a private-OSC JSON-RPC transport hosting MCP + LSP/ACP negotiation, addressed against a narrow TerminalState trait rather than rusty_term's own Grid type."
license = "MIT"

[dependencies]
# rusty_lsp is a workspace member (crates/rusty_lsp); resolve it locally
# rather than via git, per ATLAS-RWC-0050 (same-workspace first-party
# dependencies must resolve to the workspace copy, not a remote source).
rusty_lsp = { path = "../../rusty_lsp" }
serde_json = "1"
