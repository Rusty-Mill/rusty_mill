[package]
name = "rusty_http"
version = "0.1.0"
edition = "2021"
description = "One sans-IO HTTP/1.1 message layer and Url type for the rusty ecosystem"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_http"

# The core is sans-IO: it never touches a socket, so it takes nothing to
# parse/serialize HTTP/1.1 heads or frame bodies. Target is zero runtime
# deps here permanently -- adapters (sync std::io, async over rusty_tokio
# behind a feature) are the only place a dependency could ever belong, and
# even those stay optional so a sync-only consumer pulls in nothing extra.
# Per the ecosystem's dependency-justification convention (see rusty_tls's
# Cargo.toml): nothing gets added here without a comment justifying it.
[dependencies]
# Optional (see the `rusty-tokio` feature below): the async adapter drives
# the sans-IO core over `rusty_tokio`'s own `AsyncRead`/`AsyncWrite` traits
# and reactor, mirroring rusty_tls' layout -- the async adapter belongs
# here, behind a feature, not in `rusty_tokio` itself. Pinned to the same
# rev rusty_tls/rusty_request already pin, not just tidy: this crate's own
# `AsyncTransport` is generic over `rusty_tokio`'s `AsyncRead`/`AsyncWrite`,
# and Cargo treats two different revs of the same git dependency as two
# unrelated crates, so trait/type identity has to line up with whatever
# rev a consumer's other rusty_tokio-dependent crates already use.
rusty_tokio = { git = "https://github.com/baileyrd/rusty_tokio", rev = "ac598c930e85460ae3f79328a1d82f28390672f8", optional = true }
# Optional (see the `tokio` feature below): a second async adapter,
# alongside `rusty-tokio`'s, driving the sans-IO core over real crates.io
# tokio's `AsyncRead`/`AsyncWrite` instead -- for a consumer (`rusty_tail`)
# built on real tokio rather than this ecosystem's own runtime. Found
# necessary while planning `rusty_tail`'s migration, not part of the
# original mission plan -- see `ARCHITECTURE.md`. `default-features =
# false` + just `io-util`: this crate only needs the `AsyncRead`/
# `AsyncWrite` traits and their `AsyncReadExt`/`AsyncWriteExt` convenience
# methods, not tokio's own net/rt/macros surface -- the consumer's own
# tokio dependency (already enabling whatever it needs) provides those.
tokio = { version = "1", default-features = false, features = [
    "io-util",
], optional = true }

[dev-dependencies]
# Same crate as the optional dependency above, unified by Cargo's normal
# feature resolution -- but with the runtime/macro features actual tests
# need (`rt`, `macros`) that the shipped optional dependency deliberately
# doesn't ask for, so a consumer enabling just the `tokio` feature never
# pulls those in.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "io-util",
] }

[features]
# Enables `AsyncTransport`, the async counterpart to the sync adapter. Off
# by default so a sync-only consumer (e.g. a `rusty_tail` site once
# migrated) never pulls in `rusty_tokio` and its transitive dependencies.
rusty-tokio = ["dep:rusty_tokio"]
# Enables `tokio_native::AsyncTransport`, the real-tokio counterpart to
# `rusty-tokio`'s adapter. Off by default so a consumer on a different
# runtime (or no async runtime at all) never pulls in real tokio.
tokio = ["dep:tokio"]
# Enables `cookie::CookieJar`, an RFC 6265 cookie jar. Client-only (a
# server has no use for it) and needs no dependency of its own -- off by
# default purely so a server-only consumer's public API surface doesn't
# carry a client concern it'll never use.
cookies = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
