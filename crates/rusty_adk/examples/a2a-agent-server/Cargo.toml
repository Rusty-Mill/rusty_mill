[package]
name = "a2a-agent-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Serves a Rust ADK agent over A2A, so agents in any language can talk to it"

[dependencies]
rusty-adk = { path = "../../crates/rusty-adk", features = ["a2a"] }
adk-a2a.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
axum = "0.7"
