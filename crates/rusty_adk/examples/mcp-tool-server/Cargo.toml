[package]
name = "mcp-tool-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Serves Rust ADK tools over MCP, so ADK agents in any language can call them"

[dependencies]
rusty-adk = { path = "../../crates/rusty-adk" }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
