[package]
name = "weather-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "End-to-end rusty-adk example: tools, an LlmAgent, a routing graph, and human-in-the-loop"

[features]
# Use a real model when GOOGLE_API_KEY or ANTHROPIC_API_KEY is set.
live = []

[dependencies]
rusty-adk = { path = "../../crates/rusty-adk" }
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
