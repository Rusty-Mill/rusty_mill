[package]
name = "adk-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Tool abstraction for the Rust ADK: Tool trait, FunctionTool, ToolContext, toolsets"

[dependencies]
adk-core.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
adk-sessions.workspace = true
