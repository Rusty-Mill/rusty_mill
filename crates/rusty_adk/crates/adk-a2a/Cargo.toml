[package]
name = "adk-a2a"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Serve a Rust ADK agent over the Agent2Agent (A2A) protocol"

[dependencies]
adk-agents.workspace = true
adk-core.workspace = true
adk-graph.workspace = true
adk-runner.workspace = true
async-stream.workspace = true
async-trait.workspace = true
# Inline-data parts cross the ADK/A2A boundary as standard base64; the
# workspace's own dependency-free implementation replaced the external crate.
rusty_base64 = { path = "../../../rusty_base64" }
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
# A merged sibling in this workspace (was a git dependency on
# baileyrd/rusty_a2a before the monorepo merge). `server` is the only
# feature the bridge needs: it implements A2A's `AgentExecutor` trait and
# leaves transport to that crate's `AgentServer`.
rusty_a2a = { workspace = true, default-features = false, features = [
  "server",
  "client",
] }

[dev-dependencies]
adk-models.workspace = true
adk-sessions.workspace = true
adk-tools.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
axum = "0.7"
rusty_a2a = { workspace = true, default-features = false, features = [
  "server",
  "client",
] }
