[package]
name = "adk-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol transports for the Rust ADK: serve ADK tools, or consume an MCP server's"

[features]
default = ["stdio", "http", "client"]
# Serve tools over stdio (newline-delimited JSON-RPC).
stdio = ["dep:tokio", "tokio/io-std", "tokio/io-util"]
# Serve tools over streamable HTTP.
http = ["dep:axum", "dep:tokio", "tokio/net"]
# Consume tools from an external MCP server launched as a subprocess.
client = ["dep:tokio", "tokio/process"]

[dependencies]
adk-core.workspace = true
adk-tools.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
adk-sessions.workspace = true
