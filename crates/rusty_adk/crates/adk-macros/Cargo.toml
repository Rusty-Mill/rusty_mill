[package]
name = "adk-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Procedural macros for the Rust ADK: #[adk_tool]"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
adk-core.workspace = true
adk-tools.workspace = true
adk-sessions.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
