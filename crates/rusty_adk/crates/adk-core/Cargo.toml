[package]
name = "adk-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Core ADK 2.0 data model: Content, Event, EventActions, State, Session, InvocationContext"

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true }
# v4 ids for events/sessions; the workspace's own dependency-free UUID
# crate replaced the external `uuid` (only `new_v4` + `Display` were used).
rusty_uuid = { path = "../../../rusty_uuid" }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
