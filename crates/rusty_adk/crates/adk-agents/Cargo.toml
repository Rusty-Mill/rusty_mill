[package]
name = "adk-agents"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_adk"
description = "Agents for the Rust ADK: LlmAgent, workflow agents, callbacks, and graph integration"

[dependencies]
adk-core.workspace = true
adk-graph.workspace = true
adk-models.workspace = true
adk-tools.workspace = true
async-stream.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tokio-test.workspace = true
adk-sessions.workspace = true
