[package]
name = "mill-term"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Integrated terminal and environment launcher for Rusty Mill (MSYS2/Git Bash replacement)"

[dependencies]
rpath = { path = "../rpath" }
# The actual terminal host: mill-term drives rusty_term::runtime::run
# directly (not by shelling out to its binary) to render a real PTY-backed
# session for the child `rush` process.
rusty_term = { path = "../rusty_term", version = "0.1.1" }
# Real usage: Repository::open/current_branch/status power the startup
# banner's git-status line. rusty_text (rgit's sibling text-processing
# crate) is intentionally NOT a Cargo dependency here -- there's no
# non-contrived use for a sed/awk engine in a terminal launcher's own
# startup logic. Its rsed/rawk binaries are still made reachable (see
# main.rs's `resolve_tool`/`augmented_path`) by locating the sibling
# rusty_text build and prepending it to the child's PATH -- a build-artifact
# lookup, not a Rust API dependency.
rusty_git = { path = "../rusty_git" }
# Already a real (transitive) dependency of rusty_term's own Grid mutex;
# declared directly since main.rs constructs that Mutex itself.
parking_lot = "0.12"

[[bin]]
name = "mill-term"
path = "src/main.rs"
