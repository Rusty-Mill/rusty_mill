[package]
name = "sessionmgr-daemon"
description = "The sessionmgr composition root: supervisor daemon, detached per-session workers, and the CLI client roles. Ships the `sessionmgr` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# A real `[lib]` alongside the `[[bin]]`, following `rusty_prime_agent`'s
# split for the same reason: internal wire handling and path layout must
# be importable by `tests/` and (Phase 4) by the TUI crate without either
# depending on a bin target, which Cargo cannot express.
name = "sessionmgr_daemon"
path = "src/lib.rs"

[[bin]]
# One binary, three roles (daemon / detached worker / client). One
# release artifact, no version skew between "the running daemon" and
# "the worker binary it just spawned", and `current_exe()` is correct by
# construction when the daemon re-execs itself as a worker.
name = "sessionmgr"
path = "src/main.rs"

[dependencies]
sessionmgr-core = { workspace = true }
sessionmgr-protocol = { workspace = true }
sessionmgr-proc = { workspace = true }
sessionmgr-git = { workspace = true }
sessionmgr-pty = { workspace = true }
# The `tui` role is a thin dispatch from this composition root into the
# TUI crate, following PLAN.md's "the TUI is a role of the same binary"
# call. The dependency direction is one-way -- see
# `sessionmgr-tui`'s own crate docs for why it cannot depend back.
sessionmgr-tui = { workspace = true }
rusty_tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
# Embeds `sessionmgr.exe.manifest` (longPathAware, UTF-8 activeCodePage)
# into the built binary. Chosen over `winres`/`embed_resource`
# specifically because it does not shell out to `rc.exe`: it emits the
# manifest via `/MANIFEST` linker options on MSVC (a COFF resource object
# on GNU), so the build does not depend on the Windows SDK being on PATH
# -- true both locally and on `windows-latest` CI. No-op on non-Windows
# targets (see `build.rs`), so it costs nothing on the Linux/MSRV jobs.
embed-manifest = "1.5"
