[package]
name = "rusty-search-algolia"
description = "Algolia-backed SearchBackend implementation for rusty_search: a hosted search SaaS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusty-search-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
rusty_request = { git = "https://github.com/baileyrd/rusty_request", rev = "ebd1fed32dcd6958cab2c9c93ec8c04b3e7fd07a", features = ["tokio"] }
tokio = { workspace = true, features = ["sync", "time"] }
rusty_uuid = { git = "https://github.com/baileyrd/rusty_uuid", rev = "6bc9e04868fd3042d77d3bb757d40363654ebb45" }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
