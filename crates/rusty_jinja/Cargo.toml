[package]
name = "rusty_jinja"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign zero-dependency Jinja2 LLM chat template evaluator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_jinja"
keywords = ["jinja", "template", "chat", "llm", "no-std"]
categories = ["text-processing", "no-std"]

[dependencies]
rusty_regx = { path = "../rusty_regx" }
rusty_json = { path = "../rusty_json" }
rusty_std = { path = "../rusty_std" }

[features]
default = []
