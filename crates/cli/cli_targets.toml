# Known third-party CLI tools `rp-cli setup` can point at a running
# rusty_provider instance -- see ADR-0004
# (docs/adr/0004-cli-target-config-rewriting.md) for why this is a plain
# data file rather than Rust code, and README.md's "Operator CLI" section
# for the `setup list`/`show`/`apply` command docs.
#
# This is the *default* target list, baked into the `rp-cli` binary. Pass
# your own file via `--targets <path>` to add tools not listed here, or to
# fix a `config_path`/field path that's drifted from what's shipped --
# third-party config schemas are outside this repo's control and can
# change between releases of the tool itself.
#
# Each [[targets]] entry:
#   name          -- identifier passed to `setup show`/`setup apply`
#   description   -- one line, shown by `setup list`
#   config_path   -- the tool's own config file; `~` expands to $HOME
#   format        -- "json" or "toml", matching that file's own format
#   [[targets.fields]] -- one or more dotted paths to set inside it:
#     path                  -- dotted key path, e.g. "a.b.c"
#     value                 -- literal, or containing "{{base_url}}" /
#                              "{{api_key_env}}" placeholders
#     requires_api_key_env  -- (optional, default false) skip this field
#                              entirely unless --api-key-env was passed;
#                              `value` should embed the target tool's own
#                              env-var-reference syntax around
#                              "{{api_key_env}}" -- rp-cli only ever writes
#                              the *name* of an env var, never a resolved
#                              secret value.

[[targets]]
name = "opencode"
description = "opencode -- terminal AI coding agent (https://opencode.ai)"
config_path = "~/.config/opencode/opencode.json"
format = "json"

[[targets.fields]]
path = "provider.rusty-provider.npm"
value = "@ai-sdk/openai-compatible"

[[targets.fields]]
path = "provider.rusty-provider.name"
value = "rusty_provider"

[[targets.fields]]
path = "provider.rusty-provider.options.baseURL"
value = "{{base_url}}"

[[targets.fields]]
path = "provider.rusty-provider.options.apiKey"
value = "{env:{{api_key_env}}}"
requires_api_key_env = true

[[targets]]
name = "crush"
description = "Crush -- terminal AI coding agent (https://charm.land/crush)"
config_path = "~/.config/crush/crush.json"
format = "json"

[[targets.fields]]
path = "providers.rusty-provider.type"
value = "openai-compat"

[[targets.fields]]
path = "providers.rusty-provider.base_url"
value = "{{base_url}}"

[[targets.fields]]
path = "providers.rusty-provider.api_key"
value = "${{api_key_env}}"
requires_api_key_env = true
