# cargo-deny configuration — supply-chain hygiene for rush's dependency
# graph. rush's five first-party sibling crates (rusty_regx, rusty_lines,
# rusty_libc, rusty_win32, rpath — all from the same author) migrated from
# git-pinned dependencies to workspace `path` dependencies with real
# `version =` fields under ADR-0002's same-workspace-source policy; see
# Cargo.toml. Local/manual tool only -- not run in CI (see nexus/deny.toml's
# header for why enforcing it workspace-wide was attempted and reverted).
# Run locally with `cargo deny check`.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]
# criterion (benches/shell_bench.rs, dev-only — never shipped in the
# actual rush binary) pulls in `regex` transitively, which the [bans]
# `deny` list below bans for the *product* dependency graph (the `=~`
# engine swap, C56). Excluded here rather than dropping the ban, since
# the ban's whole point is that rush's own shipped code never
# reintroduces `regex` — a benchmark harness dependency doing so isn't
# the same risk.
exclude = ["criterion"]

[advisories]
# Fail the build on a known security advisory (RUSTSEC) for anything in
# the dependency graph, including transitive deps of the sibling crates.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # rsa 0.9.x (Marvin Attack timing side-channel): present in the shared
    # workspace Cargo.lock via jsonwebtoken's `rust_crypto` feature in
    # agentgateway-auth (rusty_agent_gateway) and rusty-mcp's `jwt`
    # feature, not a rush dependency itself -- cargo-deny resolves the
    # whole workspace graph regardless of which crate's config invokes it.
    # Reviewed: both crates' production code only calls
    # `jsonwebtoken::decode`/`DecodingKey` (signature *verification*,
    # public-key only); `encode`/`EncodingKey` (the private-key signing
    # path the advisory concerns) appears only in each crate's own test
    # suite, never in shipped code. The Marvin Attack leaks private-key
    # bits through timing in RSA decrypt/sign operations; verifying a
    # signature with the public modulus/exponent has no secret-dependent
    # computation to leak. Revisit once a patched `rsa` release exists.
    { id = "RUSTSEC-2023-0071", reason = "RS256 verify-only usage (DecodingKey/decode); the private-key sign/decrypt path the Marvin Attack targets is never exercised in production code" },
]

[licenses]
# rush itself is MIT (Cargo.toml). Allow the licenses actually present in
# the graph today (MIT, Apache-2.0) plus a couple of common permissive
# ones likely to show up as the dependency graph grows; anything else
# fails the build rather than silently shipping an unreviewed license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate in the graph aren't an error by
# default (common and often unavoidable with git deps), just surfaced —
# tighten to "deny" once the graph is small enough to keep at exactly one
# version per crate.
multiple-versions = "warn"
# rush's five sibling crates (rusty_regx, rusty_lines, rusty_libc,
# rusty_win32, rpath) are workspace `path` dependencies with real
# crates.io-style `version =` fields (see Cargo.toml) since the ADR-0002
# same-workspace-source migration completed -- no longer an exception to
# this lint.
wildcards = "deny"
# A crate rush deliberately dropped and never wants back (the `=~` engine
# swap, C56 — see CHANGELOG.md "Changed: `=~` regex engine replaced").
deny = [
    { name = "regex" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
