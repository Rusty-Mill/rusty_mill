[package]
name = "rusty_simd"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A zero-dependency SIMD (AVX2/NEON/FMA) accelerated block dequantization kernel library for LLM and Whisper inference"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_simd"
keywords = ["simd", "avx2", "dequantization", "gguf", "no-deps"]
