[package]
name = "agentgateway-mcp"
version = "0.1.0"
description = "MCP federation for rusty_agent_gateway"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]
publish = false

# De-inherited from rusty_agent_gateway's own former `[workspace.lints]`:
# this workspace root's `[workspace.lints]` is rustils' (a weaker
# `unsafe_code = "warn"`, and none of the rest), so these are written
# literally rather than silently downgraded.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
agentgateway-config = { workspace = true }
agentgateway-core = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["rt", "macros", "process", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
cel = { workspace = true }
http = { workspace = true }
# The `mcpGuardrails` wire protocol. The messages are written by hand rather
# than generated, so no `protoc` is needed to build this crate.
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
# Spans for MCP requests, and the attributes a guardrail writes on them.
rusty-mcp = { workspace = true, default-features = false, features = ["otel"] }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
# The transport under `mutating_client`, which applies a guardrail's
# `headerMutation` to the upstream call.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
thiserror = "2"
tracing = { workspace = true }
process-wrap = { version = "9", features = ["tokio1"] }

[dev-dependencies]
# `http2` is dev-only on purpose: the gateway speaks gRPC as a *client*, and
# the scripted processor in the tests is the only thing here that serves it.
axum = { workspace = true, features = ["http2"] }
http-body-util = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
