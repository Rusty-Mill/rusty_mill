[package]
name = "agentgateway-tls"
version = "0.1.0"
description = "TLS termination for rusty_agent_gateway, over rusty_tls"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]
publish = false

# De-inherited from rusty_agent_gateway's own former `[workspace.lints]`:
# this workspace root's `[workspace.lints]` is rustils' (a weaker
# `unsafe_code = "warn"`, and none of the rest), so these are written
# literally rather than silently downgraded.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
agentgateway-config = { workspace = true }
agentgateway-core = { workspace = true }
# A merged sibling in this workspace. It used to be pinned to a commit
# rather than a tag, because the async server adapter
# (`TlsAcceptor::accept_async`) was not in the newest tag, v0.9.0 -- a
# concern a path dependency settles outright.
rusty_tls = { workspace = true, features = ["rusty-tokio"] }
rusty_tokio = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
rustls-pemfile = "2"
# A direct rustls dependency, against this ecosystem's "consumers import
# rusty_tls, never rustls" rule -- and the one place it has to be broken.
# rusty_tls does not install a CryptoProvider, so rustls falls back to
# inferring one from crate features. That works while `ring` is the only
# provider in the graph, but this workspace also pulls `aws-lc-rs` in through
# reqwest, and rustls panics at the first handshake rather than choosing. The
# version must track rusty_tls' own (0.23) so this is the same crate instance
# and not a second copy.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
rcgen = "0.13"
