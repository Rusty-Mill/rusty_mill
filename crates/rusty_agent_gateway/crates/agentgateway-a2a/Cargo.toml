[package]
name = "agentgateway-a2a"
version = "0.1.0"
description = "Agent2Agent (A2A) method gating and agent-card discovery for rusty_agent_gateway"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]
publish = false

# De-inherited from rusty_agent_gateway's own former `[workspace.lints]`:
# this workspace root's `[workspace.lints]` is rustils' (a weaker
# `unsafe_code = "warn"`, and none of the rest), so these are written
# literally rather than silently downgraded.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
agentgateway-config = { workspace = true }
# Types only. `default-features = false` leaves the agent harness, the
# JSON-RPC client and the gRPC binding out of the graph -- which is what keeps
# this crate's `axum` 0.7, `tonic` and `reqwest` 0.12 from colliding with the
# workspace's own versions. The gateway fronts agents; it does not become one.
rusty_a2a = { workspace = true, default-features = false }
http = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
