[package]
name = "agentgateway-proxy"
version = "0.1.0"
description = "HTTP reverse proxying for rusty_agent_gateway host backends"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]
publish = false

# De-inherited from rusty_agent_gateway's own former `[workspace.lints]`:
# this workspace root's `[workspace.lints]` is rustils' (a weaker
# `unsafe_code = "warn"`, and none of the rest), so these are written
# literally rather than silently downgraded.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
agentgateway-config = { workspace = true }
cel = { workspace = true }
serde_json = { workspace = true }
agentgateway-core = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "client"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
bytes = { workspace = true }
tokio = { workspace = true, features = ["time"] }
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
