[package]
name = "agentgateway-auth"
version = "0.1.0"
description = "JWT authentication policy for rusty_agent_gateway"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]
publish = false

# De-inherited from rusty_agent_gateway's own former `[workspace.lints]`:
# this workspace root's `[workspace.lints]` is rustils' (a weaker
# `unsafe_code = "warn"`, and none of the rest), so these are written
# literally rather than silently downgraded.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
agentgateway-config = { workspace = true }
rusty-mcp = { workspace = true, default-features = false, features = ["jwt"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
http = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = { workspace = true }
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rusty_base64 = { path = "../../../rusty_base64" }
rsa = "0.9"
rand = "0.8"
tempfile = "3"
