# Pinned to "stable" for consistency of intent with CI: CI's
# dtolnay/rust-toolchain@stable step runs from the repo root and never reads
# this subdirectory's rust-toolchain.toml (rustup toolchain-file discovery
# only walks upward from cwd), so this file cannot actually force CI onto a
# specific version — pinning a literal version here would just be a promise
# this crate can't keep. "stable" documents that the intended target matches
# what CI runs, matching the pattern used by crates/nexus and crates/rusty_key.
#
# If CI is ever changed to invoke cargo from within this crate directory,
# revisit pinning an exact version here per the history below:
# clippy 1.97 once rejected an `unnecessary_sort_by` that 1.94 accepted, so a
# "clippy clean" run locally passed while CI failed on the same commit.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
