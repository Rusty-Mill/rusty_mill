# cargo-deny configuration (ADR-0029). The license gate protects the project's
# permissive (MIT/Apache-2.0) posture: a copyleft transitive dependency — the
# reason opendocswork-mcp was rejected in favour of rmcp — fails the build.
#
# Run locally / in CI: `cargo deny check licenses`

[licenses]
# Only permissive licenses are allowed in the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
# Copyleft licenses are not in `allow`, so they fail the gate by omission.
confidence-threshold = 0.9

[bans]
# Informational; the license gate is the load-bearing check here.
multiple-versions = "warn"

[advisories]
# Security advisories are reported; tune to "deny" once a baseline is clean.
yanked = "warn"
