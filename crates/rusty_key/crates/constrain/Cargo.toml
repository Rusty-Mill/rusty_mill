[package]
name = "rk-constrain"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
rk-config.workspace = true
rk-observe.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio.workspace = true

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
