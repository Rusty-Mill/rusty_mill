[package]
name = "rk-feed"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
rk-config.workspace = true
rk-observe.workspace = true
rk-constrain.workspace = true
aisdk.workspace = true
async-trait.workspace = true
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# URL validation for egress (scheme/host/port); the workspace's own `url`
# port replaced the external crate. `reqwest` still pulls external `url`
# transitively -- this only retires the direct edge.
rusty_url = { path = "../../../rusty_url" }
# Pinned: libsqlite3-sys 0.38 (rusqlite 0.40) build script uses the unstable
# `cfg_select`, which does not compile on stable. 0.32 bundles cleanly.
rusqlite = { version = "0.32", features = ["bundled"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tokio.workspace = true

[features]
# Ships the FaultyTool fixture for the chaos / resilience eval tier (eval-plan §7).
chaos = []
# Ships the deterministic HashEmbedder fixture for offline semantic-recall tests.
fake-embed = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
