[package]
name = "rk-compose"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
rk-config.workspace = true
rk-observe.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
toml.workspace = true
tokio = { workspace = true, features = ["process", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# De-inherited from rusty_key's own former `[workspace.lints]`: this
# workspace root's `[workspace.lints]` is rustils' (`unsafe_code = "warn"`),
# which is weaker than rusty_key's own `"forbid"`.
[lints.rust]
unsafe_code = "forbid"
