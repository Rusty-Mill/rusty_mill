[package]
name = "rk-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rk-config.workspace = true
rk-constrain.workspace = true
rk-observe.workspace = true
rk-feed.workspace = true
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["sync", "time", "process"] }
rmcp = { version = "0.9", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Expose the in-process FakeMcpClient for downstream offline tests.
fake = []
# The rmcp-backed transport adapters (ADR-0029). Off by default so the offline
# core builds without the external SDK; CI/release builds enable it.
rmcp = ["dep:rmcp"]

[lints]
workspace = true
