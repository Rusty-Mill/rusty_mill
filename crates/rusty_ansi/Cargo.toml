[package]
name = "rusty_ansi"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A zero-allocation, no_std VT/CSI/OSC ANSI escape sequence parser core for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_ansi"
keywords = ["ansi", "vt100", "terminal", "parser", "no-deps"]
categories = ["text-processing", "no-std"]

[dependencies]
unicode-width = "0.2"

[features]
default = ["std"]
std = ["unicode-width/std"]

[dev-dependencies]
