[package]
name = "rusty-mcp"
version = "0.5.0"
description = "Reusable scaffold for building Model Context Protocol servers in Rust (spec 2026-07-28)"
keywords = ["mcp", "model-context-protocol", "ai", "llm"]
categories = ["network-programming", "development-tools"]
readme = "../../README.md"
# Not published to crates.io. Consume it via a git or path dependency.
publish = false
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mcp"
authors = ["rusty_mcp contributors"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[dependencies]
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
    "request-state",
    "elicitation",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# Pagination cursors are base64 so clients treat them as opaque.
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-util = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusty_url = { path = "../../../rusty_url" }
tower-layer = "0.3"
# `rust_crypto` keeps the build pure-Rust; `aws_lc_rs` would need a C toolchain.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
percent-encoding = "2"
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
rsa = "0.9"
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util"] }

[features]
default = []
# A JWKS-backed JWT validator for the authorization layer.
jwt = ["dep:jsonwebtoken", "dep:reqwest", "tokio/sync"]
# Export spans to an OpenTelemetry collector over OTLP.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
