[package]
name = "rusty-mcp-demo"
version = "0.5.0"
description = "Example MCP server built on the rusty-mcp scaffold"
publish = false
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mcp"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"
unwrap_used = "warn"

[[bin]]
name = "rusty-mcp-demo"
path = "src/main.rs"

[dependencies]
rusty-mcp = { path = "../rusty-mcp", version = "0.5.0" }
rmcp = { version = "3.1", default-features = false, features = ["server", "macros", "schemars"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dev-dependencies]
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "elicitation",
] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util"] }
