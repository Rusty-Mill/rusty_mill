[package]
name = "rusty_rag"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Sovereign AI Retrieval-Augmented Generation (RAG) & Question Answering Engine for Rusty Mill"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
keywords = ["rag", "ai", "qa", "search", "sovereign"]
categories = ["science"]

# Split out of `rusty_ansder` (previously "RAG engine and ASN.1 DER parser"
# bundled in one crate under a portmanteau name) -- this half only ever
# used `rusty_simd`, not the `rusty_wire`/`rusty_regx`/`rusty_json`/
# `rusty_std` also declared there, none of which this module's source
# actually referenced.
[dependencies]
rusty_simd = { path = "../rusty_simd", default-features = false }

[features]
default = ["std"]
std = ["rusty_simd/std"]
