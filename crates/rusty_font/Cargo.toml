[package]
name = "rusty_font"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign TrueType/OpenType font table parser and SIMD-accelerated glyph rasterizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_font"
keywords = ["font", "truetype", "rasterizer", "ttf", "no-std"]
categories = ["text-processing", "no-std"]

[dependencies]
# rusty_wire/rusty_std are now siblings in this same workspace -- plain
# path dependencies. rusty_simd remains a pinned git dep (a `git = "..."`
# dependency clones only that one repository, so a sibling checkout
# doesn't exist for any external consumer) until it's merged in too.
rusty_wire = { path = "../rusty_wire" }
rusty_simd = { git = "https://github.com/baileyrd/rusty_simd", rev = "38d3fae033d716d8616ef37f087004816d055264" }
rusty_std = { path = "../rusty_std" }

[features]
default = []
