[package]
name = "rusty_base64"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Hand-rolled, dependency-free Base64 (RFC 4648) -- standard and URL-safe alphabets, encode and decode -- extracted from rusty_oauth's own encoding module so rusty_acp, rusty-mcp, and rusty_a2a can depend on it instead of the external base64 crate."
license = "MIT OR Apache-2.0"

