[package]
name = "sessionmgr-agents"
description = "Per-agent-CLI adapters: launch_args and tier-3 needs_input pattern matching for Claude Code, Codex, and Gemini CLI, against a vt100-rendered screen per ADR-0002. Gemini's adapter is built from its own shipped source and hooks docs rather than a live-verified session -- no credentials on this machine to run one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sessionmgr_agents"
path = "src/lib.rs"

[dependencies]
sessionmgr-core = { workspace = true }
vt100 = { workspace = true }
serde_json = { workspace = true }
