[package]
name = "sessionmgr-tui"
description = "The sessionmgr TUI: a grid of session panes over the daemon's public socket. Depends on sessionmgr-protocol only -- never sessionmgr-proc or sessionmgr-agents -- so a UI that cannot name a process type cannot accidentally spawn one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sessionmgr_tui"
path = "src/lib.rs"

[dependencies]
sessionmgr-protocol = { workspace = true }
rusty_tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
vt100 = { workspace = true }
tui-term = { workspace = true }
