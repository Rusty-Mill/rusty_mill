[package]
name = "agentgateway"
version = "0.1.0"
description = "An AI-native gateway for MCP, speaking agentgateway's configuration"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "agentgateway"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agentgateway-a2a = { workspace = true }
agentgateway-auth = { workspace = true }
agentgateway-config = { workspace = true }
agentgateway-core = { workspace = true }
agentgateway-llm = { workspace = true }
agentgateway-mcp = { workspace = true }
agentgateway-proxy = { workspace = true }
agentgateway-tls = { workspace = true }

rmcp = { workspace = true, features = [
    "server",
    "transport-streamable-http-server",
] }
rusty-mcp = { git = "https://github.com/baileyrd/rusty_mcp", tag = "v0.4.1", default-features = false, features = ["otel"] }
axum = { workspace = true, features = ["json"] }
tower-layer = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-util = { workspace = true }
tower-service = "0.3"
http = { workspace = true }
http-body-util = { workspace = true }
# `http2` is load-bearing and must not be "tidied away": the TLS listener
# advertises `h2` over ALPN, and a server that negotiates a protocol it cannot
# speak closes the connection after a successful handshake -- which looks like
# a network fault rather than a missing feature flag.
#
# No test can protect this. Cargo unifies features across a build and the dev
# dependencies enable `hyper/http2` anyway, so the test binary always has it
# while the shipped binary has only what is listed here. Verify with curl
# against the built binary, not with `cargo test`.
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio", "server", "service"] }
tower = { workspace = true, features = ["util"] }
bytes = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
prost = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
prost-types = { workspace = true }
http-body-util = { workspace = true }
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.22"
rsa = "0.9"
rand = "0.8"
tempfile = "3"
rcgen = "0.13"
# `flock`, for the port bands in tests/common. A safe wrapper, which matters
# here: the workspace forbids `unsafe`, tests included.
rustix = { version = "1", features = ["fs"] }
# `http2` is dev-only: the scripted gRPC processor in `mcp_guardrails.rs`
# is the only thing here that serves h2. The gateway is a gRPC *client*.
axum = { workspace = true, features = ["json", "tokio", "http1", "http2"] }
