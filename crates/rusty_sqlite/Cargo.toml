[package]
name = "rusty_sqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "A thin, ergonomic wrapper over rusqlite: cross-platform bundled SQLite, typed FTS5 schema building, and connection/migration lifecycle management."
repository = "https://github.com/baileyrd/rusty_sqlite"
authors = ["rusty_sqlite contributors"]
readme = "README.md"

[dependencies]
# Bumped from 0.31 (-> libsqlite3-sys ^0.28.0), then again from 0.32.1
# (-> libsqlite3-sys ^0.30.1): same `links = "sqlite3"` uniqueness
# constraint as before (Cargo.lock's `links` check considers every
# declared optional dependency reachable in the graph, not just the ones
# actually activated for a given build -- see the prior note this comment
# replaces), now driven by the nexus merge, which needs rusqlite 0.39 for
# a feature nexus's own storage layer requires. 0.39 (-> libsqlite3-sys
# ^0.37.0) still resolves to one shared libsqlite3-sys version across
# rusty_acp's `sqlx`-sqlite path, inventory-core, and nexus's own
# consumers -- verified via `cargo metadata --all-features`.
rusqlite = { version = "0.39", features = ["bundled"] }

[features]
default = []
pool = []

[dev-dependencies]
tempfile = "3"
