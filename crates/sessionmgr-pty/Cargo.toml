[package]
name = "sessionmgr-pty"
description = "PTY adapter for sessionmgr: hosts a session's process on a real terminal (ConPTY on Windows) via rustils' platform Pty capability."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sessionmgr_pty"
path = "src/lib.rs"

[dependencies]
# `rustils`' portable `Pty`/`PtyMaster` capability, with the ConPTY
# backend on Windows and the `openpty` backend on Linux.
#
# Pinned to the **same rev `rusty_tokio` already resolves to**
# (verified during Phase 0's dependency check). A second, differing pin
# would build two copies of the platform layer into one binary, with two
# sets of handle types that do not interoperate.
#
# Deliberately not `portable-pty`: this project already has a PTY
# implementation in its own dependency graph, and adding a second one
# would mean two ConPTY wrappers with different lifetime semantics.
platform = { git = "https://github.com/baileyrd/rustils", rev = "ce9259d465ef7d9c49c27542a98745ee7b26d249" }

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { git = "https://github.com/baileyrd/rustils", rev = "ce9259d465ef7d9c49c27542a98745ee7b26d249" }

[target.'cfg(windows)'.dependencies]
platform-windows = { git = "https://github.com/baileyrd/rustils", rev = "ce9259d465ef7d9c49c27542a98745ee7b26d249" }
