[package]
name        = "nexus-formats"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
publish.workspace   = true
description = "Nexus file-format library: markdown, canvas, bases, config parsing (PRD 06)"

[dependencies]
thiserror  = "2.0"
serde      = { workspace = true }
serde_json = { workspace = true }
serde_norway  = { workspace = true }
toml       = "1.1"
comrak     = { workspace = true }
sha2       = { workspace = true }
regex-lite = { workspace = true }
chrono     = { workspace = true }
csv        = { workspace = true }
zip        = { workspace = true }
uuid       = { workspace = true }
tracing    = { workspace = true }
nexus-plugins = { path = "../nexus-plugins" }
nexus-types = { path = "../nexus-types" }
ts-rs      = { workspace = true, optional = true, features = ["serde-json-impl"] }
schemars   = { workspace = true, optional = true }

[features]
ts-export = ["dep:ts-rs", "dep:schemars"]

[dev-dependencies]
tempfile = { workspace = true }
