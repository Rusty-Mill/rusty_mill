[package]
name = "nexus-panic-log"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local panic hook that appends to ~/.nexus-shell/logs/panic.log with 1 MB rotation."

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
chrono = { workspace = true }
dirs = "5"

[target.'cfg(windows)'.dependencies]
# Restricting the panic log's ACL to the owner (SetFileSecurityW +
# ConvertStringSecurityDescriptorToSecurityDescriptorW) needs
# Win32_Security_Authorization on top of the workspace's default
# windows-sys feature set.
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = { workspace = true }
