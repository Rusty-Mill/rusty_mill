[package]
name = "nexus-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AI-native memory layer for Nexus: episodic, semantic, and procedural stores"

[dependencies]
nexus-plugin-api = { path = "../nexus-plugin-api" }
nexus-kernel = { path = "../nexus-kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
thiserror = "2.0"
tracing = { workspace = true }
reqwest = { workspace = true }
nexus-plugins = { path = "../nexus-plugins" }
# `chrono-impl`/`uuid-impl` are needed too: `Memory` (model.rs) carries
# `DateTime<Utc>` and `Uuid` fields and is embedded in the `ts-export`
# IPC types below (e.g. `ImportArgs::records: Vec<Memory>`), but this
# crate's own `Memory`/`MemoryType`/`MemoryStatus` never actually derived
# `TS`/`JsonSchema` before the nexus/rusty_mill merge -- a latent gap this
# crate's own `scripts/check_ipc_drift.sh` never exercised (it isn't in
# that script's per-crate build list), only surfaced once rusty_mill's own
# CI's `--all-features` build actually compiled it.
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "chrono-impl", "uuid-impl"] }
schemars = { workspace = true, optional = true, features = ["chrono04", "uuid1"] }

[features]
# Emit JSON Schema + TypeScript bindings for the IPC arg types (off by
# default so normal builds don't pull ts-rs / schemars). Mirrors the
# per-service `ts-export` feature used across the workspace.
ts-export = ["dep:ts-rs", "dep:schemars"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
nexus-memory-hub = { path = "../nexus-memory-hub" }
