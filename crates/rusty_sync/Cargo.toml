[package]
name = "rusty_sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign atomic spinlock, spinlock-protected MPMC channel, and ring buffer crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_sync"
keywords = ["sync", "spinlock", "channel", "ringbuffer", "no-std"]
categories = ["concurrency", "no-std"]

[dependencies]
rusty_std = { path = "../rusty_std" }

[features]
default = []
