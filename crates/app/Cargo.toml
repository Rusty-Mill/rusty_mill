[package]
name = "rk-app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rk-config.workspace = true
rk-observe.workspace = true
rk-constrain.workspace = true
rk-feed.workspace = true
rk-kernel.workspace = true
rk-compose.workspace = true
rk-mcp.workspace = true
# `openaicompatible` references `providers::openai` internally, so `openai`
# must be enabled alongside it (aisdk 0.5.2 feature-wiring quirk).
aisdk = { workspace = true, features = ["openaicompatible", "openai"] }
anyhow = "1"
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rmcp = { version = "0.9", features = ["server", "transport-io"], optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
futures = { version = "0.3", optional = true }

[features]
# MCP server mode (`rusty-keys --mcp`): expose Session::send() over JSON-RPC
# (ADR-0029). Off by default (pulls rmcp); enable for IDE integration.
mcp-server = ["dep:rmcp", "rk-mcp/rmcp"]
# Web gateway (`rusty-keys --gateway`): axum HTTP/SSE over Session::send()
# (PRD 06). Off by default (pulls axum); enable for web/desktop clients.
gateway = ["dep:axum", "dep:tower", "dep:tower-http", "dep:futures", "tokio/net"]

[[bin]]
name = "rusty-keys"
path = "src/main.rs"

[dev-dependencies]
rk-kernel = { workspace = true, features = ["fake"] }
rk-feed = { workspace = true, features = ["chaos", "fake-embed"] }
rk-mcp = { workspace = true, features = ["fake"] }
serde_json.workspace = true
async-trait.workspace = true

[lints]
workspace = true
