[package]
name = "inventory-cli"
description = "Search every AI agent and IDE conversation on your machine, from the terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/baileyrd/rusty_inventrory"

[[bin]]
name = "inv"
path = "src/main.rs"

[dependencies]
inventory-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
