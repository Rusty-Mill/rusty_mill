[package]
name = "inventory-core"
description = "Local-first index over the conversation history AI coding tools write to disk"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/baileyrd/rusty_inventrory"

[dependencies]
anyhow.workspace = true
thiserror = "2"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
aes-gcm = "0.10"
directories = "5"
walkdir = "2"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
tempfile = "3"

# The keychain backend is per-platform.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Secret Service, not the kernel keyring. `linux-native` (keyutils) does not
# survive a reboot, which would silently regenerate the key and leave the
# existing index permanently unopenable. Costs a `libdbus-1-dev` build
# dependency; a headless machine can supply INVENTORY_INDEX_KEY instead.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
