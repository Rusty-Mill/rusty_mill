[package]
name = "rusty_err_derive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Proc-macro #[derive(Error)] for rusty_err, matching thiserror's #[error(\"...\")] / #[from] shape"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_err"
keywords = ["error", "derive", "proc-macro"]
categories = ["rust-patterns"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
