[package]
name = "platform-async-linux"
description = "Linux backend for platform-async: reuses platform-linux's spawn, adds a pidfd + epoll async wait path. Unsafe confined to sys/."
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
# `rustils` is a separate repo outside this monorepo's consolidation
# scope -- stays a pinned git dependency, matching platform-async's own.
platform = { git = "https://github.com/baileyrd/rustils", rev = "83ab7a9ed2c4ffe90df9acdd6688cc74b7aed694" }
platform-linux = { git = "https://github.com/baileyrd/rustils", rev = "83ab7a9ed2c4ffe90df9acdd6688cc74b7aed694" }
platform-async = { path = "../platform-async" }
reactor-core = { path = "../reactor-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
