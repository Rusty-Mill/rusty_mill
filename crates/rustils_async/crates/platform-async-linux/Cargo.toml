[package]
name = "platform-async-linux"
description = "Linux backend for platform-async: reuses platform-linux's spawn, adds a pidfd + epoll async wait path. Unsafe confined to sys/."
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
# `rustils` is a workspace sibling (`crates/rustils`) -- path dependency,
# matching platform-async's own.
platform = { path = "../../../rustils/crates/platform" }
platform-linux = { path = "../../../rustils/crates/platform-linux" }
platform-async = { path = "../platform-async" }
reactor-core = { path = "../reactor-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
