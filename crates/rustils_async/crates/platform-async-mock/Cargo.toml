[package]
name = "platform-async-mock"
description = "In-memory async backend for platform-async, wrapping rustils' platform-mock. For consumer tests without a real OS reactor."
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
# `rustils` is a workspace sibling (`crates/rustils`) -- path dependency,
# matching platform-async's own.
platform = { path = "../../../rustils/crates/platform" }
platform-mock = { path = "../../../rustils/crates/platform-mock" }
platform-async = { path = "../platform-async" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
