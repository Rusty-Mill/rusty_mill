[package]
name = "platform-async"
description = "Async trait counterparts to rustils::platform. Starts with the process domain only. No I/O, no unsafe."
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"

[dependencies]
# One source of truth for the sync types this workspace builds an async
# layer above. Was a rev-pinned git dependency while `rustils` lived in
# its own repo; it is a workspace sibling now (`crates/rustils`), so this
# is a path dependency like every other in-tree crate.
platform = { path = "../../../rustils/crates/platform" }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
