[package]
name = "ts-control"
description = "ts2021 control-plane client: Noise IK channel, registration, netmap long-poll"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ts-types.workspace = true
ts-key.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
h2.workspace = true
bytes.workspace = true
http.workspace = true
chacha20poly1305.workspace = true
blake2.workspace = true
hkdf.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "process"] }
