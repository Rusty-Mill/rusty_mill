[package]
name = "rp-router"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rp-core.workspace = true
rp-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror = "2"
anyhow.workspace = true
tracing.workspace = true
futures.workspace = true
prometheus.workspace = true
rusty_sqlite = { path = "../../../rusty_sqlite" }
# Shared exponential-backoff delay math, also used by rusty_request's and
# rusty_acp's own retry policies -- `jitter: 0.0` reproduces the plain
# doubling-capped-at-max formula webhook.rs's retry loop used to hand-roll.
rusty_retry = { path = "../../../rusty_retry" }
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
reqwest.workspace = true
regex.workspace = true
ring.workspace = true

[dev-dependencies]
async-trait.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["test-util"] }
