[package]
name = "rusty_oauth"
version = "0.1.0"
edition = "2021"
description = "A hand-rolled, zero-dependency OAuth 2.0 / 2.1 protocol implementation for Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_oauth"
readme = "README.md"
keywords = ["oauth", "oauth2", "pkce", "jwt", "authentication"]
categories = ["authentication", "web-programming"]

[dependencies]
rusty_base64 = { path = "../rusty_base64" }
rusty_rand = { path = "../rusty_rand" }
rusty_rsa = { path = "../rusty_rsa" }
# `Value` + JSON parser/writer for token/metadata/JWK responses and JWT
# header/claims. This crate carried its own hand-rolled copy (deliberately
# no `serde`) until `rusty_json` grew a serde-free `Value` surface of its
# own; `default-features = false` keeps that same no-`serde` stance.
rusty_json = { path = "../rusty_json", default-features = false, features = [
    "std",
] }

[dev-dependencies]
