[package]
name = "rusty_voice"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A sovereign voice-to-text application leveraging rusty_whisper and rusty_audio built exclusively with Rusty Mill libraries"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_voice"
keywords = ["voice", "whisper", "speech", "sovereign", "audio"]
categories = ["command-line-utilities", "multimedia"]

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty-whisper = { workspace = true }
rusty_audio = { workspace = true }
rusty_std = { workspace = true }
rusty_tokio = { workspace = true }
rusty_json = { workspace = true }
rusty_err = { workspace = true }
rusty_gui = { workspace = true }
rusty_gpu = { workspace = true }
rusty_font = { workspace = true }

[features]
default = []
