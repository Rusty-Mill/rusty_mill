[package]
name = "rusty_gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign CPU software framebuffer presenter and SIMD vector rasterizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_gpu"
keywords = ["gpu", "framebuffer", "rasterizer", "graphics", "no-std"]
categories = ["graphics", "no-std"]

[dependencies]
# rusty_std is now a sibling in this same workspace -- plain path
# dependency. rusty_simd remains a pinned git dep (a `git = "..."`
# dependency clones only that one repository, so a sibling checkout
# doesn't exist for any external consumer) until it's merged in too.
rusty_simd = { git = "https://github.com/baileyrd/rusty_simd", rev = "38d3fae033d716d8616ef37f087004816d055264" }
rusty_gui = { path = "../rusty_gui", version = "0.1.0" }
rusty_font = { path = "../rusty_font", version = "0.1.0" }
rusty_std = { path = "../rusty_std" }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { path = "../rusty_win32", version = "0.1.0" }

[features]
default = []
