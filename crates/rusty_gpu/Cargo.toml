[package]
name = "rusty_gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign CPU software framebuffer presenter and SIMD vector rasterizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_gpu"
keywords = ["gpu", "framebuffer", "rasterizer", "graphics", "no-std"]
categories = ["graphics", "no-std"]

[dependencies]
# rusty_simd and rusty_std are workspace members -- plain path
# dependencies, per ATLAS-RWC-0050 (same-workspace first-party
# dependencies must resolve to the workspace copy, not a remote source).
rusty_simd = { path = "../rusty_simd" }
rusty_gui = { path = "../rusty_gui", version = "0.1.0" }
rusty_font = { path = "../rusty_font", version = "0.1.0" }
rusty_std = { path = "../rusty_std" }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { path = "../rusty_win32", version = "0.1.0" }

[features]
default = []
