[package]
name = "sessionmgr-core"
description = "Pure domain logic for sessionmgr: session state machine, identifiers, and crash-recovery policy. Zero I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sessionmgr_core"
path = "src/lib.rs"

[dependencies]
# `serde` only, deliberately: this crate has no I/O and never reads or
# writes anything itself, but its types are what the daemon persists to
# `state.json` and what `sessionmgr-protocol` puts on the wire, so they
# need to be serializable. Deriving here rather than duplicating mirror
# types in two adapter crates is what keeps one definition of "what a
# session is" in the domain.
serde = { workspace = true }
