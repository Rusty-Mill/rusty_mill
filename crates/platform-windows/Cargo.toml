[package]
name = "platform-windows"
description = "Windows backend: windows-sys floor (RFC v2 §2 D-1); typed handles and safe wrappers above it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
platform.workspace = true
winargv.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# D-15: rusty_win32 is the Track W backend — a pinned git dependency (one
# source of truth, not a vendored fork), replaced into sys/ call-by-call
# behind `track-w`. Bump the rev deliberately; never track a branch.
# rusty_win32's own MSRV is 1.88 (`impl Default for *mut T`, used by the
# OVERLAPPED/handle-bearing structs), above this workspace's 1.75 floor —
# the feature must stay off on the MSRV CI leg. Its manifest is edition
# 2021 for that reason too: Cargo parses the manifest of every resolved
# dependency, optional-and-disabled included, so an edition-2024 manifest
# would have broken the MSRV leg on the dependency's mere presence.
rusty_win32 = { git = "https://github.com/baileyrd/rusty_win32", rev = "f3c4ffa048fd6a2e9aaf5ebbfb5c122cb378af7d", optional = true }

[features]
# RFC v2 §2 Track W: route curated call families through rusty_win32's
# hand-rolled `extern "system"` DLL-export bindings instead of windows-sys.
# Off by default; D-1 keeps windows-sys the floor. The Windows counterpart
# of platform-linux's `track-p`, with one honest asymmetry recorded in
# D-15: Track P buys a *lower* tier (raw syscalls under libc), Track W
# does not — Windows has no supported tier below a documented DLL export,
# so both floors call the same exports and this is a
# provenance-and-ownership swap, not a depth swap.
track-w = ["dep:rusty_win32"]

[dev-dependencies]
platform-parity.workspace = true
platform-mock.workspace = true

[lints]
workspace = true
