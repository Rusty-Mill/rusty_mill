[package]
name = "rusty_opnsense"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Async client for the OPNsense REST API: system status, services, interfaces, firewall/VLAN CRUD, gateways, DHCP leases, diagnostics, and backups."
repository = "https://github.com/baileyrd/rusty_opnsense"
authors = ["rusty_opnsense contributors"]
readme = "README.md"
keywords = ["opnsense", "firewall", "homelab", "networking"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
# See rusty_proxmox's Cargo.toml for why the `tokio` feature is required
# rather than optional: this crate runs under a real tokio runtime.
rusty_request = { path = "../rusty_request", features = ["tokio"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# The canned-response HTTP mock server the client tests drive against
# (was an identical copy under tests/support/ in each REST-client crate).
rusty_wiremock = { path = "../rusty_wiremock", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
