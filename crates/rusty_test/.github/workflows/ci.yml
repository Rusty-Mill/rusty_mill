name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: Linux
          - os: macos-latest
            host: macOS
          - os: windows-latest
            host: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The behavior matrix is an artifact of this step, not prose someone
      # typed. A probe that cannot run fails the job here.
      - name: Run conformance probes
        shell: bash
        run: cargo run --quiet --bin conformance-report -- probe | tee report.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.host }}
          path: report.tsv
          if-no-files-found: error

  matrix-drift:
    name: behavior matrix is current
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: reports
      - name: Check CONTRACT.md against what the hosts reported
        run: |
          cargo run --quiet --bin conformance-report -- check CONTRACT.md \
            Windows=reports/conformance-Windows/report.tsv \
            Linux=reports/conformance-Linux/report.tsv \
            macOS=reports/conformance-macOS/report.tsv

      # On drift, hand the author the exact file to commit rather than making
      # them reconstruct it from a diff.
      - name: Generate the corrected CONTRACT.md
        if: failure()
        run: |
          cargo run --quiet --bin conformance-report -- write CONTRACT.md \
            Windows=reports/conformance-Windows/report.tsv \
            Linux=reports/conformance-Linux/report.tsv \
            macOS=reports/conformance-macOS/report.tsv
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: CONTRACT-md-regenerated
          path: CONTRACT.md
