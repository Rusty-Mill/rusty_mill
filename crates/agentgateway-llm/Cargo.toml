[package]
name = "agentgateway-llm"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway for rusty_agent_gateway"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agentgateway-config = { workspace = true }
agentgateway-core = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false }
async-stream = "0.3"
tokio = { workspace = true, features = ["time"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
