[package]
name = "rusty-hister-model"
version = "0.1.0"
edition = "2021"
description = "Hister's persisted schema (history, links, users, crawl jobs, embedding queue, sessions) on rusty_db, dual SQLite/Postgres"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
authors = ["rusty_hister contributors"]
publish = false

[dependencies]
rusty-hister-core = { path = "../rusty-hister-core" }
rusty_rand = { path = "../../../rusty_rand" }
rusty-db = { path = "../../../rusty_db/rusty_db", features = [
    "derive",
    "sqlite",
    "postgres",
] }
# Password hashing for `User::create`/`authenticate` (`user.go`'s bcrypt
# usage). No first-party `rusty_*` crate covers this; `argon2` is already a
# workspace dependency (`rusty_croc`), so this reuses it rather than adding
# a second password-hashing crate — `rand`/`rand_core` stay off since salt
# generation goes through `rusty_rand` instead (this crate's own CSPRNG
# entry point, per `CrawlJob::generate_id`'s precedent).
argon2 = { version = "0.5", default-features = false, features = [
    "alloc",
    "password-hash",
] }
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
