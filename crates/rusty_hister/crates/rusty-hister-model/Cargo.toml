[package]
name = "rusty-hister-model"
version = "0.1.0"
edition = "2021"
description = "Hister's persisted schema (history, links, users, crawl jobs, embedding queue, sessions) on rusty_db, dual SQLite/Postgres"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
authors = ["rusty_hister contributors"]
publish = false

[dependencies]
rusty-hister-core = { path = "../rusty-hister-core" }
rusty-db = { path = "../../../rusty_db/rusty_db", features = [
    "derive",
    "sqlite",
    "postgres",
] }

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
