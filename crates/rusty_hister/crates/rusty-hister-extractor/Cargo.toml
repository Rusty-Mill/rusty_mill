[package]
name = "rusty-hister-extractor"
version = "0.1.0"
edition = "2021"
description = "Extractor SDK (enrich/extract/preview chain-of-responsibility) and the built-in per-site/format content extractors for rusty_hister"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rusty-Mill/rusty_mill"
authors = ["rusty_hister contributors"]
publish = false

[dependencies]
rusty-hister-core = { path = "../rusty-hister-core" }
rusty_json = { path = "../../../rusty_json" }
# HTML parsing/CSS-selector querying and HTML sanitizing for the built-in
# extractors that need real HTML parsing (most of the remaining ones) — no
# first-party `rusty_*` crate covers either; see
# `docs/PROJECT-STATUS.md`'s open item for the sovereignty-loop pass this
# went through before adding a new external dependency.
scraper = "0.21"
ammonia = "4"
# Timestamp parsing/formatting for extractors' `published`-style metadata
# (StackExchange's `dateCreated`, and future extractors with similar
# fields). Already an approved workspace dependency (root `Cargo.toml`,
# used by `rusty-hister-model` via `rusty_db`'s re-export) — this just
# wires it directly into a crate that has no reason to depend on `rusty_db`.
chrono.workspace = true
