[package]
name = "lel_treegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Seeded synthetic dedup test tree for Let Em Loose #1319: pure plan, manifest and digest"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.rusty_mill]
layer = "tools"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "lel-treegen"
path = "src/main.rs"
