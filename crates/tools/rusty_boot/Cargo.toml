[package]
name = "rusty_boot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign bootstrapper demonstrating kernel-to-application execution without Rust std"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_boot"
keywords = ["boot", "kernel", "no-std", "sovereign", "libc"]
categories = ["no-std", "os"]

[package.metadata.rusty_mill]
layer = "tools"

[dependencies]
rusty_wire = { workspace = true }
rusty_regx = { workspace = true }
rusty_json = { workspace = true }
rusty_compress = { workspace = true }
rusty_std = { workspace = true }
rusty_sync = { workspace = true }
rusty_time = { workspace = true }
rusty_err = { workspace = true }
rusty_codec = { workspace = true }
rusty_audio = { workspace = true }
rusty_jinja = { workspace = true }
rusty_tokio = { workspace = true }
rusty_http = { workspace = true }
rusty_lines = { workspace = true }
rusty_font = { workspace = true }
rusty_gui = { workspace = true }
rusty_gpu = { workspace = true }
rusty_vulkan = { workspace = true }
rush = { workspace = true }
rusty_term = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rusty_libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { workspace = true }

[features]
default = []
