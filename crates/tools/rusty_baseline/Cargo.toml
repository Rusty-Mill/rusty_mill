[package]
name = "rusty_baseline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Per-product baseline: binary size, dependency closure, clean and incremental build, startup, idle and peak RSS"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.rusty_mill]
layer = "tools"

[dependencies]
rusty_json = { workspace = true }

# Peak RSS of an exited child: `wait4`'s rusage on Linux, the working-set
# peak on Windows. Other targets report no RSS rather than guess.
[target.'cfg(target_os = "linux")'.dependencies]
rusty_libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { workspace = true, features = ["std"] }
