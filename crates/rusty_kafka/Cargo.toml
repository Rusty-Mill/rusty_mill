[package]
name = "rusty_kafka"
version = "0.1.0"
edition = "2021"
description = "A hand-rolled Kafka wire-protocol client: producer, consumer, and admin APIs, built on rusty_wire and rusty_tokio."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_kafka"

# Prerequisite for rusty_meshed's migration from confluent-kafka-python
# (see crates/rusty_meshed/capability-manifest.md) -- built hand-rolled
# per the platform's sovereignty convention rather than wrapping an
# external crate, matching rusty_http/rusty_tls/rusty_sqlite's own
# "own the protocol" pattern in this workspace.
[dependencies]
rusty_wire = { path = "../rusty_wire" }
rusty_tokio = { path = "../rusty_tokio" }
rusty_err = { path = "../rusty_err" }

[dev-dependencies]
