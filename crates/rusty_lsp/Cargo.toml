[package]
name = "rusty_lsp"
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
description = "A small, reusable async Language Server Protocol framework. Own the protocol plumbing; implement one trait for your language."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/baileyrd/rusty_lsp"
keywords = ["lsp", "language-server", "async", "tokio", "jsonrpc"]
categories = ["development-tools", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies.criterion]
version = "0.5"
default-features = false

[[bench]]
name = "core"
harness = false

[features]
default = []
# `Server::from_tcp`: serve an accepted tokio TCP connection.
tcp = ["tokio/net"]
# Wire-level instrumentation via the `tracing` crate.
tracing = ["dep:tracing"]
# Sovereign async runtime adapter support via `rusty_tokio`.
rusty-tokio = ["dep:rusty_tokio"]
# Sovereign JSON support via `rusty_json`.
rusty-json = ["dep:rusty_json"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", optional = true }
# Sovereign async runtime support over `rusty_tokio`; already merged into
# this workspace at crates/rusty_tokio, so a plain path dependency.
rusty_tokio = { path = "../rusty_tokio", optional = true }
# Sovereign JSON support over `rusty_json`. Not yet merged into this
# workspace (tracked separately) -- pinned git dependency until it lands,
# same as every other on-deck sibling crate before its own merge; switch
# to a path dependency once crates/rusty_json exists.
rusty_json = { git = "https://github.com/baileyrd/rusty_json", rev = "45ca45319586cc9c9b9aff712d8103fafb3d43d6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
