[package]
name = "rusty-meshed-registry"
version = "0.1.0"
edition = "2021"
description = "The data-product registry HTTP API: models, CRUD routers, governance/lineage/metrics/monitor endpoints, ported from meshed.registry."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mill"
publish = false

[dependencies]
rusty_err = { path = "../../../rusty_err" }
rusty_http = { path = "../../../rusty_http", features = ["rusty-tokio"] }
rusty_tokio = { path = "../../../rusty_tokio" }
rusty_sqlite = { path = "../../../rusty_sqlite" }
rusty_json = { path = "../../../rusty_json" }
rusty_kafka = { path = "../../../rusty_kafka" }
rusty_request = { path = "../../../rusty_request" }
rusty-meshed-core = { path = "../rusty-meshed-core" }
rusty-meshed-governance = { path = "../rusty-meshed-governance" }
rusty-meshed-observability = { path = "../rusty-meshed-observability" }
rusty-meshed-schema-registry = { path = "../rusty-meshed-schema-registry" }

[dev-dependencies]
