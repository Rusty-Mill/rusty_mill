[package]
name = "rusty-meshed-schema-registry"
version = "0.1.0"
edition = "2021"
description = "Confluent Schema Registry client and compatibility-mode enforcement, ported from meshed.schema_registry."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mill"
publish = false

[dependencies]
rusty_err = { path = "../../../rusty_err" }
rusty_request = { path = "../../../rusty_request" }

[dev-dependencies]
# Test-only: stands in as a fake Schema Registry HTTP server (no
# network access to a real one in this environment). "rusty-tokio"
# feature gates rusty_http's AsyncTransport, used to read/write raw
# HTTP/1.1 messages over a local rusty_tokio TcpListener.
rusty_tokio = { path = "../../../rusty_tokio" }
rusty_http = { path = "../../../rusty_http", features = ["rusty-tokio"] }
