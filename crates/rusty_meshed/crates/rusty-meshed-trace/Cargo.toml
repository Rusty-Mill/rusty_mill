[package]
name = "rusty-meshed-trace"
version = "0.1.0"
edition = "2021"
description = "Reverse-trace and domain-maturity model for rusty_meshed: outcome -> domains -> sources, with a fidelity verdict and a worst-first bottleneck list."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mill"
publish = false

[dependencies]
rusty_err = { path = "../../../rusty_err" }
# Scenario files are TOML (per the spec); rusty_codec's own TOML parser
# is the workspace's sovereign one -- the same "no crates.io `toml`"
# stance the rest of the rusty-meshed-* family takes with rusty_json
# over serde_json.
rusty_codec = { path = "../../../rusty_codec" }
rusty_json = { path = "../../../rusty_json" }

[dev-dependencies]
