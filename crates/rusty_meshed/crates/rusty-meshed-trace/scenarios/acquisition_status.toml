# Acquisition Status Dashboard -- the representative scenario that ships
# with rusty-meshed-trace.
#
# Maturity levels here are ILLUSTRATIVE PLACEHOLDERS chosen to exercise
# every trace state (satisfied / blocked / degraded / missing) and every
# verdict (full / partial / not achievable). They are not an assessment of
# any program office. Replace them with the honest DEFT-lead numbers
# before this goes in front of leadership (spec open question #3).
#
# Ladder: 0 Tribal · 1 Documented · 2 Structured · 3 Accessible · 4 Integrated

name = "Acquisition Status Dashboard"
description = "One pane of glass across a portfolio's programs: schedule, cost, risk, contracts, test status. Representative PAE Fires domains at placeholder maturity levels."

# ── Domains ──────────────────────────────────────────────────────────────

[domains.schedule]
name = "Schedule (IMS)"
owner = "Program Control"
maturity = 4
order = 1

[domains.cost]
name = "Cost / EVM"
owner = "Business Management"
maturity = 2
order = 2

[domains.risk]
name = "Risk"
owner = "Chief Engineer"
maturity = 3
order = 3

[domains.contracts]
name = "Contracts"
owner = "Contracting Office"
maturity = 1
order = 4

[domains.test_eval]
name = "Test & Eval Status"
owner = "T&E Lead"
maturity = 0
order = 5

[domains.funding]
name = "Funding / Budget Execution"
owner = "Resource Management"
maturity = 3
order = 6

[domains.requirements]
name = "Requirements"
owner = "Capability Manager"
maturity = 2
order = 7

[domains.technical_baseline]
name = "Technical Baseline / CM"
owner = "Systems Engineering"
maturity = 2
order = 8

[domains.logistics]
name = "Logistics / Sustainment"
owner = "Product Support Manager"
maturity = 1
order = 9

[domains.manpower]
name = "Manpower / Personnel"
owner = "Manpower DEFT"
maturity = 4
order = 10

