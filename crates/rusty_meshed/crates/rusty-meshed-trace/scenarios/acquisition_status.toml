# ── Outcomes ─────────────────────────────────────────────────────────────

[outcomes.acq_status_dashboard]
name = "Acquisition Status Dashboard"
description = "Show me acquisition status across my programs: schedule, cost, risk, contract actions and test status, on one screen."
order = 1
requires = [
  { domain = "schedule",  min_maturity = 3, criticality = "blocking" },
  { domain = "cost",      min_maturity = 3, criticality = "degrading" },
  { domain = "risk",      min_maturity = 3, criticality = "degrading" },
  { domain = "contracts", min_maturity = 2, criticality = "blocking" },
  { domain = "test_eval", min_maturity = 2, criticality = "degrading" },
  { domain = "funding",   min_maturity = 3, criticality = "degrading" },
  { domain = "logistics", min_maturity = 2, criticality = "optional" },
  { domain = "manpower",  min_maturity = 3, criticality = "optional" },
]

[outcomes.program_risk_rollup]
name = "Program Risk Rollup"
description = "Roll every program's top risks up to the portfolio, with the schedule and cost exposure behind each."
order = 2
requires = [
  { domain = "risk",               min_maturity = 3, criticality = "blocking" },
  { domain = "schedule",           min_maturity = 3, criticality = "blocking" },
  { domain = "cost",               min_maturity = 3, criticality = "degrading" },
  { domain = "technical_baseline", min_maturity = 3, criticality = "degrading" },
  { domain = "test_eval",          min_maturity = 1, criticality = "optional" },
]

[outcomes.cost_schedule_variance]
name = "Cost / Schedule Variance"
description = "CV and SV per program, straight from the IMS and the EVM feed, refreshed when the sources are."
order = 3
requires = [
  { domain = "schedule", min_maturity = 3, criticality = "blocking" },
  { domain = "cost",     min_maturity = 2, criticality = "blocking" },
  { domain = "funding",  min_maturity = 3, criticality = "degrading" },
]

[outcomes.readiness_status]
name = "Readiness Status"
description = "Are we manned, equipped and sustained to field on the date the schedule says?"
order = 4
requires = [
  { domain = "manpower",           min_maturity = 4, criticality = "blocking" },
  { domain = "logistics",          min_maturity = 2, criticality = "degrading" },
  { domain = "test_eval",          min_maturity = 1, criticality = "degrading" },
  { domain = "technical_baseline", min_maturity = 3, criticality = "optional" },
]
