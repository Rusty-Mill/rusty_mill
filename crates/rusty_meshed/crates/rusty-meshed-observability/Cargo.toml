[package]
name = "rusty-meshed-observability"
version = "0.1.0"
edition = "2021"
description = "Lineage tracking, metrics collection, SLO monitoring, and the CI contract gate, ported from meshed.observability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mill"
publish = false

[dependencies]
rusty_err = { path = "../../../rusty_err" }
rusty_sqlite = { path = "../../../rusty_sqlite" }
rusty_kafka = { path = "../../../rusty_kafka" }
rusty_json = { path = "../../../rusty_json" }
rusty_request = { path = "../../../rusty_request" }
rusty_tokio = { path = "../../../rusty_tokio" }
rusty-meshed-schema-registry = { path = "../rusty-meshed-schema-registry" }

[dev-dependencies]
# Test-only: stands in as a fake Schema Registry HTTP server (no
# network access to a real one in this environment). "rusty-tokio"
# feature gates rusty_http's AsyncTransport, used to read/write raw
# HTTP/1.1 messages over a local rusty_tokio TcpListener.
rusty_http = { path = "../../../rusty_http", features = ["rusty-tokio"] }
rusty_wire = { path = "../../../rusty_wire" }
