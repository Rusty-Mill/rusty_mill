[package]
name = "rusty-meshed-sdk"
version = "0.1.0"
edition = "2021"
description = "The data-product producer/consumer SDK, transactional outbox, and topic lifecycle management, ported from meshed.sdk and meshed.infrastructure."
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mill"
publish = false

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_err = { workspace = true }
rusty_kafka = { workspace = true }
rusty_tokio = { workspace = true }
rusty_wire = { workspace = true }
rusty_sqlite = { workspace = true }
rusty_json = { workspace = true }
rusty_uuid = { workspace = true }
rusty_time = { workspace = true }
rusty_request = { workspace = true }
rusty-meshed-core = { path = "../rusty-meshed-core" }
rusty-meshed-schema-registry = { path = "../rusty-meshed-schema-registry" }
rusty-meshed-observability = { path = "../rusty-meshed-observability" }

[dev-dependencies]
# Test-only: stands in as a fake registry HTTP server (no network
# access to a real one in this environment); rusty_tokio is already a
# normal dependency above. "rusty-tokio" feature gates rusty_http's
# AsyncTransport, used to read/write raw HTTP/1.1 messages over a
# local rusty_tokio TcpListener.
rusty_http = { workspace = true, features = ["rusty-tokio"] }
