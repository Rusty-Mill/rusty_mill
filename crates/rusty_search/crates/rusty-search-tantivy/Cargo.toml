[package]
name = "rusty-search-tantivy"
description = "Tantivy-backed SearchBackend implementation for rusty_search: embedded full-text search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusty-search-core = { workspace = true }
async-trait = { workspace = true }
rusty_serde = { workspace = true }
# `tantivy::schema::document::TantivyDocument::from_json_object` hard-requires
# real `serde_json::Map`/`Value` (tantivy itself depends on it) - kept
# alongside `rusty_serde` for exactly that boundary; see convert.rs.
serde_json = { workspace = true }
tantivy = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
rusty_time = { path = "../../../rusty_time" }
rusty_uuid = { path = "../../../rusty_uuid" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
