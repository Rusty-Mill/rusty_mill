[package]
name = "rusty-search-algolia"
description = "Algolia-backed SearchBackend implementation for rusty_search: a hosted search SaaS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusty-search-core = { workspace = true }
async-trait = { workspace = true }
rusty_serde = { workspace = true }
# Algolia's wire protocol goes through reqwest's real-serde-backed
# `.json()` convenience methods, so this stays alongside rusty_serde
# rather than being replaced by it - see convert.rs.
serde_json = { workspace = true }
rusty_request = { path = "../../../rusty_request", features = ["tokio"] }
tokio = { workspace = true, features = ["sync", "time"] }
rusty_uuid = { path = "../../../rusty_uuid" }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
