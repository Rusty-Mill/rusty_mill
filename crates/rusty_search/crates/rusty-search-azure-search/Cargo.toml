[package]
name = "rusty-search-azure-search"
description = "Azure AI Search-backed SearchBackend implementation for rusty_search: a hosted search-as-a-service on Azure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusty-search-core = { workspace = true }
async-trait = { workspace = true }
rusty_serde = { workspace = true }
# Azure AI Search's wire protocol goes through reqwest's real-serde-backed
# `.json()` convenience methods, so this stays alongside rusty_serde
# rather than being replaced by it - see convert.rs.
serde_json = { workspace = true }
rusty_request = { git = "https://github.com/baileyrd/rusty_request", rev = "ebd1fed32dcd6958cab2c9c93ec8c04b3e7fd07a", features = ["tokio"] }
tokio = { workspace = true, features = ["sync"] }
rusty_uuid = { git = "https://github.com/baileyrd/rusty_uuid", rev = "6bc9e04868fd3042d77d3bb757d40363654ebb45" }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
