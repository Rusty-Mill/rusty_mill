[package]
name = "rusty-search-azure-search"
description = "Azure AI Search-backed SearchBackend implementation for rusty_search: a hosted search-as-a-service on Azure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rusty-search-core = { workspace = true }
async-trait = { workspace = true }
rusty_serde = { workspace = true }
# Azure AI Search's wire protocol goes through reqwest's real-serde-backed
# `.json()` convenience methods, so this stays alongside rusty_serde
# rather than being replaced by it - see convert.rs.
serde_json = { workspace = true }
rusty_request = { path = "../../../rusty_request", features = ["tokio"] }
tokio = { workspace = true, features = ["sync"] }
rusty_uuid = { path = "../../../rusty_uuid" }
# Used to percent-encode caller-supplied index/name path segments before
# they are spliced into an HTTP request path (see `encode_path_segment` in
# lib.rs) - same crate/version the elasticsearch/algolia sibling backends
# already use for the same purpose.
percent-encoding = "2"
rusty_time = { path = "../../../rusty_time" }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
