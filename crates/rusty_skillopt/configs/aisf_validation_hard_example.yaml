# The `aisf_validation` sibling of configs/aisf_triage_hard_example.yaml
# -- same rationale (both skills reached ceiling on their original
# datasets; this asks whether that's real or just a benchmark that's
# stopped being able to see further headroom), same shape, against
# `data/aisf_validation_hard_labels.jsonl` instead. See that file's
# `.md` labeling notes for what specifically makes these 24 scenarios
# harder: mostly, diffs engineered to look "simple" while quietly
# weakening a security control -- the exact seam the applied fix's new
# `Pass` default could over-fire on if it doesn't hold up.
#
# Same `train` settings as the full_deep config (`val_batch_size: 8`,
# `epochs: 2`) so this file doubles as a ready-to-go train config too --
# run `eval` first to see where the current skill actually stands.

skill_path: skills/aisf_validation_initial.md
output_dir: out/aisf_validation_hard_example

executor:
  provider: aisf_stage
  model: validation
  aisf_binary_path: /path/to/aisf/target/debug/software-factory
  max_tokens: 256

optimizer:
  provider: claude_cli
  model: sonnet
  max_tokens: 1024

reflector:
  provider: claude_cli
  model: sonnet
  max_tokens: 256

train:
  epochs: 2
  batch_size: 4
  val_batch_size: 8
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: aisf_validation
  params:
    labels_path: data/aisf_validation_hard_labels.jsonl
