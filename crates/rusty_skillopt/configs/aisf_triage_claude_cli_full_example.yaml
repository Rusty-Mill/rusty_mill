# The full-dataset sibling of configs/aisf_triage_claude_cli_example.yaml
# -- identical setup (every role live via `claude -p`, zero API keys
# anywhere), but against the complete, real 40-scenario
# `data/aisf_triage_labels.jsonl` (24 train / 8 val / 8 test) instead of
# the 8-row smoke subset. Expect real (test) `train()` runs to visit all
# 24 train examples, split into 6 batches of `batch_size: 4` -- six real
# rollout/reflect/optimize/validate rounds, not one -- plus a real
# 8-example test evaluation at the end. That's roughly 5x the real
# `claude -p` call volume of the smoke example; budget on the order of
# 20-30 minutes of wall-clock time for a run, not a few.
#
# `val_batch_size: 2` here is carried over unchanged from the smoke
# config, not deliberately chosen for this one -- it means the
# validation gate only ever looks at 2 of the 8 real val examples per
# check, which is a noisy signal (each example is worth 0.5 of the
# score) even though the full val split is available. A run with this
# file produced `0/6 steps accepted, val 0.500 -> 0.500, test 0.500` --
# a real result, but read the val number for what it is: a 2-example
# gate, not an 8-example one. Bump `val_batch_size` to `8` (the full val
# split) for a less noisy gate, at the cost of a meaningfully longer run
# (every one of the 6 validation checks becomes 8 calls instead of 2).

skill_path: skills/aisf_triage_initial.md
output_dir: out/aisf_triage_claude_cli_full_example

executor:
  provider: aisf_stage
  model: triage
  aisf_binary_path: /path/to/aisf/target/debug/software-factory
  max_tokens: 256

optimizer:
  provider: claude_cli
  model: sonnet
  max_tokens: 1024

reflector:
  provider: claude_cli
  model: sonnet
  max_tokens: 256

train:
  epochs: 1
  batch_size: 4
  val_batch_size: 2
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: aisf_triage
  params:
    labels_path: data/aisf_triage_labels.jsonl
