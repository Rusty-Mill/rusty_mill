[package]
name = "rusty-db-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/baileyrd/rusty_db"
description = "SQLite driver for rusty_db, built on sqlx"

[dependencies]
rusty-db-core.workspace = true
async-trait.workspace = true
futures-util.workspace = true
async-stream.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }

[dev-dependencies]
tokio.workspace = true
