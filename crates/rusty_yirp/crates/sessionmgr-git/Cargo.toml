[package]
name = "sessionmgr-git"
description = "Git adapter for sessionmgr: worktree lifecycle, status, and diff, by shelling out to the system git."
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "sessionmgr_git"
path = "src/lib.rs"

[dependencies]
sessionmgr-core = { workspace = true }
