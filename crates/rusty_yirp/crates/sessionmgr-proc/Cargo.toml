[package]
name = "sessionmgr-proc"
description = "Process adapter for sessionmgr: detached spawn, PID-reuse-safe liveness, termination, and stdio-inheritance hardening."
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "sessionmgr_proc"
path = "src/lib.rs"

[dependencies]
sessionmgr-core = { workspace = true }
rusty_tokio = { workspace = true }
# Session-id entropy from the OS CSPRNG (`/dev/urandom` / `BCryptGenRandom`),
# via the workspace's one dependency-free copy of that plumbing rather than
# this crate's own former per-platform arms.
rusty_rand = { path = "../../../rusty_rand" }

[target.'cfg(windows)'.dependencies]
# Direct, small FFI for the things `rusty_tokio::process::Command` has no
# reason to wrap: liveness/termination for a pid this process did not
# spawn, a process start-time fingerprint, and clearing
# HANDLE_FLAG_INHERIT on our own inherited std handles. (Session-id
# entropy used to be a fourth item here, via `Win32_Security_Cryptography`;
# `rusty_rand` above carries its own `BCryptGenRandom` binding now.)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# `kill(pid, 0)`/`SIGTERM` for liveness and termination, `setsid()` in a
# `pre_exec` hook for real session-leader detachment (`rusty_tokio`
# exposes `process_group` but no `setsid` builtin), and `fcntl(F_SETFD,
# FD_CLOEXEC)` for stdio hardening.
libc = "0.2"
