# The crate's `edition` dropped from 2024 to 2021 for a manifest-compatibility
# reason that has nothing to do with formatting: Cargo parses the manifest of
# every resolved dependency, even an optional one whose feature is off, so an
# edition-2024 manifest hard-fails any consumer on a pre-1.85 toolchain — and
# rustils adopts this crate exactly that way while holding a 1.75 MSRV floor
# (see Cargo.toml's `edition` comment).
#
# rustfmt's style edition otherwise follows the crate edition, so that change
# would silently drag the entire codebase back to 2021 formatting: `use`-list
# sorting flips, single-line `if … { A } else { B }` expands, and trailing
# comments after a wrapped expression get re-indented to the expression's
# column. None of that is a decision anyone made. Pin the style edition so the
# formatting stays exactly what it was under edition 2024.
style_edition = "2024"
