[package]
name = "{{project-name}}"
version = "0.1.0"
description = "{{description}}"
edition = "2024"
rust-version = "1.88"
publish = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[dependencies]
# Pinned to a tag rather than a branch: `main` can break under you between
# builds, and this crate is 0.x, so minor releases may still change shape.
rusty-mcp = { git = "https://github.com/baileyrd/rusty_mcp", tag = "v0.3.0" }
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }

[dev-dependencies]
serde_json = "1"
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "client",
    "macros",
    "schemars",
] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
] }
