[workspace]
resolver = "2"
members = [
    "crates/rusty-search-core",
    "crates/rusty-search-memory",
    "crates/rusty-search-tantivy",
    "crates/rusty-search-sqlite-fts5",
    "crates/rusty-search-elasticsearch",
    "crates/rusty-search-meilisearch",
    "crates/rusty-search-opensearch",
    "crates/rusty-search-solr",
    "crates/rusty-search-algolia",
    "crates/rusty-search-azure-search",
    "crates/rusty-search-cloud",
    "crates/rusty-search",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_search"
authors = ["rusty_search contributors"]

[workspace.dependencies]
rusty-search-core = { path = "crates/rusty-search-core", version = "0.1.0" }
rusty-search-memory = { path = "crates/rusty-search-memory", version = "0.1.0" }
rusty-search-tantivy = { path = "crates/rusty-search-tantivy", version = "0.1.0" }
rusty-search-sqlite-fts5 = { path = "crates/rusty-search-sqlite-fts5", version = "0.1.0" }
rusty-search-elasticsearch = { path = "crates/rusty-search-elasticsearch", version = "0.1.0" }
rusty-search-meilisearch = { path = "crates/rusty-search-meilisearch", version = "0.1.0" }
rusty-search-opensearch = { path = "crates/rusty-search-opensearch", version = "0.1.0" }
rusty-search-solr = { path = "crates/rusty-search-solr", version = "0.1.0" }
rusty-search-algolia = { path = "crates/rusty-search-algolia", version = "0.1.0" }
rusty-search-azure-search = { path = "crates/rusty-search-azure-search", version = "0.1.0" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Internal replacement for serde/serde_json, adopted incrementally per
# crate - see https://github.com/baileyrd/rusty_search/issues/19. Not
# published to crates.io. TEMPORARY: `branch = "main"` instead of a pinned
# `rev` - CI's git-dependency fetch fails identically with a raw commit SHA
# regardless of two otherwise-correct auth fixes (see PR #22's discussion),
# so this is a diagnostic swap to see whether fetching a named ref instead
# of an exact SHA changes anything. If it does, this should go back to a
# pinned `rev` (or a tag) for reproducibility once the actual cause is
# understood - a floating branch dependency isn't a good permanent state.
rusty_serde = { git = "https://github.com/baileyrd/rusty_serde", branch = "main", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tantivy = "0.26"
