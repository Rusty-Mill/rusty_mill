[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/observe",
    "crates/constrain",
    "crates/feed",
    "crates/kernel",
    "crates/app",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# External
aisdk = "0.5.2"
async-trait = "0.1.88"
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }

# Internal
rk-config = { path = "crates/config" }
rk-observe = { path = "crates/observe" }
rk-constrain = { path = "crates/constrain" }
rk-feed = { path = "crates/feed" }
rk-kernel = { path = "crates/kernel" }
