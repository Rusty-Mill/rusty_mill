# Hoisted from rusty_agent_gateway's own former `[workspace.dependencies]`.
# Its `[workspace.package]` collided on `edition` (2024), `rust-version`
# (1.88), `license` (Apache-2.0), `repository` and `authors`, so its nine
# crates carry literal `[package]` fields -- rusty_db treatment. Its
# `[workspace.lints]` collided too and is likewise written literally into
# each crate (see the README). `rmcp`/`axum`/`tower`/`hyper`/`hyper-util`/
# `http`/`http-body-util`/`bytes`/`regex`/`serde_yaml` above already cover
# its requirements; `clap` gained `env` for its CLI.
agentgateway-config = { path = "crates/rusty_agent_gateway/crates/agentgateway-config", version = "0.1.0" }
agentgateway-auth = { path = "crates/rusty_agent_gateway/crates/agentgateway-auth", version = "0.1.0" }
agentgateway-core = { path = "crates/rusty_agent_gateway/crates/agentgateway-core", version = "0.1.0" }
agentgateway-a2a = { path = "crates/rusty_agent_gateway/crates/agentgateway-a2a", version = "0.1.0" }
agentgateway-llm = { path = "crates/rusty_agent_gateway/crates/agentgateway-llm", version = "0.1.0" }
agentgateway-mcp = { path = "crates/rusty_agent_gateway/crates/agentgateway-mcp", version = "0.1.0" }
agentgateway-proxy = { path = "crates/rusty_agent_gateway/crates/agentgateway-proxy", version = "0.1.0" }
agentgateway-tls = { path = "crates/rusty_agent_gateway/crates/agentgateway-tls", version = "0.1.0" }
# Another merged sibling, retiring agentgateway-tls' pinned git dependency.
rusty_tls = { path = "crates/rusty_tls" }
# `rt` is nexus-kernel's (CancellationToken-based cooperative IPC cancellation).
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
http-body = "1"
