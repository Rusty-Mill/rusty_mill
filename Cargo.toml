tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "transport"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_Networking_WinSock",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

# Hoisted from nexus's own former `[workspace.dependencies]` (it was its own
# Cargo workspace of 42 crates before this merge). Its `[workspace.package]`
# matched this root's on every field it set (version 0.1.0, edition 2021,
# license "MIT OR Apache-2.0", publish = false), so -- like rusty_test and
# unlike rusty_db -- its crates keep inheriting via `field.workspace = true`;
# nexus-rush and nexus-vt already carried a literal `edition = "2024"`.
#
# Seven of its entries collided with this root's on something a member
# cannot override by inheriting, and stay literal in the nexus crates that
# use them instead of displacing the existing root entries: `thiserror`
# ("2.0", the recurring "2"-vs-"1" split), `toml` ("1.1" vs. "0.8"),
# `rand` ("0.9" vs.
# "0.8"), `dirs` ("5" vs. "6.0"), `rmcp` ("1.3" with the server/client/
# transport feature set vs. "3.1"), and `tantivy` (default-features = false
# plus an explicit feature list vs. this root's default-features entry).
# Everything else nexus asked for either already existed here as a
# compatible superset (`tokio`, `serde`, `serde_json`, `chrono`, `axum`,
# `clap`, `schemars`, `ratatui`, `crossterm`, `portable-pty`, ...) or was
# widened above (`uuid` gained `v5`/`v7`, `reqwest` gained `rustls-tls`/
# `http2`, `rustls` gained `std`, `tokio-util` gained `rt`,
# `tracing-subscriber` gained `fmt`, `futures-util` gained `sink`).
#
# Its two `rustils` git pins (`platform`/`platform-linux` at rev 3772d60f,
# used by nexus-rush's Linux job control) retire to this root's existing
# path entries -- the ADR-0002 rule, and the same swap rusty_yirp's
# sessionmgr-pty made.
nexus-plugin-api = { path = "crates/nexus/crates/nexus-plugin-api" }
nexus-hashline = { path = "crates/nexus/crates/nexus-hashline" }
tracing-appender = "0.2"
# Markdown parsing
comrak = { version = "0.52", default-features = false, features = [] }
# Tree-sitter -- code-symbol indexing. tree-sitter 0.26 expects language
# crates emitting LANGUAGE_VERSION 13-15; the grammar versions below all
# advertise a matching ABI. Bumping any grammar in isolation is safe;
# bumping the runtime needs a matching grammar refresh.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
# tree-sitter 0.25+ returns query matches as a StreamingIterator.
streaming-iterator = "0.1"
# File watching
notify = "8"
notify-debouncer-mini = "0.7"
# WASM runtime for community plugins
wasmtime = { version = "44", default-features = false, features = ["runtime", "std", "cranelift", "cache", "parallel-compilation"] }
jsonschema = "0.46"
semver = "1"
regex-lite = "0.1"
# Unicode width + grapheme segmentation -- the only deps of the headless VT
# engine (`nexus-vt`, the in-tree port of rusty_term's core).
unicode-width = "0.2"
unicode-segmentation = "1"
rayon = "1.11"
sha2 = "0.11"
# 3-way merge for hashline edits (nexus-hashline).
diffy = "0.4"
# Note: nexus's four `base64` consumers keep the external crate for now;
# repo-inspector's Section 2 retired every *other* external `base64` use in
# this workspace in favour of `rusty_base64`, so this is a known
# sovereignty follow-up, not a policy exception granted here.
base64 = "0.22"
rustls-pki-types = "1"
webpki-roots = "1"
# Plugin manifest signing.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
# OS credential storage
keyring = "3"
# SQLite connection pooling, tracking the root `rusqlite` entry's 0.39 major.
r2d2 = "0.8"
r2d2_sqlite = "0.33"
# YAML frontmatter (serde_norway is the maintained fork of archived
# serde_yaml; serde_yml, the prior fork, is unsound + unmaintained,
# RUSTSEC-2025-0068). Distinct from this root's `serde_yaml` entry above,
# which rusty_skillopt/rusty_agent_gateway still use.
serde_norway = "0.9"
# OS process sandbox (Linux): Landlock LSM filesystem restrictions +
# seccomp-bpf network-syscall blocking (nexus-security, Linux-only target
# table).
landlock = "0.4"
seccompiler = "0.5"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
filetime = "0.2"
trash = "5"
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap_complete = "4.5"
comfy-table = "7"
ctrlc = "3.5"
# REPL line editing for `nexus ai chat` and nexus-rush's interactive mode.
rustyline = "18"
petgraph = "0.7"
# SMTP client (nexus-notifications email transport). `rustls-tls` keeps the
# TLS stack aligned with reqwest's rustls + ring graph; no native-tls.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "ring", "webpki-roots", "pool", "hostname"] }
# TypeScript type generation for nexus's IPC boundary (`ts-export` features).
ts-rs = { version = "11", features = ["serde-compat"] }
# WebSocket relay transport (nexus-collab): plain ws:// only, TLS deferred.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
# Tauri desktop shell (`crates/nexus/shell/src-tauri`, excluded above).
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# rustils' own `[workspace.lints]`, hoisted the same way -- only its eight
# crates opt in via `[lints] workspace = true`; every other crate in this
# workspace is unaffected.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
