[package]
name = "rusty-acp"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Agent Communication Protocol (ACP) v0.2.0 for Rust: protocol types, an HTTP client, and a server framework for hosting agents."
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_acp"
homepage = "https://agentcommunicationprotocol.dev"
documentation = "https://github.com/baileyrd/rusty_acp#readme"
readme = "README.md"
keywords = ["acp", "agent", "protocol", "ai", "interoperability"]
categories = ["web-programming", "api-bindings", "asynchronous"]

[features]
default = ["client", "server"]
client = ["dep:reqwest", "dep:eventsource-stream", "dep:futures-util", "dep:tokio"]
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tokio-util",
    "dep:async-trait",
    "dep:futures-util",
]
# Redis-backed Store, for running several replicas behind a load balancer.
redis-store = ["server", "dep:redis"]
# Open discovery: serve agent metadata as YAML at /.well-known/agent.yml.
well-known = ["server", "dep:serde_norway"]
# Postgres-backed Store: durable multi-replica without a key expiry.
postgres-store = ["server", "dep:sqlx"]
# Emit metrics through the `metrics` facade, leaving the exporter to you.
metrics = ["server", "dep:metrics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
tracing = "0.1"
base64 = "0.22"

# client
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "query",
    "rustls",
    "rustls-native-certs",
] }
eventsource-stream = { version = "0.2", optional = true }

# well-known
serde_norway = { version = "0.9", optional = true }

# redis-store
redis = { version = "1", optional = true, default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }

# server
axum = { version = "0.8", optional = true }
tokio-util = { version = "0.7", optional = true }
async-trait = { version = "0.1", optional = true }

# shared
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json"], optional = true }
metrics = { version = "0.24.6", optional = true }

[dev-dependencies]
# Raw HTTP and SSE, so the resumption tests can read the `id` the server tags
# each event with — the client tracks it internally and does not expose it.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs"] }
eventsource-stream = "0.2"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
metrics-util = "0.20.4"
criterion = { version = "0.8.2", features = ["async_tokio"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "echo_server"
required-features = ["server"]

[[example]]
name = "client_demo"
required-features = ["client"]

[[example]]
name = "awaiting_agent"
required-features = ["server"]

[[example]]
name = "ha_server"
required-features = ["server"]

[[example]]
name = "authenticated_server"
required-features = ["server", "client", "well-known"]
# The exemption list is the point of this example, and a renamed route would
# rot it silently. `test = true` lets it carry its own tests, so the list is
# checked against the real router rather than restated in a separate file that
# could drift from it.
test = true

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "store"
harness = false
required-features = ["server"]

[[bench]]
name = "run"
harness = false
required-features = ["server", "client"]
