    "crates/rusty_search/crates/rusty-search-solr",
    "crates/rusty_search/crates/rusty-search-algolia",
    "crates/rusty_search/crates/rusty-search-azure-search",
    "crates/rusty_search/crates/rusty-search-cloud",
    "crates/rusty_search/crates/rusty-search",
    "crates/rusty_vulkan",
    "crates/rusty_sync",
    "crates/rusty_codec",
    "crates/rusty_h2",
    "crates/rusty_ansi",
