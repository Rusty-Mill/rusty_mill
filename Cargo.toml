[workspace]
resolver = "2"
members = [
    "crates/rusty_term",
    "crates/rusty_term/l13",
    "crates/rusty_gpu",
    "crates/rusty_gui",
    "crates/rusty_font",
    "crates/rusty_regx",
    "crates/rusty_win32",
    "crates/rpath",
    "crates/rusty_diff",
    "crates/rusty_compress",
    "crates/rusty_git",
    "crates/rusty_sha1",
    "crates/rusty_lines",
    "crates/rush",
    "crates/mill-term",
    "crates/rusty_text",
    "crates/rusty_tokio",
    "crates/rusty_tokio/rusty_tokio-macros",
    "crates/rusty_rusqlite",
    "crates/rusty_libc",
    "crates/rusty_acp",
    "crates/rusty_tls",
    "crates/rusty_serde/rusty_serde",
    "crates/rusty_serde/rusty_serde_derive",
    "crates/rusty_serde/rusty_serde_erased",
    "crates/rusty_lsp",
    "crates/rusty_a2a",
    "crates/rusty_mcp/crates/rusty-mcp",
    "crates/rusty_mcp/crates/rusty-mcp-demo",
    "crates/rusty_stream",
    "crates/rusty_url",
    "crates/rusty_http",
    "crates/rusty_json",
    "crates/rusty_json/rusty_json-derive",
    "crates/rusty_oauth",
    "crates/rustils_async/crates/reactor-core",
    "crates/rustils_async/crates/platform-async",
    "crates/rustils_async/crates/platform-async-mock",
    "crates/rustils_async/crates/platform-async-linux",
    "crates/rustils_async/crates/threading",
    "crates/rustils_async/crates/coreutils-async",
    "crates/rusty_wire",
    "crates/rusty_std",
    "crates/rusty_sqlite",
    "crates/rusty_wiremock",
]
# cargo-fuzz needs nightly; kept out of ordinary workspace builds, same as
# it was excluded from rusty_term's own workspace before the merge.
# crates/rusty_lines/bench is a standalone on-demand benchmark harness
# (rusty_lines vs rustyline vs reedline) with no `[workspace]` table of its
# own, run only via `cd crates/rusty_lines/bench && cargo run --release` —
# excluded so it doesn't try to join this workspace.
# crates/rusty_libc/bench is the same shape: its own standalone `[workspace]`
# comparing rusty_libc against the `libc` crate, deliberately outside the
# library's own zero-dependency build.
exclude = [
    "crates/rusty_term/fuzz",
    "crates/rush/fuzz",
    "crates/rusty_lines/bench",
    "crates/rusty_libc/bench",
    "crates/rusty_tls/fuzz",
    "crates/rusty_lsp/fuzz",
]
