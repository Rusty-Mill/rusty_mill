[package]
name = "rusty_tls"
version = "0.1.0"
edition = "2021"
description = "A TLS library implementation in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tls"

# Every dependency here is written up (rustils' `docs/behavior/*.md` style):
# add nothing without a comment justifying it, per the ecosystem's
# dependency-justification convention.
[dependencies]
# The one dependency this crate exists to wrap. `default-features = false`
# to make the choices explicit rather than inherit whatever rustls' defaults
# happen to be next release: `std` (this is not a `no_std` crate), `tls12`
# (peers that haven't moved to 1.3 yet still need to work), and `ring` as
# the crypto provider (the mature, widely-used choice; `aws-lc-rs` is the
# other option rustls supports but adds a C/Bindgen build dependency this
# crate doesn't need).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
# `TrustPolicy::System`'s only implementation: `platform::security::
# TrustAnchors`, the rustils "B1" slice (rustils#88), which reads OS trust
# anchors as raw DER — Windows ROOT store, macOS Security.framework, Linux
# and the other BSDs' cert bundles honoring `SSL_CERT_FILE`/`SSL_CERT_DIR`.
# Replaced `rustls-native-certs` (rusty_tls#24): the ecosystem decided this
# crate should not depend on a third-party implementation of the one piece
# of the TLS problem that is pure OS personality rather than cryptography.
# See rustils' docs/design-discussion-tls.md, "B1 reopened".
#
# The trait crate is target-independent; exactly one backend is pulled in
# per target below. Rev-pinned per rustils' docs/versioning.md §3: a
# sibling-repo git dependency pins a commit, never a branch.
platform = { git = "https://github.com/baileyrd/rustils", rev = "93b00ce964284d93ea6cec2581b3543f08df8f2d" }
# Optional (see the `rusty-tokio` feature below): the async adapter drives
# the same sans-IO `rustls::ClientConnection` over `rusty_tokio`'s own
# `AsyncRead`/`AsyncWrite` traits and reactor, the way the mission's
# sequencing plan calls for -- the async adapter belongs here, behind a
# feature, not in `rusty_tokio` itself (the runtime stays TLS-free).
# Pinned to a specific commit rather than tracking `main`, mirroring
# rusty_rdp's own pinning convention for its `platform` dependency
# (rustils' docs/versioning.md §3: a bare SHA carries the same guarantee
# as a tag).
rusty_tokio = { git = "https://github.com/baileyrd/rusty_tokio", rev = "6d3bb05a45a393e4cf902013b05189dd168f6106", optional = true }

# Exactly one `platform` backend per target — the same shape rustils'
# own `coreutils` uses. `TrustPolicy::System` is the only caller; every
# other `TrustPolicy` variant is pure rustls and target-independent.
[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { git = "https://github.com/baileyrd/rustils", rev = "93b00ce964284d93ea6cec2581b3543f08df8f2d" }

[target.'cfg(windows)'.dependencies]
platform-windows = { git = "https://github.com/baileyrd/rustils", rev = "93b00ce964284d93ea6cec2581b3543f08df8f2d" }

# The gate is textually rustils' own `platform-bsd` gate: every OS whose
# trust store is either Security.framework (macOS) or a PEM bundle (the
# rest).
[target.'cfg(any(target_os = "macos", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
platform-bsd = { git = "https://github.com/baileyrd/rustils", rev = "93b00ce964284d93ea6cec2581b3543f08df8f2d" }

[features]
# Enables `AsyncTlsStream`, the async counterpart to `TlsStream`. Off by
# default so a sync-only consumer (e.g. `rusty_rdp`) never pulls in
# `rusty_tokio` and its transitive dependencies.
rusty-tokio = ["dep:rusty_tokio"]

[dev-dependencies]
# Generates throwaway certificates (wrong hostname, expired, untrusted
# root) for the rejection-path test suite — hermetic tests need a variety
# of bad certs that hand-writing DER byte arrays for each one would make
# unreadable and hard to review. Dev-only: never a dependency of the
# shipped library.
rcgen = "0.13"
# Only to name `time::OffsetDateTime` for the expired-certificate test's
# custom validity window — rcgen depends on `time` itself but doesn't
# re-export it. Dev-only.
time = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
