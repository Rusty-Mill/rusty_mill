[workspace]
resolver = "3"
members = [
    "crates/agentgateway-config",
    "crates/agentgateway-auth",
    "crates/agentgateway-a2a",
    "crates/agentgateway-llm",
    "crates/agentgateway-mcp",
    "crates/agentgateway-proxy",
    "crates/agentgateway-tls",
    "crates/agentgateway-core",
    "crates/agentgateway",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_agent_gateway"
authors = ["rusty_agent_gateway contributors"]

[workspace.dependencies]
agentgateway-config = { path = "crates/agentgateway-config", version = "0.1.0" }
agentgateway-auth = { path = "crates/agentgateway-auth", version = "0.1.0" }
agentgateway-core = { path = "crates/agentgateway-core", version = "0.1.0" }
agentgateway-a2a = { path = "crates/agentgateway-a2a", version = "0.1.0" }
agentgateway-llm = { path = "crates/agentgateway-llm", version = "0.1.0" }
agentgateway-mcp = { path = "crates/agentgateway-mcp", version = "0.1.0" }
agentgateway-proxy = { path = "crates/agentgateway-proxy", version = "0.1.0" }
agentgateway-tls = { path = "crates/agentgateway-tls", version = "0.1.0" }

rmcp = { version = "3.1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tower = { version = "0.5", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
