[workspace]
resolver = "2"
members = [
    "crates/rusty_term",
    "crates/rusty_term/l13",
    "crates/rusty_gpu",
    "crates/rusty_gui",
    "crates/rusty_font",
    "crates/rusty_regx",
    "crates/rusty_win32",
]
# cargo-fuzz needs nightly; kept out of ordinary workspace builds, same as
# it was excluded from rusty_term's own workspace before the merge.
exclude = ["crates/rusty_term/fuzz"]
