[package]
name = "rusty_compress"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A sans-IO stream compression and decompression abstraction crate for DEFLATE, Gzip, Zlib, and LZMA"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_compress"
keywords = ["compress", "deflate", "gzip", "lzma", "sans-io"]
categories = ["compression", "no-std"]

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[features]
default = []

[dev-dependencies]
