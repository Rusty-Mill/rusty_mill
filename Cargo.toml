[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/compat",
    "crates/conformance",
    "tools/stat-tool",
    "tools/proc-runner",
    "tools/pty-shell",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
contract = { path = "crates/contract" }
compat = { path = "crates/compat" }
conformance = { path = "crates/conformance" }
cap-std = "4.0"
portable-pty = "0.9"
dirs = "6.0"
thiserror = "2.0"
anyhow = "1.0"
