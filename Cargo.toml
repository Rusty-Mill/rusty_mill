[workspace]
resolver = "3"
members = ["crates/rusty-mcp", "crates/rusty-mcp-demo"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_mcp"
authors = ["rusty_mcp contributors"]

[workspace.dependencies]
rusty-mcp = { path = "crates/rusty-mcp", version = "0.3.0" }

rmcp = { version = "3.1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
