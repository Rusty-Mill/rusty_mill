[package]
name = "rusty_win32"
version = "0.1.0"
# Deliberately 2021, not 2024, and this is a compatibility contract rather
# than a preference: Cargo parses the manifest of *every* resolved
# dependency — including an optional one whose feature is off — so an
# `edition = "2024"` manifest here hard-fails `cargo check` for any consumer
# on a toolchain older than 1.85, before a single line is compiled. rustils
# adopts this crate as an optional, feature-gated Windows backend
# (`platform-windows`'s `track-w`) while holding a 1.75 MSRV floor on its own
# CI matrix; edition 2021 is what lets that floor survive the dependency
# being merely *present*. The two edition-2024 defaults actually worth having
# here are re-asserted explicitly under `[lints.rust]` below, so this costs
# discipline nothing. Same shape as the sibling crate `rusty_libc`, adopted
# into rustils the same way (edition 2021 + `rust-version = "1.88"`).
edition = "2021"
# `impl Default for *mut T` stabilized in 1.88 — `#[derive(Default)]` on the
# OVERLAPPED/handle-bearing structs (`watch`, `net`, `conpty`, …) is what
# actually sets the floor, verified by compiling against 1.87 (fails) and
# 1.88 (clean). Below it: `unsafe extern "system" { … }` blocks need 1.82,
# `c"…"` literals (net.rs's tests) 1.77, `core::error::Error` (error.rs)
# 1.81. Same floor as the sibling crate `rusty_libc`, coincidentally.
rust-version = "1.88"
license = "MIT"
description = "A #![no_std]-where-possible, minimal-dependency Windows backend for rush's sys::win32"
repository = "https://github.com/baileyrd/rusty_win32"

[dependencies]

[features]
default = []
# Adds `From<Win32Error> for std::io::Error` and other std-only ergonomics.
# The crate is `no_std` without this feature.
std = []

# The edition-2024 defaults this crate actually relies on, re-asserted so
# dropping to edition 2021 (see the `edition` comment above) is a
# manifest-compatibility change and not a safety-discipline change.
[lints.rust]
# 2024 makes this deny-by-default: an `unsafe fn` body is not itself an
# implicit `unsafe` block, so every FFI call inside one still needs its own
# `unsafe { … }` with its own SAFETY comment. That is how this crate is
# already written throughout — this keeps it enforced.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "warn"
