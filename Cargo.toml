sessionmgr-core = { path = "crates/rusty_yirp/crates/sessionmgr-core" }
sessionmgr-protocol = { path = "crates/rusty_yirp/crates/sessionmgr-protocol" }
sessionmgr-proc = { path = "crates/rusty_yirp/crates/sessionmgr-proc" }
sessionmgr-git = { path = "crates/rusty_yirp/crates/sessionmgr-git" }
sessionmgr-pty = { path = "crates/rusty_yirp/crates/sessionmgr-pty" }
sessionmgr-tui = { path = "crates/rusty_yirp/crates/sessionmgr-tui" }
sessionmgr-agents = { path = "crates/rusty_yirp/crates/sessionmgr-agents" }
ratatui = "0.30"
crossterm = "0.29"
tui-term = "0.3"
vt100 = "0.16"
