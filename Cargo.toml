[package]
name = "rusty_gpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A #![no_std] + alloc sovereign CPU software framebuffer presenter and SIMD vector rasterizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_gpu"
keywords = ["gpu", "framebuffer", "rasterizer", "graphics", "no-std"]
categories = ["graphics", "no-std"]

[dependencies]
# Pinned git deps, not path deps: a `git = "..."` Cargo dependency on
# this crate clones only this one repository, so a sibling `../rusty_simd`
# checkout doesn't exist for any external consumer (see rusty_std's
# Cargo.toml for the same fix, and rusty_tokio#254).
rusty_simd = { git = "https://github.com/baileyrd/rusty_simd", rev = "38d3fae033d716d8616ef37f087004816d055264" }
rusty_gui = { git = "https://github.com/baileyrd/rusty_gui", rev = "a00d8167a24506e8ebff9b496869a2f07cfc0a2e" }
rusty_font = { git = "https://github.com/baileyrd/rusty_font", rev = "2177686f81506028685046008bd9e535d6476942" }
rusty_std = { git = "https://github.com/baileyrd/rusty_std", rev = "99135f32afc48e868d3e17b6e234db4162e1c758" }

[target.'cfg(windows)'.dependencies]
rusty_win32 = { git = "https://github.com/baileyrd/rusty_win32", rev = "0c13c780069812e859741c383cebc20fe0647e3f" }

[features]
default = []
