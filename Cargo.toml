# cargo-fuzz needs nightly; kept out of ordinary workspace builds, same as
# it was excluded from rusty_term's own workspace before the merge.
# crates/rusty_lines/bench is a standalone on-demand benchmark harness
# (rusty_lines vs rustyline vs reedline) with no `[workspace]` table of its
# own, run only via `cd crates/rusty_lines/bench && cargo run --release` —
# excluded so it doesn't try to join this workspace.
# crates/rusty_libc/bench is the same shape: its own standalone `[workspace]`
# comparing rusty_libc against the `libc` crate, deliberately outside the
# library's own zero-dependency build.
exclude = [
    "crates/rusty_term/fuzz",
    "crates/rush/fuzz",
    "crates/rusty_lines/bench",
    "crates/rusty_libc/bench",
    "crates/rusty_tls/fuzz",
    "crates/rusty_lsp/fuzz",
    "crates/rustils/fuzz",
    "crates/rusty_croc/fuzz",
    "crates/rusty_key/desktop/src-tauri",
    # nexus's Tauri desktop shell (`shell/src-tauri`, crate `nexus-shell`)
    # was excluded from nexus's own workspace too: it is built by `tauri
    # build` from the pnpm side, carries its own dependency graph (tauri
    # plugins, WebKitGTK), and is not a `cargo test` target.
    "crates/nexus/shell",
]

# Hoisted from rusty_search's own former `[workspace.package]`/
# `[workspace.dependencies]` tables (it was its own nested Cargo workspace
# before this merge, de-inherited the same way as rustils_async/rusty_err).
# Only rusty_search's own 12 crates opt into these via `field.workspace =
# true` -- every other crate in this workspace keeps its own literal
# `[package]`/`[dependencies]` and is unaffected.
#
# rusty_db was a second nested workspace with its own `[workspace.package]`
# (version/edition/license/repository) -- its license and repository
# collided with rusty_search's own values above, so unlike rusty_search,
# rusty_db's six crates were converted to literal `[package]` fields
# instead of being hoisted into `[workspace.package]`. Only its
# *dependencies* are hoisted below (their keys don't collide), reusing
# rusty_search's `async-trait`/`serde_json` entries as-is and widening
# `tokio`'s feature set to the union both crates need.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_search"
authors = ["rusty_search contributors"]
# rusty_test's own former `[workspace.package]` carried only edition/license/
# publish. Its edition ("2021") and license ("MIT OR Apache-2.0") match the
# values already here exactly, so -- unlike rusty_db/rustils -- its six
# crates keep inheriting via `field.workspace = true`; only `publish` was
# new, added here and opted into by those six crates alone.
publish = false

[workspace.dependencies]
rusty-search-core = { path = "crates/rusty_search/crates/rusty-search-core", version = "0.1.0" }
rusty-search-memory = { path = "crates/rusty_search/crates/rusty-search-memory", version = "0.1.0" }
rusty-search-tantivy = { path = "crates/rusty_search/crates/rusty-search-tantivy", version = "0.1.0" }
rusty-search-sqlite-fts5 = { path = "crates/rusty_search/crates/rusty-search-sqlite-fts5", version = "0.1.0" }
rusty-search-elasticsearch = { path = "crates/rusty_search/crates/rusty-search-elasticsearch", version = "0.1.0" }
rusty-search-meilisearch = { path = "crates/rusty_search/crates/rusty-search-meilisearch", version = "0.1.0" }
rusty-search-opensearch = { path = "crates/rusty_search/crates/rusty-search-opensearch", version = "0.1.0" }
rusty-search-solr = { path = "crates/rusty_search/crates/rusty-search-solr", version = "0.1.0" }
rusty-search-algolia = { path = "crates/rusty_search/crates/rusty-search-algolia", version = "0.1.0" }
rusty-search-azure-search = { path = "crates/rusty_search/crates/rusty-search-azure-search", version = "0.1.0" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is rusty_adk's requirement (its SQLite session store
# holds events as JSON and round-trips an f64 timestamp through them);
# serde_json feature unification makes it global anyway, so it is declared
# here rather than hidden in one member.
serde_json = { version = "1", features = ["float_roundtrip"] }
# rusty_serde is now a sibling in this same workspace -- plain path
# dependency (previously a pinned git rev, matching the pattern used for
# every other pin retired in this series).
rusty_serde = { path = "crates/rusty_serde/rusty_serde", features = ["derive"] }
# Feature set is the union of what rusty_search, rusty_db and rusty_skillopt
# each need -- widened rather than split, so one tokio serves all three.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-util",
    "io-std",
    # rusty_provider asks for the "full" bundle; Cargo unifies tokio's
    # features across the graph anyway, so it is declared here rather than
    # hidden in one member manifest.
    "full",
] }
tantivy = "0.26"

# rusty_db's own five crates (path deps, mirroring rusty-search-* above).
rusty-db-core = { path = "crates/rusty_db/crates/rusty-db-core", version = "0.1.0" }
rusty-db-derive = { path = "crates/rusty_db/crates/rusty-db-derive", version = "0.1.0" }
rusty-db-sqlite = { path = "crates/rusty_db/crates/rusty-db-sqlite", version = "0.1.0" }
rusty-db-postgres = { path = "crates/rusty_db/crates/rusty-db-postgres", version = "0.1.0" }
rusty-db-mysql = { path = "crates/rusty_db/crates/rusty-db-mysql", version = "0.1.0" }
# Already-merged siblings rusty_db depends on -- plain path dependencies,
# same pin-retirement pattern as everywhere else in this series.
rusty_tokio = { path = "crates/rusty_tokio" }
rusty_wire = { path = "crates/rusty_wire" }
rusty_json = { path = "crates/rusty_json" }
rusty_std = { path = "crates/rusty_std" }
thiserror = "1"
futures-core = "0.3"
# `sink` is nexus-collab's (WebSocket relay writes); `futures-util`'s
# default set does not include it.
futures-util = { version = "0.3", features = ["sink"] }
async-stream = "0.3"
# Bumped 0.8 -> 0.9 by the nexus merge: sqlx-sqlite 0.8.x hard-pins
# `libsqlite3-sys ^0.30.1`, which collides (Cargo's `links = "sqlite3"`
# uniqueness rule) with the `libsqlite3-sys ^0.37` that nexus's `rusqlite`
# 0.39 needs; sqlx-sqlite 0.9.0 widens its own range to
# `>=0.30.1, <0.38.0`, which admits both. Feature names used across this
# workspace (`runtime-tokio`, `tls-rustls`, `tls-rustls-ring`, `sqlite`,
# `postgres`, `uuid`, `chrono`, `json`) are all unchanged in 0.9 (some are
# now backwards-compat aliases for renamed internals, per sqlx's own
# CHANGELOG). MSRV for 0.9 is 1.94.0; this workspace's toolchain is pinned
# above that. Verified with `cargo check` on every direct sqlx consumer
# (rp-core/rusty-db-sqlite/rusty-acp's postgres-store feature) plus the
# nexus rusqlite consumers, not just `cargo metadata`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
proc-macro-crate = "3"
# `v5`/`v7` are nexus's (deterministic note ids and time-ordered ids).
uuid = { version = "1", features = ["v4", "serde", "v5", "v7"] }
bigdecimal = "0.4"
# `serde` is rusty_skillopt's requirement; rusty_db only needs the base crate.
chrono = { version = "0.4", features = ["serde"] }

# Hoisted from rustils' own former `[workspace.package]`/
# `[workspace.dependencies]` tables (it was its own nested Cargo workspace
# before this merge, de-inherited the same way as rusty_search: its
# `license = "MIT"` collides with rusty_search's `"MIT OR Apache-2.0"`
# above, and its `version = "0.27.0"` collides with rusty_search's
# `"0.1.0"`, so rustils' own eight crates keep literal `[package]` fields
# instead of `field.workspace = true`. Only its *dependencies* are hoisted
# here. `thiserror` is already hoisted above for rusty_db's own use.
platform = { path = "crates/rustils/crates/platform" }
platform-mock = { path = "crates/rustils/crates/platform-mock" }
platform-parity = { path = "crates/rustils/crates/platform-parity" }
platform-linux = { path = "crates/rustils/crates/platform-linux" }
platform-windows = { path = "crates/rustils/crates/platform-windows" }
platform-bsd = { path = "crates/rustils/crates/platform-bsd" }
winargv = { path = "crates/rustils/crates/winargv" }
libc = "0.2"

# Hoisted from rusty_test's own former `[workspace.dependencies]` (its
# `[workspace.package]` didn't collide, so it was hoisted rather than
# de-inherited -- the rusty_search treatment, not the rusty_db one).
# `thiserror` is deliberately NOT hoisted from there: rusty_test asked for
# "2.0" while this root already pins "1" for rusty_db/rustils, so
# `contract` keeps a literal `thiserror = "2"` of its own rather than
# forcing a major bump on unrelated crates.
contract = { path = "crates/rusty_test/crates/contract" }
compat = { path = "crates/rusty_test/crates/compat" }
conformance = { path = "crates/rusty_test/crates/conformance" }
cap-std = "4.0"
portable-pty = "0.9"
dirs = "6.0"
anyhow = "1.0"

# Hoisted from rusty_inventrory's own former `[workspace.dependencies]`.
# Its `[workspace.package]` collided with this root's (rust-version 1.82 vs
# 1.75, license MIT vs "MIT OR Apache-2.0", its own repository URL), so its
# three crates carry literal `[package]` fields instead -- the rusty_db
# treatment, not rusty_search's. `anyhow`/`serde`/`serde_json` above already
# cover its requirements; `thiserror` is the same "2" vs "1" split as
# rusty_test's, so inventory-core keeps a literal one of its own.
inventory-core = { path = "crates/rusty_inventrory/crates/inventory-core" }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
# nexus asks for "0.39" + `backup` (bundled sqlite3 links natively, so only
# one rusqlite version may exist in the whole graph -- Cargo's `links`
# uniqueness rule, stricter than ordinary duplicate-version tolerance);
# widened to the higher version rather than kept literal like the other
# six nexus collisions. `backup` is a no-op for inventory-core, whose own
# feature list only asks for `bundled`.
rusqlite = { version = "0.39", features = ["bundled", "backup"] }

# Hoisted from rusty_skillopt's own former `[workspace.dependencies]`. Its
# `[workspace.package]` collided on `license` ("MIT" vs. this root's
# "MIT OR Apache-2.0"), so its four crates carry literal `[package]` fields
# -- the rusty_db treatment again. `async-trait`/`serde`/`serde_json`/
# `anyhow`/`chrono`/`tracing`/`tokio` above already cover its requirements;
# `thiserror` is the same "2"-vs-"1" split rusty_test and rusty_inventrory
# hit, so its two consumers keep literal ones.
skillopt-core = { path = "crates/rusty_skillopt/crates/skillopt-core" }
skillopt-model = { path = "crates/rusty_skillopt/crates/skillopt-model" }
skillopt-envs = { path = "crates/rusty_skillopt/crates/skillopt-envs" }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    # reqwest 0.13 renamed the 0.12-era "rustls-tls"/"rustls-tls-native-roots"
    # features to a single "rustls" feature (native-cert loading is no
    # longer a separate opt-in); the workspace's other direct 0.13
    # consumers (agentgateway*, rusty_acp, rusty-mcp) already use this name.
    "rustls",
    "http2",
    # 0.13 also split RequestBuilder::query()/form() out from the
    # always-on core into their own opt-in features; rp-providers' Gemini
    # client needs "query" for the `?key=` API-key parameter and
    # nexus-mcp's OAuth client-credentials exchange needs "form" for its
    # `application/x-www-form-urlencoded` token request body.
    "query",
    "form",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.8"

# Hoisted from rusty_key's own former `[workspace.dependencies]`. Its
# `[workspace.package]` collided on `rust-version` (1.88 vs. 1.75) and
# `license` ("MIT"), so its eight crates carry literal `[package]` fields --
# rusty_db treatment. `async-trait`/`serde`/`serde_json`/`tokio` above cover
# the rest; `thiserror` is the recurring "2"-vs-"1" split, kept literal on
# the seven rk-* crates that use it. `rmcp` is a third split alongside the
# nexus/root one documented below (nexus "1.3" vs. this root's "3.1"):
# rk-mcp and rk-app pin `rmcp = "0.9"` (two majors behind both), kept
# literal rather than bumped -- the 0.9-to-3.1 API surface changed enough
# (client/transport construction in particular) that a same-PR bump isn't a
# mechanical version-number edit; tracked as a real migration, not drift.
rk-config = { path = "crates/rusty_key/crates/config" }
rk-observe = { path = "crates/rusty_key/crates/observe" }
rk-constrain = { path = "crates/rusty_key/crates/constrain" }
rk-feed = { path = "crates/rusty_key/crates/feed" }
rk-kernel = { path = "crates/rusty_key/crates/kernel" }
rk-mcp = { path = "crates/rusty_key/crates/mcp" }
rk-compose = { path = "crates/rusty_key/crates/compose" }
aisdk = "0.5.2"
schemars = "1.0.4"
toml = "0.8"
# rusty_fedora_agent's own HTTP server: a small *synchronous* server for a
# single unprivileged local agent handling occasional requests -- no real
# concurrent I/O to exploit, so it deliberately does not pull tokio/axum in
# (the same reasoning rustils' own platform crate already applies to keep
# tokio out of the platform layer, see the `rustils` block below). Not used
# anywhere else in the workspace yet.
tiny_http = "0.12"

# Hoisted from rusty_tailscale's own former `[workspace.dependencies]`. Its
# `[workspace.package]` collided on `version` (0.0.1), `edition` (2024) and
# `repository`, so its sixteen crates carry literal `[package]` fields --
# rusty_db treatment. Its two sibling `path` dependencies are re-pathed
# from `../rusty_http`-style (relative to its own former root) to this
# root's `crates/` layout; `platform`/`platform-linux` above already cover
# the pins its ts-magicsock/ts-tun crates used to carry.
ts-types = { path = "crates/rusty_tailscale/crates/ts-types" }
ts-key = { path = "crates/rusty_tailscale/crates/ts-key" }
ts-control = { path = "crates/rusty_tailscale/crates/ts-control" }
ts-derp = { path = "crates/rusty_tailscale/crates/ts-derp" }
ts-stun = { path = "crates/rusty_tailscale/crates/ts-stun" }
ts-disco = { path = "crates/rusty_tailscale/crates/ts-disco" }
ts-magicsock = { path = "crates/rusty_tailscale/crates/ts-magicsock" }
ts-wg = { path = "crates/rusty_tailscale/crates/ts-wg" }
ts-tun = { path = "crates/rusty_tailscale/crates/ts-tun" }
ts-filter = { path = "crates/rusty_tailscale/crates/ts-filter" }
ts-engine = { path = "crates/rusty_tailscale/crates/ts-engine" }
ts-localapi = { path = "crates/rusty_tailscale/crates/ts-localapi" }
ts-net = { path = "crates/rusty_tailscale/crates/ts-net" }
rusty_http = { path = "crates/rusty_http" }
rusty_crypto_key = { path = "crates/rusty_crypto_key" }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
bytes = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
h2 = "0.4"
http = "1"
crypto_box = { version = "0.9", features = ["salsa20"] }
boringtun = "0.7"

# Hoisted from rusty_adk's own former `[workspace.dependencies]`. Its
# `[workspace.package]` collided on `rust-version` (1.85), `license`
# (Apache-2.0) and `repository`, so its fourteen crates carry literal
# `[package]` fields -- rusty_db treatment. `thiserror` ("2") and `schemars`
# ("0.8", against rusty_key's "1.0.4") both stay literal on the crates that
# use them rather than displacing this root's existing entries. `axum` is a
# fourth split: `adk-a2a` (dev-dependency only) and the `a2a-agent-server`
# example pin the older "0.7" line against this root's "0.8" -- a real
# `Router`/`axum::serve` API break between the two (confirmed by attempting
# the bump: `axum::serve` gained an `IntoFuture` bound that a 0.7-built
# `Router` doesn't satisfy when both versions land in the same dependency
# graph), so kept literal and tracked as a migration rather than bumped
# blind.
adk-core = { path = "crates/rusty_adk/crates/adk-core", version = "0.1.0" }
adk-macros = { path = "crates/rusty_adk/crates/adk-macros", version = "0.1.0" }
adk-tools = { path = "crates/rusty_adk/crates/adk-tools", version = "0.1.0" }
adk-models = { path = "crates/rusty_adk/crates/adk-models", version = "0.1.0", default-features = false }
adk-sessions = { path = "crates/rusty_adk/crates/adk-sessions", version = "0.1.0" }
adk-graph = { path = "crates/rusty_adk/crates/adk-graph", version = "0.1.0" }
adk-agents = { path = "crates/rusty_adk/crates/adk-agents", version = "0.1.0" }
adk-runner = { path = "crates/rusty_adk/crates/adk-runner", version = "0.1.0" }
adk-mcp = { path = "crates/rusty_adk/crates/adk-mcp", version = "0.1.0" }
adk-a2a = { path = "crates/rusty_adk/crates/adk-a2a", version = "0.1.0" }
futures = "0.3"
tokio-test = "0.4"
# rusty_a2a is a merged sibling -- retiring adk-a2a's and
# agentgateway-a2a's git dependencies on it. `default-features = false`
# because both ask for it explicitly and an inheriting member may not
# override the root's choice; a no-op either way, since rusty_a2a's own
# `default` feature is empty.
rusty_a2a = { path = "crates/rusty_a2a", default-features = false }

# Hoisted from rusty_provider's own former `[workspace.dependencies]`. Its
# `[workspace.package]` collided on `license` ("MIT"), so its six crates
# carry literal `[package]` fields -- rusty_db treatment. `rusty-mcp` is a
# merged sibling here, retiring rusty_provider's branch-tracking git
# dependency on it.
rp-core = { path = "crates/rusty_provider/crates/core" }
rp-mcp = { path = "crates/rusty_provider/crates/mcp" }
rp-providers = { path = "crates/rusty_provider/crates/providers" }
rp-router = { path = "crates/rusty_provider/crates/router" }
# `default-features = false` because rusty_agent_gateway's crates ask for it
# explicitly and an inheriting member may not override the root's choice.
# A no-op for rusty_provider, which inherits this entry as-is: rusty-mcp's
# own `default` feature is empty.
rusty-mcp = { path = "crates/rusty_mcp/crates/rusty-mcp", default-features = false }
rmcp = { version = "3.1", default-features = false }
axum = { version = "0.8", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
prometheus = { version = "0.13", default-features = false }
wiremock = "0.6"
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs"] }
# `std` is nexus's (TLS pinning in nexus-security); a no-op for the other
# consumers, whose targets all have std anyway.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
ring = "0.17"
regex = "1"
jsonwebtoken = "9"
eventsource-stream = "0.2"

# Hoisted from rusty_yirp's own former `[workspace.dependencies]`. Its
