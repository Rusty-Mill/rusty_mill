[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_tailscale"

[workspace.dependencies]
# Each dependency is justified in DESIGN.md before entering the tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
# Phase 2 (control client) — justified in DESIGN.md:
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
h2 = "0.4"
http = "1"
# Phase 3 (DERP-only data plane) — justified in DESIGN.md:
crypto_box = { version = "0.9", features = ["salsa20"] }
boringtun = "0.7"
# Shared sans-IO HTTP/1.1 layer (rusty ecosystem) — justified in DESIGN.md:
rusty_http = { path = "../rusty_http" }
rusty_crypto_key = { path = "../rusty_crypto_key" }

# Intra-workspace crates
ts-types = { path = "crates/ts-types" }
ts-key = { path = "crates/ts-key" }
ts-control = { path = "crates/ts-control" }
ts-derp = { path = "crates/ts-derp" }
ts-stun = { path = "crates/ts-stun" }
ts-disco = { path = "crates/ts-disco" }
ts-magicsock = { path = "crates/ts-magicsock" }
ts-wg = { path = "crates/ts-wg" }
ts-tun = { path = "crates/ts-tun" }
ts-filter = { path = "crates/ts-filter" }
ts-engine = { path = "crates/ts-engine" }
ts-localapi = { path = "crates/ts-localapi" }
ts-net = { path = "crates/ts-net" }
