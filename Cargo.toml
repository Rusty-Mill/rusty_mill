[workspace]
resolver = "2"
members = ["crates/spike"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
aisdk = "0.5.2"
async-trait = "0.1.88"
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
