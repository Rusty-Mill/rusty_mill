[package]
name = "rusty-keys-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
description = "Rusty Keys desktop frontend (Tauri 2)"
publish = false

# Standalone workspace: the desktop shell is intentionally excluded from the core
# cargo workspace (it pulls Tauri + WebKitGTK), so `cargo build --workspace` at the
# repo root stays lean. It path-depends on the core crates across the boundary.
[workspace]

[lib]
name = "rusty_keys_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rk-app = { path = "../../crates/app" }
rk-config = { path = "../../crates/config" }
rk-constrain = { path = "../../crates/constrain" }
rk-observe = { path = "../../crates/observe" }
rk-compose = { path = "../../crates/compose" }
rk-feed = { path = "../../crates/feed" }
# OpenAI-compatible provider, matching the CLI (`openai` is required alongside
# `openaicompatible` — aisdk 0.5.2 feature-wiring quirk).
aisdk = { version = "0.5.2", features = ["openaicompatible", "openai"] }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process"] }
# OS keychain for provider API keys (PRD 08): keys never live in JS memory. On
# Linux this resolves to the pure-Rust `linux-keyutils` backend (no dbus/C deps).
keyring = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
rk-kernel = { path = "../../crates/kernel", features = ["fake"] }
