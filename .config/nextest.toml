# nextest runs each test in its own process rather than sharing a test
# binary's process the way `cargo test` does -- a test that relied on
# another test's side effects within the same process (shared global
# state, a window/message loop left open, etc.) can hang instead of
# failing outright under this per-process model. Without a timeout that
# hangs the whole CI job indefinitely instead of failing loudly; cap any
# single test at 10 minutes so a regression here shows up as a fast,
# named test failure.
#
# Separately: nextest's per-test-process model means the CI runner is
# constantly spawning and tearing down OS processes throughout the run
# (cargo test instead shares one process across every test in a binary),
# which is much heavier process-creation churn than the workspace's tests
# were tuned against. Live CI runs surfaced three different tests, in
# three different crates, on both OSes, each with its own tight
# CPU-scheduling or local-I/O timing budget (a pool acquire_timeout, a
# task-poll-count assertion, a local TLS handshake's request timeout)
# occasionally missing that budget under the resulting contention --
# never the same test twice, which is the signature of environmental
# flakiness rather than one deterministic bug. `retries` is nextest's own
# sanctioned answer to exactly this: it doesn't weaken or skip a test --
# each one still must genuinely pass -- it just tolerates a transient
# miss the way a flaky-prone CI suite is supposed to, by trying again. A
# test with a real, deterministic bug (like the windows_raw_mode design
# incompatibility fixed separately) still fails every retry and still
# surfaces.
[profile.default]
slow-timeout = { period = "2m", terminate-after = 5 }
retries = 2
