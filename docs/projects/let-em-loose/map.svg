<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" width="1500" height="1120" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b98a5"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ea1ff"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#39c5cf"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <style>
      .t{fill:#e6edf3}.m{fill:#8b98a5}.h{font-size:17px;font-weight:600}.s{font-size:13px}.xs{font-size:11.5px}
      .mono{font-family:Consolas, "Cascadia Mono", Menlo, monospace}
      .panel{fill:#161d26;stroke-width:1.5}
      .chip{fill:#1d2632;stroke:#2a3644}
    </style>
  </defs>

  <rect width="1500" height="1120" fill="#0f1419"/>

  <!-- Title -->
  <text x="40" y="44" class="t" font-size="24" font-weight="700">Let Em Loose: how the pieces fit</text>
  <text x="40" y="68" class="m s">Intent in → critic lenses converge on claims on the BBP board → Nano answers only escalations. Replaces the role pipeline and both approval gates.</text>

  <!-- ============ ROW 1: SOURCES + INTENT ============ -->
  <!-- Factory repo -->
  <rect x="40" y="96" width="420" height="270" rx="12" class="panel" stroke="#4ea1ff"/>
  <text x="60" y="126" class="t h">Factory repo</text>
  <text x="60" y="146" class="m xs">process and config only · knows no project · no code</text>
  <rect x="60" y="160" width="380" height="44" rx="8" class="chip"/>
  <text x="76" y="187" class="t s"><tspan class="mono">lenses/</tspan><tspan class="m xs" dx="10">Adversary · Operator · Research · Holdout</tspan></text>
  <rect x="60" y="212" width="380" height="44" rx="8" class="chip"/>
  <text x="76" y="239" class="t s"><tspan class="mono">knowledge/</tspan><tspan class="m xs" dx="10">59 domain experts → lens prompts</tspan></text>
  <rect x="60" y="264" width="380" height="44" rx="8" class="chip"/>
  <text x="76" y="291" class="t s"><tspan class="mono">standards/</tspan><tspan class="m xs" dx="10">musts → never-rules · shoulds flagged</tspan></text>
  <rect x="60" y="316" width="380" height="40" rx="8" class="chip"/>
  <text x="76" y="341" class="t s"><tspan class="mono">bindings/</tspan><tspan class="m xs" dx="10">lens → adapter → model · tier · fallback</tspan></text>

  <!-- Expert-Agents -->
  <rect x="1040" y="96" width="420" height="270" rx="12" class="panel" stroke="#3fb950"/>
  <text x="1060" y="126" class="t h">Expert-Agents repo</text>
  <text x="1060" y="146" class="m xs">project-bound, grounded in review fixes, benched</text>
  <rect x="1060" y="160" width="380" height="44" rx="8" class="chip"/>
  <text x="1076" y="187" class="t s"><tspan class="mono">experts/&lt;p&gt;</tspan><tspan class="m xs" dx="10">benched reviewers → critic lenses</tspan></text>
  <rect x="1060" y="212" width="380" height="44" rx="8" class="chip"/>
  <text x="1076" y="239" class="t s"><tspan class="mono">developers/&lt;p&gt;</tspan><tspan class="m xs" dx="10">builders, paired with critics</tspan></text>
  <rect x="1060" y="264" width="380" height="44" rx="8" class="chip"/>
  <text x="1076" y="291" class="t s"><tspan class="mono">grounding</tspan><tspan class="m xs" dx="10">defect classes → adversary attacks</tspan></text>
  <rect x="1060" y="316" width="380" height="40" rx="8" class="chip"/>
  <text x="1076" y="341" class="t s"><tspan class="mono">bench/</tspan><tspan class="m xs" dx="10">seeds each lens's track record</tspan></text>

  <!-- Intent -->
  <rect x="520" y="96" width="460" height="270" rx="12" class="panel" stroke="#d29922" stroke-width="2"/>
  <text x="540" y="126" class="t h">Intent</text>
  <text x="540" y="146" class="m xs mono">INTENT.md in the target repo · versioned · all Nano writes</text>
  <g class="s">
    <text x="540" y="176" class="t">Goal</text>          <text x="680" y="176" class="m xs">← interview by example (~15 min)</text>
    <text x="540" y="201" class="t">Targets</text>       <text x="680" y="201" class="m xs">← speed, scale, reference hardware</text>
    <text x="540" y="226" class="t">Always</text>        <text x="680" y="226" class="m xs">→ invariants become property tests</text>
    <text x="540" y="251" class="t">Never</text>         <text x="680" y="251" class="m xs">→ never-rules become holdout tests</text>
    <text x="540" y="276" class="t">Examples</text>      <text x="680" y="276" class="m xs">← concrete good and bad cases</text>
    <text x="540" y="301" class="t">Taste</text>         <text x="680" y="301" class="m xs">← tools whose feel is right</text>
    <text x="540" y="326" class="t">Reversibility</text> <text x="680" y="326" class="m xs">→ what must reach the inbox</text>
  </g>
  <text x="540" y="352" class="xs" fill="#d29922">Edits bump the version and reopen exactly the claims proven against it</text>

  <!-- ============ ROW 2: ORCH ============ -->
  <rect x="300" y="410" width="900" height="92" rx="12" class="panel" stroke="#a371f7"/>
  <text x="320" y="438" class="t h">orch: the model-independent engine</text>
  <text x="320" y="464" class="s t">Port + adapters: <tspan fill="#a371f7">Claude · OpenAI/Codex · Gemini · local llama-swap</tspan><tspan class="m" dx="6">· swapping a model is a config edit</tspan></text>
  <text x="320" y="488" class="xs m">Fresh context per question: intent + the claim + its evidence + settled claims + track record · blind first pass · a rebel candidate required</text>

  <path d="M250,366 C250,400 280,430 296,440" stroke="#4ea1ff" stroke-width="1.6" fill="none" marker-end="url(#aB)"/>
  <text x="242" y="394" class="xs" fill="#4ea1ff" text-anchor="end">lens prompts</text>
  <path d="M750,366 L750,406" stroke="#d29922" stroke-width="1.6" fill="none" marker-end="url(#aA)"/>
  <text x="758" y="392" class="xs" fill="#d29922">intent</text>
  <path d="M1250,366 C1250,400 1220,430 1204,440" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#aG)"/>
  <text x="1264" y="398" class="xs" fill="#3fb950">grounding</text>

  <!-- ============ ROW 3: BOARD ============ -->
  <rect x="30" y="544" width="1440" height="316" rx="12" fill="#121922" stroke="#2a3644"/>
  <text x="50" y="572" class="t h">Lenses</text>
  <text x="294" y="572" class="t h">BBP board</text>
  <text x="390" y="572" class="m xs">claims converge · no stages, no turns · evidence posted any time</text>

  <!-- orch -> lenses, orch -> board -->
  <path d="M300,470 C262,470 232,520 232,588" stroke="#a371f7" stroke-width="1.6" fill="none" marker-end="url(#aP)"/>
  <path d="M850,502 L850,588" stroke="#a371f7" stroke-width="1.6" fill="none" marker-end="url(#aP)"/>
  <text x="858" y="540" class="xs" fill="#a371f7">wakes subscribed lenses · asks</text>

  <!-- Lenses -->
  <g>
    <rect x="50" y="592" width="200" height="44" rx="8" fill="#1d2632" stroke="#a371f7" stroke-width="1.5"/>
    <text x="64" y="610" class="t s" font-weight="600">Builder <tspan class="m xs" font-weight="400">· Claude</tspan></text>
    <text x="64" y="627" class="m xs">code + tests in a sandbox</text>
    <rect x="50" y="644" width="200" height="44" rx="8" fill="#1d2632" stroke="#a371f7" stroke-width="1.5"/>
    <text x="64" y="662" class="t s" font-weight="600">Adversary <tspan class="m xs" font-weight="400">· Codex</tspan></text>
    <text x="64" y="679" class="m xs">how does this break?</text>
    <rect x="50" y="696" width="200" height="44" rx="8" fill="#1d2632" stroke="#a371f7" stroke-width="1.5"/>
    <text x="64" y="714" class="t s" font-weight="600">Research <tspan class="m xs" font-weight="400">· Gemini</tspan></text>
    <text x="64" y="731" class="m xs">prior art, cited, never copied</text>
    <rect x="50" y="748" width="200" height="44" rx="8" fill="#1d2632" stroke="#a371f7" stroke-width="1.5"/>
    <text x="64" y="766" class="t s" font-weight="600">Operator <tspan class="m xs" font-weight="400">· local</tspan></text>
    <text x="64" y="783" class="m xs">kill it mid-run, odd disks</text>
    <rect x="50" y="800" width="200" height="44" rx="8" fill="#1d2632" stroke="#39c5cf" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="64" y="818" class="t s" font-weight="600">Holdout <tspan class="m xs" font-weight="400">· local</tspan></text>
    <text x="64" y="835" class="m xs">tests builders never see</text>
  </g>
  <g stroke="#8b98a5" stroke-width="1.4" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <path d="M254,614 L290,614"/>
    <path d="M254,666 L290,666"/>
    <path d="M254,718 L290,718"/>
    <path d="M254,770 L290,770"/>
    <path d="M254,822 L290,822"/>
  </g>

  <!-- Board surface -->
  <rect x="294" y="592" width="826" height="208" rx="10" fill="#0f151c" stroke="#2a3644" stroke-width="1.5"/>

  <!-- C1 settled -->
  <g opacity="0.55">
    <rect x="320" y="612" width="240" height="64" rx="8" fill="#1d2632" stroke="#2a3644"/>
    <text x="334" y="630" class="t s" font-weight="600">C1 · hash cascade</text>
    <text x="334" y="646" class="m xs">size → partial → full hash</text>
    <text x="334" y="662" class="xs" fill="#3fb950">92% · settled, compacted</text>
    <rect x="334" y="668" width="212" height="3" rx="1.5" fill="#2a3644"/><rect x="334" y="668" width="195" height="3" rx="1.5" fill="#3fb950"/>
  </g>
  <!-- C4 -->
  <rect x="320" y="700" width="240" height="64" rx="8" fill="#1d2632" stroke="#8b98a5"/>
  <text x="334" y="718" class="t s" font-weight="600">C4 · never lose the last copy</text>
  <text x="334" y="734" class="m xs">never-rule as a property test</text>
  <text x="334" y="750" class="m xs">87% · rising</text>
  <rect x="334" y="756" width="212" height="3" rx="1.5" fill="#2a3644"/><rect x="334" y="756" width="184" height="3" rx="1.5" fill="#8b98a5"/>
  <!-- C2 irreversible -->
  <rect x="620" y="612" width="240" height="64" rx="8" fill="#2a1416" stroke="#f85149" stroke-width="2"/>
  <text x="634" y="630" class="t s" font-weight="600">C2 · hardlink swap</text>
  <text x="634" y="646" class="m xs">within one volume, else report</text>
  <text x="634" y="662" class="xs" fill="#f85149">91% · irreversible → inbox</text>
  <rect x="634" y="668" width="212" height="3" rx="1.5" fill="#2a3644"/><rect x="634" y="668" width="193" height="3" rx="1.5" fill="#f85149"/>
  <!-- C3 fork -->
  <rect x="620" y="700" width="240" height="64" rx="8" fill="#1d2632" stroke="#e3b341" stroke-dasharray="5 4"/>
  <text x="634" y="718" class="t s" font-weight="600">C3 · scan index</text>
  <text x="634" y="734" class="m xs">SQLite vs append-only log</text>
  <text x="634" y="750" class="xs" fill="#e3b341">50 / 50 → fork, crash both</text>
  <!-- dependency -->
  <path d="M560,644 L616,644" stroke="#8b98a5" stroke-width="1.3" fill="none" marker-end="url(#a)"/>
  <text x="566" y="636" class="m xs">needs</text>

  <!-- Asked next -->
  <rect x="890" y="612" width="210" height="152" rx="8" fill="#1d2632" stroke="#2a3644"/>
  <text x="904" y="632" class="t s" font-weight="600">Asked next</text>
  <text x="904" y="650" class="m xs">score = doubt × stakes ÷ cost</text>
  <text x="904" y="676" class="t xs">1. C3 → Operator: crash both</text>
  <text x="904" y="696" class="t xs">2. C4 → Adversary: break it</text>
  <text x="904" y="716" class="t xs">3. C2 → inbox (one-way)</text>
  <text x="904" y="736" class="m xs">C1 settled: not asked</text>
  <text x="904" y="754" class="m xs">stops when nothing is worth it</text>

  <!-- rules strip -->
  <rect x="294" y="808" width="826" height="40" rx="8" fill="#1a2230" stroke="#2a3644"/>
  <text x="308" y="824" class="xs t">Board computes confidence · weight: tests &gt; measurements &gt; citations &gt; opinion · agreement must cite an artefact</text>
  <text x="308" y="841" class="xs m">Accept ≥ 90% · drop ≤ 10% · irreversible always escalates · stop when settled · budget scales with stakes</text>

  <!-- C2 -> inbox -->
  <path d="M740,612 L740,602 L1132,602 L1132,636 L1146,636" stroke="#f85149" stroke-width="1.6" fill="none" marker-end="url(#aR)"/>

  <!-- Right column -->
  <rect x="1150" y="592" width="300" height="118" rx="10" fill="#2a1416" stroke="#f85149" stroke-width="2"/>
  <text x="1166" y="616" class="t s" font-weight="600">Decision inbox <tspan class="m xs" font-weight="400">· Nano · usually empty</tspan></text>
  <text x="1166" y="640" class="xs" fill="#f85149">irreversible · taste · deadlock · budget</text>
  <text x="1166" y="660" class="m xs">one card: decision, confidence, evidence,</text>
  <text x="1166" y="676" class="m xs">and a dry run of what would change</text>
  <text x="1166" y="698" class="t xs">Approve · Reject · Refine intent</text>
  <rect x="1150" y="728" width="300" height="46" rx="10" fill="#1d2632" stroke="#2a3644" stroke-width="1.5"/>
  <text x="1166" y="748" class="t s" font-weight="600">Shadow run</text>
  <text x="1166" y="765" class="m xs">read-only on real data · reports what it would do</text>
  <rect x="1150" y="792" width="300" height="52" rx="10" fill="#1d2632" stroke="#2a3644" stroke-width="1.5"/>
  <text x="1166" y="814" class="t s" font-weight="600">PR opened</text>
  <text x="1166" y="832" class="m xs">a human merges · agents never merge</text>
  <path d="M1300,710 L1300,724" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M1300,774 L1300,788" stroke="#8b98a5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- Refine intent loop -->
  <path d="M1430,592 L1430,386 L900,386 L900,370" stroke="#d29922" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#aA)"/>
  <text x="1422" y="536" class="xs" fill="#d29922" text-anchor="end">Refine intent → intent v+1</text>

  <!-- ============ ROW 4: LEARNING LOOP ============ -->
  <path d="M1300,844 L1300,886" stroke="#39c5cf" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#aT)"/>
  <text x="1308" y="872" class="xs" fill="#39c5cf">every run</text>

  <rect x="40" y="890" width="1420" height="196" rx="12" class="panel" stroke="#39c5cf"/>
  <text x="60" y="920" class="t h">Learning loop: after every run</text>
  <text x="60" y="942" class="m xs">Ground truth sits outside the agents' loop · models are config; adversarial lenses never share the Builder's provider · agents never call each other</text>

  <rect x="60" y="960" width="250" height="104" rx="10" fill="#1d2632" stroke="#39c5cf"/>
  <text x="76" y="986" class="t s" font-weight="600">Ground truth</text>
  <text x="76" y="1008" class="m xs">golden set signed off by Nano</text>
  <text x="76" y="1026" class="m xs">holdout tests builders never see</text>
  <text x="76" y="1044" class="m xs">catches agents agreeing wrongly</text>

  <rect x="340" y="960" width="250" height="104" rx="10" fill="#1d2632" stroke="#39c5cf"/>
  <text x="356" y="986" class="t s" font-weight="600">Calibration</text>
  <text x="356" y="1008" class="m xs">accepted at 90% should hold</text>
  <text x="356" y="1026" class="m xs">about 90% of the time</text>
  <text x="356" y="1044" class="m xs">→ retune evidence weights</text>

  <rect x="620" y="960" width="250" height="104" rx="10" fill="#1d2632" stroke="#39c5cf"/>
  <text x="636" y="986" class="t s" font-weight="600">Track records</text>
  <text x="636" y="1008" class="m xs">difficulty-weighted, per lens</text>
  <text x="636" y="1026" class="m xs">right on hard claims counts most</text>
  <text x="636" y="1044" class="m xs">→ lens weight on the board</text>

  <rect x="900" y="960" width="250" height="104" rx="10" fill="#1d2632" stroke="#39c5cf"/>
  <text x="916" y="986" class="t s" font-weight="600">Lessons</text>
  <text x="916" y="1008" class="m xs">→ remind-me, project-tagged</text>
  <text x="916" y="1026" class="m xs">research lens reads them next run</text>
  <text x="916" y="1044" class="m xs">process change → Factory repo</text>

  <g stroke="#39c5cf" stroke-width="1.6" fill="none" marker-end="url(#aT)">
    <path d="M310,1012 L336,1012"/><path d="M590,1012 L616,1012"/><path d="M870,1012 L896,1012"/>
  </g>

  <!-- legend -->
  <g class="xs">
    <rect x="1180" y="964" width="14" height="14" rx="3" fill="none" stroke="#d29922"/><text x="1202" y="976" class="m">intent (Nano writes)</text>
    <rect x="1180" y="982" width="14" height="14" rx="3" fill="none" stroke="#4ea1ff"/><text x="1202" y="994" class="m">Factory repo (config)</text>
    <rect x="1180" y="1000" width="14" height="14" rx="3" fill="none" stroke="#3fb950"/><text x="1202" y="1012" class="m">Expert-Agents (benched)</text>
    <rect x="1180" y="1018" width="14" height="14" rx="3" fill="none" stroke="#a371f7"/><text x="1202" y="1030" class="m">orch and lenses</text>
    <rect x="1180" y="1036" width="14" height="14" rx="3" fill="none" stroke="#f85149"/><text x="1202" y="1048" class="m">escalation to Nano</text>
    <rect x="1180" y="1054" width="14" height="14" rx="3" fill="none" stroke="#39c5cf"/><text x="1202" y="1066" class="m">ground truth and learning</text>
  </g>
</svg>
