<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 840" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="840" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#1f2530">rustils — target architecture: four layers, plus the beside-the-PAL shelf</text>
  <text x="24" y="54" font-size="12" fill="#5b6472">docs/architecture.md (A3 amendment) · Complete Sovereign Micro-Crates &amp; Beside-the-PAL Topology</text>

  <!-- ══════════ LAYER 3 — Application ══════════ -->
  <rect x="24" y="74" width="640" height="132" rx="8" fill="#eef3fa" stroke="#7d97bd" stroke-width="1.5"/>
  <text x="40" y="98" font-size="14" font-weight="700" fill="#2a4468">LAYER 3 — Application &amp; Domain Services</text>
  <text x="40" y="120" font-size="13" fill="#1f2530">rush · coreutils · rusty_tail · rusty_naner · rusty_lsp · SHH · rusty_rdp</text>
  <text x="40" y="139" font-size="13" fill="#1f2530">rusty_whisper · rusty_llama · rusty_ansder (RAG Engine) · rusty_term · rusty_croc</text>
  <text x="40" y="158" font-size="13" fill="#1f2530">rusty_request · rusty_provider · rusty_search · rusty_db · rusty_compactor</text>
  <text x="40" y="180" font-size="12" fill="#5b6472" font-style="italic">meta-workspace orchestrator: cargo-xtask (audit-pins &amp; check-all CLI)</text>

  <!-- ══════════ Runtime strip ══════════ -->
  <rect x="24" y="222" width="640" height="52" rx="8" fill="#f6f1e7" stroke="#bda774" stroke-width="1.5"/>
  <text x="40" y="244" font-size="14" font-weight="700" fill="#6b5926">RUNTIME — rusty_tokio</text>
  <text x="40" y="263" font-size="12.5" fill="#1f2530">hand-rolled async runtime; epoll/IOCP reactor on PAL's raw-fd seam · TLS-free work-stealing scheduler</text>

  <!-- ══════════ LAYER 2 — PAL ══════════ -->
  <rect x="24" y="290" width="640" height="116" rx="8" fill="#eef7ef" stroke="#7dab84" stroke-width="1.5"/>
  <text x="40" y="314" font-size="14" font-weight="700" fill="#2c5c34">LAYER 2 — Platform Abstraction Layer (platform crate)</text>
  <text x="40" y="336" font-size="13" fill="#1f2530">Fs · Process · Events · Net (TCP/Unix/UDP) · Tun · Security (Csprng, Sandbox)</text>
  <text x="40" y="355" font-size="13" fill="#1f2530">errors · parity · mock</text>
  <text x="40" y="377" font-size="12" fill="#5b6472">gated (§3): Terminal · Windowing · Registry/Config · CredentialStore</text>
  <text x="40" y="395" font-size="12" fill="#5b6472" font-style="italic">no TLS concept in any trait — permanent, by design (D16 / net.md)</text>

  <!-- ══════════ LAYER 1 — OS Implementation ══════════ -->
  <rect x="24" y="422" width="640" height="86" rx="8" fill="#f4eef7" stroke="#a184b3" stroke-width="1.5"/>
  <text x="40" y="446" font-size="14" font-weight="700" fill="#5a3d6e">LAYER 1 — OS Implementation (all unsafe lives here)</text>
  <text x="40" y="468" font-size="13" fill="#1f2530">platform-linux (libc floor · rusty_libc track-p) · platform-windows (windows-sys floor)</text>
  <text x="40" y="487" font-size="13" fill="#1f2530">platform-macos (net-only slice)</text>

  <!-- ══════════ LAYER 0 — OS Kernel ══════════ -->
  <rect x="24" y="524" width="640" height="60" rx="8" fill="#f1f2f4" stroke="#8b93a1" stroke-width="1.5"/>
  <text x="40" y="548" font-size="14" font-weight="700" fill="#3c4450">LAYER 0 — OS Kernel</text>
  <text x="40" y="570" font-size="13" fill="#1f2530">Linux kernel ABI · Windows NT kernel · XNU (BSD sockets slice)</text>

  <!-- ══════════ Beside-the-PAL shelf ══════════ -->
  <rect x="692" y="74" width="264" height="690" rx="8" fill="#fbf3f3" stroke="#bb8383" stroke-width="1.5"/>
  <text x="708" y="98" font-size="14" font-weight="700" fill="#7a3b3b">BESIDE THE PAL</text>
  <text x="708" y="116" font-size="11.5" fill="#5b6472">OS-independent protocol / format</text>
  <text x="708" y="131" font-size="11.5" fill="#5b6472">libraries — serve the applications,</text>
  <text x="708" y="146" font-size="11.5" fill="#5b6472">need no abstraction layer</text>

  <!-- built: rusty_lines & rusty_regx -->
  <rect x="708" y="158" width="232" height="42" rx="6" fill="#eef7ef" stroke="#7dab84"/>
  <text x="722" y="177" font-size="12" font-weight="700" fill="#1f2530">rusty_lines · rusty_regx</text>
  <text x="722" y="191" font-size="11" fill="#2c5c34">built — readline &amp; POSIX-ERE regex</text>

  <!-- built: rusty_tls -->
  <rect x="708" y="206" width="232" height="42" rx="6" fill="#eef7ef" stroke="#7dab84"/>
  <text x="722" y="225" font-size="12" font-weight="700" fill="#1f2530">rusty_tls</text>
  <text x="722" y="239" font-size="11" fill="#2c5c34">built — sans-IO TLS engine</text>

  <!-- built: rusty_http & rusty_json -->
  <rect x="708" y="254" width="232" height="42" rx="6" fill="#eef7ef" stroke="#7dab84"/>
  <text x="722" y="273" font-size="12" font-weight="700" fill="#1f2530">rusty_http · rusty_json</text>
  <text x="722" y="287" font-size="11" fill="#2c5c34">built — sans-IO HTTP/1.1 &amp; JSON</text>

  <!-- built: rusty_wire & rusty_der -->
  <rect x="708" y="302" width="232" height="42" rx="6" fill="#eef7ef" stroke="#7dab84"/>
  <text x="722" y="321" font-size="12" font-weight="700" fill="#1f2530">rusty_wire · rusty_der</text>
  <text x="722" y="335" font-size="11" fill="#2c5c34">built — byte cursor &amp; ASN.1 DER</text>

  <!-- built: rusty_ansi & winargv -->
  <rect x="708" y="350" width="232" height="42" rx="6" fill="#eef7ef" stroke="#7dab84"/>
  <text x="722" y="369" font-size="12" font-weight="700" fill="#1f2530">rusty_ansi · winargv</text>
  <text x="722" y="383" font-size="11" fill="#2c5c34">built — ANSI parser &amp; POSIX quoting</text>

  <!-- built: rusty_compress & rusty_config -->
  <rect x="708" y="398" width="232" height="42" rx="6" fill="#eef7ef" stroke="#7dab84"/>
  <text x="722" y="417" font-size="12" font-weight="700" fill="#1f2530">rusty_compress · rusty_config</text>
  <text x="722" y="431" font-size="11" fill="#2c5c34">built — DEFLATE &amp; INI/KV parser</text>

  <!-- built: rusty_crypto_key & rusty_simd -->
  <rect x="708" y="446" width="232" height="42" rx="6" fill="#eef7ef" stroke="#7dab84"/>
  <text x="722" y="465" font-size="12" font-weight="700" fill="#1f2530">rusty_crypto_key · rusty_simd</text>
  <text x="722" y="479" font-size="11" fill="#2c5c34">built — zeroize storage &amp; SIMD kernels</text>

  <!-- notes -->
  <text x="708" y="515" font-size="10.5" fill="#2c5c34" font-weight="700">✅ All 10 shelf libraries extracted &amp; built</text>
  <text x="708" y="533" font-size="10.5" fill="#5b6472" font-style="italic">100% SHA-pinned inter-repo dependencies</text>
  <text x="708" y="551" font-size="10.5" fill="#5b6472" font-style="italic">Governed by cargo-xtask audit-pins</text>

  <!-- ══════════ Arrows ══════════ -->
  <line x1="344" y1="206" x2="344" y2="220" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="344" y1="274" x2="344" y2="288" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="344" y1="406" x2="344" y2="420" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="344" y1="508" x2="344" y2="522" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- apps use the shelf -->
  <line x1="666" y1="140" x2="690" y2="140" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="24" y="780" font-size="12" fill="#5b6472">Consumers pull the PAL into shape; the PAL never speculates (§3). Shelf libraries follow the same gate: extracted only where two-plus repos</text>
  <text x="24" y="798" font-size="12" fill="#5b6472">demonstrably duplicate the logic today. TLS layers over the plain stream above the trait boundary — never inside Net.</text>
  <text x="24" y="816" font-size="12" fill="#5b6472">Shelf build order: rusty_wire → rusty_der; rusty_simd → rusty_llama / rusty_whisper; rusty_tls, rusty_http, rusty_json independent.</text>
</svg>
