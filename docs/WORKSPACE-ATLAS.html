<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rusty Mill Atlas</title>
<meta name="description" content="An interactive map of all crates in the Rusty-Mill/rusty_mill Cargo workspace — browse by layer, search, and inspect dependents.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#faf7f0;
    --surface:#ffffff;
    --surface-2:#f2ecdd;
    --border:#e3d9c1;
    --text:#241f16;
    --text-dim:#6c6252;
    --accent:#bb500e;
    --accent-soft:#f3ddc2;
    --l-foundation:#4f76a8;
    --l-platform:#3c9581;
    --l-libs:#bd8b2e;
    --l-apps:#c85a35;
    --l-tools:#8570ae;
    --radius:12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141210;
      --surface:#1c1913;
      --surface-2:#26211a;
      --border:#3a331f;
      --text:#f1e9d9;
      --text-dim:#a89a7e;
      --accent:#e57f3f;
      --accent-soft:#3c2917;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141210;
    --surface:#1c1913;
    --surface-2:#26211a;
    --border:#3a331f;
    --text:#f1e9d9;
    --text-dim:#a89a7e;
    --accent:#e57f3f;
    --accent-soft:#3c2917;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding-inline:16px;
    padding-block:28px 60px;
    max-width:1180px;
    margin:0 auto;
  }
  h1,h2,h3{font-family:"Archivo",system-ui,sans-serif; text-wrap:balance; margin:0;}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;}
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;}

  /* ---------- header ---------- */
  header.top{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 24px;
    margin-bottom:18px;
  }
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .brand h1{font-size:26px; font-weight:800; letter-spacing:-0.01em;}
  .brand .tag{font-size:13px; color:var(--accent); font-weight:600; font-family:"IBM Plex Mono",monospace;}
  header.top p.sub{margin:4px 0 0; font-size:13.5px; color:var(--text-dim); max-width:52ch;}
  .headline-stats{
    display:flex; gap:18px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--text-dim);
  }
  .headline-stats b{display:block; font-size:20px; color:var(--text); font-weight:600;}

  /* ---------- legend ---------- */
  .legend{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:16px;
  }
  .legend button{
    display:flex; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px 6px 10px; font:inherit; font-size:12.5px; color:var(--text);
    cursor:pointer;
  }
  .legend button:hover{background:var(--surface-2);}
  .dot{width:9px; height:9px; border-radius:50%; flex:none;}

  /* ---------- controls ---------- */
  .controls{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;
  }
  .search-wrap{
    position:relative; flex:1 1 240px; min-width:200px;
  }
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none;}
  #search{
    width:100%; padding:9px 12px 9px 32px; border-radius:9px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font:inherit; font-size:13.5px;
  }
  #search:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .ctl-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:9px; padding:8px 12px; font:inherit; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .ctl-btn:hover{background:var(--surface-2);}
  .ctl-btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff;}
  .ctl-btn:focus-visible, .legend button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  #match-count{font-size:12px; color:var(--text-dim); align-self:center; margin-left:2px;}

  /* ---------- shell layout ---------- */
  .shell{display:grid; grid-template-columns:minmax(280px,400px) 1fr; gap:18px; align-items:start;}
  @media (max-width:860px){ .shell{grid-template-columns:1fr;} }

  .tree-panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .tree-scroll{max-height:min(72vh,760px); overflow-y:auto; padding:8px;}
  @media (max-width:860px){ .tree-scroll{max-height:56vh;} }

  .detail{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 24px; min-height:320px; position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px);
  }
  @media (max-width:860px){ .detail{position:static;} }

  /* ---------- tree rows ---------- */
  .layer-block + .layer-block{margin-top:2px;}
  .row-btn{
    all:unset; box-sizing:border-box; display:flex; align-items:center; gap:8px;
    width:100%; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13.5px;
  }
  .row-btn:hover{background:var(--surface-2);}
  .row-btn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .chev{
    width:9px; height:9px; flex:none; border-right:2px solid var(--text-dim); border-bottom:2px solid var(--text-dim);
    transform:rotate(-45deg); transition:transform .15s ease; margin-left:1px;
  }
  @media (prefers-reduced-motion:reduce){ .chev{transition:none;} }
  .row-btn[aria-expanded="true"] .chev{transform:rotate(45deg);}
  .layer-row{font-weight:700; font-size:14px;}
  .layer-row .dot{width:10px; height:10px;}
  .layer-row .rname{flex:1;}
  .layer-row .rcount{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--text-dim);}
  .layer-children{padding-left:19px; display:none;}
  .layer-children.open{display:block;}

  .family-row{padding-left:8px;}
  .family-row .rname{flex:1; font-weight:600;}
  .family-row .rcount{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--text-dim);}
  .family-children{padding-left:19px; display:none;}
  .family-children.open{display:block;}

  .crate-row{
    all:unset; box-sizing:border-box; display:flex; align-items:center; gap:8px;
    width:100%; padding:7px 10px 7px 8px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .crate-row .chevstub{width:9px; flex:none;}
  .crate-row:hover{background:var(--surface-2);}
  .crate-row:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .crate-row.active{background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent);}
  .crate-row .cname{flex:1; font-family:"IBM Plex Mono",monospace; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .crate-row .cdeps{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--text-dim);
    background:var(--surface-2); border-radius:999px; padding:1px 7px; flex:none;
  }
  .row-btn.dim, .crate-row.dim{opacity:.32;}
  [hidden]{display:none !important;}

  /* ---------- detail panel ---------- */
  .crumb{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--text-dim); margin-bottom:10px; letter-spacing:.01em;}
  .crumb strong{color:var(--text); font-weight:600;}
  .crate-name{font-size:22px; font-weight:800; font-family:"IBM Plex Mono",monospace; word-break:break-word;}
  .crate-desc{margin:12px 0 0; font-size:14.5px; line-height:1.55; color:var(--text); max-width:60ch;}
  .crate-desc.empty{color:var(--text-dim); font-style:italic;}

  .metric{margin-top:20px;}
  .metric-num{font-size:32px; font-weight:800; font-family:"IBM Plex Mono",monospace; line-height:1;}
  .metric-label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:3px;}
  .bar{height:6px; border-radius:999px; background:var(--surface-2); margin-top:9px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:999px;}

  .loc{
    margin-top:20px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:12px; color:var(--text-dim);
  }
  .loc code{background:var(--surface-2); padding:3px 8px; border-radius:6px; color:var(--text); font-size:12px;}
  .copy-btn{
    border:1px solid var(--border); background:transparent; color:var(--text-dim);
    border-radius:6px; padding:3px 9px; font:inherit; font-size:11.5px; cursor:pointer;
  }
  .copy-btn:hover{background:var(--surface-2); color:var(--text);}

  .layer-note{
    margin-top:22px; padding-top:16px; border-top:1px solid var(--border);
    display:flex; gap:9px; font-size:13px; color:var(--text-dim); line-height:1.5;
  }
  .layer-note .dot{margin-top:5px;}
  .layer-note strong{color:var(--text);}

  /* ---------- overview ---------- */
  .ov-head p{margin:6px 0 0; font-size:13.5px; color:var(--text-dim); max-width:56ch; line-height:1.55;}
  .stat-grid{display:grid; grid-template-columns:1fr; gap:9px; margin-top:18px;}
  .stat-tile{
    display:flex; align-items:center; gap:10px; padding:8px 4px;
  }
  .stat-tile .dot{flex:none;}
  .stat-tile .st-name{width:78px; flex:none; font-weight:600; font-size:13px;}
  .stat-tile .st-bar{flex:1; height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
  .stat-tile .st-bar > div{height:100%; border-radius:999px;}
  .stat-tile .st-count{width:38px; text-align:right; flex:none; font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--text-dim);}

  .top-list{margin-top:24px;}
  .top-list h3{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); font-weight:700;}
  .top-list ol{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .top-row{
    all:unset; box-sizing:border-box; display:flex; align-items:center; gap:10px; width:100%;
    padding:7px 8px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .top-row:hover{background:var(--surface-2);}
  .top-row:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .top-row .rank{width:16px; flex:none; color:var(--text-dim); font-family:"IBM Plex Mono",monospace; font-size:11.5px;}
  .top-row .tn{font-family:"IBM Plex Mono",monospace; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .top-row .td{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--text-dim);}

  footer.note{margin-top:22px; font-size:11.5px; color:var(--text-dim); text-align:center;}
</style>
</head>
<body>
<header class="top">
  <div class="brand-block">
    <div class="brand">
      <h1>Rusty Mill Atlas</h1>
      <span class="tag">Cargo workspace map</span>
    </div>
    <p class="sub">Every crate in the Rusty-Mill/rusty_mill monorepo, grouped by layer. Browse the tree, search by name or description, or open a crate for its blurb and dependent count.</p>
  </div>
  <div class="headline-stats">
    <div><b id="stat-crates">–</b>crates</div>
    <div><b id="stat-families">–</b>families</div>
    <div><b id="stat-layers">–</b>layers</div>
  </div>
</header>

<nav class="legend" id="legend" aria-label="Jump to layer"></nav>

<div class="controls">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <input id="search" type="text" placeholder="Search crates & descriptions…" autocomplete="off" aria-label="Search crates and descriptions">
  </div>
  <div class="btn-row">
    <button class="ctl-btn" id="btn-expand">Expand all</button>
    <button class="ctl-btn" id="btn-collapse">Collapse all</button>
    <button class="ctl-btn" id="btn-sort-alpha" aria-pressed="true">A–Z</button>
    <button class="ctl-btn" id="btn-sort-deps" aria-pressed="false">Most depended-on</button>
  </div>
  <span id="match-count" hidden></span>
</div>

<div class="shell">
  <div class="tree-panel">
    <div class="tree-scroll" id="tree" role="tree" aria-label="Workspace crates"></div>
  </div>
  <div class="detail" id="detail" aria-live="polite"></div>
</div>

<footer class="note">Generated from <code>docs/WORKSPACE-MAP.md</code> · Rusty-Mill/rusty_mill</footer>

protocol only -- never sessionmgr-proc or sessionmgr-agents -- so a UI that cannot name a process type cannot accidentally spawn one.","dependents":1},{"layer":"tools","family":"rusty_boot","crate":"rusty_boot","desc":"A #![no_std] + alloc sovereign bootstrapper demonstrating kernel-to-application execution without Rust std","dependents":0}];

  var LAYER_ORDER = ["foundation","platform","libs","apps","tools"];
  var LAYER_META = {
    foundation: {label:"Foundation", color:"var(--l-foundation)", blurb:"Zero- or near-zero dependency primitives — encoding, crypto, error handling, time, a no_std standard library. The sovereign base every other layer is built on."},
    platform:   {label:"Platform",   color:"var(--l-platform)",   blurb:"OS abstraction (rustils, rustils_async, portable-runtime): portable trait surfaces over Linux/Windows/BSD backends. No I/O, no unsafe at the API layer."},
    libs:       {label:"Libs",       color:"var(--l-libs)",       blurb:"Reusable protocol, network, storage, UI, async and AI libraries — HTTP, TLS, terminal, databases, search backends, the ADK agent framework — built on foundation and platform."},
    apps:       {label:"Apps",       color:"var(--l-apps)",       blurb:"End-user applications and services: the Nexus IDE, rush shell, rusty_tailscale, rusty_key, and the other deployable binaries."},
    tools:      {label:"Tools",      color:"var(--l-tools)",      blurb:"Build and bootstrap tooling."}
  };

  var MAX_DEPS = DATA.reduce(function(m,d){return Math.max(m, d.dependents);}, 1);

  var state = { sort:"alpha", query:"", expanded:{}, selected:null };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function slug(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,"_"); }

  function groupData(){
    var byLayer = {};
    LAYER_ORDER.forEach(function(l){ byLayer[l] = {}; });
    DATA.forEach(function(row){
      var fam = byLayer[row.layer][row.family] || (byLayer[row.layer][row.family] = []);
      fam.push(row);
    });
    return byLayer;
  }
  var TREE = groupData();

  function familyMax(fam){ return fam.reduce(function(m,c){return Math.max(m,c.dependents);},0); }

  function sortedFamilyNames(layer){
    var names = Object.keys(TREE[layer]);
    if(state.sort === "deps"){
      names.sort(function(a,b){ return familyMax(TREE[layer][b]) - familyMax(TREE[layer][a]) || a.localeCompare(b); });
    } else {
      names.sort(function(a,b){ return a.localeCompare(b); });
    }
    return names;
  }
  function sortedCrates(fam){
    var arr = fam.slice();
    if(state.sort === "deps"){
      arr.sort(function(a,b){ return b.dependents - a.dependents || a.crate.localeCompare(b.crate); });
    } else {
      arr.sort(function(a,b){ return a.crate.localeCompare(b.crate); });
    }
    return arr;
  }

  function matches(row){
    if(!state.query) return true;
    var q = state.query;
    return row.crate.toLowerCase().indexOf(q) > -1 ||
           row.family.toLowerCase().indexOf(q) > -1 ||
           row.desc.toLowerCase().indexOf(q) > -1;
  }

  /* ---------------- render legend & header stats ---------------- */
  function renderLegend(){
    var el = document.getElementById("legend");
    el.innerHTML = "";
    LAYER_ORDER.forEach(function(l){
      var meta = LAYER_META[l];
      var count = Object.keys(TREE[l]).reduce(function(n,f){return n+TREE[l][f].length;},0);
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="dot" style="background:'+meta.color+'"></span>'+meta.label+' <span class="mono" style="color:var(--text-dim)">'+count+'</span>';
      b.addEventListener("click", function(){
        state.expanded["L:"+l] = true;
        render();
        var target = document.getElementById("layer-"+slug(l));
        if(target) target.scrollIntoView({block:"nearest", behavior: prefersReduced() ? "auto":"smooth"});
      });
      el.appendChild(b);
    });
  }

  function prefersReduced(){
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; }
  }

  function renderHeaderStats(){
    var families = 0, layers = LAYER_ORDER.length;
    LAYER_ORDER.forEach(function(l){ families += Object.keys(TREE[l]).length; });
    document.getElementById("stat-crates").textContent = DATA.length;
    document.getElementById("stat-families").textContent = families;
    document.getElementById("stat-layers").textContent = layers;
  }

  /* ---------------- tree ---------------- */
  function render(){
    var root = document.getElementById("tree");
    root.innerHTML = "";
    var anyMatch = !state.query ? null : 0;

    LAYER_ORDER.forEach(function(layer){
      var meta = LAYER_META[layer];
      var famNames = sortedFamilyNames(layer);
      var layerRows = [];
      famNames.forEach(function(f){ TREE[layer][f].forEach(function(r){ layerRows.push(r); }); });
      var layerHasMatch = !state.query || layerRows.some(matches);
      if(state.query && layerHasMatch){
        layerRows.forEach(function(r){ if(matches(r)) anyMatch++; });
      }

      var block = document.createElement("div");
      block.className = "layer-block";
      block.hidden = state.query ? !layerHasMatch : false;
      block.id = "layer-"+slug(layer);

      var expandedLayer = state.query ? layerHasMatch : !!state.expanded["L:"+layer];

      var lbtn = document.createElement("button");
      lbtn.className = "row-btn layer-row";
      lbtn.setAttribute("aria-expanded", expandedLayer ? "true":"false");
      lbtn.innerHTML =
        '<span class="chev"></span>' +
        '<span class="dot" style="background:'+meta.color+'"></span>' +
        '<span class="rname">'+esc(meta.label)+'</span>' +
        '<span class="rcount">'+layerRows.length+'</span>';
      lbtn.addEventListener("click", function(){
        state.expanded["L:"+layer] = !expandedLayer;
        render();
      });
      block.appendChild(lbtn);

      var kids = document.createElement("div");
      kids.className = "layer-children" + (expandedLayer ? " open":"");

      famNames.forEach(function(fam){
        var crates = sortedCrates(TREE[layer][fam]);
        var famHasMatch = !state.query || crates.some(matches);
        if(state.query && !famHasMatch) return;

        if(crates.length === 1){
          kids.appendChild(crateRow(layer, fam, crates[0], true));
          return;
        }

        var famExpanded = state.query ? famHasMatch : !!state.expanded["F:"+layer+":"+fam];
        var fwrap = document.createElement("div");

        var fbtn = document.createElement("button");
        fbtn.className = "row-btn family-row";
        fbtn.setAttribute("aria-expanded", famExpanded ? "true":"false");
        fbtn.innerHTML =
          '<span class="chev"></span>' +
          '<span class="rname mono">'+esc(fam)+'</span>' +
          '<span class="rcount">'+crates.length+'</span>';
        fbtn.addEventListener("click", function(){
          state.expanded["F:"+layer+":"+fam] = !famExpanded;
          render();
        });
        fwrap.appendChild(fbtn);

        var fkids = document.createElement("div");
        fkids.className = "family-children" + (famExpanded ? " open":"");
        crates.forEach(function(c){
          if(state.query && !matches(c)) return;
          fkids.appendChild(crateRow(layer, fam, c, false));
        });
        fwrap.appendChild(fkids);

        kids.appendChild(fwrap);
      });

      block.appendChild(kids);
      root.appendChild(block);
    });

    var mc = document.getElementById("match-count");
    if(state.query){
      mc.hidden = false;
      mc.textContent = anyMatch + (anyMatch === 1 ? " match" : " matches");
    } else {
      mc.hidden = true;
    }

    renderDetail();
  }

  function crateRow(layer, fam, row, isLoneChild){
    var btn = document.createElement("button");
    var id = layer+"::"+fam+"::"+row.crate;
    btn.className = "crate-row" + (state.selected === id ? " active":"");
    btn.setAttribute("role","treeitem");
    btn.innerHTML =
      '<span class="chevstub"></span>' +
      '<span class="cname">'+esc(row.crate)+'</span>' +
      '<span class="cdeps num">'+row.dependents+'</span>';
    btn.addEventListener("click", function(){
      state.selected = id;
      renderTreeSelectionOnly();
      renderDetail();
    });
    return btn;
  }

  function renderTreeSelectionOnly(){
    var rows = document.querySelectorAll(".crate-row");
    rows.forEach(function(r){ r.classList.remove("active"); });
    // re-render fully is simplest & cheap enough at this scale
    render();
  }

  /* ---------------- detail panel ---------------- */
  function renderDetail(){
    var el = document.getElementById("detail");
    if(!state.selected){
      el.innerHTML = overviewHTML();
      wireOverview(el);
      return;
    }
    var parts = state.selected.split("::");
    var layer = parts[0], fam = parts[1], craten = parts[2];
    var row = DATA.find(function(d){ return d.layer===layer && d.family===fam && d.crate===craten; });
    if(!row){ el.innerHTML = overviewHTML(); wireOverview(el); return; }

    var meta = LAYER_META[layer];
    var pct = Math.round((row.dependents / MAX_DEPS) * 100);
    var descHTML = row.desc
      ? '<p class="crate-desc">'+esc(row.desc)+'</p>'
      : '<p class="crate-desc empty">No description recorded in the workspace map.</p>';
    var path = "crates/"+layer+"/"+fam+"/";

    el.innerHTML =
      '<div class="crumb">'+esc(meta.label)+' <span>/</span> '+esc(fam)+' <span>/</span> <strong>'+esc(row.crate)+'</strong></div>' +
      '<h2 class="crate-name">'+esc(row.crate)+'</h2>' +
      descHTML +
      '<div class="metric">' +
        '<div class="metric-num num">'+row.dependents+'</div>' +
        '<div class="metric-label">workspace dependents</div>' +
        '<div class="bar"><div class="bar-fill" style="width:'+Math.max(pct,row.dependents>0?4:0)+'%; background:'+meta.color+'"></div></div>' +
      '</div>' +
      '<div class="loc"><span>Location</span> <code>'+esc(path)+'</code> <button class="copy-btn" id="copy-btn">Copy</button></div>' +
      '<div class="layer-note"><span class="dot" style="background:'+meta.color+'"></span><span><strong>'+esc(meta.label)+' layer</strong> — '+esc(meta.blurb)+'</span></div>';

    var copyBtn = document.getElementById("copy-btn");
    copyBtn.addEventListener("click", function(){
      try {
        navigator.clipboard.writeText(path).then(function(){
          copyBtn.textContent = "Copied";
          setTimeout(function(){ copyBtn.textContent = "Copy"; }, 1200);
        }).catch(function(){});
      } catch(e){}
    });
  }

  function overviewHTML(){
    var totalFamilies = 0;
    var rowsHtml = LAYER_ORDER.map(function(l){
      var count = DATA.filter(function(d){ return d.layer === l; }).length;
      totalFamilies += Object.keys(TREE[l]).length;
      var pct = Math.round((count / DATA.length) * 100);
      var meta = LAYER_META[l];
      return '<div class="stat-tile">' +
        '<span class="dot" style="background:'+meta.color+'"></span>' +
        '<span class="st-name">'+esc(meta.label)+'</span>' +
        '<span class="st-bar"><div style="width:'+pct+'%; background:'+meta.color+'"></div></span>' +
        '<span class="st-count num">'+count+'</span>' +
        '</div>';
    }).join("");

    var top = DATA.slice().sort(function(a,b){ return b.dependents - a.dependents; }).slice(0,8);
    var topHtml = top.map(function(row,i){
      var pct = Math.round((row.dependents/MAX_DEPS)*100);
      return '<li><button class="top-row" data-sel="'+esc(row.layer+"::"+row.family+"::"+row.crate)+'">' +
        '<span class="rank num">'+(i+1)+'</span>' +
        '<span class="tn">'+esc(row.crate)+'</span>' +
        '<span class="td num">'+row.dependents+'</span>' +
        '</button></li>';
    }).join("");

    return '<div class="ov-head">' +
      '<h2>Workspace overview</h2>' +
      '<p>The monorepo runs bottom-up: foundation crates carry zero or near-zero dependencies, platform crates wrap the OS behind portable traits, libs assemble those into protocol and storage building blocks, and apps ship the binaries. Select a layer, family or crate on the left to inspect it.</p>' +
      '</div>' +
      '<div class="stat-grid">'+rowsHtml+'</div>' +
      '<div class="top-list"><h3>Most depended-on crates</h3><ol>'+topHtml+'</ol></div>';
  }

  function wireOverview(container){
    container.querySelectorAll(".top-row").forEach(function(btn){
      btn.addEventListener("click", function(){
        var sel = btn.getAttribute("data-sel");
        state.selected = sel;
        var parts = sel.split("::");
        state.expanded["L:"+parts[0]] = true;
        if(TREE[parts[0]][parts[1]].length > 1) state.expanded["F:"+parts[0]+":"+parts[1]] = true;
        render();
        var rowEl = document.querySelector('.crate-row.active');
        if(rowEl) rowEl.scrollIntoView({block:"center", behavior: prefersReduced() ? "auto":"smooth"});
      });
    });
  }

  /* ---------------- controls ---------------- */
  document.getElementById("search").addEventListener("input", function(e){
    state.query = e.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById("btn-expand").addEventListener("click", function(){
    LAYER_ORDER.forEach(function(l){
      state.expanded["L:"+l] = true;
      Object.keys(TREE[l]).forEach(function(f){ state.expanded["F:"+l+":"+f] = true; });
    });
    render();
  });
  document.getElementById("btn-collapse").addEventListener("click", function(){
    state.expanded = {};
    render();
  });
  document.getElementById("btn-sort-alpha").addEventListener("click", function(){
    state.sort = "alpha";
    document.getElementById("btn-sort-alpha").setAttribute("aria-pressed","true");
    document.getElementById("btn-sort-deps").setAttribute("aria-pressed","false");
    render();
  });
  document.getElementById("btn-sort-deps").addEventListener("click", function(){
    state.sort = "deps";
    document.getElementById("btn-sort-deps").setAttribute("aria-pressed","true");
    document.getElementById("btn-sort-alpha").setAttribute("aria-pressed","false");
    render();
  });

  /* ---------------- boot ---------------- */
  renderLegend();
  renderHeaderStats();
  state.expanded["L:foundation"] = true;
  render();
})();
</script>
</body>
</html>
