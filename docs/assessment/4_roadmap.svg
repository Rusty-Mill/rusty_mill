<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1040" height="660" fill="#0f1117"/>
  <text x="520" y="38" fill="#e6e6e6" font-size="24" font-weight="700" text-anchor="middle">Recommended Roadmap — closing the harness gaps</text>
  <text x="520" y="62" fill="#8b93a7" font-size="13" text-anchor="middle">Synthesis of four reviews (systems · software · architecture · integration). Arrows = hard dependency.</text>

  <!-- effort legend -->
  <rect x="360" y="78" width="14" height="14" rx="3" fill="#3ba55d"/><text x="380" y="90" fill="#c4ccda" font-size="12">S</text>
  <rect x="410" y="78" width="14" height="14" rx="3" fill="#d9a23b"/><text x="430" y="90" fill="#c4ccda" font-size="12">M</text>
  <rect x="455" y="78" width="14" height="14" rx="3" fill="#c34d4d"/><text x="475" y="90" fill="#c4ccda" font-size="12">L</text>
  <rect x="520" y="78" width="14" height="14" rx="3" fill="#3a4254"/><text x="540" y="90" fill="#c4ccda" font-size="12">deferred</text>

  <!-- column headers -->
  <text x="120" y="124" fill="#9fb0ff" font-size="14" font-weight="700" text-anchor="middle">NOW</text>
  <text x="370" y="124" fill="#9fb0ff" font-size="14" font-weight="700" text-anchor="middle">NEXT</text>
  <text x="640" y="124" fill="#9fb0ff" font-size="14" font-weight="700" text-anchor="middle">THEN</text>
  <text x="880" y="124" fill="#9fb0ff" font-size="14" font-weight="700" text-anchor="middle">LATER</text>
  <line x1="245" y1="110" x2="245" y2="560" stroke="#222838" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="110" x2="500" y2="560" stroke="#222838" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="765" y1="110" x2="765" y2="560" stroke="#222838" stroke-width="1" stroke-dasharray="4 4"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7f8aa3"/>
    </marker>
  </defs>

  <!-- P0 Safety floor (NOW) -->
  <rect x="30" y="200" width="190" height="96" rx="10" fill="#16202e" stroke="#c34d4d" stroke-width="2"/>
  <text x="44" y="224" fill="#ff8a8a" font-size="13" font-weight="700">P0 · Safety floor</text>
  <text x="44" y="246" fill="#c4ccda" font-size="11">wire max_steps / stop_when</text>
  <text x="44" y="263" fill="#c4ccda" font-size="11">sandbox-by-default (phased)</text>
  <text x="44" y="285" fill="#7f8aa3" font-size="10">S + M · fixes latent runaway hole</text>

  <!-- P1 Config (NEXT, top) -->
  <rect x="280" y="150" width="190" height="80" rx="10" fill="#16202e" stroke="#d9a23b" stroke-width="2"/>
  <text x="294" y="174" fill="#e5c07b" font-size="13" font-weight="700">P1 · Config file</text>
  <text x="294" y="195" fill="#c4ccda" font-size="11">.rustykeys/config.toml</text>
  <text x="294" y="212" fill="#c4ccda" font-size="11">env = highest override</text>
  <text x="294" y="226" fill="#7f8aa3" font-size="10">S/M · foundation for P5/P6</text>

  <!-- P2 Guides + P3 Ratchet paired (NEXT, middle) -->
  <rect x="270" y="244" width="210" height="118" rx="10" fill="#141d18" stroke="#3ba55d" stroke-width="2"/>
  <text x="284" y="266" fill="#7fd99a" font-size="12" font-weight="700">feedforward + feedback PAIR</text>
  <rect x="282" y="276" width="186" height="36" rx="6" fill="#1b2a20"/>
  <text x="292" y="293" fill="#cfe0bf" font-size="11" font-weight="700">P2 · Guides (read AGENT_GUIDE)</text>
  <text x="292" y="307" fill="#9aa3b5" font-size="10">→ cached system prefix · S/M</text>
  <rect x="282" y="318" width="186" height="36" rx="6" fill="#1b2a20"/>
  <text x="292" y="335" fill="#cfe0bf" font-size="11" font-weight="700">P3 · The Ratchet</text>
  <text x="292" y="349" fill="#9aa3b5" font-size="10">attribution→propose checks.toml · S/M</text>

  <!-- P4 Accuracy (NEXT, bottom) -->
  <rect x="280" y="376" width="190" height="74" rx="10" fill="#16202e" stroke="#3ba55d" stroke-width="2"/>
  <text x="294" y="400" fill="#7fd99a" font-size="13" font-weight="700">P4 · Token accuracy</text>
  <text x="294" y="421" fill="#c4ccda" font-size="11">real usage → finer tiers</text>
  <text x="294" y="438" fill="#7f8aa3" font-size="10">S + S · independent</text>

  <!-- P5 Extensibility (THEN) -->
  <rect x="540" y="220" width="200" height="118" rx="10" fill="#16202e" stroke="#c34d4d" stroke-width="2"/>
  <text x="554" y="244" fill="#ff8a8a" font-size="13" font-weight="700">P5 · Extensibility</text>
  <text x="554" y="266" fill="#c4ccda" font-size="11">Skills (.md in feed)</text>
  <text x="554" y="283" fill="#c4ccda" font-size="11">Hooks = Policy in chain</text>
  <text x="554" y="300" fill="#c4ccda" font-size="11">Plugins (bundles in app)</text>
  <text x="554" y="317" fill="#c4ccda" font-size="11">MCP maturity (SSE/auth)</text>
  <text x="554" y="333" fill="#7f8aa3" font-size="10">L · matches CC .md format</text>

  <!-- P6 Subagents (LATER) -->
  <rect x="790" y="220" width="200" height="100" rx="10" fill="#16202e" stroke="#d9a23b" stroke-width="2"/>
  <text x="804" y="244" fill="#e5c07b" font-size="13" font-weight="700">P6 · Subagents</text>
  <text x="804" y="266" fill="#c4ccda" font-size="11">IsolationMode</text>
  <text x="804" y="283" fill="#c4ccda" font-size="11">worktree / remote</text>
  <text x="804" y="300" fill="#c4ccda" font-size="11">honor tools subset</text>
  <text x="804" y="316" fill="#7f8aa3" font-size="10">M/L</text>

  <!-- P7 deferred lane -->
  <rect x="540" y="430" width="450" height="86" rx="10" fill="#13161f" stroke="#3a4254" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="560" y="456" fill="#8b93a7" font-size="13" font-weight="700">P7 · Own the loop  (DEFERRED — no trigger yet)</text>
  <text x="560" y="478" fill="#7f8aa3" font-size="11">Keep delegating to aisdk. Revisit only when a between-steps need lands</text>
  <text x="560" y="495" fill="#7f8aa3" font-size="11">(mid-loop compaction / per-step escalation), behind a ContextController seam.</text>
  <text x="560" y="511" fill="#6b7488" font-size="10">L · highest risk · supersedes ADR-0024 rationale when taken</text>

  <!-- dependency arrows -->
  <line x1="220" y1="248" x2="270" y2="200" stroke="#7f8aa3" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="470" y1="190" x2="540" y2="250" stroke="#7f8aa3" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="740" y1="270" x2="790" y2="270" stroke="#7f8aa3" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ADR callouts -->
  <text x="520" y="560" fill="#9fb0ff" font-size="12" font-weight="700" text-anchor="middle">New ADRs to ratify</text>
  <rect x="120" y="575" width="240" height="56" rx="8" fill="#1a1f2b" stroke="#2a3142"/>
  <text x="132" y="596" fill="#dfe4ee" font-size="11" font-weight="700">ADR-0037 (P2)</text>
  <text x="132" y="613" fill="#9aa3b5" font-size="10">Guides → cached system prefix</text>
  <text x="132" y="627" fill="#9aa3b5" font-size="10">+ ContextEntry for audit</text>
  <rect x="400" y="575" width="240" height="56" rx="8" fill="#1a1f2b" stroke="#2a3142"/>
  <text x="412" y="596" fill="#dfe4ee" font-size="11" font-weight="700">ADR-0038 (P5)</text>
  <text x="412" y="613" fill="#9aa3b5" font-size="10">Stratified extensions:</text>
  <text x="412" y="627" fill="#9aa3b5" font-size="10">skills + hooks-as-policy + plugins</text>
  <rect x="680" y="575" width="240" height="56" rx="8" fill="#1a1f2b" stroke="#2a3142"/>
  <text x="692" y="596" fill="#dfe4ee" font-size="11" font-weight="700">ADR-0039 (P7)</text>
  <text x="692" y="613" fill="#9aa3b5" font-size="10">Defer loop ownership behind</text>
  <text x="692" y="627" fill="#9aa3b5" font-size="10">a ContextController seam</text>
</svg>
