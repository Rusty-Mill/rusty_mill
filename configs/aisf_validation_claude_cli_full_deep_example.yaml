# The `aisf_validation` sibling of
# configs/aisf_triage_claude_cli_full_deep_example.yaml -- same
# rationale, same shape, different stage. That triage run's
# `val_batch_size: 2` gate (in the plain full-dataset config) was too
# low-resolution to tell "no improvement exists" apart from "this gate
# can't see the improvement that's there" -- widening it to the entire
# val split, plus a second epoch so a rejected direction's rationale
# gets a real second try via the rejection buffer, found and confirmed a
# real one. This config asks the same question of `validation`'s prompt.
#
# - `val_batch_size: 8` -- the entire val split (sixteen possible score
#     values instead of three), not a 2-example sample.
# - `epochs: 2` -- twice through all 24 train examples (12 batches, 12
#     optimizer proposals total).
# - Every role still live via `claude -p`, zero API keys anywhere in the
#     chain: `executor: aisf_stage` (model: validation) drives AISF's
#     real `validation` agent through its `claude_cli`+MCP-bridge path;
#     `optimizer`/`reflector: claude_cli`.
#
# Same cost profile as triage's: roughly 220 real `claude -p` calls (12
# batches x (4 rollout + 4 reflect + 1 optimize + 8 val) + 8 initial val
# + 8 final test), likely 45-75 minutes of wall-clock time.

skill_path: skills/aisf_validation_initial.md
output_dir: out/aisf_validation_claude_cli_full_deep_example

executor:
  provider: aisf_stage
  model: validation
  aisf_binary_path: /path/to/aisf/target/debug/software-factory
  max_tokens: 256

optimizer:
  provider: claude_cli
  model: sonnet
  max_tokens: 1024

reflector:
  provider: claude_cli
  model: sonnet
  max_tokens: 256

train:
  epochs: 2
  batch_size: 4
  val_batch_size: 8
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: aisf_validation
  params:
    labels_path: data/aisf_validation_labels.jsonl
