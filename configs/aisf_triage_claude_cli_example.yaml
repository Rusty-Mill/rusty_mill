# A fully live `train` run against AISF's real, governed `triage` agent,
# with zero API keys anywhere in the chain -- every role (executor,
# optimizer, reflector) is driven by `claude -p` instead of a raw
# Anthropic API call.
#
# - `executor` is `aisf_stage` (as in configs/aisf_triage_example.yaml):
#     drives AISF's actual `triage` agent, under real governance, via its
#     `eval-stage` subcommand as a subprocess. With no `ANTHROPIC_API_KEY`
#     set, `AisfStageBackend` sets `EVAL_STAGE_DRIVER=claude_cli`
#     unconditionally, and AISF's own side drives the governed tool loop
#     through `claude -p` and its `mcp-serve-triage` MCP bridge instead of
#     the Anthropic API.
# - `optimizer`/`reflector` are `claude_cli` (crates/skillopt-model/src/
#     claude_cli.rs): plain single-turn `claude -p` text completions, no
#     API key needed either.
# - `aisf_binary_path` is the path to AISF's *built* `software-factory`
#     binary (see configs/aisf_triage_example.yaml's own comment).
#
# `data/aisf_triage_labels_smoke.jsonl` is a deliberately small (4
# train / 2 val / 2 test) *subset* of the real, hand-labeled 40-scenario
# set in `data/aisf_triage_labels.jsonl` -- not fabricated data, just
# fewer of the same real rows, chosen to cover all four priorities across
# the 4 train examples. `train()` visits every train example each epoch
# (there's no partial-epoch sampling) and evaluates the *entire* test
# split at the end regardless of any batch-size setting, so keeping this
# example's call budget small enough to run in a few minutes meant
# shrinking the dataset itself, not just `batch_size`/`val_batch_size`.
# Use the full `aisf_triage_labels.jsonl` (see
# configs/aisf_triage_example.yaml) once you're ready to spend more real
# `claude -p` calls on a less noisy result.

skill_path: skills/aisf_triage_initial.md
output_dir: out/aisf_triage_claude_cli_example

executor:
  provider: aisf_stage
  model: triage
  aisf_binary_path: /path/to/aisf/target/debug/software-factory
  max_tokens: 256

optimizer:
  provider: claude_cli
  model: sonnet
  max_tokens: 1024

reflector:
  provider: claude_cli
  model: sonnet
  max_tokens: 256

train:
  epochs: 1
  batch_size: 4
  val_batch_size: 2
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: aisf_triage
  params:
    labels_path: data/aisf_triage_labels_smoke.jsonl
