# A fairer test of whether AISF's real `triage` prompt actually has room
# to improve, than configs/aisf_triage_claude_cli_full_example.yaml gave
# it. That run's `0/6 steps accepted` was confounded by a very
# low-resolution validation gate (`val_batch_size: 2` -- each check only
# had three possible outcomes, 0.0/0.5/1.0, against a strict
# better-than-current-best bar) and a single attempt per batch with no
# second try at a promising direction. Two changes here, both aimed at
# giving a real improvement an actual chance to be found and confirmed,
# not at making acceptance easier by fiat:
#
# - `val_batch_size: 8` -- the *entire* val split, not a 2-example
#     sample. Sixteen possible score values instead of three, so a
#     genuinely better edit has much less risk of being missed just
#     because of which examples happened to be sampled.
# - `epochs: 2` -- twice through all 24 train examples (12 batches, 12
#     optimizer proposals total instead of 6), so a rejected direction's
#     rationale (fed back via the rejection buffer) gets a real second
#     round to be refined or abandoned, not just one shot.
#
# Same everything else: every role still live via `claude -p`, zero API
# keys anywhere in the chain. This is meaningfully more expensive than
# either prior run -- roughly 220 real `claude -p` calls (12 batches x
# (4 rollout + 4 reflect + 1 optimize + 8 val) + 8 initial val + 8 final
# test), likely 45-75 minutes of wall-clock time. Budget accordingly.

skill_path: skills/aisf_triage_initial.md
output_dir: out/aisf_triage_claude_cli_full_deep_example

executor:
  provider: aisf_stage
  model: triage
  aisf_binary_path: /path/to/aisf/target/debug/software-factory
  max_tokens: 256

optimizer:
  provider: claude_cli
  model: sonnet
  max_tokens: 1024

reflector:
  provider: claude_cli
  model: sonnet
  max_tokens: 256

train:
  epochs: 2
  batch_size: 4
  val_batch_size: 8
  max_ops_per_edit: 3
  rejection_buffer_size: 5
  min_improvement: 0.000001
  seed: 0

env:
  name: aisf_triage
  params:
    labels_path: data/aisf_triage_labels.jsonl
