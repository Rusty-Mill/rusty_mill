name: 'Set up Rust build environment'
description: >
  Installs the Rust toolchain (plus optional components), the native
  system libraries the workspace's --all-features build links against, and
  wires up Swatinem/rust-cache.
inputs:
  components:
    description: 'Extra rustup components to install (e.g. clippy, rustfmt)'
    required: false
    default: ''
  cache-shared-key:
    description: 'Cache namespace shared across jobs/matrix legs that should reuse the same target-dir cache'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    # rusty_term's gui/gui-gpu features and rusty_gui's Linux X11 backend
    # link against X11/wayland directly; rusty_a2a's grpc feature runs a
    # build.rs that needs `protoc`; platform-linux's secret_service
    # integration tests spawn a real dbus-daemon + gnome-keyring-daemon;
    # rusty_whisper's mic feature links ALSA via cpal/alsa-sys;
    # inventory-tauri is a Tauri 2 shell (WebKitGTK + GTK3 + a tray icon)
    # and inventory-core's Linux keyring backend is Secret Service over
    # libdbus. None of this ships on the ubuntu-latest image by default.
    # One combined apt-get install (instead of six separate ones) to cut
    # round-trips.
    - name: Install native build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
          libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
          protobuf-compiler dbus dbus-x11 gnome-keyring libasound2-dev \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libdbus-1-dev
        # gnome-keyring-daemon ships with capabilities (cap_ipc_lock) set via
        # `setcap` that the Actions runner's container doesn't actually grant
        # use of, which otherwise surfaces as an opaque "Operation not
        # permitted" at daemon start -- a known runner-images gap
        # (actions/runner-images#6683). Stripping them falls back to a mode
        # that needs no special privileges.
        sudo setcap -r /usr/bin/gnome-keyring-daemon || true

    # platform-linux's own Secret Service integration tests spawn a private
    # dbus-daemon + gnome-keyring-daemon per test (see that crate's own
    # sys::secret_service doc comment) and don't need this. Code that talks
    # to the *ambient* session bus instead -- nexus-security's credential
    # store plugin, exercised by crates/nexus/crates/nexus-bootstrap's
    # acp_contribution_wiring tests -- does, and the packages installed
    # above only make a Secret Service provider installable, not running:
    # nothing had ever started or unlocked one, so every such test failed
    # with "OS keyring unavailable ... Secret Service: no result found"
    # (only discovered once a full workspace sweep first exercised
    # nexus-bootstrap's tests in CI). A throwaway D-Bus session bus plus an
    # unlocked default keyring collection, for the lifetime of this job.
    - name: Start a D-Bus session and unlock a keyring (Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        eval "$(dbus-launch --sh-syntax)"
        echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
        echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
        echo "ci-runner-unlock" | gnome-keyring-daemon --unlock --components=secrets

    # rusty_a2a's grpc feature needs protoc on Windows too (cpal talks to
    # WASAPI directly there, so no ALSA/X11/dbus equivalent is needed).
    - name: Install protoc (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: choco install protoc -y

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-shared-key }}
