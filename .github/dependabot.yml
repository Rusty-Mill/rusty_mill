# Dependabot version updates — npm lockfiles only.
#
# Why npm only: the three front-end lockfiles below are the one place this
# monorepo carries third-party code that nothing here regenerates locally
# (no Node toolchain on the development machines; CI has one only for
# data-mesh-monitor). The 2026-09-18 security alerts (browserslist
# GHSA-73wf-gq98-2v4g, baseline-browser-mapping GHSA-w5vr-8v7q-w6rv) hit
# rusty_term/web, and the identical vulnerable versions sat unflagged in the
# other two lockfiles because Dependabot only scanned the path an alert
# already pointed at. Listing all three here makes Dependabot regenerate
# each lockfile server-side and open PRs that CI (`npm ci` where wired)
# validates.
#
# Cargo is deliberately not listed: this workspace has ~125 crates and a
# dependency-policy CI job of its own; automated Cargo bump PRs would be
# noise without a per-crate policy decision first.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /crates/libs/ui/rusty_term/web
      - /crates/apps/rusty_meshed/data-mesh-monitor
      - /crates/apps/rusty_key/desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Majors are a deliberate per-app round, not a weekly bump: the first
    # grouped PR (#246) took every front-end to latest majors at once
    # (React 19, Vite 8, TypeScript 7, xterm 6) with no CI on two of the
    # three directories. The one exception is the Vite toolchain, which
    # must move *together*: vite 8 requires @vitejs/plugin-react 6, so
    # Dependabot's single-package security PRs for the vite/esbuild
    # advisories (#255, #258) could not even `npm ci` (ERESOLVE on
    # plugin-react 4's peer range). Dependabot cannot express "ignore
    # majors for everything except X" and rejects a second entry for the
    # same directory, so the blanket ignore is spelled out as today's other
    # direct dependencies instead — a *new* direct dependency is not on
    # this list and would get major proposals until it is added.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@xterm/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@codemirror/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tauri-apps/api"
        update-types: ["version-update:semver-major"]
      - dependency-name: "solid-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "autoprefixer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major"]
    groups:
      # Evaluated first: the Vite toolchain moves as one PR, majors
      # included, so vite and its plugin land in the same lockfile
      # regeneration and CI (data-mesh-monitor's job; rusty_term/web's
      # build job) proves the combination before it merges.
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vite-plugin-solid"
      # Everything else: one minor/patch PR per directory per week.
      # Security updates still arrive individually and immediately.
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
