name: Baseline

# The per-product baseline (design review Tranche 5): binary size,
# dependency closure, clean and incremental release build, startup, idle
# and peak RSS, on Linux and Windows. Manual only: every product builds
# clean, which takes hours, and the numbers are compared by hand.

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Space-separated binaries to measure (empty: all in products.txt)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.98.1"
  NEXUS_NO_KEYRING: '1'

jobs:
  baseline:
    name: baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # No rust-cache: every product's build is meant to be clean.
      # `inv` links the system D-Bus development library. The baseline builds
      # every selected product from source, so install it before measuring on
      # Ubuntu rather than silently excluding that product from Linux data.
      - name: Install Linux baseline build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Measure
        shell: bash
        # Passed through the environment, not interpolated into the script.
        env:
          PRODUCTS: ${{ inputs.products }}
          REPORT: baseline-${{ matrix.os }}.md
        run: |
          status=0
          # $PRODUCTS is split into separate binary names on purpose.
          # shellcheck disable=SC2086
          cargo run --release --locked -p rusty_baseline -- --work "$RUNNER_TEMP/baseline" $PRODUCTS > "$REPORT" || status=$?
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: baseline-${{ matrix.os }}
          path: baseline-${{ matrix.os }}.md
