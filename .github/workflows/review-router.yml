name: Review router (activation held)
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  activation-hold:
    # Provider actions are not permitted by current repository policy.
    # Reviewed designs live outside the workflow discovery directory.
    if: ${{ false && github.event_name != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Activation held; see docs/agents/review-router.md"
