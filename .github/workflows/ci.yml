  # rusty_key's desktop front end: a vendored Vite/Solid app inside a
  # Tauri shell (not a Cargo crate; the Rust side is its own crate). Build
  # only -- `npm run build` bundles the web assets without needing the
  # Tauri toolchain -- so a dependency bump is proven to compile and
  # bundle before it merges. No test script exists there.
  rusty-key-desktop:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-key-desktop
      queue: max
      cancel-in-progress: false
    name: rusty_key desktop (npm build)
    needs: plan
    if: needs.plan.outputs.key_desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
