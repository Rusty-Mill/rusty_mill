      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_tick/web/package-lock.json
      # The agui packages the UI links as `file:` dependencies: built first.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-core
      - run: npm ci --no-audit --no-fund && npm run build
