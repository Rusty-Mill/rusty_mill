name: CI

# Workspace-wide CI for the Rusty Mill monorepo. Individual crates carried
# their own workflow under crates/<crate>/.github/workflows/ before the
# merge (dead now that they're not at a repo root — GitHub Actions only
# reads .github/workflows/ at the repository root), left in place for
# history.
#
# The `plan` job below computes which workspace crates a PR actually
# touches (plus everything that transitively depends on them) and every
# other job scopes its cargo invocation to just that set via `-p`, instead
# of always running `--workspace` across ~70 largely-unrelated crates.
# Pushes to main, and PRs that touch this CI config itself or workspace-wide
# tooling config under .config/ (e.g. nextest's), still get the full sweep --
# those can change how every crate builds or tests. A root Cargo.toml edit
# used to force the same full sweep unconditionally, but the single most
# common edit to that file is adding a handful of brand-new, independent
# workspace members with nothing else in the file touched (e.g. #170's
# rusty_hister bootstrap, eight new crates, zero existing lines changed) --
# that has no blast radius on any existing crate, so `.github/scripts/
# cargo_toml_diff.py` classifies the change first and only forces the full
# sweep when it's more than a pure `[workspace.members]` addition (a
# dependency version bump, a removed/renamed member, a `[profile]` edit,
# ...). A Cargo.lock-only change (no Cargo.toml edit -- a plain `cargo
# update`) is narrower still: only the workspace crates whose dependency
# graph actually includes whatever package moved, per `.github/scripts/
# lockfile_diff.py`.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A one-shot CI build gets little benefit from incremental compilation
  # (there's no prior local state to reuse) and it adds bookkeeping
  # overhead and cache size for no payoff; disabling it is the standard
  # recommendation alongside Swatinem/rust-cache. Trimming debug info
  # similarly speeds up compilation/linking and shrinks what the cache has
  # to save/restore -- CI only needs `cargo test`/`clippy` to fail loudly,
  # not to produce a debuggable binary.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # GitHub-hosted runners don't run a D-Bus session/Secret Service provider,
  # so nexus-security's ADR-0009 startup keyring probe (`CredentialVault
  # ::available()`, called from `com.nexus.security`'s `on_init`) always
  # fails there -- not a flake, deterministic on every ubuntu-latest/
  # windows-latest run. `NEXUS_NO_KEYRING=1` is that crate's own documented
  # escape hatch (crates/nexus/crates/nexus-security/src/credential.rs):
  # the probe returns Ok and individual credential operations return
  # KeyringDisabled instead, exactly the CI-without-a-real-keyring case.
  NEXUS_NO_KEYRING: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  plan-tests:
    # affected_crates.py decides what every other job runs on a PR, and
    # check_workspace_deps.py enforces the dependency-sovereignty policy
    # job below -- both get unit tests, run against synthetic metadata (no
    # cargo needed), auto-discovered from this one `unittest discover`.
    name: plan script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  dependency-policy:
    # Enforces ADR-0002 (dependency sovereignty policy): a crate that is a
    # workspace member must not also be pinned as a git dependency
    # elsewhere in the workspace (ATLAS-RWC-0050). Runs unconditionally --
    # every PR, not just ones the `plan` job's affected-crate filter
    # selects -- because this is a workspace-wide manifest invariant, not
    # a per-crate build/test concern.
    name: dependency policy (workspace sovereignty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dependency-policy
          cache-targets: false
      - run: cargo metadata --format-version=1 --all-features > /tmp/metadata.json
      - run: python3 .github/scripts/check_workspace_deps.py /tmp/metadata.json

  plan:
    name: plan (affected crates)
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      packages: ${{ steps.plan.outputs.packages }}
      dashboard: ${{ steps.plan.outputs.dashboard }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: plan
          cache-targets: false

      - name: Determine affected crates
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }}, not pull_request -- running the full workspace sweep."
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            echo "shards=[1,2,3]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -Eq '^(\.config/|\.github/(workflows|actions|scripts)/)'; then
            echo "Workspace-wide CI/tooling config changed -- running the full workspace sweep."
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            echo "shards=[1,2,3]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$changed" | grep -Eq '^Cargo\.toml$'; then
            git show "$base:Cargo.toml" > /tmp/old-Cargo.toml
            classification="$(python3 .github/scripts/cargo_toml_diff.py /tmp/old-Cargo.toml Cargo.toml)"
            if [ "$classification" != "safe" ]; then
              echo "Root Cargo.toml changed beyond a pure [workspace.members] addition -- running the full workspace sweep."
              echo "full=true" >> "$GITHUB_OUTPUT"
              echo "packages=" >> "$GITHUB_OUTPUT"
              echo "dashboard=true" >> "$GITHUB_OUTPUT"
              echo "shards=[1,2,3]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Root Cargo.toml changed, but only added new [workspace.members] entries -- narrowing normally instead of a full sweep."
          fi

          # rusty_meshed's vendored data-mesh-monitor (Vite/React) isn't a
          # Cargo crate, so affected_crates.py can't see it -- gate its own
          # job on a plain path match instead.
          if echo "$changed" | grep -q '^crates/rusty_meshed/data-mesh-monitor/'; then
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
          else
            echo "dashboard=false" >> "$GITHUB_OUTPUT"
          fi

          cargo metadata --format-version=1 --all-features > /tmp/metadata.json
          packages="$(echo "$changed" | python3 .github/scripts/affected_crates.py /tmp/metadata.json)"

          # Cargo.lock isn't owned by any single crate, so affected_crates.py
          # can't attribute it -- but unlike Cargo.toml/CI-config changes
          # above, a lockfile-only change (a plain `cargo update` bumping one
          # transitive dependency, no Cargo.toml edit at all) has a real,
          # narrower blast radius: exactly the workspace crates whose
          # dependency graph actually includes the package(s) that moved.
          # lockfile_diff.py computes that from the full resolve graph
          # (including external packages, which affected_crates.py's own
          # graph deliberately excludes) and falls back to every workspace
          # crate itself if a changed lockfile entry can't be placed in the
          # current metadata snapshot -- this step never forces `full=true`
          # past that, it just folds the (possibly full) result into
          # `packages`.
          if echo "$changed" | grep -Eq '^Cargo\.lock$'; then
            echo "Cargo.lock changed -- narrowing to crates whose dependency graph actually moved."
            git show "$base:Cargo.lock" > /tmp/old-Cargo.lock
            lockfile_packages="$(python3 .github/scripts/lockfile_diff.py /tmp/metadata.json /tmp/old-Cargo.lock Cargo.lock)"
            echo "Lockfile-narrowed crates: ${lockfile_packages:-<none>}"
            packages="$(printf '%s\n' $packages $lockfile_packages | sort -u | tr '\n' ' ' | sed -e 's/^ *//' -e 's/ *$//')"
          fi

          if [ -z "$packages" ]; then
            echo "No workspace crate touched by this PR -- build/test/clippy will be skipped."
          else
            echo "Affected crates: $packages"
          fi
          {
            echo "full=false"
            echo "packages=$packages"
            echo "shards=[1]"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        run: |
          if [ "${{ steps.plan.outputs.full }}" = "true" ]; then
            echo "### CI scope: full workspace sweep" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${{ steps.plan.outputs.packages }}" ]; then
            echo "### CI scope: no workspace crate affected -- build/test/clippy skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### CI scope: affected crates" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.plan.outputs.packages }}" | tr ' ' '\n' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  clippy:
    name: clippy (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          components: clippy
          cache-shared-key: clippy-${{ matrix.os }}

      # rusty_stream is built on io_uring, a Linux-only kernel interface --
      # excluded on windows-latest rather than making its internals
      # cfg-gated portable shims like rusty_win32 does the other way.
      # rusty_fedora_agent gets the same treatment: it shells out to
      # systemctl/journalctl/dnf, none of which exist on Windows either.
      # rusty_multimodal_db is a different case -- its own library and every
      # feature but one are portable, and its standalone repo's own CI never
      # ran a Windows job at all (single-OS, so this was simply untested,
      # not previously green). --all-features here is what first exercises
      # `external-db-bench`, whose optional `duckdb` dependency vendors
      # DuckDB's own C++ amalgamation ("bundled") -- that native build fails
      # under windows-latest's current MSVC toolchain (cc-rs exit code 2
      # compiling ub_src_storage_compression_chimp.cpp), a third-party
      # native-build issue with no Rust-side fix available here. Whole-crate
      # exclusion is coarser than the actual problem (one optional feature),
      # matching this mechanism's existing granularity rather than adding a
      # new one for a single crate.
      - uses: ./.github/actions/select-packages
        id: scope
        with:
          full: ${{ needs.plan.outputs.full }}
          packages: ${{ needs.plan.outputs.packages }}
          windows-exclude: rusty_stream rusty_fedora_agent rusty_multimodal_db

      - name: Clippy
        if: steps.scope.outputs.args != ''
        run: cargo clippy ${{ steps.scope.outputs.args }} --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          cache-shared-key: test-${{ matrix.os }}

      - uses: ./.github/actions/select-packages
        id: scope
        with:
          full: ${{ needs.plan.outputs.full }}
          packages: ${{ needs.plan.outputs.packages }}
          windows-exclude: rusty_stream rusty_fedora_agent rusty_multimodal_db

      # mill-term's own tests locate sibling binaries (rush/rgit/rsed/rawk)
      # by walking target/{debug,release} at runtime rather than through a
      # Cargo dependency (see the root README's "How the crates relate") --
      # mill-term only has a *library* dependency on rusty_git, and none at
      # all on rush/rusty_text, so nothing in the dependency graph forces
      # cargo to finish building those binaries before mill-term's test
      # binary starts running. A separate, blocking build step first
      # guarantees those specific binaries exist on disk before any test
      # executes (see #12).
      #
      # Scoped to just the three crates that own those binaries, not the
      # job's full package selection (`--workspace` on a full sweep) --
      # this used to build the entire selected scope a second time before
      # `cargo nextest run` built it all again for test-cfg, roughly
      # doubling compile time on every full-sweep run for a requirement
      # that only ever concerns three small CLI-tool crates. Only runs
      # when mill-term is actually in scope; every other PR skips this
      # step entirely.
      - name: Build (mill-term's sibling-binary prerequisites)
        if: steps.scope.outputs.args != '' && (needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.packages, 'mill-term'))
        run: cargo build -p rush -p rusty_git -p rusty_text --all-features

      - name: Install cargo-nextest
        if: steps.scope.outputs.args != ''
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # rusty_lines' windows_raw_mode integration suite deliberately shares
      # one process-wide console across all its tests (a real Windows
      # console is a singular resource -- see that file's own doc comment),
      # serialized behind a Mutex rather than relying on `cargo test`'s
      # default of running everything in one process. nextest instead runs
      # every test in its own separate process, so each test now allocates
      # an independent console instead of reusing one already configured by
      # an earlier test in the same process -- 4 of its 5 tests started
      # panicking or hanging under nextest specifically (confirmed via a
      # live CI run: see the terminated `ctrl_d_on_empty_line_is_eof`
      # timeout). Excluded here and run separately below via `cargo test`,
      # the harness this suite was actually designed and verified against.
      #
      # Separately, on windows-latest specifically: two live CI runs (with
      # nextest's own `retries` already absorbing ordinary transient
      # flakiness -- see .config/nextest.toml) still hit failures that
      # trace back to rusty_tokio's own scheduler under heavy concurrent
      # load -- rusty_tokio::tracing_instrumentation's spawn_blocking span
      # never getting entered, and a real async TLS client/server test
      # (built on rusty_tokio) hanging the full 10-minute slow-timeout.
      # Both are plausibly CPU-contention-triggered starvation in
      # rusty_tokio's own scheduler, not a bug in either test -- a real
      # issue in that crate worth its own investigation, not something to
      # patch here. Capping nextest's own test-thread concurrency on
      # windows-latest is a mitigation for the suspected trigger (less
      # contention among concurrently-running nextest processes), not a
      # confirmed fix for the underlying rusty_tokio behavior.
      # Only actually partitioned on a full sweep (3 shards, ~16800 tests);
      # a scoped PR run has exactly one shard (see plan's `shards` output)
      # and must run every selected test, so no `--partition` flag is
      # added there -- passing one unconditionally would silently run only
      # a third of a scoped PR's own tests.
      #
      # `--no-tests=warn`: nextest's default (`fail`) treats "the selected
      # packages collectively have zero tests" as a CI failure (exit 4, "no
      # tests to run") -- correct for a full sweep, where that can only mean
      # something broke test collection, but wrong for a scoped PR run that
      # only touches brand-new skeleton crates with no tests yet (PR #170's
      # rusty_hister bootstrap hit exactly this: 8 crates, 0 tests, CI red
      # for having nothing to test). `warn` still logs it -- so a crate that
      # silently loses all its tests some other way isn't swept under the
      # rug -- without failing a PR whose whole point is scaffolding.
      - name: Test (nextest)
        if: steps.scope.outputs.args != ''
        run: cargo nextest run ${{ steps.scope.outputs.args }} --all-features --no-tests=warn ${{ runner.os == 'Windows' && '--test-threads 2' || '' }} ${{ needs.plan.outputs.full == 'true' && format('--partition count:{0}/3', matrix.shard) || '' }} -E 'not binary_id(rusty_lines::windows_raw_mode)'

      # Runs once per OS, not once per shard -- it's cheap and not worth
      # partitioning, and nextest's own partitioning above doesn't cover a
      # suite excluded from that run entirely.
      - name: Test rusty_lines' Windows raw-mode suite (cargo test)
        if: matrix.shard == 1 && runner.os == 'Windows' && (needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.packages, 'rusty_lines'))
        run: cargo test --test windows_raw_mode -p rusty_lines --all-features

      # nextest doesn't execute doctests -- run those separately so this
      # switch doesn't quietly drop doctest coverage. `cargo test --doc`
      # explicitly scoped via `-p` hard-errors on a package with no library
      # target ("no library targets found in package X") instead of quietly
      # skipping it the way `--doc --workspace` does -- a bin-only crate
      # (e.g. rusty_homelab_mcp) touched by a PR would otherwise fail this
      # step for having nothing to doc-test. Filter the scoped package list
      # down to crates that actually declare a `lib` target first.
      #
      # Both branches start from the select-packages step's outputs, never
      # from the plan job's raw list: only the former has the per-OS
      # exclusions applied. Re-deriving the scope here from
      # `needs.plan.outputs.packages` (or a bare `--doc --workspace`) is
      # exactly how rusty_stream -- Linux-only, and correctly excluded on
      # windows-latest by every other step in this job -- was still getting
      # compiled by this one step and failing the whole job on Windows.
      # Runs once per OS, not once per shard -- doctests are cheap and
      # nextest doesn't run them at all, so there's nothing shard 2/3
      # would otherwise be covering.
      - name: Test (doctests)
        if: matrix.shard == 1 && steps.scope.outputs.args != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.plan.outputs.full }}" = "true" ]; then
            # `args` is `--workspace` plus this runner's `--exclude` flags;
            # `--doc --workspace` already skips crates with no lib target.
            cargo test --doc ${{ steps.scope.outputs.args }} --all-features
          else
            lib_pkgs="$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.targets[]?.kind[]? == "lib") | .name')"
            args=""
            for p in ${{ steps.scope.outputs.packages }}; do
              if echo "$lib_pkgs" | grep -qx "$p"; then
                args="$args -p $p"
              fi
            done
            if [ -n "$args" ]; then
              cargo test --doc $args --all-features
            else
              echo "No affected package declares a library target -- nothing to doc-test."
            fi
          fi

  # rusty_meshed's data-mesh-monitor dashboard: a vendored Vite/React app
  # (not a Cargo crate, so none of the cargo jobs above see it). Builds
  # it and runs its `npm test`, which re-traces the vendored reverse-trace
  # scenario in JS and fails if it disagrees with the Rust reference
  # output checked in next to it (see that directory's README).
  data-mesh-monitor:
    name: data-mesh-monitor (npm build + trace parity)
    needs: plan
    if: needs.plan.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/rusty_meshed/data-mesh-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/rusty_meshed/data-mesh-monitor/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  # rusty_win32 is deliberately Windows-only and edition 2021 for MSRV
  # reasons (see crates/rusty_win32/Cargo.toml) — this mirrors its own CI's
  # cross-compile pre-check so a Linux-only contributor still gets fast
  # feedback on it without waiting on the windows-latest queue.
  win32-cross-compile-check:
    name: rusty_win32 cross-compile check (mingw, Linux)
    needs: plan
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.packages, 'rusty_win32')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win32-cross
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cargo check --target x86_64-pc-windows-gnu (std feature)
        run: cargo check -p rusty_win32 --target x86_64-pc-windows-gnu --all-targets --features std
      - name: cargo clippy --target x86_64-pc-windows-gnu
        run: cargo clippy -p rusty_win32 --target x86_64-pc-windows-gnu --all-targets --features std -- -D warnings

  # Every other Rust job above passes --all-features, and rusty_config's
  # own `default = ["std"]` (see crates/rusty_config/Cargo.toml) means
  # --all-features never disables it -- so CI has never actually compiled
  # the crate's documented `#![no_std]` + alloc-only code path (see the
  # `#![cfg_attr(not(feature = "std"), no_std)]` line in its src/lib.rs).
  # This is a small, additive check dedicated to that one crate's
  # non-default configuration, not a general no_std feature-matrix
  # mechanism for every no_std crate in the workspace. rusty_config is
  # `alloc`-only (no hardware/platform-specific code), so the host triple
  # is sufficient -- no `--target` cross-compile is needed the way
  # rusty_win32's check above needs one.
  rusty-config-no-std-check:
    name: rusty_config no_std (--no-default-features)
    needs: plan
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.packages, 'rusty_config')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rusty-config-no-std
      - name: cargo check -p rusty_config --no-default-features
        run: cargo check -p rusty_config --no-default-features --all-targets
