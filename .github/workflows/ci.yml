name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others: the whole point of
      # the matrix is to see which platforms are broken, not just that one is.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    steps:
      - uses: actions/checkout@v4

      # Linux needs GTK/WebKit for the desktop shell and libdbus for the
      # Secret Service keyring. macOS and Windows use OS-native APIs for both
      # and need nothing extra.
      - name: Install Linux toolkit
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # SQLCipher builds a vendored OpenSSL, which is slow without a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # Formatting is platform-independent, so checking it once is enough.
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Desktop shell builds
        run: cargo build -p inventory-tauri
