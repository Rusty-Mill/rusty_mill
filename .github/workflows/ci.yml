name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt · clippy · test · desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # inventory-tauri needs a GTK/WebKit toolchain to build on Linux.
      # inventory-core and inventory-cli do not, which is why they are the
      # workspace's default members.
      - name: Install desktop toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # SQLCipher builds a vendored OpenSSL, which is slow without a cache.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Desktop shell builds
        run: cargo build -p inventory-tauri
