name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # `docs/versioning.md`: under the §2 rule every source change bumps
  # something — `y` if a public item's shape moved, `z` if not — so "source
  # changed but the version did not" is always a mistake. Thirteen PRs got
  # this wrong in a row (rusty_tls#25), which is why it is checked here rather
  # than left to review.
  version-bumped:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A source change must bump the version
        run: |
          # `fetch-depth: 0` above already fetched every branch, so the base
          # is present; fetching it again shallowly would truncate it.
          base="origin/${{ github.base_ref }}"

          if ! git diff --quiet "$base"...HEAD -- src/; then
            before=$(git show "$base":Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
            after=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            echo "src/ changed; version $before -> $after"
            if [ "$before" = "$after" ]; then
              echo "::error::src/ changed but Cargo.toml's version did not. See docs/versioning.md: every source change bumps y (public item shape moved) or z (it did not)."
              exit 1
            fi
          else
            echo "src/ unchanged; no version bump required"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cargo.toml
        id: check
        run: echo "exists=$(test -f Cargo.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.exists == 'true'
        with:
          components: rustfmt, clippy

      - name: Format check
        if: steps.check.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.check.outputs.exists == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: cargo build --all-targets --verbose

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: cargo test --all-features --verbose

      # `cargo test --doc` runs the doctests but never builds the docs, so
      # rustdoc's own lints — a link to a private item, a broken intra-doc
      # reference — had no job that could fail on them. They are warnings by
      # default and warnings nobody reads are not diagnostics.
      - name: Docs
        if: steps.check.outputs.exists == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: No source yet
        if: steps.check.outputs.exists == 'false'
        run: echo "No Cargo.toml yet — skipping Rust build/test until source lands."

  # The hand-rolled engine (rusty_tls#25) needs `--cfg rusty_tls_handrolled`
  # on top of its cargo feature — see
  # docs/adr/0002-handrolled-engine-behind-a-permanently-non-default-seam.md.
  # The `build` job above therefore never compiles a line of it, even under
  # `--all-features`, which is exactly the point of the cfg gate and exactly
  # why this second job has to exist: code nobody compiles is worse than code
  # nobody wrote.
  handrolled-engine:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg rusty_tls_handrolled
      # rustdoc does not inherit RUSTFLAGS. Without this the module is absent
      # from `cargo doc` and its doctests silently do not run.
      RUSTDOCFLAGS: --cfg rusty_tls_handrolled
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --features handrolled-engine -- -D warnings

      - name: Test
        run: cargo test --features handrolled-engine --verbose

      # The `build` job's equivalent step cannot see this module at all, so a
      # rustdoc lint in here is only reachable from a job carrying the cfg.
      #
      # `--all-features` rather than just `handrolled-engine`: the crate's
      # prose links to items behind `rusty-tokio` (`AsyncTlsServerStream`,
      # `TlsAcceptor::accept_async`), so a partial-feature doc build has
      # unresolved links that say nothing about this module. All-features is
      # the configuration docs.rs builds and the one these docs are written
      # for.
      #
      # `-D warnings` is set here rather than on the job's `RUSTDOCFLAGS`
      # because that variable is also what makes the doctests compile, and
      # denying warnings for those is a different decision from denying them
      # for the docs.
      - name: Docs
        env:
          RUSTDOCFLAGS: --cfg rusty_tls_handrolled -D warnings
        run: cargo doc --no-deps --all-features

      - name: Prove the gated tests actually ran
        # Every handrolled test file is `#![cfg(all(feature = "...", cfg))]`,
        # so a typo in the cfg name — here, in Cargo.toml's check-cfg, or in
        # the source — compiles every one of them down to zero tests and still
        # reports success. A green job that ran nothing is the failure mode
        # this guards against, so every new suite belongs in this list.
        run: |
          for t in handrolled_record_kat \
                   handrolled_record_differential \
                   handrolled_record_rejection \
                   handrolled_x509_parse \
                   handrolled_x509_rejection \
                   handrolled_x509_corpus \
                   handrolled_fuzz \
                   handrolled_verify \
                   handrolled_path \
                   handrolled_name \
                   handrolled_schedule \
                   handrolled_wire \
                   handrolled_handshake \
                   handrolled_kx \
                   handrolled_tls_signature \
                   handrolled_client \
                   handrolled_interop \
                   handrolled_server; do
            n=$(cargo test --features handrolled-engine --test "$t" -- --list \
                  | grep -c ': test$')
            echo "$t: $n tests"
            if [ "$n" -eq 0 ]; then
              echo "::error::$t compiled to zero tests — is --cfg rusty_tls_handrolled reaching it?"
              exit 1
            fi
          done
          # Same trap, different flag: the module's doctests only run when
          # RUSTDOCFLAGS carries the cfg as well.
          d=$(cargo test --features handrolled-engine --doc -- --list | grep -c ': test$')
          echo "doctests: $d"
          if [ "$d" -lt 2 ]; then
            echo "::error::the handrolled module's doctests did not run — is RUSTDOCFLAGS set?"
            exit 1
          fi
