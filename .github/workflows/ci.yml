        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_meshed/data-mesh-monitor/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  # rusty_term's web front end: a vendored Vite/React app (not a Cargo
  # crate). Build only -- `tsc -b && vite build` -- so a dependency bump
  # (Dependabot's, in particular) is proven to compile and bundle before
  # it merges. Its `npm test` is a Playwright end-to-end run that needs a
  # live bridge and browsers; deliberately not run here.
  rusty-term-web:
    concurrency:
