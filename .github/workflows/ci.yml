      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/libs/ui/rusty_term/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # rusty_tick's web UI (Vite/React). Typecheck, unit tests (jsdom over the
  # in-memory adapter) and the production build; the Playwright run against
  # the real binary is the rusty-tick-e2e job below.
  rusty-tick-web:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-tick-web
      queue: max
      cancel-in-progress: false
    name: rusty_tick web (typecheck, test, build)
    needs: plan
    if: needs.plan.outputs.tick == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_tick/web
    steps:
