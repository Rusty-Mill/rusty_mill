name: CI

# Windows is the point of this workflow, not an afterthought.
#
# This project is Windows-native, and its two most important behaviours --
# a session surviving the manager being killed, and a session running on a
# real terminal -- are things Linux can only approximate. Every serious
# defect found so far surfaced on Windows and passed on Linux:
#
#   - an unbounded socket wait behind a bind-before-recover race
#   - `terminate()` failing on a pid that had already exited
#   - `cmd.exe` splitting single-quoted shell arguments
#
# None of those were caught by review or by the Linux suite. This workflow
# exists so they are caught by a machine on every push instead of by a
# human running tests by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per branch: these jobs spawn real processes and real
# git worktrees, so there is no value in racing an outdated commit's run
# against the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a failing test is the difference between "assertion
  # failed" and knowing where. These tests drive real subprocesses, so the
  # cheap local reproduction is not always available.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms always run. Cancelling the Windows job because
      # Linux failed would hide exactly the divergence this matrix exists
      # to expose.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    # Load-bearing, not boilerplate. This suite starts detached background
    # processes on purpose, and a bug in that machinery has already
    # produced a genuine indefinite hang. Without a cap, one such bug
    # burns six hours of runner time and reports nothing useful.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # The cache is shared per-OS rather than across the matrix: the
          # two targets build entirely different platform backends
          # (ConPTY vs openpty), so a shared key would thrash.
          key: ${{ matrix.os }}

      - name: Configure git identity
        # The worktree tests create real repositories and make real
        # commits from inside a session's own shell. A runner has no
        # global identity configured, and `git commit` refuses without
        # one. The test harness sets this per-repository too; this is the
        # belt to that pair of braces, and it keeps a failure here from
        # looking like a product bug.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "sessionmgr-ci"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # Warnings are failures. This project's own review found real
        # defects behind clippy warnings, and a warning nobody fails on is
        # a warning nobody reads.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Surface daemon and worker logs on failure
        # These tests drive the real binary as a subprocess, so a failure
        # inside a daemon or worker leaves its only explanation in a log
        # file the test output never shows. Without this, a red Windows
        # run says "assertion failed" and nothing about why.
        if: failure()
        shell: bash
        run: |
          echo "Searching for sessionmgr state roots left behind by failed tests..."
          for log in $(find "${TMPDIR:-${TEMP:-/tmp}}" -maxdepth 3 -name 'daemon.log' -o -maxdepth 4 -name 'worker.log' 2>/dev/null | head -40); do
            echo "===== $log ====="
            cat "$log" || true
          done
          echo "(no further logs)"

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A `rust-version` nobody builds against is decoration. This repo's
      # was inherited from a sibling project and wrong by thirteen
      # releases -- it claimed 1.75 while a transitive dependency required
      # 1.88 -- which nothing caught because every build used stable.
      #
      # Only `cargo check`, and only on one platform: this job exists to
      # prove the floor compiles, not to re-run the suite. The `test` jobs
      # above already do that on stable, where behaviour is what matters.
      - name: Install the declared minimum toolchain
        uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check
        run: cargo check --workspace --all-targets
