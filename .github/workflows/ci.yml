name: CI

# Workspace-wide CI for the Rusty Mill monorepo. Individual crates carried
# their own workflow under crates/<crate>/.github/workflows/ before the
# merge (dead now that they're not at a repo root — GitHub Actions only
# reads .github/workflows/ at the repository root), left in place for
# history.
#
# The `plan` job below computes which workspace crates a PR actually
# touches (plus everything that transitively depends on them) and every
# other job scopes its cargo invocation to just that set via `-p`, instead
# of always running `--workspace` across ~70 largely-unrelated crates.
# PRs and merge-queue entries use their event's base-to-head range. CI-only changes
# run planner tests, workflow lint, and representative smoke tests on the
# run's platforms; missing history, manual dispatches, and build-global changes still
# get the full sweep. A root Cargo.toml edit
# used to force the same full sweep unconditionally, but the single most
# common edit to that file is adding a handful of brand-new, independent
# workspace members with nothing else in the file touched (e.g. #170's
# rusty_hister bootstrap, eight new crates, zero existing lines changed) --
# that has no blast radius on any existing crate, so `.github/scripts/
# cargo_toml_diff.py` classifies the change first and only forces the full
# sweep when it's more than pure additions to `[workspace.members]` and
# `[workspace.dependencies]` (a dependency version bump, a removed/renamed
# member, a `[profile]` edit, ...). Toolchain inputs are global. Cargo.lock changes are selected using the
# full Cargo resolve graph below, with a conservative full fallback whenever
# the old/new lockfile impact cannot be established reliably.
on:
  # No `push` trigger: every change reaches `main` through the merge queue,
  # whose `merge_group` run already tested the exact tree that lands, so a
  # post-merge run would repeat it (ADR-0009). The daily sweep below replaces
  # it as the full check of `main` and the writer of `main`'s caches.
  #
  # Caches (10 GB per repository, least recently used evicted first): `main`
  # saves only the workspace `clippy-<os>`/`test-<os>` target caches
  # (setup-build-env) and the registry-only `plan`/`dependency-policy` ones.
  # With a target cache per component job as well (22 more), a queue run two
  # hours after the sweep found its `clippy-<os>` cache gone. Component jobs
  # build cold. `prune-caches` then deletes the entries each sweep supersedes.
  #
  # Platforms (ci_plan.py `platform_outputs`): a PR runs Linux only, plus
  # Windows clippy; the queue runs Windows and macOS, and Linux too unless a
  # green PR run already tested the identical tree on the same parent.
  pull_request:
  # The merge queue (ADR-0009) validates each queued entry on a temporary
  # branch; `required-gate` must run here or the queue waits forever for a
  # check that never starts. `ci_plan.py` scopes it against the entry's base.
  merge_group:
    types: [checks_requested]
  # A manual run deliberately uses the same full-sweep plan as a main push.
  # It is useful for re-running the whole workspace after runner or cache
  # incidents without creating a no-op commit.
  workflow_dispatch:
  # Daily full-workspace sweep: catches drift that scoped runs cannot see
  # (ADR-0009) and refreshes the `main` caches that PR runs restore.
  # nightly-alert.yml files an issue when it fails.
  # `ci_plan.py` treats any event other than push, PR and merge_group as full.
  schedule:
    - cron: "17 3 * * *"

# Least privilege (ADR-0009): no job here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust toolchain every job builds with (except the MSRV check, which
  # pins its own). Pinned rather than `stable`: Rust 1.99 deprecated
  # `fetch_update` and added the default `clippy::assert_is_empty` lint
  # (~1,300 hits), so a stable bump broke every warnings-as-errors job at
  # once. Moving to a newer Rust is now a deliberate change here.
  RUST_TOOLCHAIN: "1.98.1"
  # A one-shot CI build gets little benefit from incremental compilation
  # (there's no prior local state to reuse) and it adds bookkeeping
  # overhead and cache size for no payoff; disabling it is the standard
  # recommendation alongside Swatinem/rust-cache. Trimming debug info
  # similarly speeds up compilation/linking and shrinks what the cache has
  # to save/restore -- CI only needs `cargo test`/`clippy` to fail loudly,
  # not to produce a debuggable binary.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # GitHub-hosted runners don't run a D-Bus session/Secret Service provider,
  # so nexus-security's ADR-0009 startup keyring probe (`CredentialVault
  # ::available()`, called from `com.nexus.security`'s `on_init`) always
  # fails there -- not a flake, deterministic on every ubuntu-latest/
  # windows-latest run. `NEXUS_NO_KEYRING=1` is that crate's own documented
  # escape hatch (crates/apps/nexus/crates/nexus-security/src/credential.rs):
  # the probe returns Ok and individual credential operations return
  # KeyringDisabled instead, exactly the CI-without-a-real-keyring case.
  NEXUS_NO_KEYRING: '1'
  # rusty_remind_me's six crates. Excluded from the generic clippy/test jobs,
  # whose `--all-features` would switch on every optional feature of
  # remind_me_core at once -- including `stack-dumps` (libunwind/liblzma,
  # Linux-only) and `audio`/`ann` (whisper.cpp and usearch built from C/C++
  # source), on Windows too. The remind-me-* jobs below run the exact
  # per-feature matrix that product was verified with before the merge.
  REMIND_ME_PACKAGES: remind_me_core remind_me_mcp remind_me_api rusty-remind-me remind_me_remote remind_me_hub

concurrency:
  # Only revisions of the same PR supersede each other. Every main/manual
  # run can start planning immediately; main work queues per component/job
  # below. A later push's diff is not a replacement for an earlier push's.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  rl-live-test-safety:
    concurrency:
      group: ci-${{ github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rl-live-test-safety
      queue: max
      cancel-in-progress: false
    name: RL live tooling mocked safety tests
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Synthetic orchestration tests (no game or desktop)
        shell: pwsh
        run: ./crates/apps/rocket_league/rusty_bullet/tools/rl_live_test/test-safe.ps1

  rb-tape-verifier:
    concurrency:
      group: ci-${{ github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rb-tape-verifier
      queue: max
      cancel-in-progress: false
    name: Tape verifier discovery and Windows ScoreOnly
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Python runtime and PowerShell discovery regressions
        shell: pwsh
        run: |
          python -I -m unittest discover -s crates/apps/rocket_league/rusty_bullet/tools/rb_tape_bot -p 'test_verify_path.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Python verifier regressions failed" }
          ./crates/apps/rocket_league/rusty_bullet/tools/rb_tape_bot/test-run-batch.ps1
          ./crates/apps/rocket_league/rusty_bullet/tools/rb_tape_bot/test-preflight.ps1
      - name: Real monorepo ScoreOnly with matching recorded fixture (no game)
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rb verifier target
        run: |
          $bot = 'crates/apps/rocket_league/rusty_bullet/tools/rb_tape_bot'
          $batch = Join-Path $env:RUNNER_TEMP 'rb score batch'
          New-Item -ItemType Directory -Force $batch | Out-Null
          Copy-Item "$bot/fixtures/probe_reverse.jsonl" "$batch/probe_reverse_run1.jsonl"
          & "$bot/run_batch.ps1" -ScoreOnly $batch
          $report = Get-Content "$batch/results.md" -Raw
          if ($report -notmatch '\| probe_reverse \| [0-9]+' -or $report -match 'scoring failed') {
            throw "ScoreOnly did not score the matching fixture: $report"
          }
          Write-Host $report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rb-score-only-results
          path: ${{ runner.temp }}/rb score batch/results.md

  plan-tests:
    # affected_crates.py decides what every other job runs on a PR, and
    # check_workspace_deps.py enforces the dependency-sovereignty policy
    # job below -- both get unit tests, run against synthetic metadata (no
    # cargo needed), auto-discovered from this one `unittest discover`.
    name: plan script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  claude-hooks:
    # The remind-me capture hook (.claude/hooks) is stdlib-only Python and its
    # tests run against a local fake endpoint, so like library-tests this
    # needs no cargo and runs for every event.
    name: claude hook unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I -m unittest discover -s .claude/tests -p 'test_remind_me_*.py' -v

  library-tests:
    # library/ is stdlib-only Python (its builder and the offline UI it emits),
    # so this needs no cargo and runs for every event like plan-tests. The mod
    # tests (`claude plugin test`) need the `claude` CLI and are not run here.
    name: library unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        working-directory: library
        run: python3 -m unittest -v
      - name: Build the library page
        run: python3 library/build.py

  workflow-lint:
    # Runs for every event; it is the primary workflow-specific check for the
    # CI-only route and remains useful when an application change also edits CI.
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl --fail --location --retry 3 --output checksums.txt "$base/actionlint_${version}_checksums.txt"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          grep "  $archive$" checksums.txt | sha256sum --check --status
          tar --extract --gzip --file "$archive"
      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/lint_workflows.py --actionlint ./actionlint .github/workflows/*.yml
          python3 .github/scripts/test_lint_workflows.py --actionlint ./actionlint

  dependency-policy:
    # Enforces ADR-0002 (dependency sovereignty policy): a crate that is a
    # workspace member must not also be pinned as a git dependency
    # elsewhere in the workspace (ATLAS-RWC-0050). Runs unconditionally --
    # every PR, not just ones the `plan` job's affected-crate filter
    # selects -- because this is a workspace-wide manifest invariant, not
    # a per-crate build/test concern.
    name: dependency policy (workspace sovereignty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: dependency-policy
          cache-targets: false
      - run: cargo metadata --format-version=1 --all-features > /tmp/metadata.json
      - run: python3 .github/scripts/check_workspace_deps.py /tmp/metadata.json
      - run: python3 .github/scripts/check_workspace_layers.py /tmp/metadata.json
      # Default features: an optional dependency a plain build does not pull must not
      # raise a crate's declared rust-version.
      - run: cargo metadata --format-version=1 > /tmp/metadata-default.json
      - run: python3 .github/scripts/check_rust_versions.py /tmp/metadata-default.json
      - run: python3 .github/scripts/generate_workspace_map.py /tmp/metadata.json --verify docs/WORKSPACE-MAP.md

  cargo-deny:
    # Advisories, licences, sources (deny.toml, ADR-0009). Workspace-wide like
    # dependency-policy, so it runs for every event and the weekly sweep picks
    # up new RustSec entries. Blocking: accepted findings carry a reason in
    # deny.toml.
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny
      - run: cargo deny --workspace check

  cargo-shear:
    # Unused dependencies (ADR-0009). Source-scan based, so it can be wrong
    # (it was, three times, when the first batch was removed): non-blocking, a
    # finding is a prompt to look, not a verdict. Intentional exceptions live
    # in the root `[workspace.metadata.cargo-shear] ignored` list.
    name: cargo-shear (unused dependencies)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-shear
      - run: cargo shear

  plan:
    name: plan (affected crates)
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      packages: ${{ steps.plan.outputs.packages }}
      ci_only: ${{ steps.plan.outputs.ci_only }}
      dashboard: ${{ steps.plan.outputs.dashboard }}
      term_web: ${{ steps.plan.outputs.term_web }}
      term_bench: ${{ steps.plan.outputs.term_bench }}
      key_desktop: ${{ steps.plan.outputs.key_desktop }}
      tick: ${{ steps.plan.outputs.tick }}
      fair_play: ${{ steps.plan.outputs.fair_play }}
      agui: ${{ steps.plan.outputs.agui }}
      remind_me: ${{ steps.plan.outputs.remind_me }}
      remind_me_legacy_import: ${{ steps.plan.outputs.remind_me_legacy_import }}
      win32: ${{ steps.plan.outputs.win32 }}
      multimodal_db: ${{ steps.plan.outputs.multimodal_db }}
      rusty_config_no_std: ${{ steps.plan.outputs.rusty_config_no_std }}
      tls_engine: ${{ steps.plan.outputs.tls_engine }}
      rleval_viewer: ${{ steps.plan.outputs.rleval_viewer }}
      rleval_app: ${{ steps.plan.outputs.rleval_app }}
      rleval_service: ${{ steps.plan.outputs.rleval_service }}
      rleval_image: ${{ steps.plan.outputs.rleval_image }}
      crypto_ct: ${{ steps.plan.outputs.crypto_ct }}
      rand_platforms: ${{ steps.plan.outputs.rand_platforms }}
      msrv_manifests: ${{ steps.plan.outputs.msrv_manifests }}
      shards: ${{ steps.plan.outputs.shards }}
      components: ${{ steps.plan.outputs.components }}
      linux: ${{ steps.platforms.outputs.linux }}
      windows: ${{ steps.platforms.outputs.windows }}
      macos: ${{ steps.platforms.outputs.macos }}
      rust_os: ${{ steps.platforms.outputs.rust_os }}
      clippy_os: ${{ steps.platforms.outputs.clippy_os }}
      rand_os: ${{ steps.platforms.outputs.rand_os }}
    # `actions: read` lets a merge-queue run find the PR run's tested-tree record.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The planner verifies the event base is an ancestor before it
          # selects a narrow range. A shallow checkout cannot prove that for
          # a multi-commit push, so fetch complete history here.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: plan
          cache-targets: false

      - name: Determine affected crates
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          emit_full() {
            echo "$1 -- running the full workspace sweep."
            python3 .github/scripts/ci_plan.py --emit-full >> "$GITHUB_OUTPUT"
          }
          emit_ci_smoke() {
            echo "$1 -- running planner, workflow lint, and representative smoke tests. Full workspace coverage is not implied."
            printf '%s\n' "$changed" | python3 .github/scripts/ci_plan.py --emit-ci-smoke >> "$GITHUB_OUTPUT"
          }
          mapfile -t event_plan < <(python3 .github/scripts/ci_plan.py \
            --event "${{ github.event_name }}" \
            --pr-base "${{ github.event.pull_request.base.sha }}" \
            --push-before "${{ github.event.before }}" \
            --merge-base "${{ github.event.merge_group.base_sha }}")
          mode="${event_plan[0]#mode=}"
          base="${event_plan[1]#base=}"
          if [ "$mode" = "full" ]; then
            emit_full "Event has no usable scoped base"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$base" || ! git cat-file -e "$base^{commit}"; then
            emit_full "Unable to obtain event base $base"
            exit 0
          fi
          if ! python3 .github/scripts/ci_plan.py --verify-base "$base"; then
            emit_full "Event base is not an ancestor of this checkout"
            exit 0
          fi
          changed="$(python3 .github/scripts/ci_plan.py --changed-from "$base")"
          echo "Changed files:"
          echo "$changed"

          if printf '%s\n' "$changed" | python3 .github/scripts/ci_plan.py --is-ci-only; then
            emit_ci_smoke "CI-only change"
            exit 0
          fi

          if printf '%s\n' "$changed" | python3 .github/scripts/ci_plan.py --requires-full; then
            emit_full "Workspace-wide CI/tooling config changed"
            exit 0
          fi

          if echo "$changed" | grep -Eq '^Cargo\.toml$'; then
            git show "$base:Cargo.toml" > /tmp/old-Cargo.toml
            classification="$(python3 .github/scripts/cargo_toml_diff.py /tmp/old-Cargo.toml Cargo.toml)"
            if [ "$classification" != "safe" ]; then
              emit_full "Root Cargo.toml changed beyond pure [workspace.members]/[workspace.dependencies] additions"
              exit 0
            fi
            echo "Root Cargo.toml changed, but only added [workspace.members]/[workspace.dependencies] entries -- narrowing normally instead of a full sweep."
          fi

          cargo metadata --format-version=1 --all-features > /tmp/metadata.json
          packages="$(echo "$changed" | python3 .github/scripts/affected_crates.py /tmp/metadata.json)"

          # A member manifest edit, dependency declarations included, selects
          # that member and its reverse dependencies by path above. Feature
          # unification can still change how a crate that never depends on it
          # builds in a workspace-wide build; the daily full sweep covers that.

          # Cargo.lock has no owning crate. Select every workspace consumer
          # of an added, removed, version-changed, source-changed, or
          # checksum-changed resolved package through the full Cargo graph
          # (including external nodes), then fold those consumers and their
          # workspace reverse dependencies into scope, beside any manifest
          # edit's own selection. An unreadable or unknown lock entry is
          # ambiguous, so deliberately retain the full sweep.
          if echo "$changed" | grep -Eq '^Cargo\.lock$'; then
            if ! git show "$base:Cargo.lock" > /tmp/old-Cargo.lock; then
              emit_full "Event base has no readable Cargo.lock"
              exit 0
            fi
            if ! lockfile_packages="$(python3 .github/scripts/lockfile_diff.py /tmp/metadata.json /tmp/old-Cargo.lock Cargo.lock)"; then
              emit_full "Unable to establish Cargo.lock impact"
              exit 0
            fi
            if [ -z "$lockfile_packages" ]; then
              emit_full "Cargo.lock changed with no resolvable package impact"
              exit 0
            fi
            echo "Cargo.lock-affected crates: $lockfile_packages"
            packages="$(printf '%s\n' "$packages" "$lockfile_packages" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed -e 's/^ *//' -e 's/ *$//')"
          fi

          # A CI edit beside a change fragment or prose is not CI-only, but with
          # no affected crate no Cargo lane would run the edited CI at all.
          if printf '%s\n' "$changed" | python3 .github/scripts/ci_plan.py --needs-ci-smoke --packages "$packages"; then
            emit_ci_smoke "CI change with no affected crate"
            exit 0
          fi

          # Centralize all non-generic job gates here. Path-only front ends
          # are selected directly; Rust jobs use the affected crate plus its
          # reverse dependents.
          printf '%s\n' "$changed" | python3 .github/scripts/ci_plan.py --packages "$packages" >> "$GITHUB_OUTPUT"

          if [ -z "$packages" ]; then
            echo "No workspace crate touched by this PR -- build/test/clippy will be skipped."
          else
            echo "Affected crates: $packages"
          fi
          # Lanes spanning most of the workspace each rebuild the shared
          # dependencies; the full sweep runs fewer jobs and tests every crate.
          components_status=0
          components="$(python3 .github/scripts/ci_components.py /tmp/metadata.json --packages "$packages" --full-if-most)" || components_status=$?
          if [ "$components_status" -eq 3 ]; then
            emit_full "Affected crates span most of the workspace's components"
            exit 0
          elif [ "$components_status" -ne 0 ]; then
            exit "$components_status"
          fi
          {
            echo "full=false"
            echo "packages=$packages"
            echo "ci_only=false"
            echo "shards=[1]"
            echo "components=$components"
          } >> "$GITHUB_OUTPUT"

      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/ci_plan.py --tested-record > tested-tree.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree
          path: tested-tree.txt
          retention-days: 14

      - name: Choose platforms
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_plan.py --emit-platforms "${{ github.event_name }}" --repo "${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        run: |
          {
            if [ "${{ steps.plan.outputs.full }}" = "true" ]; then
              echo "### CI scope: full workspace sweep"
            elif [ "${{ steps.plan.outputs.ci_only }}" = "true" ]; then
              echo "### CI scope: CI-only smoke validation"
              echo "Planner tests, workflow lint, and representative smoke tests ran on this run's platforms; this is not full workspace coverage."
            elif [ -z "${{ steps.plan.outputs.packages }}" ]; then
              echo "### CI scope: no workspace crate affected -- build/test/clippy skipped"
            else
              echo "### CI scope: affected crates"
              echo '```'
              echo "${{ steps.plan.outputs.packages }}" | tr ' ' '\n'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-clippy-${{ matrix.scope.component }}-${{ matrix.os }}
      queue: max
      cancel-in-progress: false
    name: clippy (${{ matrix.scope.component }}, ${{ matrix.os }})
    needs: [plan, fmt]
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.clippy_os) }}
        scope: ${{ fromJson(needs.plan.outputs.components) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
        timeout-minutes: 15
        with:
          components: clippy
          cache-shared-key: clippy-${{ matrix.os }}

      # rusty_journal is built on io_uring, a Linux-only kernel interface --
      # excluded on windows-latest rather than making its internals
      # cfg-gated portable shims like rusty_win32 does the other way.
      # rusty_fedora_agent gets the same treatment: it shells out to
      # systemctl/journalctl/dnf, none of which exist on Windows either.
      # rusty_multimodal_db is a different case -- its own library and every
      # feature but one are portable, and its standalone repo's own CI never
      # ran a Windows job at all (single-OS, so this was simply untested,
      # not previously green). --all-features here is what first exercises
      # `external-db-bench`, whose optional `duckdb` dependency vendors
      # DuckDB's own C++ amalgamation ("bundled") -- that native build fails
      # under windows-latest's current MSVC toolchain (cc-rs exit code 2
      # compiling ub_src_storage_compression_chimp.cpp), a third-party
      # native-build issue with no Rust-side fix available here. Whole-crate
      # exclusion is coarser than the actual problem (one optional feature),
      # matching this mechanism's existing granularity rather than adding a
      # new one for a single crate.
      - uses: ./.github/actions/select-packages
        id: scope
        with:
          full: ${{ needs.plan.outputs.full }}
          packages: ${{ matrix.scope.packages }}
          windows-exclude: rusty_journal rusty_fedora_agent rusty_multimodal_db
          exclude: ${{ env.REMIND_ME_PACKAGES }}

      - name: Clippy
        if: steps.scope.outputs.args != ''
        run: cargo clippy ${{ steps.scope.outputs.args }} --all-targets --all-features -- -D warnings

  ci-smoke:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-ci-smoke-${{ matrix.os }}
      queue: max
      cancel-in-progress: false
    # This is deliberately a real Cargo build/test on both supported hosts,
    # but is not a replacement for a full workspace sweep.
    name: CI-only smoke (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.ci_only == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.rust_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
        timeout-minutes: 15
      - run: cargo test --locked -p rusty_baseline

  test:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-test-${{ matrix.scope.component }}-${{ matrix.os }}-${{ matrix.shard }}
      queue: max
      cancel-in-progress: false
    name: test (${{ matrix.scope.component }}, ${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: [plan, fmt]
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.packages != ''
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.rust_os) }}
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
        scope: ${{ fromJson(needs.plan.outputs.components) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
        timeout-minutes: 15
        with:
          cache-shared-key: test-${{ matrix.os }}

      - uses: ./.github/actions/select-packages
        id: scope
        with:
          full: ${{ needs.plan.outputs.full }}
          packages: ${{ matrix.scope.packages }}
          windows-exclude: rusty_journal rusty_fedora_agent rusty_multimodal_db
          exclude: ${{ env.REMIND_ME_PACKAGES }}

      # mill-term's own tests locate sibling binaries (rush/rgit/rsed/rawk)
      # by walking target/{debug,release} at runtime rather than through a
      # Cargo dependency (see the root README's "How the crates relate") --
      # mill-term only has a *library* dependency on rusty_git, and none at
      # all on rush/rusty_text, so nothing in the dependency graph forces
      # cargo to finish building those binaries before mill-term's test
      # binary starts running. A separate, blocking build step first
      # guarantees those specific binaries exist on disk before any test
      # executes (see #12).
      #
      # Scoped to just the three crates that own those binaries, not the
      # job's full package selection (`--workspace` on a full sweep) --
      # this used to build the entire selected scope a second time before
      # `cargo nextest run` built it all again for test-cfg, roughly
      # doubling compile time on every full-sweep run for a requirement
      # that only ever concerns three small CLI-tool crates. Only runs
      # when mill-term is actually in scope; every other PR skips this
      # step entirely.
      - name: Build (mill-term's sibling-binary prerequisites)
        if: steps.scope.outputs.args != '' && (needs.plan.outputs.full == 'true' || contains(matrix.scope.packages, 'mill-term'))
        run: cargo build -p rush -p rusty_git -p rusty_text --all-features

      - name: Install cargo-nextest
        if: steps.scope.outputs.args != ''
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: nextest

      # rusty_lines' windows_raw_mode integration suite deliberately shares
      # one process-wide console across all its tests (a real Windows
      # console is a singular resource -- see that file's own doc comment),
      # serialized behind a Mutex rather than relying on `cargo test`'s
      # default of running everything in one process. nextest instead runs
      # every test in its own separate process, so each test now allocates
      # an independent console instead of reusing one already configured by
      # an earlier test in the same process -- 4 of its 5 tests started
      # panicking or hanging under nextest specifically (confirmed via a
      # live CI run: see the terminated `ctrl_d_on_empty_line_is_eof`
      # timeout). Excluded here and run separately below via `cargo test`,
      # the harness this suite was actually designed and verified against.
      #
      # Separately, on windows-latest specifically: two live CI runs (with
      # nextest's own `retries` already absorbing ordinary transient
      # flakiness -- see .config/nextest.toml) still hit failures that
      # trace back to rusty_tokio's own scheduler under heavy concurrent
      # load -- rusty_tokio::tracing_instrumentation's spawn_blocking span
      # never getting entered, and a real async TLS client/server test
      # (built on rusty_tokio) hanging the full 10-minute slow-timeout.
      # Both are plausibly CPU-contention-triggered starvation in
      # rusty_tokio's own scheduler, not a bug in either test -- a real
      # issue in that crate worth its own investigation, not something to
      # patch here. Capping nextest's own test-thread concurrency on
      # windows-latest is a mitigation for the suspected trigger (less
      # contention among concurrently-running nextest processes), not a
      # confirmed fix for the underlying rusty_tokio behavior.
      # Only actually partitioned on a full sweep (3 shards, ~16800 tests);
      # a scoped PR run has exactly one shard (see plan's `shards` output)
      # and must run every selected test, so no `--partition` flag is
      # added there -- passing one unconditionally would silently run only
      # a third of a scoped PR's own tests.
      #
      # `--no-tests=warn`: nextest's default (`fail`) treats "the selected
      # packages collectively have zero tests" as a CI failure (exit 4, "no
      # tests to run") -- correct for a full sweep, where that can only mean
      # something broke test collection, but wrong for a scoped PR run that
      # only touches brand-new skeleton crates with no tests yet (PR #170's
      # rusty_hister bootstrap hit exactly this: 8 crates, 0 tests, CI red
      # for having nothing to test). `warn` still logs it -- so a crate that
      # silently loses all its tests some other way isn't swept under the
      # rug -- without failing a PR whose whole point is scaffolding.
      # `--no-fail-fast`: nextest stops the whole shard at its first failure
      # by default, so a full-workspace run showed exactly one failing test
      # per shard and hid the rest behind it -- three runs, three rounds of
      # "fix one, find the next". Running every test costs nothing extra on a
      # shard that was going to build everything anyway, and the summary then
      # names every failure at once.
      #
      # Windows, full-workspace runs specifically: cargo prepends the target
      # `deps` dir and every build script's link-search `out` dir to `PATH`
      # for each test binary. With `--all-features` across the whole
      # workspace that is dozens of long `target\debug\build\...\out` entries
      # ahead of the system's own, and `cmd.exe` reads at most 8,191
      # characters of a variable -- so `C:\Windows\System32` falls off the
      # end and any test that shells out through `cmd /C` to an external
      # program (`ping`, `sort`, `git`) fails "not recognized", while the same
      # test passes when its crate runs alone. The affected tests now hand
      # `cmd` a `PATH` without the `target\` entries (see
      # `rusty_tokio/tests/process_windows.rs`); a new test that shells out
      # on Windows must do the same.
      - name: Test (nextest)
        if: steps.scope.outputs.args != ''
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          cargo nextest run ${{ steps.scope.outputs.args }} --all-features --no-fail-fast --no-tests=warn ${{ runner.os == 'Windows' && '--test-threads 2' || '' }} ${{ needs.plan.outputs.full == 'true' && format('--partition count:{0}/3', matrix.shard) || '' }} -E 'not binary_id(rusty_lines::windows_raw_mode)' 2>&1 | tee "test-results/nextest-${{ matrix.scope.component }}-${{ matrix.os }}-shard-${{ matrix.shard }}.log"

      # The configured JUnit report carries each test's timing, retry attempts
      # and failure output; the captured nextest stream is human-readable.
      # Keep both even when the test step fails for later diagnosis.
      - name: Upload nextest timing and retry reports
        if: ${{ always() && steps.scope.outputs.args != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-${{ matrix.scope.component }}-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: |
            target/nextest/default/junit.xml
            test-results/nextest-${{ matrix.scope.component }}-${{ matrix.os }}-shard-${{ matrix.shard }}.log
          if-no-files-found: warn

      # Runs once per OS, not once per shard -- it's cheap and not worth
      # partitioning, and nextest's own partitioning above doesn't cover a
      # suite excluded from that run entirely.
      - name: Test rusty_lines' Windows raw-mode suite (cargo test)
        if: matrix.shard == 1 && runner.os == 'Windows' && (needs.plan.outputs.full == 'true' || contains(matrix.scope.packages, 'rusty_lines'))
        run: cargo test --test windows_raw_mode -p rusty_lines --all-features

      # nextest doesn't execute doctests -- run those separately so this
      # switch doesn't quietly drop doctest coverage. `cargo test --doc`
      # explicitly scoped via `-p` hard-errors on a package with no library
      # target ("no library targets found in package X") instead of quietly
      # skipping it the way `--doc --workspace` does -- a bin-only crate
      # (e.g. rusty_homelab_mcp) touched by a PR would otherwise fail this
      # step for having nothing to doc-test. Filter the scoped package list
      # down to crates that actually declare a `lib` target first.
      #
      # Both branches start from the select-packages step's outputs, never
      # from the plan job's raw list: only the former has the per-OS
      # exclusions applied. Re-deriving the scope here from
      # `needs.plan.outputs.packages` (or a bare `--doc --workspace`) is
      # exactly how rusty_journal -- Linux-only, and correctly excluded on
      # windows-latest by every other step in this job -- was still getting
      # compiled by this one step and failing the whole job on Windows.
      # Runs once per OS, not once per shard -- doctests are cheap and
      # nextest doesn't run them at all, so there's nothing shard 2/3
      # would otherwise be covering.
      - name: Test (doctests)
        if: matrix.shard == 1 && steps.scope.outputs.args != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.plan.outputs.full }}" = "true" ]; then
            # `args` is `--workspace` plus this runner's `--exclude` flags;
            # `--doc --workspace` already skips crates with no lib target.
            cargo test --doc ${{ steps.scope.outputs.args }} --all-features
          else
            lib_pkgs="$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.targets[]?.kind[]? == "lib") | .name')"
            read -r -a args <<< "${{ steps.scope.outputs.packages }}"
            doc_args=()
            for p in "${args[@]}"; do
              if echo "$lib_pkgs" | grep -qx "$p"; then
                doc_args+=(-p "$p")
              fi
            done
            if [ "${#doc_args[@]}" -gt 0 ]; then
              cargo test --doc "${doc_args[@]}" --all-features
            else
              echo "No affected package declares a library target -- nothing to doc-test."
            fi
          fi

  # rusty_meshed's data-mesh-monitor dashboard: a vendored Vite/React app
  # (not a Cargo crate, so none of the cargo jobs above see it). Builds
  # it and runs its `npm test`, which re-traces the vendored reverse-trace
  # scenario in JS and fails if it disagrees with the Rust reference
  # output checked in next to it (see that directory's README).
  data-mesh-monitor:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-data-mesh-monitor
      queue: max
      cancel-in-progress: false
    name: data-mesh-monitor (npm build + trace parity)
    needs: plan
    if: needs.plan.outputs.dashboard == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_meshed/data-mesh-monitor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_meshed/data-mesh-monitor/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  # rusty_term's web front end: a vendored Vite/React app (not a Cargo
  # crate). Build only -- `tsc -b && vite build` -- so a dependency bump
  # (Dependabot's, in particular) is proven to compile and bundle before
  # it merges. Its `npm test` is a Playwright end-to-end run that needs a
  # live bridge and browsers; deliberately not run here.
  rusty-term-web:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-term-web
      queue: max
      cancel-in-progress: false
    name: rusty_term web (npm build)
    needs: plan
    if: needs.plan.outputs.term_web == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/libs/ui/rusty_term/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/libs/ui/rusty_term/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # rusty_term parser+grid throughput gate. The engine rewrites in
  # docs/research/RUSTY-TERM-PERF-BACKLOG.md are performance work; without
  # this job a regression would only show when someone re-ran the bench by
  # hand. The failing check is deterministic: instructions per input byte
  # under cachegrind (bench/ir_gate.py), against bench/ir_ceilings.txt, with
  # glibc's memmove variant pinned so the count does not depend on the
  # runner's CPU. Wall-clock MB/s is printed to the job summary for
  # information only and never fails the build.
  rusty-term-bench:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-term-bench
      queue: max
      cancel-in-progress: false
    name: rusty_term instruction-count gate (bench_vt_throughput)
    needs: plan
    if: needs.plan.outputs.term_bench == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/libs/ui/rusty_term
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version
      - name: Gate script unit tests
        run: python3 -m unittest discover -s bench -p 'test_*.py' -v
      - name: rt-caps.sh interruption tests
        run: python3 -m unittest discover -s extra -p 'test_*.py' -v
      - name: Build bench_vt_throughput (release)
        run: cargo build --release --locked -p rusty_term --bin bench_vt_throughput
      - name: Generate quick workloads
        run: python3 bench/gen_workloads.py --size quick
      - name: Throughput (informational, never fails)
        run: |
          {
            echo "### rusty_term throughput (MB/s, informational)"
            echo '```'
            ../../../../target/release/bench_vt_throughput 20 || echo "bench run failed (informational)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Instructions per byte vs ceilings (the gate)
        run: |
          set -o pipefail
          {
            echo "### rusty_term instructions per byte (cachegrind)"
            python3 bench/ir_gate.py --bin ../../../../target/release/bench_vt_throughput
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # rusty_tick's web UI (Vite/React). Typecheck, unit tests (jsdom over the
  # in-memory adapter) and the production build; the Playwright run against
  # the real binary is the rusty-tick-e2e job below.
  rusty-tick-web:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-tick-web
      queue: max
      cancel-in-progress: false
    name: rusty_tick web (typecheck, test, build)
    needs: plan
    if: needs.plan.outputs.tick == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_tick/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_tick/web/package-lock.json
      # The agui packages the UI links as `file:` dependencies: built first.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-core
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-react
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # rusty_tick end to end: Playwright drives the built UI in Chromium against
  # the real rusty_tick binary (single-user and per-user-token servers).
  rusty-tick-e2e:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-tick-e2e
      queue: max
      cancel-in-progress: false
    name: rusty_tick e2e (Playwright)
    needs: plan
    if: needs.plan.outputs.tick == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_tick/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_tick/web/package-lock.json
      - run: cargo build -p rusty_tick
        working-directory: .
      # The agui packages the UI links as `file:` dependencies: built first.
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-core
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-react
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rusty-tick-e2e-results
          path: crates/apps/rusty_tick/web/test-results

  # rusty_agui conformance: the headless TypeScript core (packages/agui-core)
  # and the React, Vue and Angular bindings (packages/agui-*) are unit-tested
  # and built,
  # then the core and the reference AG-UI client
  # (@ag-ui/client, which CopilotKit's SDK and OpenBot embed) each drive the
  # `echo_agent` example served by rusty_agui's AgentHandler. Proves the wire
  # format against the client that matters, not only against our own.
  rusty-agui-conformance:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-agui-conformance
      queue: max
      cancel-in-progress: false
    name: rusty_agui conformance (@ag-ui/client)
    needs: plan
    if: needs.plan.outputs.agui == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/libs/protocol/rusty_agui/conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            crates/libs/protocol/rusty_agui/packages/agui-core/package-lock.json
            crates/libs/protocol/rusty_agui/packages/agui-react/package-lock.json
            crates/libs/protocol/rusty_agui/packages/agui-vue/package-lock.json
            crates/libs/protocol/rusty_agui/packages/agui-angular/package-lock.json
            crates/libs/protocol/rusty_agui/conformance/package-lock.json
      - run: cargo build -p rusty_agui --features serve --example echo_agent
        working-directory: .
      # The headless TypeScript core first: its unit tests, then its build,
      # which the conformance project consumes as a `file:` dependency.
      - run: npm ci --no-audit --no-fund
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-core
      - run: npm run typecheck
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-core
      - run: npm test
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-core
      - run: npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-core
      # The React binding over the built core: typecheck, hook tests under
      # jsdom against a scripted agent, build.
      - run: npm ci --no-audit --no-fund
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-react
      - run: npm run typecheck
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-react
      - run: npm test
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-react
      - run: npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-react
      # The Vue binding: composable tests under jsdom, same scripted agent.
      - run: npm ci --no-audit --no-fund
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-vue
      - run: npm run typecheck
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-vue
      - run: npm test
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-vue
      - run: npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-vue
      # The Angular binding: signal tests on a zoneless application.
      - run: npm ci --no-audit --no-fund
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-angular
      - run: npm run typecheck
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-angular
      - run: npm test
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-angular
      - run: npm run build
        working-directory: crates/libs/protocol/rusty_agui/packages/agui-angular
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        env:
          AGUI_ECHO_BIN: ${{ github.workspace }}/target/debug/examples/echo_agent

  # rusty_fair_play's web UI (Vite/React), the Fair Play front end: typecheck, unit tests (jsdom over the
  # in-memory adapter) and the production build. Mirrors rusty-tick-web.
  rusty-fair-play-web:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-fair-play-web
      queue: max
      cancel-in-progress: false
    name: rusty_fair_play web (typecheck, test, build)
    needs: plan
    if: needs.plan.outputs.fair_play == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_fair_play/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_fair_play/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # rusty_fair_play end to end: the API contract and the Playwright flows
  # against the real rusty_fair_play binary serving the built UI.
  rusty-fair-play-e2e:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-fair-play-e2e
      queue: max
      cancel-in-progress: false
    name: rusty_fair_play e2e (Playwright)
    needs: plan
    if: needs.plan.outputs.fair_play == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_fair_play/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_fair_play/web/package-lock.json
      - run: cargo build -p rusty_fair_play
        working-directory: .
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rusty-fair-play-e2e-results
          path: crates/apps/rusty_fair_play/web/test-results

  # rusty_key's desktop front end: a vendored Vite/Solid app inside a
  # Tauri shell (not a Cargo crate; the Rust side is its own crate). Build
  # only -- `npm run build` bundles the web assets without needing the
  # Tauri toolchain -- so a dependency bump is proven to compile and
  # bundle before it merges. No test script exists there.
  rusty-key-desktop:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-key-desktop
      queue: max
      cancel-in-progress: false
    name: rusty_key desktop (npm build)
    needs: plan
    if: needs.plan.outputs.key_desktop == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_key/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rusty_key/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # rusty_win32 is deliberately Windows-only and edition 2021 for MSRV
  # reasons (see crates/foundation/rusty_win32/Cargo.toml) — this mirrors its own CI's
  # cross-compile pre-check so a Linux-only contributor still gets fast
  # feedback on it without waiting on the windows-latest queue.
  win32-cross-compile-check:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-win32-cross-compile-check
      queue: max
      cancel-in-progress: false
    name: rusty_win32 cross-compile check (mingw, Linux)
    needs: plan
    if: needs.plan.outputs.win32 == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cargo check --target x86_64-pc-windows-gnu (std feature)
        run: cargo check -p rusty_win32 --target x86_64-pc-windows-gnu --all-targets --features std
      - name: cargo clippy --target x86_64-pc-windows-gnu
        run: cargo clippy -p rusty_win32 --target x86_64-pc-windows-gnu --all-targets --features std -- -D warnings

  # rusty_rand picks its OS source per target (getrandom(2) through rusty_libc on Linux
  # x86_64/aarch64, /dev/random on other Linux, /dev/urandom on other Unix, BCryptGenRandom
  # on Windows). The Linux x86_64 runners run the tests; Windows is covered by the workspace
  # test shards. This job adds what nothing else builds: it RUNS the tests on macOS (the
  # other-Unix path, where nothing is syscall-specific) and COMPILES, without running, the
  # aarch64 Linux path (rusty_libc's second arch) and the "other Linux" path (riscv64).
  # Compiling is not testing: the cross targets prove the cfg arms build, not that they work.
  rusty-rand-platforms:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-rand-platforms
      queue: max
      cancel-in-progress: false
    name: rusty_rand per-OS backends (macOS tests, Linux cross-checks)
    needs: plan
    if: needs.plan.outputs.rand_platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.rand_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.os == 'ubuntu-latest' && 'aarch64-unknown-linux-gnu,riscv64gc-unknown-linux-gnu' || '' }}
      - name: cargo test -p rusty_rand (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo test -p rusty_rand
      - name: cargo check --target aarch64-unknown-linux-gnu (getrandom + rusty_libc arm)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p rusty_rand --target aarch64-unknown-linux-gnu --all-targets
      - name: cargo check --target riscv64gc-unknown-linux-gnu (other-Linux /dev/random arm)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p rusty_rand --target riscv64gc-unknown-linux-gnu --all-targets

  # Every other Rust job above passes --all-features, and rusty_config's
  # own `default = ["std"]` (see crates/foundation/rusty_config/Cargo.toml) means
  # --all-features never disables it -- so CI has never actually compiled
  # the crate's documented `#![no_std]` + alloc-only code path (see the
  # `#![cfg_attr(not(feature = "std"), no_std)]` line in its src/lib.rs).
  # This is a small, additive check dedicated to that one crate's
  # non-default configuration, not a general no_std feature-matrix
  # mechanism for every no_std crate in the workspace. rusty_config is
  # `alloc`-only (no hardware/platform-specific code), so the host triple
  # is sufficient -- no `--target` cross-compile is needed the way
  # rusty_win32's check above needs one.
  # rusty_multimodal_db's library and test targets are built by every
  # other job with --all-features only, which is not what a deployment
  # builds: `memory_server` is `--features server`, a client is
  # `--features client`, and the default build has neither. Two of those
  # broke (a `research`-gated import used by both, a module ungated behind
  # `client`) and stayed broken across several merged PRs before a local
  # `cargo check --features server` found them (ADR-0098). This job lints
  # the crate's shipped feature sets, all targets, so the gap stays closed
  # -- clippy rather than check since ADR-0100, because `--all-features`
  # alone lets dead code hide behind `research`-gated callers (the crate's
  # standalone workflow's own reason for per-feature clippy). The same
  # job carries the rest of that standalone workflow, which the monorepo
  # never ran: the client-only test run (a consumer compiles no server),
  # the Python reference client's offline wire-vector conformance test,
  # and `cargo doc`. The MSRV check is its own job below (other toolchain).
  multimodal-db-feature-sets:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-multimodal-db-feature-sets
      queue: max
      cancel-in-progress: false
    name: rusty_multimodal_db feature sets (default, client, server, research)
    needs: plan
    if: needs.plan.outputs.multimodal_db == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: cargo clippy -p rusty_multimodal_db (default features)
        run: cargo clippy -p rusty_multimodal_db --all-targets -- -D warnings
      - name: cargo clippy -p rusty_multimodal_db --features client
        run: cargo clippy -p rusty_multimodal_db --features client --all-targets -- -D warnings
      - name: cargo clippy -p rusty_multimodal_db --features server
        run: cargo clippy -p rusty_multimodal_db --features server --all-targets -- -D warnings
      - name: cargo clippy -p rusty_multimodal_db --features research
        run: cargo clippy -p rusty_multimodal_db --features research --all-targets -- -D warnings
      # `server,research` is the crate's own documented test command and is not the
      # union `--all-features` builds (ADR-0098 listed five sets; ADR-0112 adds the fifth).
      - name: cargo clippy -p rusty_multimodal_db --features server,research
        run: cargo clippy -p rusty_multimodal_db --features server,research --all-targets -- -D warnings
      # `ECO-FR-003` (ADR-0043): the client-only feature set tests with no server compiled.
      - name: cargo test -p rusty_multimodal_db --features client
        run: cargo test -p rusty_multimodal_db --features client
      # `ECO-FR-008` (ADR-0043): every line of the crate's wire-vector fixture decodes and
      # re-encodes byte-for-byte through the stdlib-only Python client. `python3` is part of
      # `ubuntu-latest`; the live half runs inside `cargo test --all-features` above.
      - name: python reference client (offline conformance vectors)
        run: python3 -m unittest discover -s crates/apps/rusty_multimodal_db/clients/python/tests -v
      # Warnings denied since ADR-0101: the 82 rustdoc warnings ADR-0100 found
      # (unresolved intra-doc links, public docs linking private items) are
      # fixed, and this step keeps them at zero.
      - name: cargo doc -p rusty_multimodal_db --all-features --no-deps
        run: cargo doc -p rusty_multimodal_db --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # `Cargo.toml`'s `rust-version` is only a promise if something builds at
  # it (ADR-0100, from the crate's standalone workflow). Keep the version
  # below equal to `rust-version` in crates/apps/rusty_multimodal_db/Cargo.toml.
  # `--all-features` pulls DuckDB's amalgamation, so a cold run is long.
  multimodal-db-msrv:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-multimodal-db-msrv
      queue: max
      cancel-in-progress: false
    # The pin lives in the toolchain step below (keep it equal to `rust-version`
    # in the crate's Cargo.toml); the check's name carries no literal so a pin
    # bump does not rename a check a branch protection might require.
    name: rusty_multimodal_db msrv (rust-version)
    needs: plan
    if: needs.plan.outputs.multimodal_db == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml would otherwise win over the action's default.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.89.0
        with:
          toolchain: "1.89.0"
      - name: cargo check on the declared rust-version
        run: cargo check -p rusty_multimodal_db --all-features --all-targets

  msrv-compile:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-msrv-compile-${{ matrix.os }}
      queue: max
      cancel-in-progress: false
    # `check_rust_versions.py` (dependency policy) compares declared
    # rust-versions; this builds. Each workspace crate that declares one is
    # `cargo check`ed with a rustc of exactly that version, grouped by floor:
    # default features, then `--all-features` for a crate that has any (#844).
    # Every crate on a full sweep. A PR or queue entry checks only the crates
    # whose own Cargo.toml changed (ci_plan.py `msrv_manifests`): a code-only or
    # lockfile-only change that needs a newer rustc surfaces on the next
    # scheduled sweep instead of costing every run. Floors at
    # the pinned toolchain are covered by the ordinary jobs. The build output
    # stays under RUNNER_TEMP.
    #
    # `--all-features-exclude` lists crates whose declared floor is
    # deliberately the default build's, with an opt-in feature above it:
    # platform-linux (`track-p` -> rusty_libc 1.88) and platform-windows
    # (`track-w` -> rusty_win32 1.88, found by the Windows leg), see their
    # Cargo.tomls; rusty_json (the optional rusty_json-derive, 1.85), rusty_tls
    # (`native-crypto` -> rusty_aead/rusty_pk at the pinned toolchain),
    # rusty_rdp (its README: optional features raise the effective MSRV) and
    # rusty_tonic (`rusty-tokio` -> rusty_h2 1.88; its README keeps the
    # library at 1.75). Raising platform-linux, rusty_json or rusty_tls
    # would also break 7 to 36 dependents' declared floors.
    #
    # `--all-features-floor` checks a crate's `--all-features` build at a
    # stated floor above its declared one rather than skipping it: rusty_axum
    # (`http2` -> rusty_hyper/rusty_h2 1.88) is checked at 1.87 by default
    # and at 1.88 with all features; rusty_axum_tokio stays at 1.87.
    #
    # Windows (#845) runs on the scheduled and manual sweeps only: a
    # target-specific dependency can raise a floor there, but that drifts
    # slowly, and 14 toolchain installs per run would slow every PR. It
    # leaves out the crates the Windows clippy/test legs leave out. macOS
    # waits until CI builds the workspace there at all.
    name: compile at declared rust-version${{ matrix.os != 'ubuntu-latest' && format(' ({0})', matrix.os) || '' }}
    needs: plan
    if: (needs.plan.outputs.full == 'true' || needs.plan.outputs.msrv_manifests != '') && needs.plan.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.windows == 'true' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-env
        timeout-minutes: 15
      - name: cargo check each crate at its declared rust-version
        shell: bash
        env:
          PLAN_FULL: ${{ needs.plan.outputs.full }}
          PLAN_MANIFESTS: ${{ needs.plan.outputs.msrv_manifests }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          OS_EXCLUDE: ${{ runner.os == 'Windows' && 'rusty_journal rusty_fedora_agent' || '' }}
        run: |
          set -euo pipefail
          # Locked: a metadata call that rewrote Cargo.lock would validate a lock nobody committed.
          lock_before="$(sha256sum Cargo.lock)"
          cargo metadata --locked --format-version=1 > "$RUNNER_TEMP/metadata-default.json"
          scope=()
          if [ "$PLAN_FULL" != "true" ]; then scope=(--manifests "$PLAN_MANIFESTS"); fi
          # rusty_multimodal_db has its own msrv job; the remind_me crates have their own jobs.
          "$PYTHON" .github/scripts/check_msrv_compile.py "$RUNNER_TEMP/metadata-default.json" \
            "${scope[@]}" \
            --skip-from "$RUST_TOOLCHAIN" \
            --exclude "$REMIND_ME_PACKAGES rusty_multimodal_db $OS_EXCLUDE" \
            --all-features-exclude "platform-linux platform-windows rusty_json rusty_tls rusty_rdp rusty_tonic" \
            --all-features-floor "rusty_axum=1.88" \
            --target-base "$RUNNER_TEMP/msrv"
          test "$(sha256sum Cargo.lock)" = "$lock_before"

  rusty-config-no-std-check:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-config-no-std-check
      queue: max
      cancel-in-progress: false
    name: rusty_config no_std (--no-default-features)
    needs: plan
    if: needs.plan.outputs.rusty_config_no_std == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: cargo check -p rusty_config --no-default-features
        run: cargo check -p rusty_config --no-default-features --all-targets

  # The same engine on its first-party backend (ADR-0005, ADR-0006):
  # `native-crypto` with `--cfg rusty_tls_native_crypto`, no
  # `handrolled-engine`. That build has no direct `ring` dependency, so
  # compiling it is itself the check that the engine makes no `ring` call. It
  # has the client and server roles, tickets and client certificates, with
  # ECDSA and Ed25519 signing only: the tests that need an RSA signing key are
  # skipped on this backend by name (see each suite), and stay covered above.
  rusty-tls-engine-native:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-tls-engine-native
      queue: max
      cancel-in-progress: false
    name: rusty_tls native engine (first-party crypto)
    needs: plan
    if: needs.plan.outputs.tls_engine == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg rusty_tls_handrolled --cfg rusty_tls_native_crypto
      RUSTDOCFLAGS: --cfg rusty_tls_handrolled --cfg rusty_tls_native_crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      # `ring` must not be a direct dependency of this build. If a later change
      # makes `native-crypto` imply `handrolled-engine` (or adds `ring` some
      # other way), the compile-time proof above silently stops being one.
      - name: no direct ring dependency
        shell: bash
        run: |
          set -euo pipefail
          deps=$(cargo tree -p rusty_tls --features native-crypto -e normal --depth 1 --prefix none)
          echo "$deps"
          if echo "$deps" | grep -qE '^ring v'; then
            echo "::error::rusty_tls with native-crypto depends on ring directly"
            exit 1
          fi
      - name: cargo clippy -p rusty_tls --features native-crypto
        run: cargo clippy -p rusty_tls --all-targets --features native-crypto -- -D warnings
      # With the native cfg the server modules do not exist, so a doc link to
      # one breaks only here; the job above cannot see it.
      - name: cargo doc -p rusty_tls --all-features (native cfg)
        env:
          RUSTDOCFLAGS: --cfg rusty_tls_handrolled --cfg rusty_tls_native_crypto -D warnings
        run: cargo doc -p rusty_tls --all-features --no-deps
      # Includes the seam differential (`handrolled::crypto::native::tests`):
      # the same inputs through both backends, byte-identical outputs.
      - name: cargo test -p rusty_tls --features native-crypto
        run: cargo test -p rusty_tls --features native-crypto
      # Both directions, as in the ring job: the TLS 1.3 server, the TLS 1.2
      # client and server, and version negotiation, each against OpenSSL.
      - name: socket interop against OpenSSL (both directions)
        shell: bash
        run: |
          set -euo pipefail
          openssl version
          for suite in handrolled_socket_interop handrolled_client12_socket_interop \
            handrolled_server12_socket_interop handrolled_negotiate_socket_interop; do
            out=$(cargo test -p rusty_tls --features native-crypto \
              --test "$suite" -- --ignored --nocapture --color never)
            echo "$out"
            echo "$out" | grep -qE 'test result: ok\. [1-9][0-9]* passed' || {
              echo "::error::the $suite suite ran no tests"
              exit 1
            }
          done
      # The zero-tests trap again, with an explicit split: a suite marked
      # `// ring-only suite (ADR-0005)` (its inner cfg excludes the native
      # backend) must compile to zero tests here, and
      # every other handrolled suite must run at least one. A suite that drops
      # to zero without saying so fails, and so does one that claims to be
      # ring-only but still runs.
      - name: prove the native suites ran, and only those
        shell: bash
        run: |
          set -euo pipefail
          native=0
          ring_only=0
          for f in crates/libs/net/rusty_tls/tests/handrolled_*.rs; do
            t=$(basename "$f" .rs)
            n=$(cargo test -p rusty_tls --features native-crypto --test "$t" -- --list | grep -c ': test$' || true)
            if grep -q '^// ring-only suite (ADR-0005)' "$f"; then
              echo "$t: ring-only, $n tests"
              if [ "$n" -ne 0 ]; then
                echo "::error::$t is marked ring-only but ran $n tests on the native backend"
                exit 1
              fi
              ring_only=$((ring_only + 1))
            else
              echo "$t: $n tests"
              if [ "$n" -eq 0 ]; then
                echo "::error::$t compiled to zero tests on the native backend -- mark it ring-only or fix its cfg"
                exit 1
              fi
              native=$((native + 1))
            fi
          done
          echo "native suites: $native, ring-only suites: $ring_only"
          if [ "$native" -lt 36 ]; then
            echo "::error::only $native handrolled suites ran on the native backend; expected 36 or more"
            exit 1
          fi
          d=$(cargo test -p rusty_tls --features native-crypto --doc -- --list | grep -c ': test$' || true)
          echo "doctests: $d"
          if [ "$d" -lt 2 ]; then
            echo "::error::the handrolled doctests did not run -- is RUSTDOCFLAGS set?"
            exit 1
          fi
      # BoGo on the first-party backend, both roles (ADR-0005 decision 4,
      # ADR-0006). The engine has no RSA signing here, so scenarios whose key is
      # RSA (BoGo's default server certificate) are refused at load and reported
      # as unimplemented (exit 89). The floor is set from the first full run
      # with server scenarios (494 passed at the pinned commit). A shim that
      # skipped everything would also exit 0, which is what the floor catches.
      # The ring job's BoGo run keeps covering RSA signing.
      - name: BoGo, both roles (BoringSSL protocol suite)
        shell: bash
        run: |
          set -euo pipefail
          go version
          NATIVE=1 crates/libs/net/rusty_tls/bogo/run.sh | tee bogo-native.out
          passed=$(sed -nE 's/^BoGo: ([0-9]+) passed.*/\1/p' bogo-native.out)
          if [ "${passed:-0}" -lt 480 ]; then
            echo "::error::native BoGo passed only ${passed:-0} tests (expected 480+) -- is the shim skipping everything?"
            exit 1
          fi
      - name: x509-limbo certificate differential
        shell: bash
        run: >
          bash .github/scripts/limbo_differential.sh
          cargo test -p rusty_tls --features native-crypto
          --test handrolled_limbo -- --ignored --nocapture --color never
      # Tier 1 item 1 on the native backend (ADR-0002 Amendment 2): the same live
      # check as the ring job, against the named consumer's hosts, with the
      # rustls differential. The 10 consecutive scheduled runs are counted here.
      - name: live internet (non-blocking)
        continue-on-error: true
        shell: bash
        env:
          LIVE_BACKEND: native
        # Through the same tested script as the ring job; see its comment.
        run: >-
          bash .github/scripts/live_internet_check.sh
          cargo test -p rusty_tls --features native-crypto
          --test handrolled_live -- --ignored --nocapture --color never

  # The hand-rolled TLS engine (rusty_tls#25) compiles only with the cargo
  # feature `handrolled-engine` AND `--cfg rusty_tls_handrolled`
  # (crates/libs/net/rusty_tls/docs/adr/0002-*.md). Neither the generic clippy
  # nor the generic test job sets the cfg, so before this job existed no CI job
  # compiled, linted or ran a line of it, and a regression (including a
  # security one) could land with every check green. The pre-merge crate
  # workflow had this job; it went dead with the others when the crate moved
  # under crates/ (see the header of this file). Ported from it.
  rusty-tls-engine:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-tls-engine
      queue: max
      cancel-in-progress: false
    name: rusty_tls native engine (handrolled cfg)
    needs: plan
    if: needs.plan.outputs.tls_engine == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg rusty_tls_handrolled
      # rustdoc does not inherit RUSTFLAGS. Without this the module is absent
      # from `cargo doc` and its doctests silently do not run.
      RUSTDOCFLAGS: --cfg rusty_tls_handrolled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: cargo clippy -p rusty_tls --features handrolled-engine
        run: cargo clippy -p rusty_tls --all-targets --features handrolled-engine -- -D warnings
      - name: cargo test -p rusty_tls --features handrolled-engine
        run: cargo test -p rusty_tls --features handrolled-engine
      # `--all-features` rather than just `handrolled-engine`: the crate's prose
      # links to items behind `rusty-tokio`, so a partial-feature doc build has
      # unresolved links that say nothing about the engine. `-D warnings` is set
      # here and not on the job's RUSTDOCFLAGS because that variable also makes
      # the doctests compile, and denying warnings for those is a different
      # decision.
      - name: cargo doc -p rusty_tls --all-features
        env:
          RUSTDOCFLAGS: --cfg rusty_tls_handrolled -D warnings
        run: cargo doc -p rusty_tls --all-features --no-deps
      # `handrolled_socket_interop` is `#[ignore]`d so it does not fail on a
      # machine without OpenSSL. The runner has it and the tests are hermetic (a
      # loopback listener and a child process, no network), so they run here
      # instead of staying permanently unexercised. `openssl version` first so
      # a missing binary fails loudly rather than running zero tests.
      - name: socket interop against OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          openssl version
          # Four suites: the TLS 1.3 server (OpenSSL as the client), the
          # TLS 1.2 client and server (OpenSSL as the other end), and version
          # negotiation with the downgrade sentinel (both directions).
          for suite in handrolled_socket_interop handrolled_client12_socket_interop \
            handrolled_server12_socket_interop handrolled_negotiate_socket_interop; do
            out=$(cargo test -p rusty_tls --features handrolled-engine \
              --test "$suite" -- --ignored --nocapture --color never)
            echo "$out"
            # `-- --ignored` runs ONLY ignored tests: if the attribute is removed
            # this runs zero and exits 0. Assert the count, not the exit code.
            echo "$out" | grep -qE 'test result: ok\. [1-9][0-9]* passed' || {
              echo "::error::the $suite suite ran no tests -- is #[ignore] still on them?"
              exit 1
            }
          done
      # Every handrolled test file is `#![cfg(all(feature = ..., cfg))]`, so a
      # typo in the cfg name (here, in Cargo.toml's check-cfg, or in a source
      # file) compiles each one down to zero tests and still reports success.
      # The suites are discovered from the directory rather than listed by hand,
      # so a new `handrolled_*.rs` is guarded the moment it exists.
      - name: prove the gated tests actually ran
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for f in crates/libs/net/rusty_tls/tests/handrolled_*.rs; do
            t=$(basename "$f" .rs)
            n=$(cargo test -p rusty_tls --features handrolled-engine --test "$t" -- --list | grep -c ': test$' || true)
            echo "$t: $n tests"
            if [ "$n" -eq 0 ]; then
              echo "::error::$t compiled to zero tests -- is --cfg rusty_tls_handrolled reaching it?"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -lt 10 ]; then
            echo "::error::found only $count handrolled suites; the glob matched too little"
            exit 1
          fi
          # Same trap, different flag: the doctests only run when RUSTDOCFLAGS
          # carries the cfg as well.
          d=$(cargo test -p rusty_tls --features handrolled-engine --doc -- --list | grep -c ': test$' || true)
          echo "doctests: $d"
          if [ "$d" -lt 2 ]; then
            echo "::error::the handrolled doctests did not run -- is RUSTDOCFLAGS set?"
            exit 1
          fi
      # BoringSSL's protocol suite (BoGo) as an independent hostile peer. The
      # run script pins the BoringSSL commit and exits non-zero on any FAIL;
      # tests the shim does not implement are skipped, which is why the floor
      # below exists: a shim that skipped everything would also exit 0.
      # No setup-go: this repo pins every action to a commit SHA and none is
      # pinned for it. The runner image ships Go; the version is printed so a
      # too-old one shows in the log.
      - name: BoGo (BoringSSL protocol suite)
        shell: bash
        run: |
          set -euo pipefail
          go version
          crates/libs/net/rusty_tls/bogo/run.sh | tee bogo.out
          passed=$(sed -nE 's/^BoGo: ([0-9]+) passed.*/\1/p' bogo.out)
          if [ "${passed:-0}" -lt 830 ]; then
            echo "::error::BoGo passed only ${passed:-0} tests (expected 830+) -- is the shim skipping everything?"
            exit 1
          fi
      # Evidence, not a gate: the native engine against real servers (Google's
      # sign-in endpoints, the first candidate consumer's peers), compared with
      # the rustls-backed stream. A third party's server must not decide whether
      # a PR merges, so a failure here is a visible warning, not a red job; read
      # the step summary. The runner reaches the internet directly, which the
      # sandboxes this was developed in do not (they re-sign TLS with their own
      # CA, and the test says so when it sees that).
      # The x509-limbo corpus (about ten thousand certificate-validation cases
      # written by others) run through this validator and webpki side by side.
      # Any change in the results fails -- including lost coverage (cases that
      # stop being compared) -- and so does any case this validator accepts that
      # webpki refuses and nobody has looked at (tests/data/limbo_divergences.txt).
      # The corpus is fetched from an immutable upstream commit and checked
      # against a pinned sha256; if it cannot be fetched or does not match, the
      # step fails rather than skipping (limbo_differential.sh).
      - name: x509-limbo certificate differential
        shell: bash
        run: >
          bash .github/scripts/limbo_differential.sh
          cargo test -p rusty_tls --features handrolled-engine
          --test handrolled_limbo -- --ignored --nocapture --color never
      - name: live internet (non-blocking)
        continue-on-error: true
        shell: bash
        env:
          LIVE_BACKEND: ring
        # The script always prints and summarises the output, even when cargo
        # fails (a bare command substitution under `set -e` would lose it), and
        # fails the step on a failure or a zero-test run. It is tested offline
        # by test_live_internet_check.py.
        run: >-
          bash .github/scripts/live_internet_check.sh
          cargo test -p rusty_tls --features handrolled-engine
          --test handrolled_live -- --ignored --nocapture --color never

  # ---------------------------------------------------------------------------
  # Rocket League family: RLEvalSystem's two product-specific checks, ported from
  # its pre-merge CI (baileyrd/RLEvalSystem .github/workflows/ci.yml). The
  # workspace-wide jobs above already cover everything else (fmt; clippy, nextest
  # and doctests with --all-features, which includes rleval-app's `mmdb,oidc`
  # set on Linux and Windows). Its Python service job is deliberately not ported:
  # the service and Docker files were moved as-is, with no CI (ADR-0008).
  # ---------------------------------------------------------------------------

  # Coverage-guided fuzz smoke for the native TLS engine's parsers and state
  # machines (evidence bar, docs/research/TLS-EVIDENCE-BAR.md item 3). A fixed
  # time per target on every PR: it finds shallow regressions, not deep bugs;
  # long runs are a separate, deliberate activity. Nightly is pinned to a date
  # because libFuzzer instrumentation needs it and a floating nightly would let
  # an unrelated compiler change fail an unrelated PR. The logic lives in a
  # tested script (tls_fuzz_smoke.sh): a crash, a target that runs nothing, and
  # a vanished target directory all fail the job.
  rusty-tls-fuzz:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-tls-fuzz
      queue: max
      cancel-in-progress: false
    name: rusty_tls native engine fuzz smoke
    needs: plan
    if: needs.plan.outputs.tls_engine == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg rusty_tls_handrolled
      # One dated nightly, used for both the install and the script's `+name`.
      FUZZ_TOOLCHAIN: nightly-2026-10-07
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: fuzz smoke (30 s per target)
        env:
          # The installed cargo-fuzz is a musl binary and would otherwise build
          # the targets for musl, whose std the runner lacks.
          FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: bash .github/scripts/tls_fuzz_smoke.sh 30 8
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rusty-tls-fuzz-artifacts
          path: crates/libs/net/rusty_tls/fuzz/artifacts
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------

  # The offline replay viewer bundles three.js and a render loop in JS that the
  # Rust golden tests cannot exercise. Render it under software WebGL
  # (swiftshader) and fail on any page error or if the render loop never ticks.
  # puppeteer is pinned by tests/package-lock.json, installed with `npm ci`.
  rleval-viewer-gl-smoke:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rleval-viewer-gl-smoke
      queue: max
      cancel-in-progress: false
    name: replay-viewer headless-GL smoke
    needs: plan
    if: needs.plan.outputs.rleval_viewer == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/apps/rocket_league/crates/replay-viewer/tests/package-lock.json
      - name: Generate offline viewer
        run: cargo run -q -p replay-viewer -- crates/apps/rocket_league/rleval/assets/replays/42f2.replay --offline --hz 15 --html "$RUNNER_TEMP/viewer.html"
      - name: Input strip helpers
        run: node crates/apps/rocket_league/crates/replay-viewer/tests/input_strip.mjs
      - name: Install puppeteer
        working-directory: crates/apps/rocket_league/crates/replay-viewer/tests
        run: npm ci --no-audit --no-fund
      - name: Headless-GL smoke test
        run: node crates/apps/rocket_league/crates/replay-viewer/tests/gl_smoke.mjs "$RUNNER_TEMP/viewer.html"
      # ADR-0085: the same page built from a capture, with the port's run as ghosts.
      - name: Generate capture viewer with a sim run
        env:
          CAPTURE: crates/apps/rocket_league/crates/rb_capture_ingest/fixtures/human/clean-dodge.capture.jsonl
        run: |
          cargo run -q -p rb_verify_cli --bin rb-verify -- --self "$CAPTURE" --write-candidate "$RUNNER_TEMP/candidate.jsonl"
          cargo run -q -p replay-viewer -- "$CAPTURE" --sim "$RUNNER_TEMP/candidate.jsonl" --offline --html "$RUNNER_TEMP/capture.html"
      - name: Headless-GL smoke test (capture)
        run: node crates/apps/rocket_league/crates/replay-viewer/tests/gl_smoke.mjs "$RUNNER_TEMP/capture.html"

  # Every other Rust job passes --all-features, which hides a broken default or
  # single-feature build of rleval-app: its default build is the token-only
  # server and must not need the rustls stack (`oidc`) or the engine (`mmdb`).
  # The combined `mmdb,oidc` set is what --all-features already builds.
  rleval-app-feature-sets:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rleval-app-feature-sets
      queue: max
      cancel-in-progress: false
    name: rleval-app feature sets (default, mmdb, oidc)
    needs: plan
    if: needs.plan.outputs.rleval_app == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: cargo clippy -p rleval-app (default features)
        run: cargo clippy -p rleval-app --all-targets -- -D warnings
      - name: cargo clippy -p rleval-app --features mmdb
        run: cargo clippy -p rleval-app --all-targets --features mmdb -- -D warnings
      - name: cargo clippy -p rleval-app --features oidc
        run: cargo clippy -p rleval-app --all-targets --features oidc -- -D warnings
      - name: cargo test -p rleval-app (default features)
        run: cargo test -p rleval-app

  # The rleval Python service (crates/apps/rocket_league/rleval/service): its pytest suite with
  # the dev extra, which pulls in the queue, S3 (moto), migration and crypto backends.
  rleval-service:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rleval-service
      queue: max
      cancel-in-progress: false
    name: rleval service (pytest)
    needs: plan
    if: needs.plan.outputs.rleval_service == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rocket_league/rleval/service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install into a venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -e ".[dev]"
      - name: pytest
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q'

  # The rleval service image, built from the monorepo root as compose builds it.
  rleval-image:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rleval-image
      queue: max
      cancel-in-progress: false
    name: rleval service image (docker build)
    needs: plan
    if: needs.plan.outputs.rleval_image == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        run: docker build -f crates/apps/rocket_league/rleval/Dockerfile -t rleval-ci .
      - name: The image bundles the scorer and imports the API
        run: docker run --rm rleval-ci sh -c 'test -x "$RLS_WORKER_BIN" && python -c "import app.main"'

  # ---------------------------------------------------------------------------
  # rusty_remind_me (crates/apps/rusty_remind_me). Ported from that product's
  # own pre-merge CI (its crates/apps/rusty_remind_me/.github/workflows/ci.yml,
  # dead now that it is not at a repository root -- the full rationale for
  # each leg is in its comments there). Its toolchain-independent check
  # (plugin.json version) is the `remind-me-plugin-version` job below.
  # `fmt` is covered by the workspace-wide job above.
  # ---------------------------------------------------------------------------

  remind-me:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-remind-me
      queue: max
      cancel-in-progress: false
    name: rusty_remind_me build / test / clippy (default features)
    needs: plan
    if: needs.plan.outputs.remind_me == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: cargo build
        run: cargo build --locked -p remind_me_core -p remind_me_mcp -p remind_me_api -p rusty-remind-me -p remind_me_remote -p remind_me_hub
      - name: cargo test
        run: cargo test --locked -p remind_me_core -p remind_me_mcp -p remind_me_api -p rusty-remind-me -p remind_me_remote -p remind_me_hub
      - name: cargo clippy
        run: cargo clippy --locked -p remind_me_core -p remind_me_mcp -p remind_me_api -p rusty-remind-me -p remind_me_remote -p remind_me_hub --all-targets -- -D warnings

  # One runner per optional remind_me_core feature. Which features run tests
  # and which are clippy-only is deliberate (models that can't be fetched in
  # CI, runner disk) -- see the original workflow's comment before changing it.
  remind-me-features:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-remind-me-features-${{ matrix.feature }}
      queue: max
      cancel-in-progress: false
    name: rusty_remind_me feature ${{ matrix.feature }}
    needs: plan
    if: needs.plan.outputs.remind_me == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      # This workflow strips debug info (CARGO_PROFILE_DEV_DEBUG: 0 above),
      # but `stack-dumps`' watchdog_stack_dump_test asserts that dumped
      # frames resolve to file:line, which needs line tables.
      # `line-tables-only` is what this product's own CI always ran with.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: pdf, test: true, clippy: true }
          - { feature: cloud-backup, test: true, clippy: true }
          - { feature: ann, test: true, clippy: false }
          - { feature: ocr, test: false, clippy: true }
          - { feature: audio, test: false, clippy: true }
          - { feature: rerank, test: true, clippy: false }
          - { feature: local-embed, test: false, clippy: true }
          # rstack-self links libunwind's ptrace API; liblzma-dev is required
          # too (remind_me_core's build.rs asks for -llzma -- its docs/adr/0014).
          - { feature: stack-dumps, test: true, clippy: true, apt: libunwind-dev liblzma-dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Install system packages this feature needs
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: cargo test --features ${{ matrix.feature }}
        if: matrix.test
        run: cargo test --locked -p remind_me_core --features ${{ matrix.feature }}
      - name: cargo clippy --features ${{ matrix.feature }}
        if: matrix.clippy
        run: cargo clippy --locked -p remind_me_core --features ${{ matrix.feature }} --all-targets -- -D warnings

  # ocr/rerank/local-embed share one rten/tokenizers runtime; this is the only
  # leg that exercises them initialising together in one process.
  remind-me-combined-features:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-remind-me-combined-features
      queue: max
      cancel-in-progress: false
    name: rusty_remind_me build / test / clippy (combined features)
    needs: plan
    if: needs.plan.outputs.remind_me == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: cargo build --features ann,ocr,rerank,local-embed,pdf
        run: cargo build --locked -p remind_me_core --features ann,ocr,rerank,local-embed,pdf
      - name: cargo test --features ann,ocr,rerank,local-embed,pdf
        run: cargo test --locked -p remind_me_core --features ann,ocr,rerank,local-embed,pdf
      - name: cargo clippy --features ann,ocr,rerank,local-embed,pdf
        run: cargo clippy --locked -p remind_me_core --features ann,ocr,rerank,local-embed,pdf --all-targets -- -D warnings

  remind-me-plugin-version:
    # rusty_remind_me's `.claude-plugin/plugin.json` version must equal its six
    # crates' versions (check_plugin_version.sh also fails if the crates
    # disagree). Lives here, not in its own workflow, so `required-gate` covers
    # it: a drifted bump must not merge while the sole required check is green.
    # Runs whenever the product's directory changes (the `remind_me` plan flag).
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-remind-me-plugin-version
      queue: max
      cancel-in-progress: false
    name: rusty_remind_me plugin.json version vs. crate versions
    needs: plan
    if: needs.plan.outputs.remind_me == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare .claude-plugin/plugin.json against the crates' Cargo.toml
        run: crates/apps/rusty_remind_me/scripts/check_plugin_version.sh

  remind-me-hub:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-remind-me-hub
      queue: max
      cancel-in-progress: false
    name: rusty_remind_me hub (engine + SQLite copy)
    needs: plan
    if: needs.plan.outputs.remind_me == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: cargo clippy -p remind_me_hub --no-default-features
        run: cargo clippy --locked -p remind_me_hub --no-default-features --all-targets -- -D warnings
      - name: cargo test -p remind_me_hub --no-default-features
        run: cargo test --locked -p remind_me_hub --no-default-features

  remind-me-legacy-import:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-remind-me-legacy-import
      queue: max
      cancel-in-progress: false
    # Postgres is only a legacy recovery source, never a runtime backend.
    name: rusty_remind_me legacy Postgres import
    needs: plan
    if: needs.plan.outputs.remind_me_legacy_import == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hubtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: Lint the recovery feature and binaries
        run: cargo clippy --locked -p remind_me_hub --no-default-features --features postgres-import --all-targets -- -D warnings
      - name: Test legacy Postgres recovery against a disposable server
        env:
          REMIND_ME_HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hubtest
          # Refuse a missing service instead of reporting skipped imports as passed.
          REMIND_ME_HUB_REQUIRE_POSTGRES: "1"
        run: cargo test --locked -p remind_me_hub --no-default-features --features postgres-import --test hub_postgres_copy_test -- --test-threads=1

  # remind_me_core's cfg(windows) FFI (sidecar job objects, `\\?\` stripping)
  # compiles on no Linux leg above.
  remind-me-windows:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-remind-me-windows
      queue: max
      cancel-in-progress: false
    name: rusty_remind_me build / test / clippy (windows)
    needs: plan
    if: needs.plan.outputs.remind_me == 'true' && needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: cargo build
        run: cargo build --locked -p remind_me_core -p remind_me_mcp -p remind_me_api -p rusty-remind-me -p remind_me_remote -p remind_me_hub
      - name: cargo test
        run: cargo test --locked -p remind_me_core -p remind_me_mcp -p remind_me_api -p rusty-remind-me -p remind_me_remote -p remind_me_hub
      - name: cargo clippy
        run: cargo clippy --locked -p remind_me_core -p remind_me_mcp -p remind_me_api -p rusty-remind-me -p remind_me_remote -p remind_me_hub --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Constant-time evidence for the native crypto crates (rusty_ct_check,
  # rusty_sha2, rusty_pk, rusty_aead). Compiler-sensitive: LLVM can turn a
  # branch-free masked select into a branch on a secret, which no functional
  # test sees (it happened once in rusty_pk::mont::reduce_once and was caught
  # only by the valgrind taint run below). The jump-count budgets in each
  # crate's scripts/disasm_limits.txt are tied to a compiler version, so this
  # job runs on the pinned RUST_TOOLCHAIN every other job ships with; moving
  # that toolchain is a global change that reruns this job, and a changed count
  # fails it until someone re-reviews the budget. Evidence, not proof: see
  # docs/research/CRYPTO-REPLACEMENT-PLAN.md section 4.5. The statistical
  # timing tests are deliberately NOT run here (noisy shared runners); they run
  # from docs/research/crypto-evidence/collect.sh.
  # ---------------------------------------------------------------------------
  crypto-constant-time:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-crypto-constant-time
      queue: max
      cancel-in-progress: false
    name: crypto constant-time checks (valgrind taint, disassembly budget)
    needs: plan
    if: needs.plan.outputs.crypto_ct == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version
          objdump --version | head -1
      - name: Harness self-test (planted leaks must be caught)
        run: sh crates/foundation/rusty_ct_check/scripts/valgrind_selftest.sh
      - name: rusty_sha2 (HMAC / HKDF keys)
        run: sh crates/foundation/rusty_sha2/scripts/ct_check.sh
      - name: rusty_aead (ChaCha20-Poly1305, AES-GCM)
        run: sh crates/foundation/rusty_aead/scripts/ct_check.sh
      - name: rusty_pk (X25519, ECDH P-256/P-384, shared Montgomery core)
        run: sh crates/foundation/rusty_pk/scripts/ct_check.sh
      - name: Vector manifests (hashes, missing and unlisted files)
        run: >
          python3 -I docs/research/crypto-evidence/check_manifests.py
          crates/foundation/rusty_sha2/tests/vectors
          crates/foundation/rusty_pk/tests/vectors
          crates/foundation/rusty_aead/tests/vectors
      - name: Evidence tooling self-tests (collector, manifests, taint exit status, disassembly counts)
        run: |
          python3 -I docs/research/crypto-evidence/test_timing_series.py
          python3 -I docs/research/crypto-evidence/test_check_manifests.py
          python3 -I docs/research/crypto-evidence/test_planted_leak.py
          python3 -I crates/foundation/rusty_ct_check/scripts/test_disasm_audit.py
          python3 -I crates/foundation/rusty_pk/scripts/test_verdict_sites.py
          sh crates/foundation/rusty_ct_check/scripts/test_taint_lib.sh

  # Small, unconditional acceptance lane: source/planner filters must not
  # silently omit this Linux confinement contract, including on merge_group.
  orch-bbp-acceptance:
    concurrency:
      group: ci-${{ github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-orch-bbp-acceptance
      queue: max
      cancel-in-progress: false
    name: Orch BBP confined acceptance (Linux)
    needs: [plan, fmt]
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Build real host and Orch binaries and acceptance tests
        run: |
          cargo build --locked -p rusty_orch -p rusty_bbp_host -p rusty_mill_board
          cargo test --locked -p orch-bbp --lib --no-run
          cargo test --locked -p rusty_orch --lib --no-run
          cargo test --locked -p rusty_bbp_host --test moderator_e2e --test rust_lld_profile --no-run
      - name: Confined execution, lifecycle and durable pause/adoption recovery
        shell: bash
        run: |
          set -euo pipefail
          export BBP_TEST_BIN="$PWD/target/debug/bbp"
          export ORCH_TEST_BIN="$PWD/target/debug/rusty_orch"
          export MILLBOARD_TEST_BIN="$PWD/target/debug/rusty_mill_board"
          python3 .github/scripts/orch_bbp_acceptance.py --output acceptance-results
      - name: Publish each mode's result
        if: always()
        shell: bash
        run: |
          if [ -f acceptance-results/summary.md ]; then
            cat acceptance-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Acceptance did not reach test execution; see build logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orch-bbp-confined-acceptance
          path: acceptance-results/
          if-no-files-found: warn

  prune-caches:
    # `main`'s rust-cache keys end in a Cargo.lock/manifest hash, so each sweep
    # saves a new entry beside yesterday's and the 10 GB budget evicts by least
    # recent use -- which has taken the live clippy cache. After this run's
    # savers finish, delete every `v0-rust-*` entry on `main` older than the
    # newest in its family (stale_caches.py). Never runs for PRs or the queue.
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-prune-caches
      queue: max
      cancel-in-progress: false
    name: prune superseded caches
    needs: [plan, dependency-policy, clippy, test]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Delete superseded rust-cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key v0-rust- \
            --limit 100 --json id,key,createdAt > /tmp/caches.json
          python3 .github/scripts/stale_caches.py < /tmp/caches.json > /tmp/stale.txt
          echo "$(wc -l < /tmp/stale.txt) superseded of $(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' < /tmp/caches.json) rust caches on main"
          while read -r id; do
            # Already evicted by GitHub is fine; anything else is worth a look.
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::could not delete cache $id"
          done < /tmp/stale.txt

  # ---------------------------------------------------------------------------
  required-gate:
    # The one check branch protection requires (ADR-0009). Planned-out jobs
    # are `skipped`, which passes; a failed or cancelled job fails the gate.
    # `test_ci_workflow` fails if a job is missing from `needs`.
    name: required-gate
    if: always()
    needs:
      - fmt
      - plan-tests
      - rl-live-test-safety
      - rb-tape-verifier
      - library-tests
      - claude-hooks
      - workflow-lint
      - dependency-policy
      - cargo-deny
      - cargo-shear
      - plan
      - clippy
      - ci-smoke
      - orch-bbp-acceptance
      - test
      - data-mesh-monitor
      - rusty-term-web
      - rusty-term-bench
      - rusty-tick-web
      - rusty-tick-e2e
      - rusty-agui-conformance
      - rusty-fair-play-web
      - rusty-fair-play-e2e
      - rusty-key-desktop
      - win32-cross-compile-check
      - multimodal-db-feature-sets
      - multimodal-db-msrv
      - msrv-compile
      - rusty-config-no-std-check
      - rusty-tls-engine
      - rusty-tls-engine-native
      - rusty-tls-fuzz
      - crypto-constant-time
      - rusty-rand-platforms
      - rleval-viewer-gl-smoke
      - rleval-app-feature-sets
      - rleval-service
      - rleval-image
      - remind-me
      - remind-me-features
      - remind-me-combined-features
      - remind-me-plugin-version
      - remind-me-hub
      - remind-me-legacy-import
      - remind-me-windows
      - prune-caches
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
