      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # rusty_fair_play end to end: the API contract and the Playwright flows
  # against the real rusty_fair_play binary serving the built UI.
  rusty-fair-play-e2e:
    concurrency:
      group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}-rusty-fair-play-e2e
      queue: max
      cancel-in-progress: false
    name: rusty_fair_play e2e (Playwright)
    needs: plan
    if: needs.plan.outputs.fair_play == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/apps/rusty_fair_play/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rusty-fair-play-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
