name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.75"] # 1.75 = MSRV; bump per RFC v2 policy
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # D-Bus transport (rustils#77): `dbus_transport.rs`'s live tests
      # spawn a real `dbus-daemon --session` as a test fixture — ensure
      # the binary is present rather than relying on it happening to
      # already be in the runner image. Idempotent if it already is.
      # Secret Service (rustils#78): `secret_service.rs`'s live tests
      # additionally spawn a real `gnome-keyring-daemon` as the Secret
      # Service provider under test.
      - name: install dbus-daemon and gnome-keyring (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # D-12 / Track P: the whole platform-linux suite (parity included)
      # re-runs with the rusty_libc raw-syscall path swapped in for the
      # replaced call families. Linux + stable only: the feature is
      # meaningless on Windows, and rusty_libc's MSRV (1.88) is above the
      # workspace floor (1.75) — Track P is opt-in precisely so the floor
      # holds (see platform-linux/Cargo.toml).
      - name: test platform-linux with track-p (raw-syscall backend)
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: |
          cargo clippy -p platform-linux --features track-p --all-targets -- -D warnings
          cargo test -p platform-linux --features track-p
      # D-15 / Track W: the Windows counterpart of the step above — the
      # whole platform-windows suite (parity included) re-runs with the
      # rusty_win32 path swapped in for the replaced call families.
      # Windows + stable only, for the mirror-image reasons: the feature
      # is meaningless on Linux, and rusty_win32's MSRV (1.88) is above
      # the workspace floor (1.75), so Track W is opt-in precisely so the
      # floor holds (see platform-windows/Cargo.toml). This is the leg
      # that matters — `cargo test` here executes the swapped ReadFile/
      # WriteFile against a real Windows kernel, which no cross-compile
      # check can do.
      - name: test platform-windows with track-w (rusty_win32 backend)
        if: matrix.os == 'windows-latest' && matrix.toolchain == 'stable'
        run: |
          cargo clippy -p platform-windows --features track-w --all-targets -- -D warnings
          cargo test -p platform-windows --features track-w
      # Tun surface (D14): TUNSETIFF needs CAP_NET_ADMIN, which the
      # hosted ubuntu-latest runner's default user lacks — the `test`
      # step above already ran tun_parity.rs, but every one of its
      # tests skipped gracefully rather than exercising real kernel
      # behavior (see tun_parity.rs's tun_or_skip! macro). Root via
      # sudo has the capability, so re-run just that suite privileged
      # to keep genuine live coverage in CI instead of silently losing
      # it on every run.
      - name: test platform-linux tun surface (privileged)
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: sudo -E env "PATH=$PATH" cargo test -p platform-linux --test tun_parity

  # rustils#48: platform-bsd's real-hardware verification on Darwin. A
  # separate job, not a `test` matrix leg — `cargo test --workspace` on
  # macOS would also try to build coreutils' bin targets, which call
  # `coreutils::native::spawner()` unconditionally; that module is gated
  # `#[cfg(any(target_os = "linux", windows))]` because platform-bsd is
  # deliberately net-only (no process/fs slice — RFC v2 §3, no consumer
  # has forced one), so those bins simply don't compile there yet. Scoped
  # to the three crates that actually run on macOS today, the same
  # per-job scoping `miri` and `cross-compile-check` already use for
  # what they can and can't cover.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (warnings are errors)
        run: cargo clippy -p platform -p platform-mock -p platform-bsd --all-targets -- -D warnings
      - name: test
        run: cargo test -p platform -p platform-mock -p platform-bsd

  # rustils#86: the same real-hardware gate for the non-Darwin half of
  # platform-bsd's cfg. GitHub Actions has no native BSD runner, so these
  # boot a real FreeBSD/OpenBSD VM on the ubuntu host and run the suite
  # inside it — the point being that `cargo check --target` alone is not
  # enough here, which #48 proved: its macos-latest leg caught a genuine
  # Darwin `AF_UNIX` divergence (`sys::net::from_sockaddr_un`) that no
  # amount of cross-compiling would have surfaced. Widening a cfg gate on
  # the strength of "the syscalls should be the same" and no runner is
  # exactly what #86 was filed to avoid.
  #
  # Same `-p` scoping as the macos job above, for the same coreutils
  # reason. `usesh: true` runs the script inside the guest; `prepare`
  # installs the guest's own Rust, since the host toolchain is Linux ELF
  # and cannot execute there.
  #
  # `cargo test` only, no `clippy` — deliberately. These guests use the
  # OS's packaged Rust, and both ports split `clippy` out of the base
  # `rust` package, so a clippy step here would fail on guest packaging
  # rather than on this repo's code. Lints are the cross-compile-check
  # job's business anyway: it runs `clippy -D warnings` against
  # `x86_64-unknown-freebsd` with a real rustup toolchain, on the same
  # source these jobs execute. What only a VM can do is run the syscalls
  # — so that is all these do.
  #
  # Not covered by any job here, and stated rather than left to
  # inference: NetBSD gets cross-compile-check coverage only (below),
  # and DragonFly gets neither — tier 3, no prebuilt std, no runner.
  # Both are in the cfg gate on the strength of a shared BSD socket
  # surface, which is weaker evidence than these two legs provide. See
  # platform-bsd's lib.rs "verification status".
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo test -p platform -p platform-mock -p platform-bsd

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test in an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add -I rust
          run: |
            cargo test -p platform -p platform-mock -p platform-bsd

  unsafe-scope:
    # RFC v2 §6: unsafe is confined to backend sys/ module trees. This job
    # fails if `unsafe` appears anywhere else. Grep-based on purpose —
    # simple enough to trust, strict enough to catch drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unsafe outside sys/ fails the build
        run: |
          violations=$(grep -rn "unsafe" crates/*/src --include='*.rs' \
            | grep -v "/sys/" \
            | grep -v "forbid(unsafe_code)" \
            | grep -v "deny(unsafe_code)" \
            | grep -v "unsafe_code = " \
            | grep -v ':[[:space:]]*//' \
            || true)
          if [ -n "$violations" ]; then
            echo "unsafe found outside sys/ module trees:"; echo "$violations"; exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # RFC v2 §4.2: Miri on everything it can execute — the pure crates
  # (platform, platform-mock, winargv, coreutils' library tests). The
  # backend crates make foreign calls Miri cannot model and are excluded.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # winargv is pure string logic with no OS calls (extracted to its
      # own crate, convergence roadmap Phase 1c) — exactly what Miri
      # should cover; platform-windows's own lib is windows-gated to
      # nothing on this host now, kept in the list for when that changes.
      - run: cargo miri test -p platform -p platform-mock -p platform-windows -p winargv -p coreutils --lib

  # Fast Windows feedback without waiting on a windows-latest runner: a
  # cross-compile check from Linux catches most platform-windows compile
  # errors in minutes. The windows-latest matrix leg above remains the real
  # gate — this is a pre-check, not a replacement. (Practice borrowed from
  # rusty_win32, an R2 extraction donor — see docs/extraction-map.md.)
  #
  # rustils#86 added the same pre-check shape for the BSD targets, ahead
  # of the freebsd/openbsd VM jobs above (which take minutes to boot a
  # guest). `x86_64-apple-darwin` and `x86_64-unknown-netbsd` are here
  # too: neither has a runner in this workspace, so for NetBSD this is
  # the *only* coverage it gets, and for Darwin it is the same pre-check
  # the macos job backstops. OpenBSD and DragonFly are tier 3 with no
  # prebuilt std and cannot be checked this way at all — OpenBSD has its
  # VM leg instead, DragonFly has nothing (see platform-bsd's lib.rs).
  cross-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-unknown-netbsd
          components: clippy
      - name: cargo check (windows target, all targets)
        run: cargo check --workspace --target x86_64-pc-windows-gnu --all-targets
      - name: cargo clippy (windows target, warnings are errors)
        run: cargo clippy --workspace --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      # D-15 / Track W gets the same minutes-not-queue-time pre-check the
      # rest of platform-windows does. Compile coverage only — the real
      # gate is the windows-latest `--features track-w` leg above, which
      # actually runs the swapped calls. Cheap enough to be worth it: a
      # feature nothing compiles until a Windows runner frees up is a
      # feature that bit-rots between the runs that would catch it.
      - name: cargo clippy (windows target, track-w feature)
        run: cargo clippy -p platform-windows --features track-w --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      # Scoped to the crates that build on these targets, not
      # `--workspace`: coreutils' bins are `#[cfg(any(target_os =
      # "linux", windows))]` for the reason the macos job's own comment
      # explains, so a workspace-wide check here would fail on a gap
      # that is deliberate.
      - name: cargo clippy (BSD targets, warnings are errors)
        run: |
          for target in x86_64-apple-darwin x86_64-unknown-freebsd x86_64-unknown-netbsd; do
            echo "::group::$target"
            cargo clippy -p platform -p platform-mock -p platform-bsd \
              --target "$target" --all-targets -- -D warnings
            echo "::endgroup::"
          done
