name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  deps:
    name: Zero dependencies check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify no external crates.io dependencies
        run: |
          # Every crate in the tree should be one of this workspace's own
          # members - proc_macro (compiler-provided) doesn't show up here.
          external=$(cargo tree --workspace -e normal,build --prefix none \
            | sed 's/ (\*)$//' \
            | awk '{print $1}' \
            | sort -u \
            | grep -vE '^(rusty_serde|rusty_serde_derive)$' || true)
          if [ -n "$external" ]; then
            echo "Unexpected external dependencies found:"
            echo "$external"
            exit 1
          fi
