name: CI

# Workspace-wide CI for the Rusty Mill monorepo. Individual crates carried
# their own workflow under crates/<crate>/.github/workflows/ before the
# merge (dead now that they're not at a repo root — GitHub Actions only
# reads .github/workflows/ at the repository root), left in place for
# history. This workflow supersedes them all with a single matrix that
# builds and tests the whole workspace.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # rusty_term's `gui`/`gui-gpu` features and rusty_gui's Linux X11
      # backend link against X11/wayland directly rather than through an
      # x11/xcb crate, so the runner needs the dev headers even though
      # there's no display to actually present to.
      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy (workspace, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # mill-term's own tests locate sibling binaries (rgit/rsed/rawk) by
      # walking target/{debug,release} at runtime rather than through a
      # Cargo dependency (see the root README's "How the crates relate") --
      # mill-term only has a *library* dependency on rusty_git, so nothing
      # in the dependency graph forces cargo to finish building rusty_git's
      # own `rgit` binary before mill-term's test binary starts running
      # under a plain `cargo test --workspace`. A separate, blocking build
      # step first guarantees every workspace binary exists on disk before
      # any test executes (see #12).
      - name: Build (workspace, all features)
        run: cargo build --workspace --all-features

      - name: Test (workspace, all features)
        run: cargo test --workspace --all-features

  # rusty_win32 is deliberately Windows-only and edition 2021 for MSRV
  # reasons (see crates/rusty_win32/Cargo.toml) — this mirrors its own CI's
  # cross-compile pre-check so a Linux-only contributor still gets fast
  # feedback on it without waiting on the windows-latest queue.
  win32-cross-compile-check:
    name: rusty_win32 cross-compile check (mingw, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cargo check --target x86_64-pc-windows-gnu (std feature)
        run: cargo check -p rusty_win32 --target x86_64-pc-windows-gnu --all-targets --features std
      - name: cargo clippy --target x86_64-pc-windows-gnu
        run: cargo clippy -p rusty_win32 --target x86_64-pc-windows-gnu --all-targets --features std -- -D warnings
