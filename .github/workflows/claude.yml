name: claude
on:
  issue_comment: {types: [created]}
  pull_request_review_comment: {types: [created]}
permissions: {contents: write, pull-requests: write, issues: write, id-token: write}

jobs:
  work:
    if: >
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.login != 'yourname-codex'
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          ok=true
          if [ "$IS_PR" = true ]; then
            ref=$(gh pr view "$N" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
            case "$ref" in claude/*) ;; *) ok=false
              gh pr comment "$N" --repo "$GITHUB_REPOSITORY" --body "Claude only updates claude/* PRs.";; esac
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
