name: Release check

# Verifies a published tag is actually consumable, which the pull-request CI
# cannot do: `check-template.sh` rewrites the generated project's dependency to
# a path, so the **git** dependency every real consumer uses is never resolved.
#
# v0.4.0 shipped a defect that lived in exactly that gap and was found by hand
# after tagging. This closes it.

on:
  push:
    tags: ["v*"]
  # So a tag can be re-verified without pushing anything — and so this workflow
  # itself can be exercised on demand.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify, e.g. v0.5.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  published-tag:
    name: published tag is consumable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      # ~3 minutes from source. Acceptable here because this runs per release
      # rather than per push, and it keeps the check free of third-party
      # installer actions.
      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      # The detector has to catch a *successful* build that printed an error,
      # which is what v0.4.0 did. Proving that first means a green run below
      # means something.
      - name: Self-test the output detector
        run: ./scripts/check-published-tag.sh --self-test

      - name: Verify the tag
        run: ./scripts/check-published-tag.sh "${{ inputs.tag || github.ref_name }}"
