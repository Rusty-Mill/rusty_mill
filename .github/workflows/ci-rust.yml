name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      # The `futures_io_compat` and `tracing_instrumentation` test targets carry
      # `required-features`, so the default run above silently skips both. Neither
      # feature needs anything from the kernel, so they run for real here.
      - name: Test (interop features)
        run: cargo test --workspace --features futures-io-compat,tracing
      # io_uring is deliberately compile-gated rather than run: hosted runners
      # vary in whether their seccomp profile permits io_uring_setup, so running
      # these would make CI flaky for a reason unrelated to the change under test.
      # `thread-per-core` rides along since its test targets pair with io-uring-fs.
      - name: Check (io_uring + thread-per-core)
        run: cargo check --workspace --all-targets --features io-uring-reactor,io-uring-fs,thread-per-core
