name: rusty_remind_me checks

# rusty_remind_me's cheap, toolchain-independent check, ported from its
# pre-merge ci.yml (crates/apps/rusty_remind_me/.github/workflows/ci.yml):
# .claude-plugin/plugin.json against the crates' version, and the six crates
# against each other.
#
# This used to run a daily schema-drift check against the Python reference,
# baileyrd/remind_me. That reference is retired (rusty_remind_me ADR-0023), so
# the node's schema is its own and there is nothing outside this repository
# to drift from.
#
# The Rust build/test/clippy legs for this product are in ci.yml
# (`remind-me*` jobs), gated on its affected-crates plan like everything else.

on: .claude-plugin/plugin.json against the crates' version,
#   and the six crates against each other.
#
# The Rust build/test/clippy legs for this product are in ci.yml
# (`remind-me*` jobs), gated on its affected-crates plan like everything else.

on:
  push:
    branches: [main]
    paths:
      - "crates/apps/rusty_remind_me/**"
      - ".github/workflows/remind-me-checks.yml"
  pull_request:
    paths:
      - "crates/apps/rusty_remind_me/**"
      - ".github/workflows/remind-me-checks.yml"
  workflow_dispatch:

concurrency:
  group: remind-me-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-version:
    name: rusty_remind_me plugin.json version vs. crate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare .claude-plugin/plugin.json against the crates' Cargo.toml
        run: crates/apps/rusty_remind_me/scripts/check_plugin_version.sh
